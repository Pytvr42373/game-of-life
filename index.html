<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game of Life · 游戏合集</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;700&display=swap');

  :root {
    --bg: #0a0a1a;
    --surface: #12122a;
    --surface2: #1a1a3e;
    --border: #2a2a5a;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --text: #e0e0ff;
    --text-dim: #7878aa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }

  .header { text-align: center; margin-bottom: 40px; }

  .header h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2rem;
    color: var(--text);
    margin-bottom: 8px;
  }

  .header h1 span { color: var(--accent2); }

  .header p { color: var(--text-dim); font-size: 0.95rem; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 900px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(108, 92, 231, 0.15);
  }

  .card .emoji { font-size: 2rem; }

  .card h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.15rem;
    color: var(--accent2);
  }

  .card p {
    color: var(--text-dim);
    font-size: 0.88rem;
    line-height: 1.5;
  }

  .card .tag {
    align-self: flex-start;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.72rem;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: 'JetBrains Mono', monospace;
  }

  .card.coming { opacity: 0.6; cursor: not-allowed; pointer-events: none; }

  .footer { margin-top: 40px; color: var(--text-dim); font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
  <div class="header">
    <h1>🎮 Game of Life <span>· 游戏合集</span></h1>
    <p>纯前端小游戏，点击卡片进入</p>
  </div>

  <div class="grid">
    <a class="card" href="life/index.html">
      <div class="emoji">🧬</div>
      <h2>康威生命游戏</h2>
      <p>Conway's Game of Life — 零玩家细胞自动机。绘制初始状态，观察生命的演化、繁殖与消亡，支持预设经典结构、日与夜模式。</p>
      <span class="tag">▶ 开始</span>
    </a>

    <a class="card" href="bottle/index.html">
      <div class="emoji">🧪</div>
      <h2>倒水游戏</h2>
      <p>Decanta · 水瓶排序 — 将彩色液体倒入试管，使每管只含单一颜色。三种模式、首领战、每日挑战、商店皮肤。</p>
      <span class="tag">▶ 开始</span>
    </a>

    <div class="card coming">
      <div class="emoji">⚡</div>
      <h2>Stroop 挑战</h2>
      <p>斯特鲁普效应测验 — 说出文字的颜色，而非文字本身。训练大脑的抑制控制能力。敬请期待。</p>
      <span class="tag">🔒 即将上线</span>
    </div>
  </div>

  <div class="footer">Pytvr42373 · GitHub Pages</div>
</body>
</html>
