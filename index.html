<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>康威生命游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.container{text-align:center;padding:20px}
h1{font-size:1.5rem;margin-bottom:12px;color:#e94560;font-weight:300;letter-spacing:2px}
canvas{border:1px solid #333;border-radius:4px;cursor:pointer;display:block;margin:0 auto;max-width:100%;background:#0f0f23}
.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{background:#16213e;color:#eee;border:1px solid #333;padding:6px 16px;border-radius:4px;cursor:pointer;font-size:13px;transition:.15s}
.btn:hover{background:#e94560;border-color:#e94560}
.btn.active{background:#e94560;border-color:#e94560}
.btn:disabled{opacity:.4;cursor:not-allowed}
.slider-group{display:flex;align-items:center;gap:8px;font-size:12px;color:#888}
.slider-group input{width:80px;accent-color:#e94560}
.pattern-select{background:#16213e;color:#eee;border:1px solid #333;border-radius:4px;padding:6px 10px;font-size:13px;cursor:pointer;outline:none}
.pattern-select option{background:#16213e;color:#eee}
.pattern-select.active{background:#e94560;border-color:#e94560}
.info{font-size:12px;color:#666;margin-top:8px}
</style>
</head>
<body>
<div class="container">
<h1>CONWAY'S GAME OF LIFE</h1>
<canvas id="canvas"></canvas>
<div class="controls">
<button class="btn" id="playBtn">▶ 运行</button>
<button class="btn" id="stepBtn">⏭ 一步</button>
<button class="btn" id="clearBtn">✕ 清空</button>
<button class="btn" id="randomBtn">🎲 随机</button>
<select id="patternSelect" class="pattern-select">
<option value="">— 放置结构 —</option>
</select>
<div class="slider-group">
<span>速度</span>
<input type="range" id="speedSlider" min="1" max="10" value="5">
</div>
</div>
<div class="info">
<span id="genInfo">第 0 代</span> · <span id="popInfo">存活: 0</span> · 左键画 · 右键擦 · 拖拽连续画
</div>
</div>
<script>
const COLS=60,ROWS=40,CELL=12
const canvas=document.getElementById('canvas')
const ctx=canvas.getContext('2d')
canvas.width=COLS*CELL
canvas.height=ROWS*CELL

let grid=Array.from({length:ROWS},()=>Array(COLS).fill(0))
let running=false,timer=null,gen=0
let speedMap={1:400,2:300,3:200,4:150,5:100,6:80,7:60,8:40,9:25,10:15}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height)
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
if(grid[r][c]){
ctx.fillStyle='#e94560'
ctx.fillRect(c*CELL+1,r*CELL+1,CELL-2,CELL-2)
}else{
ctx.fillStyle='#1a1a3e'
ctx.fillRect(c*CELL+1,r*CELL+1,CELL-2,CELL-2)
}
}
ctx.strokeStyle='#222'
ctx.lineWidth=0.5
for(let r=0;r<=ROWS;r++){ctx.beginPath();ctx.moveTo(0,r*CELL);ctx.lineTo(canvas.width,r*CELL);ctx.stroke()}
for(let c=0;c<=COLS;c++){ctx.beginPath();ctx.moveTo(c*CELL,0);ctx.lineTo(c*CELL,canvas.height);ctx.stroke()}
document.getElementById('genInfo').textContent=`第 ${gen} 代`
document.getElementById('popInfo').textContent=`存活: ${grid.flat().filter(Boolean).length}`
}

function neighbors(r,c){
let n=0
for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
if(dr===0&&dc===0)continue
let nr=(r+dr+ROWS)%ROWS,nc=(c+dc+COLS)%COLS
n+=grid[nr][nc]
}
return n
}

function step(){
const next=grid.map(row=>[...row])
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
const n=neighbors(r,c)
if(grid[r][c])next[r][c]=n===2||n===3?1:0
else next[r][c]=n===3?1:0
}
grid=next;gen++
draw()
}

function play(){
running=!running
document.getElementById('playBtn').textContent=running?'⏸ 暂停':'▶ 运行'
document.getElementById('playBtn').classList.toggle('active',running)
document.getElementById('stepBtn').disabled=running
if(running){
const speed=parseInt(document.getElementById('speedSlider').value)
tick()
}else{
clearTimeout(timer)
}
}

function tick(){
if(!running)return
step()
const speed=parseInt(document.getElementById('speedSlider').value)
timer=setTimeout(tick,speedMap[speed])
}

// 经典结构预设
const PATTERNS={
'方块':[[1,1],[1,2],[2,1],[2,2]],
'闪光灯':[[1,2],[2,2],[3,2]],
'蟾蜍':[[1,2],[1,3],[1,4],[2,1],[2,2],[2,3]],
'滑翔机':[[1,2],[2,3],[3,1],[3,2],[3,3]],
'轻量飞船':[[1,2],[1,5],[2,1],[3,1],[3,5],[4,1],[4,2],[4,3],[4,4]],
'中型飞船':[[1,2],[1,6],[2,1],[3,1],[3,6],[4,1],[4,2],[4,3],[4,4],[4,5]],
'脉冲星':[[3,5],[3,6],[3,7],[5,3],[5,8],[6,3],[6,8],[7,3],[7,8],[8,5],[8,6],[8,7],[5,11],[5,12],[6,11],[6,12],[7,11],[7,12],[8,10],[8,9],[9,5],[9,6],[9,7],[9,8],[9,9],[9,10],[9,11],[9,12],[10,4],[10,5],[10,6],[10,7],[10,8],[10,9],[10,10],[10,11],[10,12],[10,13],[11,3],[11,4],[11,5],[11,6],[11,7],[11,8],[11,9],[11,10],[11,11],[11,12],[11,13],[12,3],[12,4],[12,5],[12,6],[12,7],[12,8],[12,9],[12,10],[12,11],[12,12],[12,13]],
'滑翔机枪':[[8,3],[8,4],[9,3],[9,4],[8,13],[9,13],[10,13],[7,14],[11,14],[6,15],[12,15],[6,16],[12,16],[9,17],[7,18],[11,18],[8,19],[9,19],[10,19],[9,20],[6,23],[7,23],[8,23],[6,24],[7,24],[8,24],[5,25],[9,25],[4,27],[5,27],[9,27],[10,27],[6,37],[7,37],[6,38],[7,38]]
}
const PATTERN_NAMES=Object.keys(PATTERNS)
let placePattern=null

// 拖拽画/擦 —— 左键画，右键擦
let isDrawing=false,drawMode=1 // 1=画, 0=擦

function getCell(e){
const rect=canvas.getBoundingClientRect()
const x=Math.floor((e.clientX-rect.left)/CELL)
const y=Math.floor((e.clientY-rect.top)/CELL)
return x>=0&&x<COLS&&y>=0&&y<ROWS?[x,y]:null
}

function paintCell(x,y,mode){
if(grid[y][x]===mode)return
grid[y][x]=mode
}

// 合并 mousedown —— 放置结构优先，否则拖拽画/擦
canvas.addEventListener('mousedown',e=>{
if(placePattern&&e.button===0){
e.preventDefault()
const cell=getCell(e)
if(cell){
const [cx,cy]=cell
const p=PATTERNS[placePattern]
if(p){running&&play();p.forEach(([y,x])=>{const r=cy+y-1,c=cx+x-1;if(r>=0&&r<ROWS&&c>=0&&c<COLS)grid[r][c]=1});draw()}
}
return
}
if(e.button===0){isDrawing=true;drawMode=1}
else if(e.button===2){isDrawing=true;drawMode=0}
const cell=getCell(e)
if(cell)paintCell(cell[0],cell[1],drawMode);draw()
})
canvas.addEventListener('mousemove',e=>{
if(!isDrawing)return
const cell=getCell(e)
if(cell)paintCell(cell[0],cell[1],drawMode);draw()
})
canvas.addEventListener('mouseup',()=>{isDrawing=false})
canvas.addEventListener('mouseleave',()=>{isDrawing=false})
canvas.addEventListener('contextmenu',e=>e.preventDefault())

// 填充结构下拉菜单
const sel=document.getElementById('patternSelect')
PATTERN_NAMES.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o)})
sel.addEventListener('change',function(){
placePattern=this.value||null
this.classList.toggle('active',!!this.value)
if(this.value)canvas.style.cursor='crosshair'
else canvas.style.cursor='pointer'
})

document.getElementById('playBtn').addEventListener('click',play)
document.getElementById('stepBtn').addEventListener('click',()=>{step()})
document.getElementById('clearBtn').addEventListener('click',()=>{
running&&play()
grid=Array.from({length:ROWS},()=>Array(COLS).fill(0))
gen=0;draw()
})
document.getElementById('randomBtn').addEventListener('click',()=>{
running&&play()
grid=Array.from({length:ROWS},()=>Array.from({length:COLS},()=>Math.random()>.8?1:0))
gen=0;draw()
})
document.getElementById('speedSlider').addEventListener('input',function(){
if(running){clearTimeout(timer);tick()}
})

// 初始随机
grid=Array.from({length:ROWS},()=>Array.from({length:COLS},()=>Math.random()>.8?1:0))
draw()
</script>
</body>
</html>
