<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameHub · 迷你游戏合集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bungee&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bungee&family=ZCOOL+KuaiLe&display=swap"></noscript>
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* ============ 主题1 · 4399橙绿（亮色·默认） ============ */
body[data-theme="4399"]{
  --bg:#f4f8ef; --bg2:#ffffff; --surface:#ffffff; --line:#d8e8cd;
  --text:#24401d; --dim:#6f8a63; --green:#389904; --green2:#448230; --orange:#fb6400; --orange2:#e64e00;
  --tag-bg:#eef5e8;
  --go-bg:rgba(244,248,239,.97); --go-text:#389904;
  background:linear-gradient(180deg,#f0f7ea 0%,#ffffff 55%,#f7fbf3 100%);color:var(--text);
}
body[data-theme="4399"]::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:
    radial-gradient(circle at 12% 18%, rgba(56,153,4,.08), transparent 40%),
    radial-gradient(circle at 88% 80%, rgba(251,100,0,.07), transparent 40%);
}

/* ============ 主题2 · 街机厅（暗色） ============ */
body[data-theme="arcade"]{
  --bg:#0b0b18; --bg2:#14142b; --surface:#191934; --line:#3a3a5c; --hard:#000;
  --text:#f4f4ff; --dim:#7a7aa0; --green:#00ff9d; --pink:#ff2d78; --cyan:#3de1ff; --yellow:#ffe14d;
  --tag-bg:#2a2a4a;
  --go-bg:rgba(11,11,24,.97); --go-text:#3de1ff;
  background-color:#0b0b18;color:var(--text);
  background-image:radial-gradient(circle at 50% 0%, #2a2a55 0%, transparent 60%);
}
/* 像素网格 */
body[data-theme="arcade"]::before{
  content:'';position:fixed;inset:0;pointer-events:none;opacity:.15;z-index:0;
  background-image:linear-gradient(#3a3a5c 1px,transparent 1px),linear-gradient(90deg,#3a3a5c 1px,transparent 1px);
  background-size:26px 26px;
}
/* CRT 扫描线 + 呼吸霓虹 */
body[data-theme="arcade"]::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.5;
}

body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;transition:background .4s,color .4s}

/* ============ 主题切换器 ============ */
.theme-switch{position:fixed;right:16px;bottom:16px;z-index:99;width:46px;height:46px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;user-select:none;
  background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);
  box-shadow:0 3px 12px rgba(0,0,0,.3);transition:transform .2s,background .2s;color:#22c55e}
body[data-theme="4399"] .theme-switch{background:rgba(10,10,24,.75);border:1px solid rgba(61,225,255,.4);color:#7ff3ff;box-shadow:0 0 14px rgba(61,225,255,.25)}
body[data-theme="arcade"] .theme-switch{background:rgba(255,255,255,.9);border:1px solid rgba(34,197,94,.35);color:#16a34a;box-shadow:0 3px 12px rgba(34,197,94,.15)}
.theme-switch:hover{transform:scale(1.08)}
.theme-switch:active{transform:scale(.94)}

/* ============ 华丽加载过渡 ============ */
.loader{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:var(--bg);color:var(--text);opacity:0;pointer-events:none;transition:opacity .3s}
.loader.on{opacity:1;pointer-events:auto}
/* 中央霓虹核心 */
.loader .core{position:relative;width:150px;height:150px;display:flex;align-items:center;justify-content:center}
.loader .core .ring{position:absolute;inset:0;border-radius:50%;border:4px solid transparent;border-top-color:var(--green);animation:spin 1s linear infinite}
.loader .core .ring.r2{inset:12px;border-top-color:var(--pink,#fb6400);animation:spin 1.3s linear infinite reverse;border-right-color:var(--cyan,#389904)}
.loader .core .ring.r3{inset:24px;border-top-color:var(--yellow,#389904);animation:spin .8s linear infinite}
.loader .core .pixel{font-family:'Press Start 2P',monospace;font-size:30px;color:var(--green);text-shadow:0 0 18px currentColor;animation:pulse 1s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.7}}
/* 进度条 */
.loader .load-track{width:260px;height:8px;background:var(--line);border-radius:6px;overflow:hidden;position:relative;box-shadow:0 0 14px var(--green)}
.loader .load-track i{position:absolute;height:100%;width:45%;border-radius:6px;
  background:linear-gradient(90deg,var(--green),var(--yellow,#fb6400),var(--cyan,#389904),var(--green));
  background-size:300% 100%;animation:slide 1s linear infinite}
@keyframes slide{0%{transform:translateX(-50%)}100%{transform:translateX(350%)}}
.loader .load-text{font-family:var(--load-font,'PingFang SC');font-size:13px;letter-spacing:2px;color:var(--dim)}
body[data-theme="4399"] .loader .load-text{--load-font:'PingFang SC','Microsoft YaHei'}
body[data-theme="arcade"] .loader .load-text{--load-font:'Press Start 2P',monospace}
.loader .load-text b{color:var(--green)}

/* ============ 开屏动画 (splash) ============ */
.splash{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  overflow:hidden;color:#fff;opacity:1;transition:opacity .5s ease;cursor:pointer}
.splash.off{opacity:0;pointer-events:none}
/* 纯暗色底，只做字，不要花背景 */
.splash .bg{position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 50% 40%,#1a1a2e,#0a0a14)}
.splash .bg::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.25)}
/* 霓虹大标题字母逐个弹出 */
.splash .big{display:flex;font-family:'Press Start 2P',monospace;font-size:clamp(30px,9vw,74px);font-weight:900;letter-spacing:4px;z-index:3}
.splash .big span{display:inline-block;opacity:0;animation:popIn .5s cubic-bezier(.2,1.6,.4,1) forwards;text-shadow:0 0 18px currentColor,4px 4px 0 rgba(0,0,0,.5);margin-right:4px}
.splash .big span:nth-child(1){color:#ff2d78;animation-delay:.05s}
.splash .big span:nth-child(2){color:#ffe14d;animation-delay:.14s}
.splash .big span:nth-child(3){color:#3de1ff;animation-delay:.23s}
.splash .big span:nth-child(4){color:#00ff9d;animation-delay:.32s}
.splash .big span:nth-child(5){color:#a55eea;animation-delay:.41s}
.splash .big span:nth-child(6){color:#ff8c42;animation-delay:.50s}
.splash .big span:nth-child(7){color:#3de1ff;animation-delay:.59s}
@keyframes popIn{0%{opacity:0;transform:scale(.2) translateY(40px) rotate(-12deg);filter:blur(6px)}60%{opacity:1}100%{opacity:1;transform:scale(1) translateY(0) rotate(0);filter:blur(0)}}
.splash .sub{font-family:'Press Start 2P',monospace;font-size:11px;letter-spacing:6px;color:#fff;z-index:3;opacity:0;animation:fadeUp .6s ease .85s forwards;text-shadow:0 0 12px rgba(255,255,255,.85)}
.splash .sub2{font-family:'PingFang SC','Microsoft YaHei';font-size:15px;color:#fff;z-index:3;opacity:0;animation:fadeUp .6s ease 1.05s forwards;letter-spacing:2px;text-shadow:0 0 10px rgba(0,0,0,.5)}
.splash .enter{font-family:'Press Start 2P',monospace;font-size:12px;letter-spacing:3px;color:#ffe14d;z-index:3;
  opacity:0;animation:fadeUp .6s ease 1.6s forwards,breathe 1.6s ease-in-out 2.2s infinite;
  text-shadow:0 0 14px rgba(255,225,77,.75),2px 2px 0 rgba(0,0,0,.5)}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.97)}}
/* 闪光扫过 */
@keyframes shine{0%{background-position:150% 0}100%{background-position:-150% 0}}

/* ============ 跳转过渡动画 (transition) ============ */
.transition{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;
  visibility:hidden;opacity:0;pointer-events:none;color:#fff;overflow:hidden;font-family:'Press Start 2P',monospace}
.transition.on{visibility:visible;opacity:1;pointer-events:auto}
.transition .t-text{position:relative;z-index:3;font-size:clamp(15px,5vw,32px);letter-spacing:3px;text-align:center;padding:0 16px;
  color:var(--go-text);font-family:var(--go-font,'PingFang SC');
  text-shadow:0 0 24px currentColor;animation:tTxt .35s ease}
@keyframes tTxt{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
.transition .t-bg{position:absolute;inset:0;z-index:1;background:var(--go-bg);animation:tFade .35s ease forwards}
.transition .t-bg2{position:absolute;inset:0;z-index:2}
@keyframes tFade{0%{opacity:0}100%{opacity:1}}
body[data-theme="4399"] .transition .t-text{--go-font:'PingFang SC','Microsoft YaHei'}
body[data-theme="arcade"] .transition .t-text{--go-font:'Press Start 2P',monospace;text-shadow:3px 3px 0 var(--hard),0 0 24px currentColor}
.transition.t-scan .t-bg2{background:repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 2px, transparent 2px 5px);animation:tFade .4s ease forwards}
.transition.t-pulse .t-text{animation:tTxt .35s ease,tPulse 1.1s ease-in-out .35s infinite}
@keyframes tPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.09);opacity:.75}}
.transition.t-flash .t-bg2{background:var(--go-text);animation:tFlash .55s ease forwards}
@keyframes tFlash{0%{opacity:.3}100%{opacity:0}}

/* ============ 尊重 reduce-motion：关闭动画 ============ */
@media (prefers-reduced-motion: reduce){
  .splash,.splash *,.transition,.transition *{animation:none!important;transition:none!important}
  .splash .big span,.splash .pt,.splash .sub,.splash .sub2,.splash .enter{opacity:1!important;transform:none!important}
}

/* ============ 布局 ============ */
.wrap{max-width:1000px;margin:0 auto;padding:96px 24px 60px;position:relative;z-index:1}
.h4399,.harcade{display:none}

/* ===== 4399 头部（更鲜明） ===== */
body[data-theme="4399"] .h4399{display:block}
.h4399 .top{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:14px}
.h4399 .logo-box{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--green),var(--green2));display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;box-shadow:0 6px 16px rgba(56,153,4,.35)}
.h4399 .title{font-size:34px;font-weight:900;color:var(--green);letter-spacing:1px;text-shadow:0 2px 0 rgba(56,153,4,.12)}
.h4399 .title em{font-style:normal;color:var(--orange)}
.h4399 .sub{text-align:center;color:var(--dim);font-size:15px;margin-bottom:30px}
.h4399 .nav{display:flex;justify-content:center;gap:10px;margin-bottom:36px;flex-wrap:wrap}
.h4399 .nav button{font:inherit;font-size:13px;font-weight:600;color:var(--green);background:#eef5e8;border:1px solid var(--line);padding:5px 14px;border-radius:999px;cursor:pointer}
.h4399 .nav button:hover{border-color:var(--orange)}
.h4399 .nav button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.h4399 .nav button.on{background:var(--green);color:#fff;border-color:var(--green)}

/* ===== 街机厅 头部（更鲜明） ===== */
body[data-theme="arcade"] .harcade{display:block}
.harcade .logo{font-family:'Press Start 2P',monospace;font-size:13px;letter-spacing:3px;color:var(--yellow);text-shadow:0 0 14px var(--yellow),3px 3px 0 var(--hard);text-align:center;margin-bottom:18px;animation:blink 1.4s steps(1) infinite}
.harcade .title{font-family:'Press Start 2P',monospace;font-size:clamp(20px,4.5vw,34px);line-height:1.7;text-align:center;color:var(--text);text-shadow:3px 3px 0 var(--hard),0 0 20px rgba(61,225,255,.4);margin-bottom:14px}
.harcade .title .c{color:var(--pink);text-shadow:3px 3px 0 var(--hard),0 0 20px var(--pink)}
.harcade .title .y{color:var(--cyan);text-shadow:3px 3px 0 var(--hard),0 0 20px var(--cyan)}
.harcade .sub{text-align:center;color:var(--dim);font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:3px;margin-bottom:26px}
.harcade .nav{display:flex;justify-content:center;gap:10px;margin-bottom:38px;flex-wrap:wrap}
.harcade .nav button{padding:8px 11px;border:2px solid var(--line);color:var(--dim);background:var(--surface);font-family:'Press Start 2P',monospace;font-size:8px;line-height:1;cursor:pointer;box-shadow:3px 3px 0 var(--hard)}
.harcade .nav button:hover{color:var(--cyan);border-color:var(--cyan)}
.harcade .nav button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.harcade .nav button.on{color:var(--hard);border-color:var(--green);background:var(--green);box-shadow:3px 3px 0 var(--hard),0 0 10px rgba(0,255,157,.45)}

/* ===== 卡片网格：三卡居中 ===== */
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:24px}

/* ===== 卡片通用 ===== */
.card{width:210px;text-align:center;cursor:pointer;position:relative;opacity:0;transform:translateY(20px)}
.card.show{opacity:1;transform:translateY(0)}
.card[hidden]{display:none}

/* 4399 卡片（橙绿更鲜明） */
body[data-theme="4399"] .card{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:28px 18px;overflow:hidden;transition:.2s;box-shadow:0 3px 10px rgba(56,153,4,.06)}
body[data-theme="4399"] .card:hover{border-color:var(--green);box-shadow:0 10px 26px rgba(56,153,4,.22);transform:translateY(-5px)}
body[data-theme="4399"] .card .hot{position:absolute;top:12px;right:-28px;background:var(--orange);color:#fff;font-size:11px;font-weight:700;padding:4px 34px;transform:rotate(45deg);box-shadow:0 2px 6px rgba(251,100,0,.4)}
body[data-theme="4399"] .card .ico{font-size:44px;margin-bottom:14px;display:block;transition:.25s}
body[data-theme="4399"] .card:hover .ico{transform:scale(1.15) rotate(-6deg)}
body[data-theme="4399"] .card .name{font-size:18px;font-weight:800;color:var(--text);margin-bottom:8px}
body[data-theme="4399"] .card .tag{font-size:12px;color:var(--green);background:var(--tag-bg);border:1px solid var(--line);display:inline-block;padding:3px 12px;border-radius:999px;font-weight:600}
body[data-theme="4399"] .card.locked{opacity:.5}

/* 街机厅 卡片（霓虹更强烈） */
body[data-theme="arcade"] .card{background:var(--surface);border:3px solid var(--line);padding:30px 16px;box-shadow:6px 6px 0 var(--hard);transition:.12s;position:relative}
body[data-theme="arcade"] .card:hover{background:#1f1f42;border-color:var(--cyan);box-shadow:6px 6px 0 var(--hard),0 0 18px var(--cyan),0 0 40px rgba(61,225,255,.35);outline:2px solid var(--cyan);outline-offset:2px}
body[data-theme="arcade"] .card:active{background:#262650;box-shadow:6px 6px 0 var(--hard),0 0 10px var(--pink)}
body[data-theme="arcade"] .card .corner{position:absolute;width:12px;height:12px;border:3px solid var(--pink)}
body[data-theme="arcade"] .card .corner.tl{top:-3px;left:-3px;border-right:0;border-bottom:0}
body[data-theme="arcade"] .card .corner.tr{top:-3px;right:-3px;border-left:0;border-bottom:0}
body[data-theme="arcade"] .card .corner.bl{bottom:-3px;left:-3px;border-right:0;border-top:0}
body[data-theme="arcade"] .card .corner.br{bottom:-3px;right:-3px;border-left:0;border-top:0}
body[data-theme="arcade"] .card .hot{display:none}
body[data-theme="arcade"] .card .ico{font-size:46px;margin-bottom:16px;display:block;filter:drop-shadow(4px 4px 0 #000)}
body[data-theme="arcade"] .card .name{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--text);text-shadow:2px 2px 0 var(--hard);line-height:1.8;margin-bottom:14px}
body[data-theme="arcade"] .card .tag{font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:1px;color:var(--green);text-shadow:0 0 8px var(--green);padding-top:12px;border-top:3px double var(--line)}
body[data-theme="arcade"] .card.locked .tag{color:var(--dim);text-shadow:none}

/* ===== 页脚 ===== */
body[data-theme="4399"] .hint{text-align:center;margin-top:48px;color:var(--dim);font-size:13px}
body[data-theme="4399"] .hint b{color:var(--orange)}
body[data-theme="arcade"] .hint{text-align:center;margin-top:56px;font-family:'Press Start 2P',monospace;font-size:9px;color:var(--dim);letter-spacing:3px}
body[data-theme="arcade"] .hint b{color:var(--cyan);text-shadow:0 0 10px var(--cyan);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body data-theme="4399">

<!-- 开屏动画 -->
<div class="splash" id="splash" role="button" tabindex="0" aria-label="点击进入主页">
  <div class="bg"></div>
  <div class="big" id="splashBig"></div>
  <div class="sub">- MINI GAME COLLECTION -</div>
  <div class="sub2">🎮 迷你游戏合集 · 即将开始</div>
  <div class="enter">▶ 点击进入 · PRESS START ◀</div>
</div>

<!-- 华丽加载过渡 -->
<div class="loader" id="loader">
  <div class="core">
    <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="pixel">◆</div>
  </div>
  <div class="load-track"><i></i></div>
  <div class="load-text">LOADING <b>GAMEHUB</b>...</div>
</div>

<div class="theme-switch" id="themeToggle" role="button" aria-label="切换主题" title="切换主题"></div>

<div class="wrap">
  <!-- 4399 头部 -->
  <header class="h4399">
    <div class="top"><div class="logo-box">🎮</div><div class="title">好玩<em>小游戏</em></div></div>
    <p class="sub">专注好玩 · 每天都有新发现</p>
    <nav class="nav" aria-label="游戏分类">
      <button type="button" class="on" data-filter="全部" aria-pressed="true" aria-controls="gameGrid">全部</button>
      <button type="button" data-filter="益智" aria-pressed="false" aria-controls="gameGrid">益智</button>
      <button type="button" data-filter="逻辑" aria-pressed="false" aria-controls="gameGrid">逻辑</button>
      <button type="button" data-filter="反应" aria-pressed="false" aria-controls="gameGrid">反应</button>
      <button type="button" data-filter="经典" aria-pressed="false" aria-controls="gameGrid">经典</button>
    </nav>
  </header>

  <!-- 街机厅 头部 -->
  <header class="harcade">
    <div class="logo">▶ INSERT COIN ◀</div>

    <p class="sub">— SELECT YOUR GAME —</p>
    <nav class="nav" aria-label="GAME CATEGORIES">
      <button type="button" class="on" data-filter="全部" aria-pressed="true" aria-controls="gameGrid">ALL</button>
      <button type="button" data-filter="益智" aria-pressed="false" aria-controls="gameGrid">PUZZLE</button>
      <button type="button" data-filter="逻辑" aria-pressed="false" aria-controls="gameGrid">LOGIC</button>
      <button type="button" data-filter="反应" aria-pressed="false" aria-controls="gameGrid">REFLEX</button>
      <button type="button" data-filter="经典" aria-pressed="false" aria-controls="gameGrid">CLASSIC</button>
    </nav>
  </header>

  <div class="grid" id="gameGrid">
    <!-- 康威生命游戏 -->
    <div class="card" data-delay="0" data-categories="经典" onclick="go('life/index.html',event)">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <span class="hot">热</span>
      <span class="ico">🦠</span>
      <div class="name">康威生命游戏</div>
      <div class="tag">经典</div>
    </div>
    <!-- 倒水游戏 -->
    <div class="card" data-delay=".12s" data-categories="益智 逻辑" onclick="go('bottle/index.html',event)">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <span class="ico">🍶</span>
      <div class="name">倒水谜题</div>
      <div class="tag">益智 · 逻辑</div>
    </div>
    <!-- 1A2B 猜数字 -->
    <div class="card" data-delay=".18s" data-categories="益智 逻辑 经典" onclick="go('1A2B/index.html',event)">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <span class="ico">🔢</span>
      <div class="name">1A2B 猜数字</div>
      <div class="tag">益智 · 逻辑 · 经典</div>
    </div>
    <!-- Stroop 挑战 -->
    <div class="card" data-delay=".3s" data-categories="反应" onclick="go('stroop/index.html',event)">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <span class="ico">🎯</span>
      <div class="name">Stroop 挑战</div>
      <div class="tag">反应</div>
    </div>
    <!-- 点灯 -->
    <div class="card" data-delay=".36s" data-categories="益智 逻辑" onclick="go('light-up/index.html',event)">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <span class="ico">💡</span>
      <div class="name">点灯 · 光廊</div>
      <div class="tag">益智 · 逻辑</div>
    </div>
    <!-- 光线侦探 -->
    <div class="card" data-delay=".42s" data-categories="益智 逻辑" onclick="go('ray-lab/index.html',event)">
      <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
      <span class="ico">🔬</span>
      <div class="name">光线侦探</div>
      <div class="tag">益智 · 逻辑</div>
    </div>
  </div>

  <div class="hint">更多好玩游戏，<b>持续上新</b>中……</div>
</div>

<!-- 跳转过渡遮罩 -->
<div class="transition" id="transition" aria-hidden="true">
  <div class="t-bg"></div>
  <div class="t-bg2"></div>
  <div class="t-text"></div>
</div>

<script>
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const toggle=document.getElementById('themeToggle');
const loader=document.getElementById('loader');
const saved=localStorage.getItem('gh-theme')||'4399';
document.body.dataset.theme=saved;
function iconSVG(arcade){
  if(arcade){
    // 吃豆人 Pac-Man（街机）· 深底浅线
    return '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 12 L21 6 A10 10 0 1 0 21 18 Z"/><circle cx="13.5" cy="7.5" r="1.1" fill="#0a0a18"/></svg>';
  }
  // 世界树 Yggdrasil（清新）· 浅底深线
  return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3C9.8 3 8 4.8 8 7c0 .6.1 1.2.4 1.7C6.5 9.4 5.2 11 5.2 13c0 2.2 1.8 4 4 4h5.6c2.2 0 4-1.8 4-4 0-2-1.3-3.6-3.2-4.3.3-.5.4-1.1.4-1.7 0-2.2-1.8-4-4-4z"/><path d="M12 17v4"/><path d="M12 21l-3 2M12 21l3 2"/></svg>';
}
function paintIcon(){ toggle.innerHTML = iconSVG(document.body.dataset.theme!=='arcade'); }
paintIcon();
toggle.addEventListener('click',()=>{
  const next = document.body.dataset.theme==='arcade' ? '4399' : 'arcade';
  loader.classList.add('on');
  setTimeout(()=>{
    document.body.dataset.theme=next;
    localStorage.setItem('gh-theme',next);
    paintIcon();
    document.querySelectorAll('.card').forEach(c=>{c.classList.remove('show');});
    setTimeout(()=>{
      document.querySelectorAll('.card').forEach(c=>{
        setTimeout(()=>c.classList.add('show'),parseFloat(c.dataset.delay||0)*1000);
      });
      loader.classList.remove('on');
    },150);
  },700);
});

/* ===== 开屏动画：只做字，返回主页不触发 ===== */
function buildSplash(){
  const big=document.getElementById('splashBig');
  // 霓虹字母逐个弹出（只做字）
  const title='GAMEHUB';
  [...title].forEach(ch=>{const sp=document.createElement('span');sp.textContent=ch;big.appendChild(sp);});
}
// 卡片入场（开屏关闭后触发；reduced/返回时立即触发）
function revealCards(){
  document.querySelectorAll('.card').forEach(c=>{setTimeout(()=>c.classList.add('show'),parseFloat(c.dataset.delay||0)*1000);});
}
// 判断是否从子游戏返回：sessionStorage 标记
let returning=false;
try{ returning = sessionStorage.getItem('skipSplash')==='1'; sessionStorage.removeItem('skipSplash'); }catch(e){}
if(reduced || returning){
  // 减少动效 或 从子游戏返回：直接移除开屏，卡片直出
  const sp=document.getElementById('splash'); if(sp) sp.remove();
  revealCards();
}else{
  buildSplash();
  const sp=document.getElementById('splash');
  const born=Date.now();
  let closing=false;
  const closeSplash=()=>{
    if(closing||Date.now()-born<1200)return;
    closing=true;
    document.removeEventListener('keydown',onEnter);
    sp.classList.add('off');
    revealCards();
    setTimeout(()=>sp.remove(),500);
  };
  const onEnter=ev=>{
    if(ev.key!=='Enter'&&ev.key!==' ')return;
    ev.preventDefault();
    closeSplash();
  };
  sp.addEventListener('click',closeSplash);
  document.addEventListener('keydown',onEnter);
}

/* ===== 跳转随机过渡动画 + 打趣文本 ===== */
const goTexts=['进入游戏…','加载中，别眨眼','🎮 街机启动','祝你好运！','对手已就位','前方高能','READY? GO!','一键起飞','LOADING…','满血出击！','走起，别掉线','开局送好运','搓搓手，上分！','这把稳了'];
const tClasses=['t-scan','t-pulse','t-flash'];
function go(url,ev){
  if(ev&&ev.preventDefault)ev.preventDefault();
  try{ sessionStorage.setItem('skipSplash','1'); }catch(e){}
  if(reduced){ location.href=url; return; }
  const t=document.getElementById('transition');
  t.querySelector('.t-text').textContent=goTexts[Math.floor(Math.random()*goTexts.length)];
  t.className='transition on '+tClasses[Math.floor(Math.random()*tClasses.length)];
  setTimeout(()=>{location.href=url;},500);
}

const cards=document.querySelectorAll('.card');
const filterButtons=document.querySelectorAll('[data-filter]');
function filterGames(category){
  filterButtons.forEach(button=>{
    const active=button.dataset.filter===category;
    button.classList.toggle('on',active);
    button.setAttribute('aria-pressed',String(active));
  });
  cards.forEach(card=>{
    const categories=(card.dataset.categories||'').split(' ');
    card.hidden=category!=='全部'&&!categories.includes(category);
  });
}
filterButtons.forEach(button=>button.addEventListener('click',()=>filterGames(button.dataset.filter)));

/* ===== bottle 预取：悬停/触摸预热 + 空闲预取主页 ===== */
const prefetched=new Set();
function prefetch(href){
  if(prefetched.has(href))return;
  prefetched.add(href);
  const link=document.createElement('link');
  link.rel='prefetch';
  link.href=href;
  document.head.appendChild(link);
}
const bottleAssets=[
  'bottle/index.html',
  'bottle/assets/index-DhMYQyOW.js',
  'bottle/assets/index-CpaC40FQ.css',
  'bottle/assets/Geometry-DtZ4-p-4.js',
  'bottle/assets/RenderTargetSystem-CFWUoMLd.js'
];
const bottleCard=document.querySelector('.card[onclick*="bottle"]');
if(bottleCard){
  const warmBottle=()=>bottleAssets.forEach(prefetch);
  bottleCard.addEventListener('pointerenter',warmBottle,{once:true});
  bottleCard.addEventListener('touchstart',warmBottle,{once:true});
}
if(window.requestIdleCallback){
  requestIdleCallback(()=>prefetch('bottle/index.html'));
}else{
  setTimeout(()=>prefetch('bottle/index.html'),3000);
}
</script>
</body>
</html>
