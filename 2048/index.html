<!DOCTYPE html>
<html lang="zh-CN" data-theme="4399">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('gh-theme')==='arcade')document.documentElement.setAttribute('data-theme','arcade')}catch(e){}</script>
<title>2048</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;color:var(--text);background:var(--bg);font-family:'Rubik','PingFang SC','Microsoft YaHei',sans-serif;display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
/* ============ 4399 清新绿 ============ */
body[data-theme="4399"]{
  --bg:#f2f8ec;--bg2:#e8f4de;--surface:#fff;--line:#c2dbb0;--hard:#1f4a17;
  --text:#24401d;--dim:#6f8a63;--green:#389904;--green2:#2c7c05;--orange:#fb6400;--yellow:#f5b700;--cyan:#187f8e;
  --panel:rgba(255,255,255,.9);--panel-line:rgba(88,137,67,.25);
  --glow:rgba(56,153,4,.35);
  background:
    radial-gradient(1200px 500px at 50% -10%,#dff0cf 0%,rgba(223,240,207,0) 60%),
    linear-gradient(180deg,#eef7e6,#fff 55%,#f5faf0);
}
/* ============ arcade 街机霓虹 ============ */
body[data-theme="arcade"]{
  --bg:#07070f;--bg2:#10102a;--surface:#14143a;--line:#3a3a68;--hard:#000;
  --text:#eef0ff;--dim:#8a8ab6;--green:#00ff9d;--orange:#ff9d3d;--yellow:#ffe14d;--cyan:#3de1ff;--pink:#ff2d78;
  --panel:rgba(18,18,52,.78);--panel-line:rgba(140,140,210,.3);
  --glow:rgba(61,225,255,.5);
  background:
    radial-gradient(900px 520px at 50% -8%,rgba(61,225,255,.12),transparent 60%),
    radial-gradient(700px 420px at 85% 108%,rgba(255,45,120,.12),transparent 60%),
    #07070f;
}
/* scanlines overlay for arcade */
body[data-theme="arcade"]::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;
}
/* subtle grid for 4399 */
body[data-theme="4399"]::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(56,153,4,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(56,153,4,.05) 1px,transparent 1px);
  background-size:34px 34px;
}
.back-home{position:fixed;left:16px;top:16px;z-index:30;display:inline-block;padding:9px 16px;border-radius:999px;text-decoration:none;font-size:13px;font-weight:700;color:var(--text);background:var(--surface);border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.back-home:hover{color:var(--orange);transform:translateY(-2px)}
body[data-theme="4399"] .back-home{background:rgba(255,255,255,.68);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 3px 12px rgba(56,153,4,.14)}
body[data-theme="arcade"] .back-home{font-family:'Press Start 2P',monospace;font-size:9px;padding:10px 14px;border-radius:0;border:2px solid var(--cyan);box-shadow:3px 3px 0 var(--hard),0 0 12px rgba(61,225,255,.25);color:var(--cyan)}
body[data-theme="arcade"] .back-home:hover{color:#fff;background:var(--cyan);box-shadow:3px 3px 0 var(--hard),0 0 22px rgba(61,225,255,.6)}
.theme-switch{position:fixed;right:16px;bottom:16px;z-index:50;width:46px;height:46px;padding:0;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#16a34a;background:rgba(255,255,255,.92);border:1px solid rgba(34,197,94,.4);box-shadow:0 3px 14px rgba(34,197,94,.2);backdrop-filter:blur(8px);transition:transform 180ms ease,background 180ms ease}
.theme-switch:hover{transform:scale(1.08) rotate(-3deg)}
body[data-theme="arcade"] .theme-switch{color:#7ff3ff;background:rgba(10,10,24,.82);border-color:rgba(61,225,255,.42);box-shadow:0 0 16px rgba(61,225,255,.23)}
.wrap{position:relative;z-index:1;max-width:520px;width:100%;padding:70px 16px 90px;display:flex;flex-direction:column;align-items:center}
.topbar{width:100%;display:flex;justify-content:center;margin-bottom:4px}
.badge{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:3px}
body[data-theme="4399"] .badge{background:rgba(255,255,255,.65);border:1px solid rgba(88,137,67,.25);border-radius:999px;padding:4px 14px;color:var(--green2);backdrop-filter:blur(6px);letter-spacing:2px}
body[data-theme="arcade"] .badge{font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:2px;color:var(--pink);text-shadow:0 0 8px rgba(255,45,120,.5)}
h1.title{font-size:40px;font-weight:900;color:var(--text);margin:4px 0 6px;letter-spacing:2px}
body[data-theme="4399"] h1.title{
  background:linear-gradient(135deg,#2c7c05 0%,#54a02a 55%,#fb6400 125%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 2px 0 rgba(56,153,4,.16));
}
body[data-theme="arcade"] h1.title{font-family:'Press Start 2P',monospace;font-size:28px;color:var(--yellow);letter-spacing:2px;text-shadow:0 0 16px var(--yellow),3px 3px 0 var(--hard),0 0 34px rgba(255,225,77,.5)}
.sub{font-size:12px;color:var(--dim);letter-spacing:1px;margin-bottom:16px}
body[data-theme="arcade"] .sub{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--cyan);text-shadow:0 0 8px rgba(61,225,255,.4)}
.hud{width:100%;display:flex;justify-content:center;gap:12px;margin-bottom:14px}
.hud .card{flex:1;max-width:130px;text-align:center;background:var(--panel);border:1px solid var(--panel-line);border-radius:10px;padding:10px 8px;backdrop-filter:blur(6px)}
body[data-theme="4399"] .hud .card{box-shadow:0 6px 18px rgba(56,153,4,.08),inset 0 1px 0 rgba(255,255,255,.9)}
body[data-theme="arcade"] .hud .card{border-radius:0;border:2px solid var(--line);box-shadow:3px 3px 0 var(--hard),inset 0 0 18px rgba(61,225,255,.05)}
.hud .label{font-size:10px;font-weight:700;color:var(--dim);letter-spacing:2px;margin-bottom:4px}
body[data-theme="arcade"] .hud .label{font-family:'Press Start 2P',monospace;font-size:7px}
.hud .value{font-size:24px;font-weight:900;color:var(--green)}
body[data-theme="4399"] .hud .value{color:var(--green)}
body[data-theme="arcade"] .hud .value{font-family:'Press Start 2P',monospace;font-size:16px;color:var(--cyan);text-shadow:0 0 10px rgba(61,225,255,.7)}
.hud .value.best{color:var(--yellow)}
body[data-theme="arcade"] .hud .value.best{color:var(--yellow);text-shadow:0 0 10px rgba(255,225,77,.7)}
.board{position:relative;width:min(90vw,400px);aspect-ratio:1;background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:10px;margin-bottom:16px}
body[data-theme="4399"] .board{box-shadow:0 14px 30px rgba(56,153,4,.12),inset 0 0 0 3px rgba(255,255,255,.5)}
body[data-theme="arcade"] .board{border-radius:0;border:3px solid var(--line);box-shadow:5px 5px 0 var(--hard),0 0 26px rgba(61,225,255,.22),inset 0 0 34px rgba(0,0,0,.6)}
body[data-theme="arcade"] .board::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 4px)}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:900;border-radius:6px;transition:transform .13s ease-in-out,left .13s,top .13s;will-change:transform;user-select:none}
body[data-theme="4399"] .tile{border-radius:8px;box-shadow:0 3px 8px rgba(0,0,0,.12)}
body[data-theme="arcade"] .tile{border-radius:0;border:2px solid rgba(0,0,0,.35);box-shadow:2px 2px 0 var(--hard),inset 0 0 12px rgba(255,255,255,.22)}
.tile .tinner{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.tile-new .tinner,.tile-merged .tinner{animation:pop .18s ease}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
/* ===== arcade LED 低频随机闪烁（每块独立 delay，由 JS 设置 animationDelay） ===== */
@keyframes ledFlicker{
  0%,86%,90%,93%,100%{opacity:1;filter:brightness(1)}
  87%{opacity:.72;filter:brightness(.82) saturate(1.35)}
  88%{opacity:1;filter:brightness(1.1)}
  89%{opacity:.82;filter:brightness(.9)}
  91%{opacity:1;filter:brightness(1.06)}
  92%{opacity:.88;filter:brightness(.94)}
}
body[data-theme="arcade"] .tile{animation:ledFlicker 7s infinite}
/* ===== 4399 世界树 · 叶脉微风 ===== */
.leaf-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.world-leaf{--leaf-face:#6fa647;--leaf-edge:#3f6e31;--leaf-vein:#315f2a;--leaf-light:rgba(245,255,226,.8);position:fixed;width:var(--leaf-size,18px);aspect-ratio:14/19;opacity:0;pointer-events:none;color:var(--leaf-face);transform-origin:50% 82%}
.world-leaf.leaf--sage{--leaf-face:#88aa68;--leaf-edge:#527542;--leaf-vein:#46693b}
.world-leaf.leaf--amber{--leaf-face:#aaa052;--leaf-edge:#706c38;--leaf-vein:#625f32;--leaf-light:rgba(255,248,201,.72)}
.world-leaf svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 1px rgba(31,69,27,.18))}
.world-leaf .leaf-shape{fill:currentColor;stroke:var(--leaf-edge);stroke-width:1;vector-effect:non-scaling-stroke}
.world-leaf .leaf-glint{fill:none;stroke:var(--leaf-light);stroke-width:1.15;stroke-linecap:round;opacity:.72;vector-effect:non-scaling-stroke}
.world-leaf .leaf-vein{fill:none;stroke:var(--leaf-vein);stroke-width:.9;stroke-linecap:round;stroke-linejoin:round;opacity:.72;vector-effect:non-scaling-stroke}
body[data-theme="4399"] .leaf-layer .world-leaf{animation:leafDrift 16s cubic-bezier(.42,0,.58,1) infinite}
@keyframes leafDrift{
  0%{opacity:0;transform:translate3d(0,-8px,0) rotate(var(--r0,-12deg)) scale(var(--leaf-scale,.9))}
  9%{opacity:.58}
  27%{transform:translate3d(var(--x1,-24px),var(--y1,18vh),0) rotate(var(--r1,42deg)) scale(var(--leaf-scale,.9))}
  52%{transform:translate3d(var(--x2,-8px),var(--y2,44vh),0) rotate(var(--r2,-18deg)) scale(var(--leaf-scale,.9))}
  78%{opacity:.48;transform:translate3d(var(--x3,-72px),var(--y3,72vh),0) rotate(var(--r3,78deg)) scale(var(--leaf-scale,.9))}
  100%{opacity:0;transform:translate3d(var(--x4,-110px),var(--y4,108vh),0) rotate(var(--r4,150deg)) scale(var(--leaf-scale,.9))}
}
body[data-theme="4399"] .world-leaf.leaf-lift{z-index:26;animation:leafLift 1.2s cubic-bezier(.16,1,.3,1) forwards}
@keyframes leafLift{
  0%{opacity:0;transform:translate3d(0,7px,0) rotate(var(--r0,-18deg)) scale(.5)}
  18%{opacity:.86}
  48%{opacity:.74;transform:translate3d(var(--x1,8px),var(--y1,-28px),0) rotate(var(--r1,25deg)) scale(.78)}
  100%{opacity:0;transform:translate3d(var(--x2,28px),var(--y2,-82px),0) rotate(var(--r2,72deg)) scale(.96)}
}

/* ===== 4399 世界树 · 环境装饰（树影 + 萤火虫） ===== */
.decor-tree{position:fixed;right:-34px;top:-16px;z-index:0;pointer-events:none;opacity:.1;display:none}
body[data-theme="4399"] .decor-tree{display:block}
.decor-tree svg{display:block}
.firefly-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
body[data-theme="4399"] .firefly-layer{display:block}
.firefly-layer i{position:absolute;bottom:-14px;width:6px;height:6px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(220,255,130,.95) 0%,rgba(190,255,90,.4) 45%,rgba(190,255,90,0) 72%);
  box-shadow:0 0 10px 3px rgba(190,255,90,.35);
  animation:fireflyUp linear infinite}
@keyframes fireflyUp{
  0%{opacity:0;transform:translate3d(0,0,0) scale(.6)}
  10%{opacity:.9}
  70%{opacity:.55}
  100%{opacity:0;transform:translate3d(var(--fx,20px),calc(-1*var(--fh,80vh)),0) scale(1)}
}

/* 4399 配色 */
body[data-theme="4399"] .tile{color:#fff}
body[data-theme="4399"] .tile.v2{background:#eee4da;color:#776e65;box-shadow:0 3px 6px rgba(119,110,101,.18)}
body[data-theme="4399"] .tile.v4{background:#ede0c8;color:#776e65;box-shadow:0 3px 6px rgba(119,110,101,.18)}
body[data-theme="4399"] .tile.v8{background:#f2b179;box-shadow:0 3px 8px rgba(242,177,121,.4)}
body[data-theme="4399"] .tile.v16{background:#f59563;box-shadow:0 3px 8px rgba(245,149,99,.42)}
body[data-theme="4399"] .tile.v32{background:#f67c5f;box-shadow:0 3px 8px rgba(246,124,95,.42)}
body[data-theme="4399"] .tile.v64{background:#f65e3b;box-shadow:0 3px 10px rgba(246,94,59,.45)}
body[data-theme="4399"] .tile.v128{background:linear-gradient(180deg,#edcf72,#e3b94e);box-shadow:0 4px 12px rgba(237,207,114,.5)}
body[data-theme="4399"] .tile.v256{background:linear-gradient(180deg,#edcc61,#e2b63e);box-shadow:0 4px 12px rgba(237,204,97,.5)}
body[data-theme="4399"] .tile.v512{background:linear-gradient(180deg,#edc850,#e0b02e);box-shadow:0 4px 12px rgba(237,200,80,.55)}
body[data-theme="4399"] .tile.v1024{background:linear-gradient(180deg,#edc53f,#dca91f);box-shadow:0 5px 16px rgba(237,197,63,.6)}
body[data-theme="4399"] .tile.v2048{background:linear-gradient(180deg,#edc22e,#d9a511);box-shadow:0 0 24px rgba(237,194,46,.7),0 5px 14px rgba(217,165,17,.5)}
/* arcade 霓虹配色 */
body[data-theme="arcade"] .tile{color:#0b0b18}
body[data-theme="arcade"] .tile.v2{background:linear-gradient(135deg,#3de1ff,#0fb6d6);color:#001016;box-shadow:2px 2px 0 var(--hard),0 0 16px rgba(61,225,255,.55)}
body[data-theme="arcade"] .tile.v4{background:linear-gradient(135deg,#7ae8ff,#3dc9ea);color:#00121a;box-shadow:2px 2px 0 var(--hard),0 0 16px rgba(122,232,255,.5)}
body[data-theme="arcade"] .tile.v8{background:linear-gradient(135deg,#00ff9d,#00c476);color:#001008;box-shadow:2px 2px 0 var(--hard),0 0 16px rgba(0,255,157,.55)}
body[data-theme="arcade"] .tile.v16{background:linear-gradient(135deg,#66ffc2,#22e094);color:#00130b;box-shadow:2px 2px 0 var(--hard),0 0 16px rgba(102,255,194,.5)}
body[data-theme="arcade"] .tile.v32{background:linear-gradient(135deg,#ff2d78,#d60a58);color:#1a0010;box-shadow:2px 2px 0 var(--hard),0 0 18px rgba(255,45,120,.6)}
body[data-theme="arcade"] .tile.v64{background:linear-gradient(135deg,#ff5c96,#ff2d78);color:#1a0010;box-shadow:2px 2px 0 var(--hard),0 0 18px rgba(255,45,120,.55)}
body[data-theme="arcade"] .tile.v128{background:linear-gradient(135deg,#ffe14d,#ffb42e);color:#3a2a00;box-shadow:2px 2px 0 var(--hard),0 0 18px rgba(255,225,77,.6)}
body[data-theme="arcade"] .tile.v256{background:linear-gradient(135deg,#ffed8a,#ffd23d);color:#3a2a00;box-shadow:2px 2px 0 var(--hard),0 0 20px rgba(255,225,77,.65)}
body[data-theme="arcade"] .tile.v512{background:linear-gradient(135deg,#b388ff,#8a4dff);color:#15002b;box-shadow:2px 2px 0 var(--hard),0 0 20px rgba(179,136,255,.6)}
body[data-theme="arcade"] .tile.v1024{background:linear-gradient(135deg,#d4b8ff,#a26bff);color:#15002b;box-shadow:2px 2px 0 var(--hard),0 0 24px rgba(179,136,255,.7)}
body[data-theme="arcade"] .tile.v2048{background:linear-gradient(135deg,#ffe14d,#ff9d00);color:#3a2a00;box-shadow:2px 2px 0 var(--hard),0 0 30px rgba(255,225,77,.85),0 0 60px rgba(255,157,0,.4)}
.btn{font-weight:900;font-size:15px;padding:13px 34px;border-radius:10px;cursor:pointer;border:2px solid var(--green);background:var(--green);color:#fff;transition:.18s;margin-bottom:12px}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
body[data-theme="4399"] .btn{box-shadow:0 6px 0 var(--green2),0 10px 18px rgba(56,153,4,.22)}
body[data-theme="4399"] .btn:hover{box-shadow:0 4px 0 var(--green2),0 10px 20px rgba(56,153,4,.28)}
body[data-theme="4399"] .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--green2)}
body[data-theme="arcade"] .btn{font-family:'Press Start 2P',monospace;font-size:10px;border-radius:0;border:3px solid var(--cyan);background:linear-gradient(180deg,#10102a,#0a0a1e);color:var(--cyan);box-shadow:4px 4px 0 var(--hard),0 0 18px rgba(61,225,255,.3);text-shadow:0 0 8px rgba(61,225,255,.6)}
body[data-theme="arcade"] .btn:hover{color:#00121a;background:var(--cyan);box-shadow:4px 4px 0 var(--hard),0 0 26px rgba(61,225,255,.7)}
body[data-theme="arcade"] .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--hard)}
.controls{font-size:12px;color:var(--dim);text-align:center;line-height:1.8;max-width:420px}
body[data-theme="arcade"] .controls{font-size:11px}
.controls b{color:var(--text)}
body[data-theme="arcade"] .controls b{color:var(--cyan);text-shadow:0 0 6px rgba(61,225,255,.5)}
/* ============ 虚拟方向键（双主题） ============ */
.dpad{position:fixed;left:16px;top:66%;transform:translateY(-50%);z-index:45;display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:4px;padding:11px;touch-action:none;user-select:none;-webkit-user-select:none}
/* 街机烤漆控制台 */
body[data-theme="arcade"] .dpad{
  background:
    radial-gradient(circle at 10px 10px,#e9f4fa 0 2px,#728da3 2.5px 4px,transparent 4.5px),
    radial-gradient(circle at calc(100% - 10px) 10px,#e9f4fa 0 2px,#728da3 2.5px 4px,transparent 4.5px),
    radial-gradient(circle at 10px calc(100% - 10px),#e9f4fa 0 2px,#728da3 2.5px 4px,transparent 4.5px),
    radial-gradient(circle at calc(100% - 10px) calc(100% - 10px),#e9f4fa 0 2px,#728da3 2.5px 4px,transparent 4.5px),
    linear-gradient(145deg,#35a7e8 0%,#176bab 48%,#0d477f 100%);
  border:2px solid #8de7ff;
  box-shadow:0 5px 0 #082c54,0 10px 22px rgba(2,14,38,.48),inset 0 2px 0 rgba(255,255,255,.42),inset 0 -3px 0 rgba(4,42,84,.42);
  border-radius:10px 10px 16px 16px;
}
body[data-theme="arcade"] .dpad::before{content:'PLAYER 1';position:absolute;left:12px;top:-11px;padding:4px 7px 3px;font:7px/1 'Press Start 2P',monospace;letter-spacing:1px;color:#173653;background:#ffe14d;border:2px solid #fff0a0;border-radius:2px;box-shadow:0 3px 0 #9b5510;transform:rotate(-2deg);pointer-events:none}
body[data-theme="arcade"] .dpad button{width:40px;height:40px;color:#fff8df;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.92) 0 5%,rgba(255,255,255,.34) 6% 12%,transparent 13%),radial-gradient(circle at 45% 38%,#d51b52 0 31%,#bc1147 50%,#8f0d3a 72%,#59082d 100%);border:3px solid #d9e6ed;border-radius:50%;box-shadow:0 4px 0 #580729,0 7px 9px rgba(3,25,58,.5),inset 0 2px 2px rgba(255,255,255,.42),inset 0 -4px 5px rgba(80,0,33,.34);text-shadow:0 1px 1px #69072f}
body[data-theme="arcade"] .dpad button:hover{color:#fff;filter:brightness(1.1);box-shadow:0 5px 0 #580729,0 9px 12px rgba(3,25,58,.54),inset 0 2px 2px rgba(255,255,255,.5),inset 0 -4px 5px rgba(80,0,33,.3);transform:translateY(-1px)}
body[data-theme="arcade"] .dpad button:active{color:#fff;filter:brightness(.96);transform:translateY(4px);box-shadow:0 1px 0 #580729,0 2px 4px rgba(3,25,58,.45),inset 0 3px 6px rgba(80,0,33,.35)}
body[data-theme="arcade"] .dpad .dpad-center{width:30px;height:30px;align-self:center;justify-self:center;border:3px solid #d9e6ed;border-radius:50%;background:radial-gradient(circle at 34% 27%,#fff8bd 0 7%,#ffe14d 9% 38%,#e99a20 58%,#8b480f 78%,#4d2a0a 100%);box-shadow:0 3px 0 #6d380b,0 5px 7px rgba(3,25,58,.38),inset 0 2px 2px rgba(255,255,255,.48)}
/* 4399 世界树主题：年轮木章与苔玉方向键 */
body[data-theme="4399"] .dpad{isolation:isolate;background:
  radial-gradient(circle at 30% 22%,rgba(255,255,255,.62),transparent 25%),
  repeating-radial-gradient(circle at 52% 49%,transparent 0 15px,rgba(93,67,32,.08) 16px 17px),
  linear-gradient(145deg,#eadbad 0%,#cfad70 54%,#ab7a40 100%);
  border:2px solid #8b673b;border-radius:50%;

<body data-theme="4399">
<a class="back-home" href="../index.html">← 主页</a>
<button class="theme-switch" id="themeToggle" aria-label="切换主题" title="切换主题"></button>
<main class="wrap">
  <div class="topbar"><span class="badge">MYSTERY · 2048</span></div>
  <h1 class="title">2048</h1>
  <p class="sub">合并数字 · 冲击 2048</p>
  <div class="hud">
    <div class="card"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
    <div class="card"><div class="label">BEST</div><div class="value best" id="best">0</div></div>
  </div>
  <div class="board" id="board"><div id="tiles"></div></div>
  <button class="btn" id="newGame">重新开始</button>
  <div class="controls"><b>↑ ↓ ← →</b> 或 <b>W A S D</b> 移动 · 滑动屏幕合并数字<br>相同数字相碰合并，凑出 <b>2048</b> 获胜</div>
  <div class="dpad" role="group" aria-label="移动方向">
    <button type="button" data-dir="0" aria-label="向上移动"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 15 7-7 7 7"/></svg></button>
    <button type="button" data-dir="1" aria-label="向左移动"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></button>
    <span class="dpad-center" aria-hidden="true"><svg class="dpad-tree" viewBox="0 0 24 24"><path d="M12 20V9M12 12C8.5 12 6 9.8 6 6.4c3.5-.2 6 1.7 6 5.1M12 13c3.5 0 6-2.2 6-5.6-3.5-.2-6 1.7-6 5.1M12 20l-4 2m4-2 4 2m-4-2v3"/></svg></span>
    <button type="button" data-dir="3" aria-label="向右移动"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></button>
    <button type="button" data-dir="2" aria-label="向下移动"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg></button>
  </div>
</main>
<div class="modal" id="modal" hidden>
  <div class="box">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <button class="btn" id="modalBtn">再来一局</button>
  </div>
</div>
<script>
(function(){
'use strict';
var SIZE=4, GAP=10;
var board=document.getElementById('board');
var tilesEl=document.getElementById('tiles');
var scoreEl=document.getElementById('score');
var bestEl=document.getElementById('best');
var modal=document.getElementById('modal');
var modalTitle=document.getElementById('modalTitle');
var modalText=document.getElementById('modalText');
var modalBtn=document.getElementById('modalBtn');
var grid=[], tiles=[], nextId=1, score=0, best=0, over=false, won=false;
var SLIDE_MS=140; // 与 CSS .tile transition 0.13s 匹配
var tileEls={};   // tile.id -> DOM 元素（复用，实现滑动动画）
var leafLayer=null;
try{ best=parseInt(localStorage.getItem('g2048-best')||'0',10)||0; }catch(e){}
bestEl.textContent=best;

function resetGrid(){ grid=[]; for(var r=0;r<SIZE;r++){ grid[r]=[]; for(var c=0;c<SIZE;c++) grid[r][c]=null; } }
function tileSize(){ var w=board.clientWidth-2*GAP; return Math.floor((w-GAP*(SIZE-1))/SIZE); }
function cellPos(r,c){ var s=tileSize(); return {x:GAP+c*(s+GAP), y:GAP+r*(s+GAP), s:s}; }

// 纯逻辑：一行值左移合并，返回 {out,score,moved}（合并只算一次）
function slideLine(vals){
  var arr=vals.filter(function(v){return v>0;});
  var out=[0,0,0,0], sc=0, i=0, j=0;
  while(j<arr.length){
    if(j+1<arr.length && arr[j]===arr[j+1]){ out[i]=arr[j]*2; sc+=arr[j]*2; i++; j+=2; }
    else { out[i]=arr[j]; i++; j++; }
  }
  var moved=false;
  for(var k=0;k<SIZE;k++) if(out[k]!==vals[k]) moved=true;
  return {out:out, score:sc, moved:moved};
}

function move(dir){
  if(over) return;
  var total=0, anyMove=false;
  var newGrid=[]; for(var r=0;r<SIZE;r++) newGrid[r]=[null,null,null,null];
  var movedTiles=[], mergedIds=[], mergeAway=[];
  for(var line=0; line<SIZE; line++){
    // 收集该线中非空 tile（按移动方向排序）
    var sources=[]; // {tile} 按移动方向收集非空tile
    var vals=[];
    for(var p=0;p<SIZE;p++){
      var rr,cc;
      if(dir===0){ rr=p; cc=line; }           // 上：p=0 是 row0
      else if(dir===1){ rr=line; cc=p; }      // 左：p=0 是 col0
      else if(dir===2){ rr=SIZE-1-p; cc=line; } // 下：p=0 是 row3
      else { rr=line; cc=SIZE-1-p; }          // 右：p=0 是 col3
      var tile=grid[rr][cc];
      vals.push(tile?tile.v:0);
      if(tile) sources.push({tile:tile});
    }
    var res=slideLine(vals);
    if(res.moved) anyMove=true;
    total+=res.score;
    // 用 slideLine 结果分配，si 指向 sources 索引（避免 coords 索引错位）
    var si=0;
    for(var k=0;k<SIZE;k++){
      if(res.out[k]>0){
        var t=sources[si].tile;
        var nextSource = si+1<sources.length ? sources[si+1].tile : null;
        var isMerge = nextSource && nextSource.v===t.v && res.out[k]===t.v*2;
        var outR,outC;
        if(dir===0){ outR=k; outC=line; }
        else if(dir===1){ outR=line; outC=k; }
        else if(dir===2){ outR=SIZE-1-k; outC=line; }
        else { outR=line; outC=SIZE-1-k; }
        if(isMerge){
          t.v=t.v*2;
          mergedIds.push(t.id);
          mergeAway.push({tile:nextSource, toR:outR, toC:outC}); // 被合并块滑到目标后移除
          si+=2;
        }
        else { si+=1; }
        t.r=outR; t.c=outC;
        newGrid[outR][outC]=t;
        movedTiles.push(t);
      }
    }
  }
  grid=newGrid;
  if(!anyMove) return;
  score+=total;
  scoreEl.textContent=score;
  if(score>best){ best=score; bestEl.textContent=best; try{localStorage.setItem('g2048-best',String(best));}catch(e){} }
  /* ---- 动画阶段一：滑动（复用 DOM，改 left/top 触发 CSS transition） ---- */
  var alive={};
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
    var t=(grid[r]&&grid[r][c])||null; if(!t) continue;
    alive[t.id]=true;
    var el=tileEls[t.id];
    if(el){
      setTileValue(el,t);
      positionTile(el,t.r,t.c); // 触发滑动过渡
    }
  }
  // 被合并的块也滑向目标位置
  for(var a=0;a<mergeAway.length;a++){
    var ma=mergeAway[a];
    var el=tileEls[ma.tile.id];
    if(el) positionTile(el,ma.toR,ma.toC);
  }
  // 合并存活块 pop 放大
  for(var m=0;m<mergedIds.length;m++){
    if(tileEls[mergedIds[m]]) tileEls[mergedIds[m]].classList.add('tile-merged');
  }
  // 4399：合并时以少量叶片回应
  if(mergedIds.length) burstLeaves(mergedIds.length);

  /* ---- 动画阶段二：滑动结束后移除被合并块并生成新块 ---- */
  setTimeout(function(){
    for(var id in tileEls){
      if(!alive[id]){
        var el=tileEls[id];
        if(el.parentNode) el.parentNode.removeChild(el);
        delete tileEls[id];
      }
    }
    spawn();
    for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
      var t=(grid[r]&&grid[r][c])||null; if(!t||alive[t.id]) continue;
      var el=createTileEl(t);
      el.classList.add('tile-new'); // 新块入场 pop
      tileEls[t.id]=el;
      tilesEl.appendChild(el);
    }
    check();
  }, SLIDE_MS);
}

function spawn(){
  var empties=[];
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++) if(!grid[r][c]) empties.push({r:r,c:c});
  if(!empties.length) return;
  var e=empties[Math.floor(Math.random()*empties.length)];
  grid[e.r][e.c]={id:nextId++, v:Math.random()<0.9?2:4, r:e.r, c:e.c};
}

/* ===================== DOM tile 复用（滑动/合并动画基础） ===================== */
function createTileEl(t){
  var el=document.createElement('div');
  el.className='tile v'+t.v;
  el.setAttribute('data-id',t.id);
  // arcade LED：每块随机闪烁延迟（低频、独立）
  el.style.animationDelay=(Math.random()*7).toFixed(2)+'s';
  var pos=cellPos(t.r,t.c);
  el.style.width=pos.s+'px'; el.style.height=pos.s+'px';
  el.style.left=pos.x+'px'; el.style.top=pos.y+'px';
  var inner=document.createElement('div');
  inner.className='tinner';
  inner.textContent=t.v;
  inner.style.fontSize=fontSize(t.v,pos.s)+'px';
  el.appendChild(inner);
  return el;
}
function setTileValue(el,t){
  var inner=el.querySelector('.tinner');
  if(inner.textContent!=String(t.v)){
    inner.textContent=t.v;
    el.className='tile v'+t.v;
    var pos=cellPos(t.r,t.c);
    inner.style.fontSize=fontSize(t.v,pos.s)+'px';
  }
}
function positionTile(el,r,c){ var pos=cellPos(r,c); el.style.left=pos.x+'px'; el.style.top=pos.y+'px'; }
/* 全量同步（新开局 / 主题切换），entrance 为 true 时新块带入场 pop */
function syncAll(entrance){
  var alive={};
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
    var t=(grid[r]&&grid[r][c])||null; if(!t) continue;
    alive[t.id]=true;
    var el=tileEls[t.id];
    if(!el){
      el=createTileEl(t);
      if(entrance) el.classList.add('tile-new');
      tileEls[t.id]=el;
      tilesEl.appendChild(el);
    } else {
      setTileValue(el,t);
      positionTile(el,t.r,t.c);
    }
  }
  for(var id in tileEls){
    if(!alive[id]){
      var el=tileEls[id];
      if(el.parentNode) el.parentNode.removeChild(el);
      delete tileEls[id];
    }
  }
}
function fontSize(v,cell){
  var len=String(v).length;
  if(len<=2) return Math.floor(cell*0.45);
  if(len===3) return Math.floor(cell*0.36);
  if(len===4) return Math.floor(cell*0.3);
  return Math.floor(cell*0.24);
}

function check(){
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++) if(grid[r][c]&&grid[r][c].v>=2048&&!won){
    won=true; modalTitle.textContent='🎉 2048!'; modalText.textContent='你成功凑出了 2048！太厉害了！'; showModal(); return;
  }
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++) if(!grid[r][c]) return;
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
    var t=grid[r][c];
    if(c+1<SIZE&&grid[r][c+1]&&grid[r][c+1].v===t.v) return;
    if(r+1<SIZE&&grid[r+1][c]&&grid[r+1][c].v===t.v) return;
  }
  over=true; modalTitle.textContent='游戏结束'; modalText.textContent='无法继续合并了。得分：'+score; showModal();
}
function showModal(){ modal.classList.add('show'); modal.hidden=false; }
function hideModal(){ modal.classList.remove('show'); modal.hidden=true; }
function newGame(){ resetGrid(); tiles=[]; score=0; over=false; won=false; scoreEl.textContent='0'; hideModal(); spawn(); spawn(); syncAll(true); }

/* ===================== 4399 世界树 · 环境装饰（树影/叶脉微风/萤火虫） ===================== */
function reducedMotion(){ try{ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
var treeEl=null, fireflyLayer=null;
function treeSVG(){
  return '<svg viewBox="0 0 200 240" width="300" height="360" aria-hidden="true">'
    +'<path d="M92 224c-10 8-24 10-34 7M108 224c10 8 24 10 34 7M100 224c0 7 1 11 0 16" stroke="#7a5230" stroke-width="6" stroke-linecap="round" fill="none"/>'
    +'<path d="M91 224 C88 172 93 152 100 126 C107 152 112 172 109 224 Z" fill="#7a5230"/>'
    +'<circle cx="100" cy="62" r="47" fill="#57a832"/>'
    +'<circle cx="60" cy="92" r="35" fill="#57a832"/>'
    +'<circle cx="140" cy="92" r="35" fill="#57a832"/>'
    +'<circle cx="80" cy="122" r="31" fill="#5cb43c"/>'
    +'<circle cx="120" cy="122" r="31" fill="#5cb43c"/>'
    +'<circle cx="100" cy="44" r="31" fill="#4f9c2e"/>'
    +'</svg>';
}
function startTree(){
  if(treeEl) return;
  treeEl=document.createElement('div');
  treeEl.className='decor-tree';
  treeEl.innerHTML=treeSVG();
  document.body.appendChild(treeEl);
}
function stopTree(){ if(treeEl){ if(treeEl.parentNode) treeEl.parentNode.removeChild(treeEl); treeEl=null; } }
function leafSVG(){
  return '<svg viewBox="0 0 28 38" aria-hidden="true"><path class="leaf-shape" d="M14.4 2.5c6.4 2.6 11 8.2 10.4 14.8-.8 8-7.1 14.2-17.6 16.8 1-6.3-3.1-10.1-3-16.3.1-6.9 4.1-12.2 10.2-15.3Z"/><path class="leaf-glint" d="M13.3 6.2c-3.9 2.9-5.8 7-5.7 11.6"/><path class="leaf-vein" d="M7.1 35.6c3.8-8 6.4-15.6 7.7-28.2M11.7 24.6l-4.3-4M13.1 19.2l5.4-4.4M10.1 29.7l-2.7-2.4"/></svg>';
}
function createLeaf(extraClass){
  var l=document.createElement('span');
  var tone=Math.random()<.18?'leaf--amber':(Math.random()<.42?'leaf--sage':'leaf--fern');
  l.className='world-leaf '+tone+(extraClass?' '+extraClass:'');
  l.innerHTML=leafSVG();
  return l;
}
function startLeaves(){
  if(leafLayer||reducedMotion()) return;
  leafLayer=document.createElement('div');
  leafLayer.className='leaf-layer';
  var vh=Math.max(window.innerHeight||0,560);
  for(var i=0;i<4;i++){
    var l=createLeaf('');
    var duration=14+Math.random()*7;
    var tilt=-35+Math.random()*70;
    l.style.right=(8+Math.random()*210).toFixed(0)+'px';
    l.style.top=(36+Math.random()*96)+'px';
    l.style.animationDelay=(-Math.random()*duration).toFixed(2)+'s';
    l.style.animationDuration=duration.toFixed(2)+'s';
    l.style.setProperty('--leaf-size',(14+Math.random()*8).toFixed(1)+'px');
    l.style.setProperty('--leaf-scale',(0.76+Math.random()*0.34).toFixed(2));
    l.style.setProperty('--x1',(-15-Math.random()*30).toFixed(0)+'px');
    l.style.setProperty('--x2',(10-Math.random()*55).toFixed(0)+'px');
    l.style.setProperty('--x3',(-28-Math.random()*88).toFixed(0)+'px');
    l.style.setProperty('--x4',(-72-Math.random()*125).toFixed(0)+'px');
    l.style.setProperty('--y1',(vh*(.16+Math.random()*.06)).toFixed(0)+'px');
    l.style.setProperty('--y2',(vh*(.39+Math.random()*.08)).toFixed(0)+'px');
    l.style.setProperty('--y3',(vh*(.66+Math.random()*.08)).toFixed(0)+'px');
    l.style.setProperty('--y4',(vh*(1.02+Math.random()*.12)).toFixed(0)+'px');
    l.style.setProperty('--r0',tilt.toFixed(0)+'deg');
    l.style.setProperty('--r1',(tilt+40+Math.random()*50).toFixed(0)+'deg');
    l.style.setProperty('--r2',(tilt-30-Math.random()*45).toFixed(0)+'deg');
    l.style.setProperty('--r3',(tilt+60+Math.random()*70).toFixed(0)+'deg');
    l.style.setProperty('--r4',(tilt+125+Math.random()*90).toFixed(0)+'deg');
    leafLayer.appendChild(l);
  }
  document.body.appendChild(leafLayer);
}
function stopLeaves(){
  if(leafLayer){ if(leafLayer.parentNode) leafLayer.parentNode.removeChild(leafLayer); leafLayer=null; }
}
function startFireflies(){
  if(fireflyLayer||reducedMotion()) return;
  fireflyLayer=document.createElement('div');
  fireflyLayer.className='firefly-layer';
  for(var i=0;i<8;i++){
    var f=document.createElement('i');
    f.style.left=(2+Math.random()*96)+'%';
    f.style.animationDuration=(9+Math.random()*9).toFixed(2)+'s';
    f.style.animationDelay=(Math.random()*10).toFixed(2)+'s';
    f.style.setProperty('--fx',(-60+Math.random()*120)+'px');
    f.style.setProperty('--fh',(55+Math.random()*40)+'vh');
    fireflyLayer.appendChild(f);
  }
  document.body.appendChild(fireflyLayer);
}
function stopFireflies(){ if(fireflyLayer){ if(fireflyLayer.parentNode) fireflyLayer.parentNode.removeChild(fireflyLayer); fireflyLayer=null; } }
function burstLeaves(count,sourceEl){
  if(document.body.getAttribute('data-theme')!=='4399'||!count||reducedMotion()) return;
  var b=(sourceEl||board).getBoundingClientRect();
  var total=Math.min(7,Math.max(2,Math.ceil(count*1.2)));
  for(var i=0;i<total;i++){
    var l=createLeaf('leaf-lift');
    var tilt=-28+Math.random()*56;
    l.style.left=(b.left+b.width*(.14+Math.random()*.72))+'px';
    l.style.top=(b.top+b.height*(.38+Math.random()*.42))+'px';
    l.style.animationDelay=(i*.045).toFixed(2)+'s';
    l.style.animationDuration=(1+Math.random()*.38).toFixed(2)+'s';
    l.style.setProperty('--leaf-size',(13+Math.random()*6).toFixed(1)+'px');
    l.style.setProperty('--r0',tilt.toFixed(0)+'deg');
    l.style.setProperty('--r1',(tilt-24+Math.random()*48).toFixed(0)+'deg');
    l.style.setProperty('--r2',(tilt-75+Math.random()*150).toFixed(0)+'deg');
    l.style.setProperty('--x1',(-14+Math.random()*28).toFixed(0)+'px');
    l.style.setProperty('--y1',(-24-Math.random()*16).toFixed(0)+'px');
    l.style.setProperty('--x2',(-42+Math.random()*84).toFixed(0)+'px');
    l.style.setProperty('--y2',(-70-Math.random()*38).toFixed(0)+'px');
    document.body.appendChild(l);
    (function(el){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },1700); })(l);
  }
}

// 输入
var keyMap={ ArrowUp:0, w:0, W:0, ArrowRight:3, d:3, D:3, ArrowDown:2, s:2, S:2, ArrowLeft:1, a:1, A:1 };
window.addEventListener('keydown',function(e){
  if(keyMap[e.key]!==undefined){ e.preventDefault(); move(keyMap[e.key]); }
});
Array.prototype.forEach.call(document.querySelectorAll('.dpad button'),function(b){
  b.addEventListener('click',function(){ move(parseInt(b.getAttribute('data-dir'),10)); });
});
// 触屏滑动
var tx=0,ty=0;
board.addEventListener('touchstart',function(e){ var t=e.touches[0]; tx=t.clientX; ty=t.clientY; e.preventDefault(); },{passive:false});
board.addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});
board.addEventListener('touchend',function(e){
  var t=e.changedTouches[0]; var dx=t.clientX-tx, dy=t.clientY-ty;
  if(Math.abs(dx)<24&&Math.abs(dy)<24) return;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?3:1);
  else move(dy>0?2:0);
});
document.getElementById('newGame').addEventListener('click',newGame);
modalBtn.addEventListener('click',function(){ newGame(); });

// 主题
var themeToggle=document.getElementById('themeToggle');
function iconSVG(arcade){
  return arcade
    ? '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3C9.8 3 8 4.8 8 7c0 .6.1 1.2.4 1.7C6.5 9.4 5.2 11 5.2 13c0 2.2 1.8 4 4 4h5.6c2.2 0 4-1.8 4-4 0-2-1.3-3.6-3.2-4.3.3-.5.4-1.1.4-1.7 0-2.2-1.8-4-4-4z"/><path d="M12 17v4"/><path d="M12 21l-3 2M12 21l3 2"/></svg>'
    : '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 12 L21 6 A10 10 0 1 0 21 18 Z"/><circle cx="13.5" cy="7.5" r="1.1" fill="#ffffff"/></svg>';
}
function applyTheme(t){
  document.body.setAttribute('data-theme',t);
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('gh-theme',t);}catch(e){}
  themeToggle.innerHTML=iconSVG(t==='arcade');
  if(t==='4399'){ startTree(); startLeaves(); startFireflies(); }
  else { stopTree(); stopLeaves(); stopFireflies(); }
  syncAll(false);
}
var initTheme=(function(){ try{return document.documentElement.getAttribute('data-theme')||'4399';}catch(e){return '4399';} })();
applyTheme(initTheme==='arcade'?'arcade':'4399');
themeToggle.addEventListener('click',function(){
  applyTheme(document.body.getAttribute('data-theme')==='arcade'?'4399':'arcade');
});

// 启动
newGame();
})();
</script>
<script>
/* ===== 防沉迷统一计时（与主页共享 golPlaySeconds，每天提醒一次） ===== */
(function(){
  var PLAY_SECONDS_KEY='golPlaySeconds';
  var PLAY_WARNED_KEY='golPlayWarnedDate';
  var THRESHOLD=15*60;      // 900 秒 = 15 分钟
  var STEP=30;              // 每次心跳累加 30 秒
  var INTERVAL=30000;       // 每 30 秒心跳

  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  var today=new Date();
  var dateKey=today.getFullYear()+'-'+(today.getMonth()+1)+'-'+today.getDate();

  function readSeconds(){
    var v=parseInt(lsGet(PLAY_SECONDS_KEY),10);
    return isNaN(v)?0:v;
  }
  var playSeconds=readSeconds();
  var warned=false;
  if(lsGet(PLAY_WARNED_KEY)===dateKey) warned=true;

  var banner=null;
  function ensureBanner(){
    if(banner) return banner;
    banner=document.createElement('div');
    banner.setAttribute('role','alert');
    banner.style.cssText='position:fixed;left:16px;right:16px;bottom:20px;z-index:99999;background:rgba(20,20,35,.96);color:#ffe14d;border:2px solid #ff4040;border-radius:12px;padding:14px 18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.5;box-shadow:0 6px 24px rgba(0,0,0,.35);text-align:center;transform:translateY(20px);opacity:0;transition:opacity .25s ease,transform .25s ease;';
    var reduced=false;
    try{ reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
    if(reduced){ banner.style.transition='none'; }
    var title=document.createElement('div');
    title.style.cssText='font-weight:700;font-size:18px;';
    title.textContent='⏰ 已经玩 '+Math.floor(playSeconds/60)+' 分钟啦';
    var sub=document.createElement('div');
    sub.style.cssText='margin-top:4px;color:#eee;font-size:14px;';
    sub.textContent='注意休息眼睛，眺望一下远方吧 👀';
    banner.appendChild(title);
    banner.appendChild(sub);
    if(document.body) document.body.appendChild(banner);
    requestAnimationFrame(function(){ banner.style.transform='translateY(0)'; banner.style.opacity='1'; });
    return banner;
  }
  function warnPlay(){
    // 每天只提醒一次：当天已提醒则不再弹
    if(warned) return;
    warned=true;
    lsSet(PLAY_WARNED_KEY,dateKey);
    ensureBanner();
    var t=setTimeout(function(){ if(banner){ banner.style.opacity='0'; banner.style.transform='translateY(20px)'; } },8000);
    banner.addEventListener('click',function(){ banner.style.opacity='0'; banner.style.transform='translateY(20px)'; clearTimeout(t); });
  }
  function tickPlay(){
    // 仅在页面可见时累计，切走/隐藏时暂停
    if(document.visibilityState==='visible'){
      playSeconds+=STEP;
      lsSet(PLAY_SECONDS_KEY,String(playSeconds));
      if(playSeconds>=THRESHOLD) warnPlay();
    }
  }
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') tickPlay();
  });
  setInterval(tickPlay,INTERVAL);
  // 初次加载：若已累计达到阈值且当天未提醒，立即提示
  if(playSeconds>=THRESHOLD) warnPlay();
})();
</script>
