<!DOCTYPE html>
<html lang="zh-CN" data-theme="4399">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script>try{if(localStorage.getItem('gh-theme')==='arcade')document.documentElement.setAttribute('data-theme','arcade')}catch(e){}</script>
<title>2048</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;color:var(--text);background:var(--bg);font-family:'PingFang SC','Microsoft YaHei',sans-serif;display:flex;flex-direction:column;align-items:center}
body[data-theme="4399"]{--bg:#f4f8ef;--bg2:#eef7e9;--surface:#fff;--line:#c9dec0;--hard:#17331d;--text:#24401d;--dim:#6f8a63;--green:#389904;--orange:#fb6400;--yellow:#f5b700;--cyan:#187f8e;--panel:rgba(255,255,255,.88);--panel-line:rgba(88,137,67,.28);background:linear-gradient(180deg,#f0f7ea,#fff 55%,#f7fbf3)}
body[data-theme="arcade"]{--bg:#0b0b18;--bg2:#14142b;--surface:#191934;--line:#3a3a5c;--hard:#000;--text:#f4f4ff;--dim:#7a7aa0;--green:#00ff9d;--orange:#fb6400;--yellow:#ffe14d;--cyan:#3de1ff;--pink:#ff2d78;--panel:rgba(25,25,52,.8);--panel-line:rgba(122,122,160,.35)}
body[data-theme="arcade"]{background:#0b0b18}
.back-home{position:fixed;left:16px;top:16px;z-index:30;display:inline-block;padding:8px 16px;border-radius:999px;text-decoration:none;font-size:13px;color:var(--text);background:var(--surface);border:1px solid var(--line);transition:transform .2s}
.back-home:hover{color:var(--orange);transform:translateY(-2px)}
.theme-switch{position:fixed;right:16px;bottom:16px;z-index:50;width:46px;height:46px;padding:0;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);transition:transform .2s}
.theme-switch:hover{transform:scale(1.08)}
.wrap{position:relative;z-index:1;max-width:520px;width:100%;padding:70px 16px 40px;display:flex;flex-direction:column;align-items:center}
.topbar{width:100%;display:flex;justify-content:center;margin-bottom:4px}
.badge{font-size:11px;color:var(--dim);letter-spacing:2px}
h1.title{font-size:38px;font-weight:900;color:var(--text);margin:4px 0 6px}
body[data-theme="arcade"] h1.title{font-family:'Press Start 2P',monospace;font-size:26px;color:var(--yellow);text-shadow:0 0 14px var(--yellow),3px 3px 0 var(--hard)}
.sub{font-size:12px;color:var(--dim);letter-spacing:1px;margin-bottom:16px}
body[data-theme="arcade"] .sub{font-family:'Press Start 2P',monospace;font-size:8px}
.hud{width:100%;display:flex;justify-content:center;gap:12px;margin-bottom:14px}
.hud .card{flex:1;max-width:130px;text-align:center;background:var(--panel);border:1px solid var(--panel-line);border-radius:8px;padding:10px 8px}
body[data-theme="arcade"] .hud .card{border-radius:0;box-shadow:2px 2px 0 var(--hard)}
.hud .label{font-size:11px;color:var(--dim);letter-spacing:2px;margin-bottom:4px}
.hud .value{font-size:24px;font-weight:900;color:var(--green)}
body[data-theme="arcade"] .hud .value{font-family:'Press Start 2P',monospace;font-size:16px;color:var(--cyan);text-shadow:0 0 8px rgba(61,225,255,.6)}
.hud .value.best{color:var(--yellow)}
body[data-theme="arcade"] .hud .value.best{color:var(--yellow);text-shadow:0 0 8px rgba(255,225,77,.6)}
.board{position:relative;width:min(90vw,400px);aspect-ratio:1;background:var(--bg2);border:2px solid var(--line);border-radius:10px;padding:10px;margin-bottom:16px}
body[data-theme="arcade"] .board{border-radius:0;border:3px solid var(--line);box-shadow:4px 4px 0 var(--hard),inset 0 0 30px rgba(0,0,0,.5)}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:900;border-radius:6px;transition:transform .13s ease-in-out,left .13s,top .13s;will-change:transform;user-select:none}
body[data-theme="arcade"] .tile{border-radius:0}
.tile .tinner{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.tile-new .tinner,.tile-merged .tinner{animation:pop .18s ease}
@keyframes pop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
/* 4399 配色 */
body[data-theme="4399"] .tile{color:#fff}
body[data-theme="4399"] .tile.v2{background:#eee4da;color:#776e65}
body[data-theme="4399"] .tile.v4{background:#ede0c8;color:#776e65}
body[data-theme="4399"] .tile.v8{background:#f2b179;color:#fff}
body[data-theme="4399"] .tile.v16{background:#f59563;color:#fff}
body[data-theme="4399"] .tile.v32{background:#f67c5f;color:#fff}
body[data-theme="4399"] .tile.v64{background:#f65e3b;color:#fff}
body[data-theme="4399"] .tile.v128{background:#edcf72;color:#fff}
body[data-theme="4399"] .tile.v256{background:#edcc61;color:#fff}
body[data-theme="4399"] .tile.v512{background:#edc850;color:#fff}
body[data-theme="4399"] .tile.v1024{background:#edc53f;color:#fff}
body[data-theme="4399"] .tile.v2048{background:#edc22e;color:#fff;box-shadow:0 0 20px rgba(237,194,46,.5)}
/* arcade 配色 */
body[data-theme="arcade"] .tile{color:#0b0b18}
body[data-theme="arcade"] .tile.v2{background:#3de1ff}
body[data-theme="arcade"] .tile.v4{background:#7ae8ff}
body[data-theme="arcade"] .tile.v8{background:#00ff9d}
body[data-theme="arcade"] .tile.v16{background:#66ffc2}
body[data-theme="arcade"] .tile.v32{background:#ff2d78;color:#1a0010}
body[data-theme="arcade"] .tile.v64{background:#ff5c96;color:#1a0010}
body[data-theme="arcade"] .tile.v128{background:#ffe14d;color:#3a2a00}
body[data-theme="arcade"] .tile.v256{background:#ffed8a;color:#3a2a00}
body[data-theme="arcade"] .tile.v512{background:#b388ff;color:#15002b}
body[data-theme="arcade"] .tile.v1024{background:#d4b8ff;color:#15002b}
body[data-theme="arcade"] .tile.v2048{background:linear-gradient(135deg,#ffe14d,#ff9d00);color:#3a2a00;box-shadow:0 0 24px rgba(255,225,77,.7)}
.btn{font-weight:700;font-size:15px;padding:12px 32px;border-radius:8px;cursor:pointer;border:2px solid var(--green);background:var(--green);color:#fff;transition:.18s;margin-bottom:12px}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
body[data-theme="arcade"] .btn{font-family:'Press Start 2P',monospace;font-size:10px;border-radius:0;border:3px solid var(--green);box-shadow:3px 3px 0 var(--hard)}
.controls{font-size:12px;color:var(--dim);text-align:center;line-height:1.8}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px;margin-top:14px;touch-action:none;user-select:none}
.dpad button{display:flex;align-items:center;justify-content:center;width:46px;height:46px;padding:0;color:var(--text);background:var(--panel);border:1px solid var(--panel-line);border-radius:8px;box-shadow:0 2px 0 var(--line);cursor:pointer;font-size:20px;touch-action:manipulation}
.dpad button:active{transform:translateY(2px);background:var(--green);color:#fff}
body[data-theme="arcade"] .dpad button{border-radius:0}
.dpad button[data-dir="0"]{grid-column:2;grid-row:1}
.dpad button[data-dir="3"]{grid-column:1;grid-row:2}
.dpad .dpad-center{grid-column:2;grid-row:2;border-radius:50%;background:var(--line);opacity:.4}
.dpad button[data-dir="1"]{grid-column:3;grid-row:2}
.dpad button[data-dir="2"]{grid-column:2;grid-row:3}
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.6)}
.modal.show{display:flex}
.modal .box{width:min(340px,92%);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:30px;text-align:center;box-shadow:0 0 40px rgba(0,0,0,.3)}
body[data-theme="arcade"] .modal .box{border-radius:0;border:3px solid var(--line);box-shadow:4px 4px 0 var(--hard),0 0 30px rgba(61,225,255,.2)}
.modal h2{font-size:24px;font-weight:900;color:var(--yellow);margin-bottom:12px}
body[data-theme="arcade"] .modal h2{font-family:'Press Start 2P',monospace;font-size:14px}
.modal p{color:var(--dim);font-size:14px;margin-bottom:18px}
body[data-theme="arcade"] .modal p{font-family:'Press Start 2P',monospace;font-size:9px}
.modal .btn{margin-top:0;margin-bottom:0}
@media (max-width:480px){
  h1.title{font-size:30px}
  .tile{font-size:22px}
}
</style>
</head>
<body data-theme="4399">
<a class="back-home" href="../index.html">← 主页</a>
<button class="theme-switch" id="themeToggle" aria-label="切换主题" title="切换主题"></button>
<main class="wrap">
  <div class="topbar"><span class="badge">Mystery · 2048</span></div>
  <h1 class="title">2048</h1>
  <p class="sub">合并数字 · 冲击 2048</p>
  <div class="hud">
    <div class="card"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
    <div class="card"><div class="label">BEST</div><div class="value best" id="best">0</div></div>
  </div>
  <div class="board" id="board"><div id="tiles"></div></div>
  <button class="btn" id="newGame">重新开始</button>
  <div class="controls"><b>↑ ↓ ← →</b> 或 <b>W A S D</b> 移动 · 滑动屏幕合并数字<br>相同数字相碰合并，凑出 <b>2048</b> 获胜</div>
  <div class="dpad" id="dpad">
    <button type="button" data-dir="0" aria-label="上">↑</button>
    <button type="button" data-dir="3" aria-label="左">←</button>
    <span class="dpad-center"></span>
    <button type="button" data-dir="1" aria-label="右">→</button>
    <button type="button" data-dir="2" aria-label="下">↓</button>
  </div>
</main>
<div class="modal" id="modal" hidden>
  <div class="box">
    <h2 id="modalTitle"></h2>
    <p id="modalText"></p>
    <button class="btn" id="modalBtn">再来一局</button>
  </div>
</div>
<script>
(function(){
'use strict';
var SIZE=4, GAP=10;
var board=document.getElementById('board');
var tilesEl=document.getElementById('tiles');
var scoreEl=document.getElementById('score');
var bestEl=document.getElementById('best');
var modal=document.getElementById('modal');
var modalTitle=document.getElementById('modalTitle');
var modalText=document.getElementById('modalText');
var modalBtn=document.getElementById('modalBtn');
var grid=[], tiles=[], nextId=1, score=0, best=0, over=false, won=false;
try{ best=parseInt(localStorage.getItem('g2048-best')||'0',10)||0; }catch(e){}
bestEl.textContent=best;

function resetGrid(){ grid=[]; for(var r=0;r<SIZE;r++){ grid[r]=[]; for(var c=0;c<SIZE;c++) grid[r][c]=null; } }
function tileSize(){ var w=board.clientWidth-2*GAP; return Math.floor((w-GAP*(SIZE-1))/SIZE); }
function cellPos(r,c){ var s=tileSize(); return {x:GAP+c*(s+GAP), y:GAP+r*(s+GAP), s:s}; }

// 纯逻辑：一行值左移合并，返回 {out,score,moved}（合并只算一次）
function slideLine(vals){
  var arr=vals.filter(function(v){return v>0;});
  var out=[0,0,0,0], sc=0, i=0, j=0;
  while(j<arr.length){
    if(j+1<arr.length && arr[j]===arr[j+1]){ out[i]=arr[j]*2; sc+=arr[j]*2; i++; j+=2; }
    else { out[i]=arr[j]; i++; j++; }
  }
  var moved=false;
  for(var k=0;k<SIZE;k++) if(out[k]!==vals[k]) moved=true;
  return {out:out, score:sc, moved:moved};
}

function move(dir){
  if(over) return;
  var total=0, anyMove=false;
  // 新网格
  var newGrid=[]; for(var r=0;r<SIZE;r++) newGrid[r]=[null,null,null,null];
  var movedTiles=[], mergedIds=[];
  for(var line=0; line<SIZE; line++){
    // 取该线的值（沿移动方向）
    var vals=[], coords=[];
    for(var p=0;p<SIZE;p++){
      var rr,cc;
      if(dir===0){ rr=p; cc=line; }      // 上
      else if(dir===1){ rr=line; cc=p; } // 左
      else if(dir===2){ rr=SIZE-1-p; cc=line; } // 下
      else { rr=line; cc=SIZE-1-p; }      // 右
      vals.push(grid[rr][cc]?grid[rr][cc].v:0);
      coords.push({r:rr,c:cc});
    }
    var res=slideLine(vals);
    if(res.moved) anyMove=true;
    total+=res.score;
    // 放置结果，更新tile位置和合并
    var tIdx=0;
    for(var k=0;k<SIZE;k++){
      if(res.out[k]>0){
        var t = grid[coords[tIdx].r][coords[tIdx].c];
        var outR,outC;
        if(dir===0){ outR=k; outC=line; }
        else if(dir===1){ outR=line; outC=k; }
        else if(dir===2){ outR=SIZE-1-k; outC=line; }
        else { outR=line; outC=SIZE-1-k; }
        // 合并判断：输出值是源值的2倍且下一非零源值相同
        var nextT = tIdx+1<SIZE ? grid[coords[tIdx+1].r][coords[tIdx+1].c] : null;
        var isMerge = nextT && nextT.v===t.v && res.out[k]===t.v*2;
        if(isMerge){ t.v=t.v*2; mergedIds.push(t.id); tIdx+=2; }
        else { tIdx+=1; }
        t.r=outR; t.c=outC;
        newGrid[outR][outC]=t;
        movedTiles.push(t);
      }
    }
  }
  grid=newGrid;
  if(!anyMove) return;
  score+=total;
  scoreEl.textContent=score;
  if(score>best){ best=score; bestEl.textContent=best; try{localStorage.setItem('g2048-best',String(best));}catch(e){} }
  render(mergedIds);
  spawn();
  render([]);
  check();
}

function spawn(){
  var empties=[];
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++) if(!grid[r][c]) empties.push({r:r,c:c});
  if(!empties.length) return;
  var e=empties[Math.floor(Math.random()*empties.length)];
  grid[e.r][e.c]={id:nextId++, v:Math.random()<0.9?2:4, r:e.r, c:e.c};
}

function render(mergedIds){
  tilesEl.innerHTML='';
  var s=tileSize();
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
    var t=grid[r][c]; if(!t) continue;
    var pos=cellPos(t.r,t.c);
    var el=document.createElement('div');
    el.className='tile v'+t.v;
    el.style.width=pos.s+'px'; el.style.height=pos.s+'px';
    el.style.left=pos.x+'px'; el.style.top=pos.y+'px';
    var inner=document.createElement('div');
    inner.className='tinner';
    inner.textContent=t.v;
    var fs=fontSize(t.v,pos.s);
    inner.style.fontSize=fs+'px';
    if(mergedIds.indexOf(t.id)>=0) el.classList.add('tile-merged');
    el.appendChild(inner);
    tilesEl.appendChild(el);
  }
}
function fontSize(v,cell){
  var len=String(v).length;
  if(len<=2) return Math.floor(cell*0.45);
  if(len===3) return Math.floor(cell*0.36);
  if(len===4) return Math.floor(cell*0.3);
  return Math.floor(cell*0.24);
}

function check(){
  // 胜利
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++) if(grid[r][c]&&grid[r][c].v>=2048&&!won){
    won=true; modalTitle.textContent='🎉 2048!'; modalText.textContent='你成功凑出了 2048！太厉害了！'; showModal(); return;
  }
  // 失败
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++) if(!grid[r][c]) return;
  for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
    var t=grid[r][c];
    if(c+1<SIZE&&grid[r][c+1]&&grid[r][c+1].v===t.v) return;
    if(r+1<SIZE&&grid[r+1][c]&&grid[r+1][c].v===t.v) return;
  }
  over=true; modalTitle.textContent='游戏结束'; modalText.textContent='无法继续合并了。得分：'+score; showModal();
}
function showModal(){ modal.classList.add('show'); modal.hidden=false; }
function hideModal(){ modal.classList.remove('show'); modal.hidden=true; }
function newGame(){ resetGrid(); tiles=[]; score=0; over=false; won=false; scoreEl.textContent='0'; hideModal(); spawn(); spawn(); render([]); }

// 输入
var keyMap={ ArrowUp:0, w:0, W:0, ArrowRight:1, d:1, D:1, ArrowDown:2, s:2, S:2, ArrowLeft:3, a:3, A:3 };
window.addEventListener('keydown',function(e){
  if(keyMap[e.key]!==undefined){ e.preventDefault(); move(keyMap[e.key]); }
});
Array.prototype.forEach.call(document.querySelectorAll('.dpad button'),function(b){
  b.addEventListener('click',function(){ move(parseInt(b.getAttribute('data-dir'),10)); });
});
// 触屏滑动
var tx=0,ty=0;
board.addEventListener('touchstart',function(e){ var t=e.touches[0]; tx=t.clientX; ty=t.clientY; e.preventDefault(); },{passive:false});
board.addEventListener('touchmove',function(e){ e.preventDefault(); },{passive:false});
board.addEventListener('touchend',function(e){
  var t=e.changedTouches[0]; var dx=t.clientX-tx, dy=t.clientY-ty;
  if(Math.abs(dx)<24&&Math.abs(dy)<24) return;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?1:3);
  else move(dy>0?2:0);
});
document.getElementById('newGame').addEventListener('click',newGame);
modalBtn.addEventListener('click',function(){ newGame(); });

// 主题
var themeToggle=document.getElementById('themeToggle');
function iconSVG(arcade){
  return arcade
    ? '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 12 L21 6 A10 10 0 1 0 21 18 Z"/><circle cx="13.5" cy="7.5" r="1.1" fill="#0a0a18"/></svg>'
    : '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3C9.8 3 8 4.8 8 7c0 .6.1 1.2.4 1.7C6.5 9.4 5.2 11 5.2 13c0 2.2 1.8 4 4 4h5.6c2.2 0 4-1.8 4-4 0-2-1.3-3.6-3.2-4.3.3-.5.4-1.1.4-1.7 0-2.2-1.8-4-4-4z"/><path d="M12 17v4"/></svg>';
}
function applyTheme(t){
  document.body.setAttribute('data-theme',t);
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('gh-theme',t);}catch(e){}
  themeToggle.innerHTML=iconSVG(t==='arcade');
  render([]);
}
var initTheme=(function(){ try{return document.documentElement.getAttribute('data-theme')||'4399';}catch(e){return '4399';} })();
applyTheme(initTheme==='arcade'?'arcade':'4399');
themeToggle.addEventListener('click',function(){
  applyTheme(document.body.getAttribute('data-theme')==='arcade'?'4399':'arcade');
});

// 启动
newGame();
})();
</script>
</body>
</html>
