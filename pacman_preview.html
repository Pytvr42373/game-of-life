<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>吃豆人 Icon 预览</title>
<style>
body{background:#0a0a18;color:#7ff3ff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:30px;padding:40px}
h2{color:#fff;font-size:18px}
.row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}
.card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(127,243,255,.2)}
.card .label{font-size:13px;color:#9ad}
.btn-demo{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(10,10,24,.75);border:1px solid rgba(61,225,255,.4);color:#7ff3ff}
.btn-demo.light{background:rgba(255,255,255,.9);border:1px solid rgba(34,197,94,.35);color:#16a34a}
</style>
</head>
<body>
<h1 style="color:#fff">吃豆人 Pac-Man Icon 变体预览</h1>

<h2>变体 A：经典实心（嘴朝右 + 眼睛）</h2>
<div class="row">
  <div class="card"><div class="btn-demo"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 12 L20 7.5 A9 9 0 1 0 20 16.5 Z"/><circle cx="14.5" cy="8" r="1.2" fill="#0a0a18"/></svg></div><div class="label">深底浅线</div></div>
  <div class="card"><div class="btn-demo light"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 12 L20 7.5 A9 9 0 1 0 20 16.5 Z"/><circle cx="14.5" cy="8" r="1.2" fill="#fff"/></svg></div><div class="label">浅底深线</div></div>
</div>

<h2>变体 B：描边线条版（嘴朝右 + 眼睛）</h2>
<div class="row">
  <div class="card"><div class="btn-demo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 12 L19.5 7.8 A8 8 0 1 0 19.5 16.2 Z"/><circle cx="14" cy="8.5" r="0.8" fill="currentColor" stroke="none"/></svg></div><div class="label">深底浅线</div></div>
  <div class="card"><div class="btn-demo light"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 12 L19.5 7.8 A8 8 0 1 0 19.5 16.2 Z"/><circle cx="14" cy="8.5" r="0.8" fill="currentColor" stroke="none"/></svg></div><div class="label">浅底深线</div></div>
</div>

<h2>变体 C：大嘴版（嘴巴开更大 + 眼睛）</h2>
<div class="row">
  <div class="card"><div class="btn-demo"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 12 L21 6 A10 10 0 1 0 21 18 Z"/><circle cx="13.5" cy="7.5" r="1.1" fill="#0a0a18"/></svg></div><div class="label">深底浅线</div></div>
  <div class="card"><div class="btn-demo light"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 12 L21 6 A10 10 0 1 0 21 18 Z"/><circle cx="13.5" cy="7.5" r="1.1" fill="#fff"/></svg></div><div class="label">浅底深线</div></div>
</div>

<h2>变体 D：描边大嘴版（嘴巴开更大 + 眼睛）</h2>
<div class="row">
  <div class="card"><div class="btn-demo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 12 L20.5 6.5 A9.5 9.5 0 1 0 20.5 17.5 Z"/><circle cx="13" cy="8" r="0.9" fill="currentColor" stroke="none"/></svg></div><div class="label">深底浅线</div></div>
  <div class="card"><div class="btn-demo light"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 12 L20.5 6.5 A9.5 9.5 0 1 0 20.5 17.5 Z"/><circle cx="13" cy="8" r="0.9" fill="currentColor" stroke="none"/></svg></div><div class="label">浅底深线</div></div>
</div>

<h2>变体 E：实心 + 描边混合（最有辨识度）</h2>
<div class="row">
  <div class="card"><div class="btn-demo"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" stroke="currentColor" stroke-width="0.5"><path d="M12 2 L15 9.5 A9 9 0 1 0 15 14.5 L12 22 Z" transform="rotate(90 12 12)"/><circle cx="17" cy="11" r="1.3" fill="#0a0a18" stroke="none"/></svg></div><div class="label">深底(嘴朝下)</div></div>
  <div class="card"><div class="btn-demo"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 12 L20.5 7 A8.5 8.5 0 1 0 20.5 17 Z"/><circle cx="14" cy="8" r="1.2" fill="#0a0a18"/></svg></div><div class="label">经典实心(优化)</div></div>
  <div class="card"><div class="btn-demo light"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 12 L20.5 7 A8.5 8.5 0 1 0 20.5 17 Z"/><circle cx="14" cy="8" r="1.2" fill="#fff"/></svg></div><div class="label">经典实心(浅底)</div></div>
</div>

</body>
</html>
