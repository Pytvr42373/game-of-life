<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1A2B 猜数字</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bungee&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* ============ 主题1 · 4399橙绿（亮色·默认） ============ */
body[data-theme="4399"]{
  --bg:#f4f8ef; --bg2:#ffffff; --surface:#ffffff; --line:#d8e8cd;
  --text:#24401d; --dim:#6f8a63; --green:#389904; --green2:#448230; --orange:#fb6400; --orange2:#e64e00;
  --tag-bg:#eef5e8; --cell-empty:#ffffff; --cell-border:#d8e8cd;
  --gray-bg:#b9c8ad; --gray-text:#ffffff;
  --key-bg:#e6efde; --key-text:#24401d; --key-border:#cfe3bf;
  --overlay:rgba(36,64,29,.42);
  background:linear-gradient(180deg,#f0f7ea 0%,#ffffff 55%,#f7fbf3 100%);color:var(--text);
}
body[data-theme="4399"]::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:
    radial-gradient(circle at 12% 18%, rgba(56,153,4,.08), transparent 40%),
    radial-gradient(circle at 88% 80%, rgba(251,100,0,.07), transparent 40%);
}

/* ============ 主题2 · 街机厅（暗色） ============ */
body[data-theme="arcade"]{
  --bg:#0b0b18; --bg2:#14142b; --surface:#191934; --line:#3a3a5c; --hard:#000;
  --text:#f4f4ff; --dim:#7a7aa0; --green:#00ff9d; --pink:#ff2d78; --cyan:#3de1ff; --yellow:#ffe14d;
  --tag-bg:#2a2a4a; --cell-empty:#191934; --cell-border:#3a3a5c;
  --gray-bg:#3a3a5c; --gray-text:#9a9ac4;
  --key-bg:#24244a; --key-text:#f4f4ff; --key-border:#3a3a5c;
  --overlay:rgba(0,0,0,.75);
  background-color:#0b0b18;color:var(--text);
  background-image:radial-gradient(circle at 50% 0%, #2a2a55 0%, transparent 60%);
}
/* 像素网格 */
body[data-theme="arcade"]::before{
  content:'';position:fixed;inset:0;pointer-events:none;opacity:.15;z-index:0;
  background-image:linear-gradient(#3a3a5c 1px,transparent 1px),linear-gradient(90deg,#3a3a5c 1px,transparent 1px);
  background-size:26px 26px;
}
/* CRT 扫描线 */
body[data-theme="arcade"]::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.5;
}

body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;transition:background .4s,color .4s}

/* ============ 主题切换器 ============ */
.theme-switch{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;display:flex;gap:8px;
  background:rgba(0,0,0,.6);backdrop-filter:blur(10px);padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2)}
.theme-switch button{border:0;background:transparent;color:#cfcfcf;font-size:13px;font-weight:700;padding:5px 14px;border-radius:999px;cursor:pointer;font-family:inherit;transition:.25s;letter-spacing:.5px}
.theme-switch button:hover{color:#fff}
.theme-switch button.on{background:#fff;color:#111}

/* ============ 主容器 ============ */
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:84px 16px 210px;display:flex;flex-direction:column;align-items:center;min-height:100vh}

/* 4399 头部 */
body[data-theme="4399"] .h4399{display:block}
.h4399{display:none;text-align:center;margin-bottom:14px}
.h4399 .top{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:4px}
.h4399 .logo-box{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--green),var(--green2));display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;box-shadow:0 6px 16px rgba(56,153,4,.35)}
.h4399 .title{font-size:28px;font-weight:900;color:var(--green);letter-spacing:1px;text-shadow:0 2px 0 rgba(56,153,4,.12)}
.h4399 .title em{font-style:normal;color:var(--orange)}
.h4399 .sub{color:var(--dim);font-size:13px;margin-top:2px}

/* 街机厅 头部 */
body[data-theme="arcade"] .harcade{display:block}
.harcade{display:none;text-align:center;margin-bottom:14px}
.harcade .logo{font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:3px;color:var(--yellow);text-shadow:0 0 14px var(--yellow),3px 3px 0 var(--hard);margin-bottom:10px;animation:blink 1.4s steps(1) infinite}
.harcade .title{font-family:'Press Start 2P',monospace;font-size:clamp(16px,4.5vw,26px);line-height:1.6;color:var(--text);text-shadow:3px 3px 0 var(--hard),0 0 20px rgba(61,225,255,.4);margin-bottom:6px}
.harcade .title .c{color:var(--pink);text-shadow:3px 3px 0 var(--hard),0 0 20px var(--pink)}
.harcade .title .y{color:var(--cyan);text-shadow:3px 3px 0 var(--hard),0 0 20px var(--cyan)}
.harcade .sub{color:var(--dim);font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:3px}
@keyframes blink{50%{opacity:0}}

/* ============ 设置栏 ============ */
.setup{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.length-pick{display:flex;gap:8px}
.length-pick button{font-weight:700;font-size:14px;padding:8px 14px;border-radius:10px;cursor:pointer;transition:.18s;letter-spacing:.5px}
body[data-theme="4399"] .length-pick button{background:var(--surface);border:2px solid var(--line);color:var(--text)}
body[data-theme="4399"] .length-pick button.on{background:linear-gradient(135deg,var(--green),var(--green2));border-color:var(--green2);color:#fff;box-shadow:0 3px 10px rgba(56,153,4,.3)}
body[data-theme="arcade"] .length-pick button{background:var(--key-bg);border:3px solid var(--line);color:var(--key-text);box-shadow:3px 3px 0 var(--hard)}
body[data-theme="arcade"] .length-pick button.on{background:var(--green);border-color:var(--green);color:#000;box-shadow:3px 3px 0 var(--hard)}
.new-btn{font-weight:700;font-size:14px;padding:8px 16px;border-radius:10px;cursor:pointer;transition:.18s}
body[data-theme="4399"] .new-btn{background:linear-gradient(135deg,var(--orange),var(--orange2));border:2px solid var(--orange2);color:#fff;box-shadow:0 3px 10px rgba(251,100,0,.25)}
body[data-theme="4399"] .new-btn:hover{filter:brightness(1.08)}
body[data-theme="arcade"] .new-btn{background:var(--pink);border:3px solid var(--pink);color:#fff;text-shadow:2px 2px 0 #000;box-shadow:3px 3px 0 var(--hard)}
body[data-theme="arcade"] .new-btn:hover{background:#ff6aa0;border-color:var(--cyan)}

/* 进度提示 */
.hud{display:flex;align-items:center;gap:16px;margin-bottom:14px;font-size:13px}
body[data-theme="4399"] .hud .chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--dim)}
body[data-theme="4399"] .hud .chip b{color:var(--green2)}
body[data-theme="arcade"] .hud .chip{background:var(--surface);border:2px solid var(--line);box-shadow:3px 3px 0 var(--hard);padding:4px 12px;color:var(--dim);font-family:'Press Start 2P',monospace;font-size:9px}
body[data-theme="arcade"] .hud .chip b{color:var(--green);text-shadow:0 0 8px var(--green)}

/* ============ 棋盘 ============ */
.board{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
.row{display:flex;gap:5px;justify-content:center}
:root{--cell-size:min(calc((100vw - 57px)/6),58px);--cell-font:calc(var(--cell-size)*0.46)}
.cell{width:var(--cell-size);height:var(--cell-size);display:flex;align-items:center;justify-content:center;font-size:var(--cell-font);font-weight:800;
  border-radius:8px;transition:transform .1s}
body[data-theme="4399"] .cell{background:var(--cell-empty);border:2px solid var(--cell-border);color:var(--text)}
body[data-theme="arcade"] .cell{background:var(--cell-empty);border:3px solid var(--cell-border);color:var(--text);box-shadow:3px 3px 0 var(--hard)}
.cell.filled{animation:pop .15s ease}
@keyframes pop{50%{transform:scale(1.12)}}
.cell.current{border-color:var(--green)}
/* 已提交行反馈配色：!important 覆盖主题基础格子背景，杜绝白底白字 */
.cell.green{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important}
body[data-theme="arcade"] .cell.green{color:#000!important;box-shadow:3px 3px 0 var(--hard)!important,0 0 14px rgba(0,255,157,.5)!important}
.cell.yellow{background:#e2c233!important;border-color:#e2c233!important;color:#fff!important}
body[data-theme="arcade"] .cell.yellow{color:#000!important;box-shadow:3px 3px 0 var(--hard)!important,0 0 14px rgba(255,225,77,.5)!important}
.cell.gray{background:var(--gray-bg)!important;border-color:var(--gray-bg)!important;color:var(--gray-text)!important}
.cell .fb{font-size:11px;margin-left:1px;font-weight:700;opacity:.95}

/* 反馈动画 */
@keyframes flipIn{0%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.cell.reveal{animation:flipIn .45s ease forwards}
.row .cell:nth-child(1){animation-delay:0s}
.row .cell:nth-child(2){animation-delay:.1s}
.row .cell:nth-child(3){animation-delay:.2s}
.row .cell:nth-child(4){animation-delay:.3s}
.row .cell:nth-child(5){animation-delay:.4s}
.row .cell:nth-child(6){animation-delay:.5s}

/* ============ 键盘 ============ */
.kb{position:fixed;left:0;right:0;bottom:0;z-index:40;width:100%;padding:10px 12px max(14px, env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:6px;user-select:none;box-shadow:0 -8px 24px rgba(0,0,0,.18)}
body[data-theme="4399"] .kb{background:rgba(244,248,239,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
body[data-theme="arcade"] .kb{background:rgba(11,11,24,.97);backdrop-filter:blur(12px);border-top:2px solid var(--line)}
.kb-row{display:flex;gap:6px;justify-content:center;max-width:420px;margin:0 auto;width:100%}
.key{flex:1;height:50px;border-radius:8px;font-size:20px;font-weight:800;cursor:pointer;transition:.12s;touch-action:manipulation}
body[data-theme="4399"] .key{background:var(--key-bg);border:2px solid var(--key-border);color:var(--key-text)}
body[data-theme="4399"] .key:hover{background:var(--surface2,#eef5e8);border-color:var(--green);transform:translateY(-1px)}
body[data-theme="4399"] .key:active{transform:translateY(1px)}
body[data-theme="arcade"] .key{background:var(--key-bg);border:3px solid var(--line);color:var(--key-text);box-shadow:3px 3px 0 var(--hard)}
body[data-theme="arcade"] .key:hover{background:#2e2e58;border-color:var(--cyan);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--hard)}
body[data-theme="arcade"] .key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--hard)}
.key.wide{flex:1.6;font-size:15px}
.key.green{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important}
body[data-theme="arcade"] .key.green{color:#000!important;box-shadow:3px 3px 0 var(--hard),0 0 10px rgba(0,255,157,.4)!important}
.key.yellow{background:#e2c233!important;border-color:#e2c233!important;color:#fff!important}
body[data-theme="arcade"] .key.yellow{color:#000!important;box-shadow:3px 3px 0 var(--hard)!important}
.key.gray{background:var(--gray-bg)!important;border-color:var(--gray-bg)!important;color:var(--gray-text)!important}
body[data-theme="arcade"] .key.gray{box-shadow:2px 2px 0 var(--hard)!important}
.key:disabled{opacity:.5;cursor:not-allowed}

/* ============ 图例 ============ */
.legend{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.legend .item{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dim)}
.legend .sw{width:18px;height:18px;border-radius:5px;display:inline-block;flex:none}
.legend .sw.g{background:var(--green)}
.legend .sw.y{background:#e2c233}
.legend .sw.gr{background:var(--gray-bg)}

/* ============ 结果弹窗 ============ */
.overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(4px);z-index:150;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.modal{width:100%;max-width:380px;border-radius:16px;padding:22px;text-align:center;max-height:88vh;overflow:auto}
body[data-theme="4399"] .modal{background:var(--surface);border:2px solid var(--line);box-shadow:0 14px 40px rgba(36,64,29,.2)}
body[data-theme="arcade"] .modal{background:var(--surface);border:3px solid var(--line);box-shadow:8px 8px 0 var(--hard),0 0 30px rgba(61,225,255,.15)}
.modal h2{font-size:20px;margin-bottom:4px}
body[data-theme="4399"] .modal h2{color:var(--green)}
body[data-theme="arcade"] .modal h2{font-family:'Press Start 2P',monospace;font-size:14px;color:var(--green);text-shadow:0 0 10px var(--green);line-height:1.8}
.modal .answer{margin:6px 0 12px;font-size:15px;color:var(--dim)}
.modal .answer b{font-size:22px;letter-spacing:4px;color:var(--text)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stat-box{padding:10px 4px;border-radius:10px}
body[data-theme="4399"] .stat-box{background:var(--tag-bg);border:1px solid var(--line)}
body[data-theme="arcade"] .stat-box{background:var(--key-bg);border:2px solid var(--line)}
.stat-box .num{font-size:22px;font-weight:800;color:var(--green)}
.stat-box .lbl{font-size:11px;color:var(--dim);margin-top:2px}
.dist{margin:10px 0}
.dist .drow{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12px;color:var(--dim)}
.dist .dlabel{width:22px;flex:none;text-align:right}
.dist .dbar{height:18px;min-width:2px;border-radius:3px;transition:width .5s}
body[data-theme="4399"] .dbar{background:linear-gradient(90deg,var(--green),var(--green2))}
body[data-theme="arcade"] .dbar{background:var(--green);box-shadow:0 0 8px rgba(0,255,157,.4)}
.dist .dcount{width:18px;flex:none;color:var(--text)}
.modal-btns{display:flex;gap:10px;justify-content:center;margin-top:14px}
.modal-btns button{font-weight:700;font-size:14px;padding:10px 18px;border-radius:10px;cursor:pointer;transition:.18s}
body[data-theme="4399"] .modal-btns button{background:linear-gradient(135deg,var(--green),var(--green2));border:2px solid var(--green2);color:#fff}
body[data-theme="4399"] .modal-btns button.ghost{background:var(--surface);border:2px solid var(--line);color:var(--text)}
body[data-theme="arcade"] .modal-btns button{background:var(--green);border:3px solid var(--green);color:#000;box-shadow:3px 3px 0 var(--hard)}
body[data-theme="arcade"] .modal-btns button.ghost{background:var(--key-bg);border:3px solid var(--line);color:var(--text)}

.msg{font-size:14px;color:var(--dim);min-height:20px;margin-bottom:6px;text-align:center}

/* 减少动效偏好 */
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}

/* 移动端微调 */
@media (max-width:480px){
  .wrap{padding-top:76px}
  .key{height:48px}
}
@media (max-width:360px){
  .key{height:44px}
}

/* 返回主页按钮 */
.home-btn{position:fixed;top:14px;right:14px;z-index:98;text-decoration:none;font-family:inherit;font-weight:700;
  font-size:13px;padding:7px 14px;border-radius:999px;cursor:pointer;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);
  color:#fff;border:1px solid rgba(255,255,255,.25);transition:.25s;letter-spacing:.5px}
.home-btn:hover{background:rgba(0,0,0,.75);transform:translateY(-1px)}

</style>
</head>
<body data-theme="4399">

<a class="home-btn" href="../index.html">← 主页</a>
<div class="theme-switch">
  <button data-theme="4399" class="on">4399</button>
  <button data-theme="arcade">街机厅</button>
</div>

<div class="wrap">
  <!-- 4399 头部 -->
  <header class="h4399">
    <div class="top"><div class="logo-box">🔢</div><div class="title">1A2B <em>猜数字</em></div></div>
    <div class="sub">猜出隐藏的 N 位数字，数字可重复、首位可为 0</div>
  </header>

  <!-- 街机厅 头部 -->
  <header class="harcade">
    <div class="logo">▶ INSERT COIN ◀</div>
    <div class="title"><span class="c">1A</span>2B <span class="y">猜数字</span></div>
    <div class="sub">— GUESS THE NUMBER —</div>
  </header>

  <div class="setup">
    <div class="length-pick">
      <button class="on" data-len="4">4位</button>
      <button data-len="5">5位</button>
      <button data-len="6">6位</button>
    </div>
    <button class="new-btn" id="newGame">🔄 新游戏</button>
  </div>

  <div class="hud">
    <div class="chip">机会 <b id="chancesLeft">10</b>/<span id="chancesTotal">10</span></div>
    <div class="chip">最佳 <b id="bestLabel">—</b></div>
    <div class="chip" id="statsBtn" style="cursor:pointer;text-decoration:underline">📊 统计</div>
  </div>

  <div class="msg" id="msg"></div>

  <div class="board" id="board"></div>

  <div class="legend">
    <div class="item"><span class="sw g"></span>正确</div>
    <div class="item"><span class="sw y"></span>有但错位</div>
    <div class="item"><span class="sw gr"></span>不存在</div>
  </div>

  <div class="kb">
    <div class="kb-row">
      <button class="key" data-digit="1">1</button><button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button><button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
    </div>
    <div class="kb-row">
      <button class="key" data-digit="6">6</button><button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button><button class="key" data-digit="9">9</button>
      <button class="key" data-digit="0">0</button>
    </div>
    <div class="kb-row">
      <button class="key wide act" id="kbEnter">确认</button>
      <button class="key wide act" id="kbBack">⌫</button>
    </div>
  </div>
</div>

<!-- 结果弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="resultTitle">🎉 恭喜通关！</h2>
    <div class="answer">答案：<b id="resultAnswer"></b></div>
    <div id="resultSub" style="color:var(--dim);font-size:13px"></div>
    <div class="stats-grid">
      <div class="stat-box"><div class="num" id="stPlayed">0</div><div class="lbl">已玩</div></div>
      <div class="stat-box"><div class="num" id="stWinPct">0%</div><div class="lbl">胜率</div></div>
      <div class="stat-box"><div class="num" id="stStreak">0</div><div class="lbl">连胜</div></div>
      <div class="stat-box"><div class="num" id="stBest">—</div><div class="lbl">最佳</div></div>
    </div>
    <div class="dist" id="dist"></div>
    <div class="modal-btns">
      <button class="ghost" id="modalClose">关闭</button>
      <button id="modalNew">再来一局</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var CURRENT_LEN = 4;
  var MAX_GUESSES = {4:10, 5:12, 6:15};

  var answer = [];
  var guesses = [];      // 已提交的猜测 (each: array of digits)
  var feedbacks = [];    // 已提交的反馈 (each: array of 'green'|'yellow'|'gray')
  var current = [];      // 当前行输入
  var currentRow = 0;    // 下一行索引
  var gameOver = false;
  var isWin = false;
  var guessedCount = 0;  // 本局已提交次数

  var boardEl = document.getElementById('board');
  var msgEl = document.getElementById('msg');
  var chancesLeftEl = document.getElementById('chancesLeft');
  var chancesTotalEl = document.getElementById('chancesTotal');
  var bestLabelEl = document.getElementById('bestLabel');
  var overlay = document.getElementById('overlay');
  var kbEnter = document.getElementById('kbEnter');
  var kbBack = document.getElementById('kbBack');

  /* ================= 反馈算法（处理重复数字） ================= */
  function getFeedback(ans, gue){
    var n = ans.length;
    var result = new Array(n).fill('gray');
    var remaining = {};
    for (var i=0;i<n;i++){ remaining[ans[i]] = (remaining[ans[i]]||0)+1; }
    // 第一遍：绿色（位置和数字都正确）
    for (var i=0;i<n;i++){
      if (gue[i]===ans[i]){ result[i]='green'; remaining[ans[i]]--; }
    }
    // 第二遍：黄色（数字存在但位置错，且剩余可用）
    for (var i=0;i<n;i++){
      if (result[i]==='green') continue;
      var d = gue[i];
      if (remaining[d] > 0){ result[i]='yellow'; remaining[d]--; }
    }
    return result;
  }

  /* ================= 生成答案 ================= */
  function genAnswer(n){
    var a = [];
    for (var i=0;i<n;i++){ a.push(String(Math.floor(Math.random()*10))); }
    return a;
  }

  /* ================= 渲染棋盘 ================= */
  function renderBoard(){
    var max = MAX_GUESSES[CURRENT_LEN];
    var html = '';
    for (var r=0;r<max;r++){
      html += '<div class="row">';
      for (var c=0;c<CURRENT_LEN;c++){ html += '<div class="cell"></div>'; }
      html += '</div>';
    }
    boardEl.innerHTML = html;
  }

  function setCell(r, c, text, cls){
    var rowEl = boardEl.children[r];
    if (!rowEl) return;
    var cell = rowEl.children[c];
    if (cls) cell.className = 'cell ' + cls; else cell.className = 'cell';
    cell.textContent = text;
  }

  function updateCurrentRow(){
    var r = currentRow;
    var c;
    for (c=0;c<CURRENT_LEN;c++){
      if (c < current.length) setCell(r, c, current[c], 'cell filled');
      else setCell(r, c, '', 'cell');
    }
  }

  function renderBoardState(){
    // 已提交的行
    for (var i=0;i<feedbacks.length;i++){
      for (var c=0;c<CURRENT_LEN;c++){
        setCell(i, c, guesses[i][c], 'cell ' + feedbacks[i][c]);
      }
    }
    // 当前行
    if (!gameOver) updateCurrentRow();
    else { for (var c=0;c<CURRENT_LEN;c++) setCell(currentRow, c, '', 'cell'); }
  }

  /* ================= 键盘状态 ================= */
  function resetKeyboard(){
    document.querySelectorAll('.key[data-digit]').forEach(function(k){
      k.className = 'key';
    });
  }

  function updateKeyboard(guess, feedback){
    document.querySelectorAll('.key[data-digit]').forEach(function(k){
      var d = k.getAttribute('data-digit');
      var hasGreen=false, hasYellow=false, present=false;
      for (var i=0;i<guess.length;i++){
        if (guess[i]!==d) continue;
        present=true;
        if (feedback[i]==='green') hasGreen=true;
        else if (feedback[i]==='yellow') hasYellow=true;
      }
      if (hasGreen) k.className='key green';
      else if (hasYellow) k.className='key yellow';
      else if (present) k.className='key gray';
    });
  }

  /* ================= 游戏操作 ================= */
  function addDigit(d){
    if (gameOver) return;
    if (current.length >= CURRENT_LEN) return;
    current.push(d);
    updateCurrentRow();
    msgEl.textContent = '';
  }

  function doBackspace(){
    if (gameOver) return;
    if (current.length===0) return;
    current.pop();
    updateCurrentRow();
  }

  function submitGuess(){
    if (gameOver) return;
    if (current.length !== CURRENT_LEN){
      shakeRow();
      msgEl.textContent = '请输入 ' + CURRENT_LEN + ' 位数字';
      return;
    }
    var gue = current.slice();
    var fb = getFeedback(answer, gue);
    guesses.push(gue);
    feedbacks.push(fb);
    guessedCount++;

    // 逐格动画着色
    var rowEl = boardEl.children[currentRow];
    for (var c=0;c<CURRENT_LEN;c++){
      var cell = rowEl.children[c];
      cell.textContent = gue[c];
      setTimeout(function(cell2, cls){
        cell2.className = 'cell reveal ' + cls;
      }, 250 + c*160, cell, fb[c]);
    }

    updateKeyboard(gue, fb);

    // 判断输赢
    var won = fb.every(function(x){return x==='green';});
    current = [];
    currentRow++;
    updateHud();

    if (won){
      isWin = true;
      gameOver = true;
      setTimeout(function(){ endGame(true); }, 300 + CURRENT_LEN*160);
    } else if (currentRow >= MAX_GUESSES[CURRENT_LEN]){
      isWin = false;
      gameOver = true;
      setTimeout(function(){ endGame(false); }, 300 + CURRENT_LEN*160);
    } else {
      // 渲染空当前行
      for (var c=0;c<CURRENT_LEN;c++) setCell(currentRow, c, '', 'cell');
    }
  }

  function shakeRow(){
    var rowEl = boardEl.children[currentRow];
    if (!rowEl) return;
    rowEl.style.animation='shake .3s';
    setTimeout(function(){ rowEl.style.animation=''; }, 300);
  }

  function updateHud(){
    chancesLeftEl.textContent = Math.max(0, MAX_GUESSES[CURRENT_LEN]-currentRow);
    chancesTotalEl.textContent = MAX_GUESSES[CURRENT_LEN];
    bestLabelEl.textContent = getBest()===null ? '—' : getBest();
  }

  /* ================= 本地统计 ================= */
  function statsKey(len){ return 'ab12-stats-' + len; }
  function defaultStats(){
    return { played:0, won:0, currentStreak:0, maxStreak:0, best:null, dist:{} };
  }
  function loadStats(len){
    try {
      var raw = localStorage.getItem(statsKey(len));
      if (raw){ var s = JSON.parse(raw); if (s && typeof s==='object') return s; }
    } catch(e){}
    return defaultStats();
  }
  function saveStats(len, s){
    try { localStorage.setItem(statsKey(len), JSON.stringify(s)); } catch(e){}
  }
  function getBest(){
    return loadStats(CURRENT_LEN).best;
  }

  function recordResult(win){
    var s = loadStats(CURRENT_LEN);
    s.played++;
    if (win){
      s.won++;
      s.currentStreak++;
      s.maxStreak = Math.max(s.maxStreak, s.currentStreak);
      var prevBest = s.best;
      if (prevBest===null || guessedCount < prevBest) s.best = guessedCount;
      s.dist[guessedCount] = (s.dist[guessedCount]||0) + 1;
    } else {
      s.currentStreak = 0;
    }
    saveStats(CURRENT_LEN, s);
  }

  function endGame(win){
    recordResult(win);
    updateHud();
    showModal(win);
  }

  /* ================= 结果弹窗 ================= */
  function showModal(win){
    var s = loadStats(CURRENT_LEN);
    document.getElementById('resultTitle').textContent = win ? '🎉 恭喜通关！' : '😵 挑战失败';
    document.getElementById('resultAnswer').textContent = answer.join('');
    var sub = win
      ? ('第 ' + guessedCount + ' 次猜中，真厉害！')
      : ('已经用完 ' + MAX_GUESSES[CURRENT_LEN] + ' 次机会，别灰心，再来一局！');
    document.getElementById('resultSub').textContent = sub;

    document.getElementById('stPlayed').textContent = s.played;
    document.getElementById('stWinPct').textContent = (s.played ? Math.round(s.won/s.played*100) : 0) + '%';
    document.getElementById('stStreak').textContent = s.currentStreak;
    document.getElementById('stBest').textContent = s.best===null ? '—' : s.best;

    // 分布
    var distEl = document.getElementById('dist');
    var max = MAX_GUESSES[CURRENT_LEN];
    var maxCount = 1;
    for (var k=1;k<=max;k++){ if ((s.dist[k]||0)>maxCount) maxCount=s.dist[k]||0; }
    var html = '';
    for (var k=1;k<=max;k++){
      var cnt = s.dist[k]||0;
      var w = Math.max(2, Math.round(cnt/maxCount*100));
      html += '<div class="drow"><span class="dlabel">'+k+'</span>'+
              '<div class="dbar" style="width:'+w+'%"></div>'+
              '<span class="dcount">'+cnt+'</span></div>';
    }
    distEl.innerHTML = html;

    overlay.classList.add('on');
  }

  function closeModal(){ overlay.classList.remove('on'); }

  /* ================= 新游戏 ================= */
  function newGame(){
    answer = genAnswer(CURRENT_LEN);
    guesses = []; feedbacks = []; current = [];
    currentRow = 0; gameOver = false; isWin = false; guessedCount = 0;
    renderBoard();
    resetKeyboard();
    msgEl.textContent = '';
    closeModal();
    updateHud();
  }

  /* ================= 主题切换 ================= */
  function applyTheme(t){
    document.body.dataset.theme = t;
    document.querySelectorAll('.theme-switch button').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-theme')===t);
    });
    try { localStorage.setItem('gh-theme', t); } catch(e){}
  }

  /* ================= 绑定事件 ================= */
  document.querySelectorAll('.length-pick button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.length-pick button').forEach(function(b){b.classList.remove('on');});
      btn.classList.add('on');
      CURRENT_LEN = parseInt(btn.getAttribute('data-len'),10);
      newGame();
    });
  });

  document.getElementById('newGame').addEventListener('click', newGame);
  document.getElementById('modalNew').addEventListener('click', newGame);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('statsBtn').addEventListener('click', function(){ showModal(false); });

  document.querySelectorAll('.key[data-digit]').forEach(function(k){
    k.addEventListener('click', function(){ addDigit(k.getAttribute('data-digit')); });
  });
  kbEnter.addEventListener('click', submitGuess);
  kbBack.addEventListener('click', doBackspace);

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)){ addDigit(e.key); e.preventDefault(); return; }
    if (e.key==='Backspace'){ doBackspace(); e.preventDefault(); return; }
    if (e.key==='Enter'){ submitGuess(); e.preventDefault(); return; }
  });

  document.querySelectorAll('.theme-switch button').forEach(function(b){
    b.addEventListener('click', function(){ applyTheme(b.getAttribute('data-theme')); });
  });

  /* 初始 */
  (function init(){
    var saved = null;
    try { saved = localStorage.getItem('gh-theme')||'4399'; } catch(e){ saved='4399'; }
    applyTheme(saved);
    newGame();
  })();
})();
</script>
</body>
</html>
