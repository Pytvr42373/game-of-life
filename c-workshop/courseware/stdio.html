<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>输入输出 — C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0d1a; --surface: #12142a; --surface2: #1a1d3a; --border: #2a2d5a;
    --accent: #6c5ce7; --accent2: #a29bfe; --green: #00e676; --cyan: #00e5ff;
    --orange: #ff9100; --pink: #ff4081; --text: #e0e0ff; --text-dim: #7878aa;
  }

  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
  
  .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
  .back-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
  .back-btn:hover { border-color: var(--accent); color: var(--text); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .top-bar h1 { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent2), var(--green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .top-bar .sub { font-size: 0.78rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

  .workspace { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 800px) { .workspace { grid-template-columns: 1fr; } }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel-header { padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-header .label { font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .panel-header .action { font-size: 0.72rem; color: var(--accent2); cursor: pointer; padding: 4px 10px; border-radius: 6px; background: rgba(108,92,231,0.1); border: none; font-family: inherit; transition: background 0.2s; }
  .panel-header .action:hover { background: rgba(108,92,231,0.2); }
  .panel-body { padding: 20px; }

  .code-block { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; line-height: 1.8; color: var(--text); white-space: pre; overflow-x: auto; letter-spacing: 0.5px; }
  .code-block .kw { color: var(--accent2); } .code-block .type { color: var(--cyan); }
  .code-block .num { color: var(--orange); } .code-block .str { color: var(--green); }
  .code-block .comment { color: var(--text-dim); font-style: italic; }
  .code-block .highlight { background: rgba(108,92,231,0.25); border-radius: 3px; }
  .code-block .line-num { color: var(--text-dim); user-select: none; margin-right: 12px; }

  .example-selector { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .example-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; cursor: pointer; transition: all 0.2s; }
  .example-btn:hover { border-color: var(--accent); }
  .example-btn.active { border-color: var(--accent); background: rgba(108,92,231,0.15); }

  .io-simulator { padding: 16px; background: rgba(0,0,0,0.3); border-radius: 8px; margin-top: 12px; }
  .io-simulator .prompt { color: var(--green); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
  .io-simulator .output { color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; line-height: 1.8; }
  .io-simulator .input-line { color: var(--cyan); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
  .io-simulator .cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent2); animation: blink 0.8s step-end infinite; vertical-align: text-bottom; }
  @keyframes blink { 50% { opacity: 0; } }

  .format-table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.78rem; }
  .format-table th { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-weight: 600; }
  .format-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; }
  .format-table tr:hover { background: rgba(108,92,231,0.05); }
  .format-table .fmt { color: var(--orange); }
  .format-table .desc { color: var(--text-dim); font-family: 'Inter', sans-serif; }

  .state-info { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .state-item { padding: 6px 12px; border-radius: 6px; background: rgba(0,0,0,0.2); font-size: 0.72rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .state-item strong { color: var(--accent2); font-weight: 600; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    返回
  </a>
  <h1>输入输出</h1>
  <span class="sub">printf · scanf · 格式化 · 竞赛技巧</span>
</div>

<div class="workspace">
  <div class="panel">
    <div class="panel-header">
      <span class="label">C 代码</span>
      <span class="action" style="cursor:default;background:transparent;color:var(--text-dim)">点击例子上方运行</span>
    </div>
    <div class="panel-body">
      <div class="example-selector" id="example-selector"></div>
      <div class="code-block" id="code-display"></div>
      <div class="state-info" id="state-info"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="label">运行结果</span>
      <span class="action" style="cursor:default;background:transparent;color:var(--text-dim)">终端模拟</span>
    </div>
    <div class="panel-body">
      <div class="io-simulator" id="io-simulator">
        <div class="prompt">$ ./a.out</div>
        <div class="output" id="output-display">点击左侧例子查看输出</div>
      </div>
      <div id="format-ref" style="margin-top: 16px;"></div>
    </div>
  </div>
</div>

<script>
const EXAMPLES = [
  {
    name: 'printf 基础',
    code: [
      '#include <stdio.h>',
      'int main() {',
      '    int a = 42;',
      '    float b = 3.14;',
      '    char c = \'A\';',
      '    printf("整数: %d\\n", a);',
      '    printf("小数: %.2f\\n", b);',
      '    printf("字符: %c\\n", c);',
      '    printf("混合: %d + %.2f = %.2f\\n", a, b, a + b);',
      '    return 0;',
      '}'
    ],
    output: [
      '整数: 42',
      '小数: 3.14',
      '字符: A',
      '混合: 42 + 3.14 = 45.14'
    ],
    formatRef: true,
    info: 'printf 用 %d, %f, %c 等格式占位符输出不同类型'
  },
  {
    name: 'scanf 输入',
    code: [
      '#include <stdio.h>',
      'int main() {',
      '    int age;',
      '    float height;',
      '    printf("请输入年龄和身高: ");',
      '    scanf("%d %f", &age, &height);',
      '    printf("年龄: %d, 身高: %.1f\\n", age, height);',
      '    return 0;',
      '}'
    ],
    output: [
      '请输入年龄和身高: 18 1.75',
      '年龄: 18, 身高: 1.8'
    ],
    formatRef: false,
    info: 'scanf 需要 & 取地址，%d 读整数，%f 读浮点数'
  },
  {
    name: '宽度与对齐',
    code: [
      '#include <stdio.h>',
      'int main() {',
      '    int a = 5, b = 123, c = 4567;',
      '    printf("右对齐:\\n");',
      '    printf("%6d\\n", a);',
      '    printf("%6d\\n", b);',
      '    printf("%6d\\n", c);',
      '    printf("左对齐:\\n");',
      '    printf("%-6d\\n", a);',
      '    printf("%-6d\\n", b);',
      '    printf("%-6d\\n", c);',
      '    return 0;',
      '}'
    ],
    output: [
      '右对齐:',
      '     5',
      '   123',
      '  4567',
      '左对齐:',
      '5     ',
      '123   ',
      '4567  '
    ],
    formatRef: true,
    info: '%6d 右对齐占6格，%-6d 左对齐，对齐输出表格数据'
  },
  {
    name: '小数精度',
    code: [
      '#include <stdio.h>',
      'int main() {',
      '    double pi = 3.1415926535;',
      '    printf("默认: %f\\n", pi);',
      '    printf("保留2位: %.2f\\n", pi);',
      '    printf("保留4位: %.4f\\n", pi);',
      '    printf("宽度10右对齐: %10.4f\\n", pi);',
      '    printf("科学计数: %e\\n", pi);',
      '    return 0;',
      '}'
    ],
    output: [
      '默认: 3.141593',
      '保留2位: 3.14',
      '保留4位: 3.1416',
      '宽度10右对齐:     3.1416',
      '科学计数: 3.141593e+00'
    ],
    formatRef: true,
    info: '%.nf 控制小数位数，%m.nf 同时控制宽度和精度'
  },
  {
    name: '竞赛常用技巧',
    code: [
      '#include <stdio.h>',
      'int main() {',
      '    // 快速读入多个整数',
      '    int a, b, c;',
      '    scanf("%d %d %d", &a, &b, &c);',
      '    // 一行输出多个数，空格分隔',
      '    printf("%d %d %d\\n", a, b, c);',
      '    // 十六进制输出',
      '    printf("十六进制: %x\\n", 255);',
      '    // 补前导零',
      '    printf("补零: %04d\\n", 42);',
      '    return 0;',
      '}'
    ],
    output: [
      '输入: 10 20 30',
      '10 20 30',
      '十六进制: ff',
      '补零: 0042'
    ],
    formatRef: true,
    info: '%x 十六进制，%04d 补前导零，竞赛中常用'
  }
];

let currentIdx = 0;

function getCodeHTML(ex) {
  let html = '';
  ex.code.forEach((line, i) => {
    let cls = '';
    if (line.includes('printf') || line.includes('scanf')) cls = 'highlight';
    html += `<div class="${cls}"><span class="line-num">${String(i + 1).padStart(2)}</span>${escapeHtml(line)}</div>`;
  });
  return html;
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderOutput(ex) {
  const output = document.getElementById('output-display');
  output.innerHTML = ex.output.map(line => `<div>${escapeHtml(line)}</div>`).join('');
  
  const info = document.getElementById('state-info');
  info.innerHTML = `<div class="state-item">💡 ${ex.info}</div>`;
}

function renderFormatRef(ex) {
  const ref = document.getElementById('format-ref');
  if (!ex.formatRef) {
    ref.innerHTML = '';
    return;
  }
  ref.innerHTML = `
    <div style="font-size:0.72rem;color:var(--text-dim);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:1px">常用格式说明</div>
    <table class="format-table">
      <tr><th>格式</th><th>说明</th></tr>
      <tr><td class="fmt">%d</td><td class="desc">有符号十进制整数</td></tr>
      <tr><td class="fmt">%f</td><td class="desc">浮点数（float/double）</td></tr>
      <tr><td class="fmt">%c</td><td class="desc">单个字符</td></tr>
      <tr><td class="fmt">%s</td><td class="desc">字符串</td></tr>
      <tr><td class="fmt">%x</td><td class="desc">十六进制（小写）</td></tr>
      <tr><td class="fmt">%n</td><td class="desc">宽度控制（如 %6d）</td></tr>
      <tr><td class="fmt">%.nf</td><td class="desc">小数精度（如 %.2f）</td></tr>
      <tr><td class="fmt">%-n</td><td class="desc">左对齐（如 %-6d）</td></tr>
      <tr><td class="fmt">%0n</td><td class="desc">补前导零（如 %04d）</td></tr>
    </table>
  `;
}

function selectExample(idx) {
  currentIdx = idx;
  const ex = EXAMPLES[idx];
  
  document.querySelectorAll('.example-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
  document.getElementById('code-display').innerHTML = getCodeHTML(ex);
  renderOutput(ex);
  renderFormatRef(ex);
}

function init() {
  const selector = document.getElementById('example-selector');
  EXAMPLES.forEach((ex, i) => {
    const btn = document.createElement('button');
    btn.className = 'example-btn' + (i === 0 ? ' active' : '');
    btn.textContent = ex.name;
    btn.onclick = () => selectExample(i);
    selector.appendChild(btn);
  });
  selectExample(0);
}

init();
</script>
</body>
</html>
