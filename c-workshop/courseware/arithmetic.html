<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算术运算与赋值 — C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0d1a; --surface: #12142a; --surface2: #1a1d3a; --border: #2a2d5a;
    --accent: #6c5ce7; --accent2: #a29bfe; --green: #00e676; --cyan: #00e5ff;
    --orange: #ff9100; --pink: #ff4081; --red: #ff4757; --text: #e0e0ff; --text-dim: #7878aa;
    --cell-bg: #1a1d3a; --cell-border: #2a2d5a;
  }

  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
  
  .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
  .back-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
  .back-btn:hover { border-color: var(--accent); color: var(--text); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .top-bar h1 { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--orange), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .top-bar .sub { font-size: 0.78rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

  .workspace { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .workspace { grid-template-columns: 1fr; } }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel-header { padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-header .label { font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .panel-header .action { font-size: 0.72rem; color: var(--accent2); cursor: pointer; padding: 4px 10px; border-radius: 6px; background: rgba(108,92,231,0.1); border: none; font-family: inherit; transition: background 0.2s; }
  .panel-header .action:hover { background: rgba(108,92,231,0.2); }
  .panel-body { padding: 20px; }

  .code-block { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; line-height: 1.8; color: var(--text); white-space: pre; overflow-x: auto; letter-spacing: 0.5px; }
  .code-block .kw { color: var(--accent2); } .code-block .type { color: var(--cyan); }
  .code-block .num { color: var(--orange); } .code-block .str { color: var(--green); }
  .code-block .comment { color: var(--text-dim); font-style: italic; }
  .code-block .hl-yellow { background: rgba(255,215,0,0.12); border-radius: 3px; }
  .code-block .line-num { color: #3a3a6a; user-select: none; margin-right: 10px; }

  /* Operation selector */
  .op-selector { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .op-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
  .op-btn:hover { border-color: var(--accent); }
  .op-btn.active { border-color: var(--accent); background: rgba(108,92,231,0.15); }

  /* Interactive calculator */
  .calc-area { margin-top: 12px; padding: 16px; background: rgba(0,0,0,0.2); border-radius: 8px; }
  .calc-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .calc-row label { font-size: 0.78rem; color: var(--text-dim); min-width: 50px; }
  .calc-row input { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; width: 80px; outline: none; transition: border-color 0.2s; }
  .calc-row input:focus { border-color: var(--accent); }
  .calc-row .op-symbol { font-size: 1.2rem; color: var(--accent2); font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .calc-row .eq-symbol { font-size: 1.2rem; color: var(--text-dim); font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .calc-row .result-box { padding: 6px 16px; border-radius: 6px; background: rgba(108,92,231,0.15); border: 1px solid var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 1rem; font-weight: 700; color: var(--accent2); min-width: 60px; text-align: center; }

  /* Memory grid for operation visualization */
  .mem-grid { display: flex; gap: 4px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
  .mem-cell { width: 56px; height: 56px; background: var(--cell-bg); border: 1px solid var(--cell-border); border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; transition: all 0.3s; position: relative; }
  .mem-cell .val { font-size: 0.9rem; font-weight: 600; color: var(--text); }
  .mem-cell .addr { font-size: 0.55rem; color: var(--text-dim); margin-top: 2px; }
  .mem-cell.active { border-color: var(--accent); box-shadow: 0 0 12px rgba(108,92,231,0.3); }
  .mem-cell.highlight-int { border-color: var(--accent); }
  .mem-cell.highlight-float { border-color: var(--green); }
  .mem-cell.highlight-char { border-color: var(--orange); }
  .mem-cell .type-label { position: absolute; top: -18px; font-size: 0.6rem; color: var(--text-dim); white-space: nowrap; }
  .mem-cell .arrow-down { position: absolute; bottom: -14px; font-size: 0.7rem; color: var(--accent2); }

  /* Number line visualization */
  .num-line { margin-top: 12px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; position: relative; height: 60px; }
  .num-line .axis { position: absolute; left: 20px; right: 20px; top: 30px; height: 2px; background: var(--border); }
  .num-line .tick { position: absolute; top: 24px; font-size: 0.6rem; color: var(--text-dim); transform: translateX(-50%); text-align: center; }
  .num-line .tick::before { content: ''; display: block; width: 1px; height: 8px; background: var(--border); margin: 0 auto 4px; }
  .num-line .marker { position: absolute; top: 8px; width: 20px; height: 20px; border-radius: 50%; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; transition: left 0.3s; }
  .marker-a { background: rgba(108,92,231,0.3); border: 2px solid var(--accent); color: var(--accent2); }
  .marker-b { background: rgba(0,229,255,0.3); border: 2px solid var(--cyan); color: var(--cyan); }
  .marker-result { background: rgba(0,230,118,0.3); border: 2px solid var(--green); color: var(--green); }

  /* Type conversion visual */
  .type-flow { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 8px; flex-wrap: wrap; justify-content: center; }
  .type-box { padding: 8px 14px; border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: 600; text-align: center; }
  .type-box.int { background: rgba(108,92,231,0.15); border: 1px solid var(--accent); color: var(--accent2); }
  .type-box.float { background: rgba(0,230,118,0.15); border: 1px solid var(--green); color: var(--green); }
  .type-box.char { background: rgba(255,145,0,0.15); border: 1px solid var(--orange); color: var(--orange); }
  .type-box.double { background: rgba(0,229,255,0.15); border: 1px solid var(--cyan); color: var(--cyan); }
  .type-arrow { font-size: 1rem; color: var(--text-dim); }
  .type-arrow.loss { color: var(--red); }

  /* Info bar */
  .info-bar { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .info-item { padding: 6px 12px; border-radius: 6px; background: rgba(0,0,0,0.2); font-size: 0.72rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .info-item strong { color: var(--accent2); font-weight: 600; }
  .info-item .badge-red { color: var(--red); }
  .info-item .badge-green { color: var(--green); }
  .info-item .badge-cyan { color: var(--cyan); }
  .info-item .badge-orange { color: var(--orange); }

  /* Legend */
  .legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text-dim); }
  .legend-color { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--cell-border); }

  /* Knowledge panel */
  .tip-box { padding: 14px 18px; background: rgba(255,215,0,0.06); border: 1px solid rgba(255,215,0,0.15); border-radius: 8px; margin-bottom: 14px; }
  .tip-box .tip-label { font-size: 0.72rem; font-weight: 700; color: #ffd700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .tip-box .tip-text { font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; }

  .danger-box { padding: 14px 18px; background: rgba(255,71,87,0.06); border: 1px solid rgba(255,71,87,0.15); border-radius: 8px; margin-bottom: 14px; }
  .danger-box .danger-label { font-size: 0.72rem; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .danger-box .danger-text { font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; }

  .op-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.82rem; }
  .op-table th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .op-table td { padding: 8px 10px; border-bottom: 1px solid rgba(42,45,90,0.5); font-family: 'JetBrains Mono', monospace; }
  .op-table .highlight-row { background: rgba(108,92,231,0.08); }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .mem-cell { animation: fadeIn 0.3s ease both; }
  .mem-cell:nth-child(1) { animation-delay: 0s; }
  .mem-cell:nth-child(2) { animation-delay: 0.05s; }
  .mem-cell:nth-child(3) { animation-delay: 0.1s; }
  .mem-cell:nth-child(4) { animation-delay: 0.15s; }
  .mem-cell:nth-child(5) { animation-delay: 0.2s; }
  .mem-cell:nth-child(6) { animation-delay: 0.25s; }
  .mem-cell:nth-child(7) { animation-delay: 0.3s; }
  .mem-cell:nth-child(8) { animation-delay: 0.35s; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    返回
  </a>
  <h1>算术运算与赋值</h1>
  <span class="sub">+ - * / % · 复合赋值 · 类型转换 · 自增自减</span>
</div>

<div class="workspace">
  <!-- Left: Interactive Calculator -->
  <div class="panel">
    <div class="panel-header">
      <span class="label">交互计算器</span>
      <button class="action" onclick="resetCalc()">重置</button>
    </div>
    <div class="panel-body">
      <div class="op-selector" id="op-selector"></div>

      <div class="calc-area" id="calc-area">
        <div class="calc-row">
          <label>a =</label>
          <input type="number" id="input-a" value="10" oninput="updateCalc()">
          <span class="op-symbol" id="op-symbol">+</span>
          <label>b =</label>
          <input type="number" id="input-b" value="3" oninput="updateCalc()">
          <span class="eq-symbol">=</span>
          <span class="result-box" id="result-box">13</span>
        </div>
      </div>

      <!-- Memory visualization -->
      <div style="margin-top:8px;font-size:0.72rem;color:var(--text-dim);font-family:'JetBrains Mono',monospace">内存中的值</div>
      <div class="mem-grid" id="mem-grid">
        <div class="mem-cell highlight-int">
          <span class="type-label">int a</span>
          <span class="val" id="mem-a-val">10</span>
          <span class="addr">0x100</span>
        </div>
        <div class="mem-cell highlight-int">
          <span class="type-label">int b</span>
          <span class="val" id="mem-b-val">3</span>
          <span class="addr">0x104</span>
        </div>
        <div class="mem-cell active" id="mem-result-cell">
          <span class="type-label" id="mem-result-label">int 结果</span>
          <span class="val" id="mem-result-val">13</span>
          <span class="addr" id="mem-result-addr">0x108</span>
        </div>
      </div>

      <!-- Number line -->
      <div style="margin-top:8px;font-size:0.72rem;color:var(--text-dim);font-family:'JetBrains Mono',monospace">数轴上的位置</div>
      <div class="num-line" id="num-line">
        <div class="axis"></div>
        <div class="marker marker-a" id="marker-a" style="left:calc(50% + 0px)">a</div>
        <div class="marker marker-b" id="marker-b" style="left:calc(50% + 0px)">b</div>
        <div class="marker marker-result" id="marker-result" style="left:calc(50% + 0px)">=</div>
      </div>

      <!-- Info bar -->
      <div class="info-bar">
        <div class="info-item" id="info-type">类型: <strong>int</strong></div>
        <div class="info-item" id="info-remainder">a % b = <strong>1</strong></div>
        <div class="info-item" id="info-float">a / b = <strong class="badge-orange">3</strong> (整数除法)</div>
      </div>

      <!-- Legend -->
      <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background:var(--accent)"></div> int 类型</div>
        <div class="legend-item"><div class="legend-color" style="background:var(--green)"></div> float/double</div>
        <div class="legend-item"><div class="legend-color" style="background:var(--orange)"></div> char 类型</div>
      </div>
    </div>
  </div>

  <!-- Right: Knowledge Panel -->
  <div class="panel">
    <div class="panel-header">
      <span class="label">关键知识点</span>
    </div>
    <div class="panel-body" id="knowledge-panel">
      <div id="knowledge-content"></div>
    </div>
  </div>
</div>

<script>
const OPS = [
  { sym: '+', name: '加法', desc: 'a + b', result: (a,b) => a + b, type: 'int' },
  { sym: '-', name: '减法', desc: 'a - b', result: (a,b) => a - b, type: 'int' },
  { sym: '*', name: '乘法', desc: 'a × b', result: (a,b) => a * b, type: 'int' },
  { sym: '/', name: '整数除法', desc: 'a ÷ b（截断）', result: (a,b) => Math.floor(a / b), type: 'int' },
  { sym: '%', name: '取模', desc: 'a % b（余数）', result: (a,b) => a % b, type: 'int' },
  { sym: '+=', name: '复合加', desc: 'a += b → a = a + b', result: (a,b) => a + b, type: 'int' },
  { sym: '-=', name: '复合减', desc: 'a -= b → a = a - b', result: (a,b) => a - b, type: 'int' },
  { sym: '*=', name: '复合乘', desc: 'a *= b → a = a × b', result: (a,b) => a * b, type: 'int' },
  { sym: '/=', name: '复合除', desc: 'a /= b → a = a ÷ b', result: (a,b) => Math.floor(a / b), type: 'int' },
  { sym: '%=', name: '复合模', desc: 'a %= b → a = a % b', result: (a,b) => a % b, type: 'int' },
  { sym: '→f', name: 'int→float', desc: '(float)a / b', result: (a,b) => a / b, type: 'float' },
  { sym: '→d', name: 'int→double', desc: '(double)a / b', result: (a,b) => a / b, type: 'double' },
  { sym: '→c', name: 'int→char', desc: 'char c = a', result: (a,b) => String.fromCharCode(a), type: 'char' }
];

const KNOWLEDGE = {
  '+': `
    <div class="tip-box" style="margin-top:0">
      <div class="tip-label">📌 加法运算</div>
      <div class="tip-text">
        <strong>a + b</strong> 是最基本的算术运算。<br><br>
        <strong>注意类型溢出：</strong><br>
        int 最大值约 21 亿（2^31-1）。<br>
        两个大数相加可能溢出，结果变成负数！<br><br>
        <strong>竞赛建议：</strong><br>
        大数用 <strong>long long</strong>（64位，最大 9×10^18）。
      </div>
    </div>
    <div class="danger-box">
      <div class="danger-label">⚠️ 整数溢出</div>
      <div class="danger-text">
        int a = 2000000000;<br>
        int b = 2000000000;<br>
        a + b → -294967296（溢出！）<br><br>
        用 long long 避免：<br>
        long long sum = (long long)a + b;
      </div>
    </div>
  `,
  '-': `
    <div class="tip-box" style="margin-top:0">
      <div class="tip-label">📌 减法运算</div>
      <div class="tip-text">
        <strong>a - b</strong> 减法运算。<br><br>
        <strong>注意负数：</strong><br>
        int 可以表示负数（最高位是符号位）。<br>
        小减大得到负数，这是正常的。<br><br>
        <strong>取模与负数：</strong><br>
        C++ 中负数取模结果<strong>依赖编译器</strong>，<br>
        建议避免负数取模操作。
      </div>
    </div>
  `,
  '*': `
    <div class="tip-box" style="margin-top:0">
      <div class="tip-label">📌 乘法运算</div>
      <div class="tip-text">
        <strong>a × b</strong> 乘法运算。<br><br>
        <strong>溢出风险最大！</strong><br>
        两个 10^5 的数相乘就是 10^10，<br>
        远超 int 范围（2.1×10^9）。<br><br>
        <strong>竞赛铁律：</strong><br>
        看到乘法先想会不会溢出，<br>
        不确定就用 long long。
      </div>
    </div>
    <div class="danger-box">
      <div class="danger-label">⚠️ 乘法溢出</div>
      <div class="danger-text">
        int a = 100000, b = 100000;<br>
        a * b → 1410065408（溢出！）<br>
        正确：long long c = (long long)a * b;
      </div>
    </div>
  `,
  '/': `
    <div class="tip-box" style="margin-top:0">
      <div class="tip-label">📌 整数除法</div>
      <div class="tip-text">
        <strong>两个整数相除，结果截断为整数！</strong><br>
        10 / 3 = 3（不是 3.333）<br><br>
        <strong>想保留小数：</strong><br>
        double x = 10.0 / 3;  // 3.333<br>
        double y = (double)10 / 3;  // 3.333<br><br>
        <strong>注意：</strong><br>
        double z = 10 / 3;  // 还是 3.0！<br>
        因为 10/3 先按整数算 = 3，再转成 3.0
      </div>
    </div>
    <div class="danger-box">
      <div class="danger-label">⚠️ 除零错误</div>
      <div class="danger-text">
        任何数除以 0 都会导致<strong>运行时崩溃</strong>！<br>
        竞赛中一定要检查除数是否为 0。
      </div>
    </div>
  `,
  '%': `
    <div class="tip-box" style="margin-top:0">
      <div class="tip-label">📌 取模运算</div>
      <div class="tip-text">
        <strong>a % b</strong> 求 a 除以 b 的<strong>余数</strong>。<br>
        10 % 3 = 1（10 = 3×3 + 1）<br><br>
        <strong>常见用途：</strong><br>
        • 判断奇偶：n % 2 == 1 → 奇数<br>
        • 取个位：n % 10<br>
        • 判断整除：n % m == 0<br>
        • 循环分组：i % 3 == 0 → 每3个一组<br>
        • 哈希散列：大数 % 质数
      </div>
    </div>
    <div class="danger-box">
      <div class="danger-label">⚠️ 取模与负数</div>
      <div class="danger-text">
        C++ 中负数取模结果<strong>可能是负数</strong>：<br>
        -5 % 3 → -2（不是 1）<br><br>
        竞赛中建议：<br>
        int mod = ((a % b) + b) % b;  // 保证正数
      </div>
    </div>
  `,
  '+=': `
    <div class="tip-box" style="margin-top:0">
      <div class="tip-label">📌 复合赋值</div>
      <div class="tip-text">
        <strong>a += b</strong> 等价于 <strong>a = a + b</strong><br>
        类似：-=  *=  /=  %=  <<=  >>=  &=  |=  ^=<br><br>
        <strong>优点：</strong><br>
        • 代码更简洁<br>
        • 只计算一次 a 的地址（性能更好）<br>
        • 语义更清晰：修改 a 本身
      </div>
    </div>
  `,
  '-=': `
    <div class="tip-box" style="margin-top:0">
      <div class="tip-label">📌 复合赋值</div>
      <div class="tip-text">
        <strong>a -= b</strong> 等价于 <strong>a = a - b</strong><br><br>
        所有复合赋值运算符：<br>
        +=  -=  *=  /=  %=<br>
        <<=  >>=  &=  |=  ^=<br><br>
        它们都修改<strong>变量本身</strong>，<br>
        而不是创建一个新值。
      </div>
    </div>
  `,
  '*=': `
    <div class="tip-box" style="margin-top:0">
      <div class="tip-label">📌 复合赋值</div>
      <div class="tip-text">
        <strong>a *= b</strong> 等价于 <strong>a = a * b</strong><br><br>
        注意溢出问题同样存在！<br>
        int a = 100000;<br>
        a *= 100000;  // 溢出！<br><br>
        大数乘法用 long long。
      </div>
    </div>
  `,
  '/=': `
    <div class="tip-box" style="margin-top:0">
      <div class="tip-label">📌 复合赋值</div>
      <div class="tip-text">
        <strong>a /= b</strong> 等价于 <strong>a = a / b</strong><br><br>
        整数除法截断同样适用：<br>
        int a = 10; a /= 3;  // a = 3<br><br>
        <strong>注意：</strong><br>
        a /= 0 同样会崩溃！
      </div>
    </div>
  `,
  '%=': `
    <div class="tip-box" style="margin-top:0">
      <div class="tip-label">📌 复合赋值</div>
      <div class="tip-text">
        <strong>a %= b</strong> 等价于 <strong>a = a % b</strong><br><br>
        常用于循环中控制范围：<br>
        for (int i = 0; i < n; i++) {<br>
        &nbsp;&nbsp;idx = (idx + 1) % m;<br>
        }<br><br>
        保证 idx 始终在 [0, m-1] 范围内。
      </div>
    </div>
  `,
  '→f': `
    <div class="tip-box" style="margin-top:0">
      <div class="tip-label">📌 int → float 转换</div>
      <div class="tip-text">
        <strong>(float)a / b</strong> 先转 a 为 float，再做浮点除法。<br><br>
        <strong>精度：</strong><br>
        float 约 7 位有效数字。<br>
        int 转 float 可能丢失精度（超过 2^24 时）。<br><br>
        <strong>竞赛建议：</strong><br>
        需要小数结果时用 <strong>double</strong>，<br>
        精度更高（15 位有效数字）。
      </div>
    </div>
  `,
  '→d': `
    <div class="tip-box" style="margin-top:0">
      <div class="tip-label">📌 int → double 转换</div>
      <div class="tip-text">
        <strong>(double)a / b</strong> 得到精确的浮点结果。<br><br>
        <strong>推荐做法：</strong><br>
        double x = (double)a / b;<br><br>
        <strong>错误做法：</strong><br>
        double x = a / b;  // 先整数除法，再转 double<br>
        结果还是整数！
      </div>
    </div>
  `,
  '→c': `
    <div class="tip-box" style="margin-top:0">
      <div class="tip-label">📌 int → char 转换</div>
      <div class="tip-text">
        <strong>char c = a;</strong> 整数转成 ASCII 字符。<br><br>
        65 → 'A'<br>
        97 → 'a'<br>
        48 → '0'<br><br>
        <strong>常见技巧：</strong><br>
        char digit = n + '0';  // 数字 → 字符<br>
        int num = c - '0';     // 字符 → 数字
      </div>
    </div>
  `
};

let currentOp = 0;

function updateCalc() {
  const a = parseInt(document.getElementById('input-a').value) || 0;
  const b = parseInt(document.getElementById('input-b').value) || 0;
  const op = OPS[currentOp];
  
  // Update memory cells
  document.getElementById('mem-a-val').textContent = a;
  document.getElementById('mem-b-val').textContent = b;
  
  // Calculate result
  let result;
  let resultType = op.type;
  let resultStr;
  
  if (op.sym === '→c') {
    result = String.fromCharCode(a);
    resultStr = result;
  } else if (op.sym === '→f' || op.sym === '→d') {
    result = a / b;
    resultStr = result.toFixed(4);
  } else {
    result = op.result(a, b);
    resultStr = result;
  }
  
  document.getElementById('result-box').textContent = resultStr;
  document.getElementById('op-symbol').textContent = op.sym;
  
  // Update result memory cell
  const resultCell = document.getElementById('mem-result-cell');
  const resultLabel = document.getElementById('mem-result-label');
  const resultVal = document.getElementById('mem-result-val');
  
  if (op.type === 'float' || op.type === 'double') {
    resultCell.className = 'mem-cell active';
    resultCell.style.borderColor = 'var(--green)';
    resultLabel.textContent = op.type + ' 结果';
    resultVal.textContent = result.toFixed(4);
  } else if (op.type === 'char') {
    resultCell.className = 'mem-cell active';
    resultCell.style.borderColor = 'var(--orange)';
    resultLabel.textContent = 'char 结果';
    resultVal.textContent = "'" + result + "' (" + a + ")";
  } else {
    resultCell.className = 'mem-cell active';
    resultCell.style.borderColor = 'var(--accent)';
    resultLabel.textContent = 'int 结果';
    resultVal.textContent = result;
  }
  
  // Update number line
  const line = document.getElementById('num-line');
  const lineWidth = line.offsetWidth - 40 || 400;
  const minVal = Math.min(0, a, b, result);
  const maxVal = Math.max(0, a, b, result);
  const range = Math.max(maxVal - minVal, 1);
  
  function pos(v) {
    if (range === 0) return 50;
    return ((v - minVal) / range) * 100;
  }
  
  document.getElementById('marker-a').style.left = `calc(${pos(a)}% + 0px)`;
  document.getElementById('marker-b').style.left = `calc(${pos(b)}% + 0px)`;
  document.getElementById('marker-result').style.left = `calc(${pos(result)}% + 0px)`;
  
  // Update info bar
  document.getElementById('info-type').innerHTML = `类型: <strong>${op.type}</strong>`;
  
  if (op.sym === '/' || op.sym === '/=') {
    document.getElementById('info-remainder').innerHTML = `a % b = <strong>${a % b}</strong>`;
    document.getElementById('info-float').innerHTML = `a / b = <strong class="badge-orange">${Math.floor(a/b)}</strong> (整数除法)`;
  } else if (op.sym === '→f' || op.sym === '→d') {
    document.getElementById('info-remainder').innerHTML = `整数除法: <strong class="badge-orange">${Math.floor(a/b)}</strong>`;
    document.getElementById('info-float').innerHTML = `浮点结果: <strong class="badge-green">${(a/b).toFixed(4)}</strong>`;
  } else if (op.sym === '→c') {
    document.getElementById('info-remainder').innerHTML = `ASCII: <strong>${a}</strong>`;
    document.getElementById('info-float').innerHTML = `字符: <strong class="badge-orange">'${String.fromCharCode(a)}'</strong>`;
  } else {
    document.getElementById('info-remainder').innerHTML = `a % b = <strong>${a % b}</strong>`;
    document.getElementById('info-float').innerHTML = `a / b = <strong class="badge-orange">${Math.floor(a/b)}</strong> (整数除法)`;
  }
  
  // Update knowledge
  document.getElementById('knowledge-content').innerHTML = KNOWLEDGE[op.sym] || KNOWLEDGE['+'];
}

function selectOp(idx) {
  currentOp = idx;
  document.querySelectorAll('.op-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
  updateCalc();
}

function resetCalc() {
  document.getElementById('input-a').value = 10;
  document.getElementById('input-b').value = 3;
  selectOp(0);
}

function init() {
  const selector = document.getElementById('op-selector');
  OPS.forEach((op, i) => {
    const btn = document.createElement('button');
    btn.className = 'op-btn' + (i === 0 ? ' active' : '');
    btn.textContent = op.sym + ' ' + op.name;
    btn.onclick = () => selectOp(i);
    selector.appendChild(btn);
  });
  updateCalc();
}

init();
</script>
</body>
</html>
