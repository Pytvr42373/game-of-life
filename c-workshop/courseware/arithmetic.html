<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>算术运算与赋值 — C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0d1a; --surface: #12142a; --surface2: #1a1d3a; --border: #2a2d5a;
    --accent: #6c5ce7; --accent2: #a29bfe; --green: #00e676; --cyan: #00e5ff;
    --orange: #ff9100; --pink: #ff4081; --red: #ff4757; --text: #e0e0ff; --text-dim: #7878aa;
  }

  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
  
  .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
  .back-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
  .back-btn:hover { border-color: var(--accent); color: var(--text); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .top-bar h1 { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--orange), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .top-bar .sub { font-size: 0.78rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

  .workspace { max-width: 1100px; margin: 0 auto; }

  .example-selector { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .example-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
  .example-btn:hover { border-color: var(--accent); }
  .example-btn.active { border-color: var(--accent); background: rgba(108,92,231,0.15); }

  .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel-header { padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-header .label { font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .panel-body { padding: 20px; }

  .code-block { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; line-height: 1.8; color: var(--text); white-space: pre; overflow-x: auto; letter-spacing: 0.5px; }
  .code-block .kw { color: var(--accent2); } .code-block .type { color: var(--cyan); }
  .code-block .num { color: var(--orange); } .code-block .str { color: var(--green); }
  .code-block .comment { color: var(--text-dim); font-style: italic; }
  .code-block .hl-yellow { background: rgba(255,215,0,0.12); border-radius: 3px; }
  .code-block .line-num { color: #3a3a6a; user-select: none; margin-right: 10px; }

  .step-area { margin-top: 16px; }
  .step-buttons { display: flex; gap: 8px; margin-bottom: 12px; }
  .step-btn { padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
  .step-btn:hover { border-color: var(--accent); }
  .step-btn.primary { background: rgba(108,92,231,0.2); border-color: var(--accent); }
  .step-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .var-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem; }
  .var-table th { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .var-table td { padding: 8px 12px; border-bottom: 1px solid rgba(42,45,90,0.5); font-family: 'JetBrains Mono', monospace; }
  .var-table .val { color: var(--orange); }
  .var-table .highlight-row { background: rgba(108,92,231,0.08); }

  .output-area { margin-top: 12px; padding: 14px; background: rgba(0,0,0,0.3); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--green); line-height: 1.6; min-height: 40px; }
  .output-area .line { display: block; }

  .step-info { margin-top: 10px; padding: 10px 14px; background: rgba(108,92,231,0.08); border-radius: 8px; font-size: 0.85rem; color: var(--accent2); font-family: 'Inter', sans-serif; line-height: 1.5; }

  .tip-box { padding: 14px 18px; background: rgba(255,215,0,0.06); border: 1px solid rgba(255,215,0,0.15); border-radius: 8px; margin-bottom: 14px; }
  .tip-box .tip-label { font-size: 0.72rem; font-weight: 700; color: #ffd700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .tip-box .tip-text { font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; }

  .danger-box { padding: 14px 18px; background: rgba(255,71,87,0.06); border: 1px solid rgba(255,71,87,0.15); border-radius: 8px; margin-bottom: 14px; }
  .danger-box .danger-label { font-size: 0.72rem; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .danger-box .danger-text { font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; }
</style>
</head>

<script>
const EXAMPLES = [
  {
    name: '基本算术运算',

      '#include <iostream>',
      'using namespace std;',

      { line: 7, vars: { a: { v: 10 }, b: { v: 3 }, sum: { v: 13 }, diff: { v: 7 }, prod: { v: 30 }, quot: { v: 3, c: 'green' } }, out: [], info: '10 ÷ 3 = 3（整数除法，丢掉小数部分！）' },
      { line: 8, vars: { a: { v: 10 }, b: { v: 3 }, sum: { v: 13 }, diff: { v: 7 }, prod: { v: 30 }, quot: { v: 3 }, rem: { v: 1, c: 'green' } }, out: [], info: '10 % 3 = 1（余数：10 = 3×3 + 1）' },
      { line: 9, vars: { a: { v: 10 }, b: { v: 3 }, sum: { v: 13 }, diff: { v: 7 }, prod: { v: 30 }, quot: { v: 3 }, rem: { v: 1 } }, out: ['13 7 '], info: '输出 sum 和 diff' },
      { line: 10, vars: { a: { v: 10 }, b: { v: 3 }, sum: { v: 13 }, diff: { v: 7 }, prod: { v: 30 }, quot: { v: 3 }, rem: { v: 1 } }, out: ['13 7 30 3 '], info: '输出 prod 和 quot' },
      { line: 11, vars: { a: { v: 10 }, b: { v: 3 }, sum: { v: 13 }, diff: { v: 7 }, prod: { v: 30 }, quot: { v: 3 }, rem: { v: 1 } }, out: ['13 7 30 3 1'], info: '输出 rem' }
    ],
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 基本运算符</div>
        <div class="tip-text">
          <strong>+</strong> 加法 &nbsp; <strong>-</strong> 减法 &nbsp; <strong>*</strong> 乘法 &nbsp; <strong>/</strong> 除法 &nbsp; <strong>%</strong> 取模<br><br>
          <strong>关键：整数除法会截断！</strong><br>
          10 / 3 = 3（不是 3.333），小数部分直接丢掉。<br>
          想得到小数结果，至少一个操作数要是浮点数。<br><br>
          <strong>% 取模</strong>：求余数，只对整数有效。<br>
          10 % 3 = 1（因为 10 = 3×3 + 1）
        </div>
      </div>
      <div class="danger-box">
        <div class="danger-label">⚠️ 除零错误</div>
        <div class="danger-text">
          任何数除以 0 都会导致<strong>运行时错误</strong>，程序崩溃！<br>
          取模 % 0 也一样。<br><br>
          竞赛中一定要检查除数是否为 0。
        </div>
      </div>
    `
  },
  {
    name: '整数除法 vs 浮点除法',
    code: [
      '#include <iostream>',
      'using namespace std;',
      'int main() {',
      '    int a = 5, b = 2;',
      '    // 整数除法：丢掉小数',
      '    int q1 = a / b;       // 5/2 = 2',
      '    // 浮点除法：保留小数',
      '    double q2 = a / b;    // 还是 2！',
      '    double q3 = 5.0 / 2;  // 2.5',
      '    double q4 = (double)a / b;  // 2.5',
      '    cout << q1 << " " << q2 << " ";',
      '    cout << q3 << " " << q4 << endl;',
      '    return 0;',
      '}'
    ],
    steps: [
      { line: 0, vars: {}, out: [] },
      { line: 1, vars: {}, out: [] },
      { line: 2, vars: {}, out: [] },
      { line: 3, vars: { a: { v: 5, c: 'cyan' }, b: { v: 2, c: 'cyan' } }, out: [], info: 'a=5, b=2' },
      { line: 4, vars: { a: { v: 5 }, b: { v: 2 } }, out: [], info: '整数除法：5/2 先算，结果是 2' },
      { line: 5, vars: { a: { v: 5 }, b: { v: 2 }, q1: { v: 2, c: 'green' } }, out: [], info: 'q1 = 5/2 = 2（整数除法截断）' },
      { line: 6, vars: { a: { v: 5 }, b: { v: 2 }, q1: { v: 2 } }, out: [], info: 'q2 是 double，但 5/2 先按整数算 = 2，再转成 2.0' },
      { line: 7, vars: { a: { v: 5 }, b: { v: 2 }, q1: { v: 2 }, q2: { v: 2, c: 'orange' } }, out: [], info: 'q2 = 2.0（不是 2.5！因为整数除法先执行）' },
      { line: 8, vars: { a: { v: 5 }, b: { v: 2 }, q1: { v: 2 }, q2: { v: 2 } }, out: [], info: '5.0 是浮点数，/ 2 自动转成浮点除法' },
      { line: 9, vars: { a: { v: 5 }, b: { v: 2 }, q1: { v: 2 }, q2: { v: 2 }, q3: { v: 2.5, c: 'green' } }, out: [], info: 'q3 = 2.5（正确！）' },
      { line: 10, vars: { a: { v: 5 }, b: { v: 2 }, q1: { v: 2 }, q2: { v: 2 }, q3: { v: 2.5 } }, out: [], info: '(double)a 把 a 转成 5.0，再 / 2 = 2.5' },
      { line: 11, vars: { a: { v: 5 }, b: { v: 2 }, q1: { v: 2 }, q2: { v: 2 }, q3: { v: 2.5 }, q4: { v: 2.5, c: 'green' } }, out: [], info: 'q4 = 2.5（正确！）' },
      { line: 12, vars: { a: { v: 5 }, b: { v: 2 }, q1: { v: 2 }, q2: { v: 2 }, q3: { v: 2.5 }, q4: { v: 2.5 } }, out: ['2 2 '], info: 'q1=2, q2=2' },
      { line: 13, vars: { a: { v: 5 }, b: { v: 2 }, q1: { v: 2 }, q2: { v: 2 }, q3: { v: 2.5 }, q4: { v: 2.5 } }, out: ['2 2 2.5 2.5'], info: 'q3=2.5, q4=2.5' }
    ],
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 整数除法陷阱</div>
        <div class="tip-text">
          <strong>两个整数相除，结果还是整数！</strong><br><br>
          int a = 5, b = 2;<br>
          a / b → 2（不是 2.5，小数被截断）<br><br>
          <strong>正确做法：</strong><br>
          double x = 5.0 / 2;     // 2.5<br>
          double y = (double)a / b; // 2.5<br><br>
          只要有一个操作数是浮点数，就做浮点除法。
        </div>
      </div>
      <div class="danger-box">
        <div class="danger-label">⚠️ 常见错误</div>
        <div class="danger-text">
          double q = a / b;  // 以为能得到小数？<br>
          实际上 a/b 先按整数算 = 2，再转成 2.0<br>
          结果不是 2.5，是 2.0！
        </div>
      </div>
    `
  },
  {
    name: '复合赋值运算符',
    code: [
      '#include <iostream>',
      'using namespace std;',
      'int main() {',
      '    int x = 10;',
      '    x += 5;   // x = x + 5',
      '    x -= 3;   // x = x - 3',
      '    x *= 2;   // x = x * 2',
      '    x /= 4;   // x = x / 4',
      '    x %= 3;   // x = x % 3',
      '    cout << x << endl;',
      '    return 0;',
      '}'
    ],
    steps: [
      { line: 0, vars: {}, out: [] },
      { line: 1, vars: {}, out: [] },
      { line: 2, vars: {}, out: [] },
      { line: 3, vars: { x: { v: 10, c: 'cyan' } }, out: [], info: 'x = 10' },
      { line: 4, vars: { x: { v: 15, c: 'orange' } }, out: [], info: 'x += 5 → x = 10 + 5 = 15' },
      { line: 5, vars: { x: { v: 12, c: 'orange' } }, out: [], info: 'x -= 3 → x = 15 - 3 = 12' },
      { line: 6, vars: { x: { v: 24, c: 'orange' } }, out: [], info: 'x *= 2 → x = 12 × 2 = 24' },
      { line: 7, vars: { x: { v: 6, c: 'orange' } }, out: [], info: 'x /= 4 → x = 24 ÷ 4 = 6' },
      { line: 8, vars: { x: { v: 0, c: 'orange' } }, out: [], info: 'x %= 3 → x = 6 % 3 = 0' },
      { line: 9, vars: { x: { v: 0 } }, out: ['0'] }
    ],
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 复合赋值运算符</div>
        <div class="tip-text">
          <strong>x += y</strong> 等价于 <strong>x = x + y</strong><br>
          <strong>x -= y</strong> 等价于 <strong>x = x - y</strong><br>
          <strong>x *= y</strong> 等价于 <strong>x = x * y</strong><br>
          <strong>x /= y</strong> 等价于 <strong>x = x / y</strong><br>
          <strong>x %= y</strong> 等价于 <strong>x = x % y</strong><br><br>
          还有：<<=  >>=  &=  |=  ^=<br><br>
          <strong>优点：</strong>代码更简洁，且只计算一次 x 的地址。
        </div>
      </div>
    `
  },
  {
    name: '自增自减与类型转换',
    code: [
      '#include <iostream>',
      'using namespace std;',
      'int main() {',
      '    int i = 5;',
      '    // 自增自减',
      '    i++;  // i = 6',
      '    i--;  // i = 5',
      '    // 隐式类型转换',
      '    double d = 3.7;',
      '    int n = d;       // 截断为 3',
      '    char c = 65;     // 65 是 ASCII A',
      '    // 强制类型转换',
      '    double pi = (double)22 / 7;',
      '    cout << i << " " << n << " ";',
      '    cout << c << " " << pi << endl;',
      '    return 0;',
      '}'
    ],
    steps: [
      { line: 0, vars: {}, out: [] },
      { line: 1, vars: {}, out: [] },
      { line: 2, vars: {}, out: [] },
      { line: 3, vars: { i: { v: 5, c: 'cyan' } }, out: [], info: 'i = 5' },
      { line: 4, vars: { i: { v: 5, c: 'cyan' } }, out: [], info: '自增自减部分' },
      { line: 5, vars: { i: { v: 6, c: 'orange' } }, out: [], info: 'i++ → i = 6' },
      { line: 6, vars: { i: { v: 5, c: 'orange' } }, out: [], info: 'i-- → i = 5' },
      { line: 7, vars: { i: { v: 5 } }, out: [], info: '类型转换部分' },
      { line: 8, vars: { i: { v: 5 }, d: { v: 3.7, c: 'cyan' } }, out: [], info: 'd = 3.7' },
      { line: 9, vars: { i: { v: 5 }, d: { v: 3.7 }, n: { v: 3, c: 'orange' } }, out: [], info: 'double → int 截断：3.7 变成 3（丢掉小数）' },
      { line: 10, vars: { i: { v: 5 }, d: { v: 3.7 }, n: { v: 3 }, c: { v: 'A', c: 'green' } }, out: [], info: 'int 65 转成 char → ASCII 65 对应字母 A' },
      { line: 11, vars: { i: { v: 5 }, d: { v: 3.7 }, n: { v: 3 }, c: { v: 'A' } }, out: [], info: '(double)22 / 7：先把 22 转成 22.0，再 / 7' },
      { line: 12, vars: { i: { v: 5 }, d: { v: 3.7 }, n: { v: 3 }, c: { v: 'A' }, pi: { v: 3.14286, c: 'green' } }, out: [], info: 'pi = 22.0 / 7 = 3.14286（浮点除法）' },
      { line: 13, vars: { i: { v: 5 }, d: { v: 3.7 }, n: { v: 3 }, c: { v: 'A' }, pi: { v: 3.14286 } }, out: ['5 3 '], info: '输出 i=5, n=3' },
      { line: 14, vars: { i: { v: 5 }, d: { v: 3.7 }, n: { v: 3 }, c: { v: 'A' }, pi: { v: 3.14286 } }, out: ['5 3 A 3.14286'], info: '输出 c=A, pi=3.14286' }
    ],
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 类型转换</div>
        <div class="tip-text">
          <strong>隐式转换（自动）：</strong><br>
          double d = 3.7; int n = d;  // 3.7 → 3（截断）<br>
          char c = 65;  // 整数 → 字符（ASCII）<br><br>
          <strong>强制转换（手动）：</strong><br>
          double x = (double)a / b;<br>
          (类型)表达式  → 临时转成目标类型<br><br>
          <strong>转换方向：</strong><br>
          char → int → long → float → double<br>
          小类型自动转大类型，大转小可能丢失精度。
        </div>
      </div>
      <div class="danger-box">
        <div class="danger-label">⚠️ 截断 vs 四舍五入</div>
        <div class="danger-text">
          C++ 的 double→int 是<strong>直接截断</strong>，不是四舍五入！<br>

          想四舍五入：int n = (int)(d + 0.5);
        </div>
      </div>
    `
  }
];

let currentIdx = 0;
let stepIdx = 0;

function getCodeHTML(code) {
  return code.map((line, i) => {
    let hl = line;
    hl = hl.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // Strings FIRST — before keyword/comment/number spans introduce quoted text
    hl = hl.replace(/"([^"]*)"/g, '<span class="str">"$1"</span>');
    hl = hl.replace(/\/\/.*/g, '<span class="comment">$&</span>');
    hl = hl.replace(/\b(int|double|float|char|string|bool|void|long|auto|for|while|do|if|else|return|break|continue|cout|cin|endl|main|using|namespace|include|true|false)\b/g, '<span class="kw">$1</span>');
    hl = hl.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
    const cls = (stepIdx > 0 && i === EXAMPLES[currentIdx].steps[stepIdx]?.line) ? ' hl-yellow' : '';
    return `<div class="${cls}"><span class="line-num">${String(i+1).padStart(2)}</span>${hl}</div>`;
  }).join('');
}

function renderVars(vars) {
  const keys = Object.keys(vars);
  if (keys.length === 0) return '<div style="color:var(--text-dim);font-size:0.85rem;font-family:\'JetBrains Mono\',monospace">（无变量）</div>';
  
  let html = '<table class="var-table"><tr><th>变量</th><th>值</th></tr>';
  keys.forEach(k => {
    const v = vars[k];
    const color = v.c || '';
    const colorMap = { cyan: 'var(--cyan)', green: 'var(--green)', orange: 'var(--orange)', red: 'var(--red)' };
    const style = color ? `color:${colorMap[color] || 'var(--text)'}` : '';
    html += `<tr><td style="color:var(--text-dim)">${k}</td><td class="val" style="${style}">${v.v}</td></tr>`;
  });
  html += '</table>';
  return html;
}

function renderStep() {
  const ex = EXAMPLES[currentIdx];
  const step = ex.steps[stepIdx];
  
  document.getElementById('code-display').innerHTML = getCodeHTML(ex.code);
  document.getElementById('var-table-wrapper').innerHTML = renderVars(step.vars);
  
  const outEl = document.getElementById('output-area');
  if (step.out.length > 0) {
    outEl.innerHTML = step.out.map((l, i) => 
      `<span class="line">${escapeHtml(l)}</span>`
    ).join('');
  }
  
  const existing = document.querySelector('.step-info');
  if (existing) existing.remove();
  
  if (step.info) {
    const infoEl = document.createElement('div');
    infoEl.className = 'step-info';
    infoEl.textContent = step.info;
    outEl.after(infoEl);
  }
  
  document.getElementById('step-btn').disabled = stepIdx >= ex.steps.length - 1;
}

function stepOnce() {
  const ex = EXAMPLES[currentIdx];
  if (stepIdx < ex.steps.length - 1) {
    stepIdx++;
    renderStep();
  }
}

function resetStep() {
  stepIdx = 0;
  const ex = EXAMPLES[currentIdx];
  const outEl = document.getElementById('output-area');
  outEl.innerHTML = '<span class="line">点击"单步执行"逐步观察</span>';
  const infoEl = document.querySelector('.step-info');
  if (infoEl) infoEl.remove();
  document.getElementById('var-table-wrapper').innerHTML = '';
  document.getElementById('step-btn').disabled = false;
  document.getElementById('code-display').innerHTML = getCodeHTML(ex.code);
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function selectExample(idx) {
  currentIdx = idx;
  stepIdx = 0;
  const ex = EXAMPLES[idx];
  
  document.querySelectorAll('.example-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
  document.getElementById('code-display').innerHTML = getCodeHTML(ex.code);
  document.getElementById('var-table-wrapper').innerHTML = '';
  document.getElementById('step-btn').disabled = false;
  
  const outEl = document.getElementById('output-area');
  outEl.innerHTML = '<span class="line">点击"单步执行"逐步观察</span>';
  const infoEl = document.querySelector('.step-info');
  if (infoEl) infoEl.remove();
  
  document.getElementById('knowledge-content').innerHTML = ex.knowledge;
}

function init() {
  const selector = document.getElementById('example-selector');
  EXAMPLES.forEach((ex, i) => {
    const btn = document.createElement('button');
    btn.className = 'example-btn' + (i === 0 ? ' active' : '');
    btn.textContent = ex.name;
    btn.onclick = () => selectExample(i);
    selector.appendChild(btn);
  });
  selectExample(0);
}

init();
</script>
</body>
</html>
