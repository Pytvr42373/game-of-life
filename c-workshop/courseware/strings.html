<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字符串 — C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0d1a; --surface: #12142a; --surface2: #1a1d3a;
    --border: #2a2d5a; --accent: #6c5ce7; --accent2: #a29bfe;
    --green: #00e676; --cyan: #00e5ff; --orange: #ff9100;
    --pink: #ff4081; --text: #e0e0ff; --text-dim: #7878aa;
    --cell-bg: #1a1d3a; --cell-border: #2a2d5a;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }

  .top-bar {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 32px; flex-wrap: wrap;
  }

  .back-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-dim); text-decoration: none;
    font-size: 0.82rem; font-weight: 600; transition: all 0.2s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--text); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

  .top-bar h1 {
    font-size: 1.3rem; font-weight: 700;
    background: linear-gradient(135deg, var(--orange), var(--pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .top-bar .sub { font-size: 0.78rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

  .workspace {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 24px; max-width: 1100px; margin: 0 auto;
  }
  @media (max-width: 800px) { .workspace { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }

  .panel-header {
    padding: 12px 16px; background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-header .label { font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .panel-header .action {
    font-size: 0.72rem; color: var(--accent2); cursor: pointer;
    padding: 4px 10px; border-radius: 6px;
    background: rgba(108,92,231,0.1); border: none; font-family: inherit;
  }
  .panel-header .action:hover { background: rgba(108,92,231,0.2); }

  .panel-body { padding: 20px; }

  .code-block {
    font-family: 'JetBrains Mono', monospace; font-size: 0.9rem;
    line-height: 1.8; color: var(--text); white-space: pre; overflow-x: auto; letter-spacing: 0.5px;
  }
  .code-block .kw { color: var(--accent2); }
  .code-block .type { color: var(--cyan); }
  .code-block .num { color: var(--orange); }
  .code-block .comment { color: var(--text-dim); font-style: italic; }
  .code-block .highlight { background: rgba(108,92,231,0.2); border-radius: 3px; padding: 0 2px; }
  .code-block .str { color: var(--green); }
  .code-block .null-char { color: var(--pink); font-weight: 700; }

  .memory-grid {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 12px; background: rgba(0,0,0,0.2);
    border-radius: 8px; min-height: 60px; align-content: flex-start;
  }

  .mem-cell {
    width: 48px; height: 48px;
    background: var(--cell-bg); border: 1px solid var(--cell-border);
    border-radius: 6px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
    transition: all 0.3s; position: relative; cursor: pointer;
  }
  .mem-cell .val { font-size: 0.85rem; font-weight: 600; color: var(--text); }
  .mem-cell .addr { font-size: 0.55rem; color: var(--text-dim); margin-top: 2px; }
  .mem-cell .index { font-size: 0.55rem; color: var(--accent2); margin-bottom: 2px; }
  .mem-cell.active { border-color: var(--accent); box-shadow: 0 0 12px rgba(108,92,231,0.3); }
  .mem-cell.null-cell { border-color: var(--pink); background: rgba(255,64,129,0.08); }
  .mem-cell.char-cell { border-color: var(--orange); }
  .mem-cell.highlight { border-color: var(--green); box-shadow: 0 0 8px rgba(0,230,118,0.2); }

  .mem-cell .tooltip {
    display: none; position: absolute;
    bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px;
    font-size: 0.65rem; color: var(--text); white-space: nowrap; z-index: 10;
  }
  .mem-cell:hover .tooltip { display: block; }

  .string-controls {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .ctrl-btn {
    padding: 8px 16px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  }
  .ctrl-btn:hover { border-color: var(--accent); }
  .ctrl-btn.active { border-color: var(--orange); background: rgba(255,145,0,0.1); }

  .string-editor {
    display: flex; align-items: center; gap: 12px;
    margin-top: 12px; padding: 12px 16px;
    background: rgba(0,0,0,0.2); border-radius: 8px;
  }
  .string-editor label { font-size: 0.78rem; color: var(--text-dim); }
  .string-editor input {
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
    width: 200px; outline: none; transition: border-color 0.2s;
  }
  .string-editor input:focus { border-color: var(--accent); }

  .info-bar {
    display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap;
  }
  .info-item {
    padding: 6px 12px; border-radius: 6px;
    background: rgba(0,0,0,0.2);
    font-size: 0.72rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace;
  }
  .info-item strong { color: var(--accent2); font-weight: 600; }

  .legend {
    display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text-dim); }
  .legend-color { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--cell-border); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .mem-cell { animation: fadeIn 0.3s ease both; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    返回
  </a>
  <h1>字符串</h1>
  <span class="sub">char[] · \0 结尾</span>
</div>

<div class="workspace">
  <div class="panel">
    <div class="panel-header">
      <span class="label">C 代码</span>
      <span class="action" style="cursor:default;background:transparent;color:var(--text-dim)">C 语言没有 string 类型</span>
    </div>
    <div class="panel-body">
      <div class="string-controls" id="string-controls"></div>
      <div class="code-block" id="code-display"></div>
      <div class="string-editor">
        <label>输入字符串：</label>
        <input type="text" id="string-input" value="Hello" oninput="updateString(this.value)" maxlength="10">
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="label">内存视图</span>
      <span class="action" style="cursor:default;background:transparent;color:var(--text-dim)" id="mem-summary">6 字节（含 \0）</span>
    </div>
    <div class="panel-body">
      <div class="memory-grid" id="memory-grid"></div>
      <div class="info-bar" id="info-bar"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-color" style="border-color:var(--orange);background:rgba(255,145,0,0.1)"></div> 字符</div>
        <div class="legend-item"><div class="legend-color" style="border-color:var(--pink);background:rgba(255,64,129,0.1)"></div> \0 结束符</div>
      </div>
    </div>
  </div>
</div>

<script>
const EXAMPLES = [
  {
    name: 'char s[] = "Hello"',
    code: 'char s[] = "Hello";',
    str: 'Hello'
  },
  {
    name: 'char s[] = "C!"',
    code: 'char s[] = "C!";',
    str: 'C!'
  },
  {
    name: 'char s[] = "ABC"',
    code: 'char s[] = "ABC";',
    str: 'ABC'
  },
  {
    name: 'char s[10] = "Hi"',
    code: 'char s[10] = "Hi";',
    str: 'Hi',
    fixedSize: 10
  }
];

let currentIdx = 0;
let baseAddr = 0x4000;

function renderMemory(str, fixedSize) {
  const grid = document.getElementById('memory-grid');
  const summary = document.getElementById('mem-summary');
  const infoBar = document.getElementById('info-bar');

  grid.innerHTML = '';

  const len = str.length;
  const total = fixedSize || len + 1;

  for (let i = 0; i < total; i++) {
    const cell = document.createElement('div');
    const isNull = i >= len;
    cell.className = `mem-cell ${isNull ? 'null-cell' : 'char-cell'}`;
    cell.style.animationDelay = `${i * 0.05}s`;

    const idx = document.createElement('div');
    idx.className = 'index';
    idx.textContent = `[${i}]`;
    cell.appendChild(idx);

    const val = document.createElement('div');
    val.className = 'val';
    if (isNull) {
      val.textContent = '\\0';
      val.style.color = 'var(--pink)';
    } else {
      val.textContent = str[i];
    }
    cell.appendChild(val);

    const addr = document.createElement('div');
    addr.className = 'addr';
    addr.textContent = `0x${(baseAddr + i).toString(16).toUpperCase()}`;
    cell.appendChild(addr);

    const tooltip = document.createElement('div');
    tooltip.className = 'tooltip';
    if (isNull) {
      tooltip.textContent = `s[${i}] = '\\0' (空字符，字符串结束标记)`;
    } else {
      tooltip.textContent = `s[${i}] = '${str[i]}' (ASCII: ${str.charCodeAt(i)})`;
    }
    cell.appendChild(tooltip);

    grid.appendChild(cell);
  }

  summary.textContent = `${total} 字节（含 \\0）`;

  infoBar.innerHTML = `
    <div class="info-item">字符串长度: <strong>${len}</strong></div>
    <div class="info-item">内存占用: <strong>${total} 字节</strong></div>
    <div class="info-item">起始地址: <strong>0x${baseAddr.toString(16).toUpperCase()}</strong></div>
    <div class="info-item">\\0 位置: <strong>[${len}]</strong></div>
  `;
}

function updateString(val) {
  const ex = EXAMPLES[currentIdx];
  ex.str = val;
  renderMemory(val, ex.fixedSize);
  updateCodeDisplay();
}

function updateCodeDisplay() {
  const ex = EXAMPLES[currentIdx];
  const codeEl = document.getElementById('code-display');
  if (ex.fixedSize) {
    codeEl.innerHTML = `<span class="type">char</span> s[${ex.fixedSize}] = <span class="str">"${ex.str}"</span>;`;
  } else {
    codeEl.innerHTML = `<span class="type">char</span> s[] = <span class="str">"${ex.str}"</span>;`;
  }
}

function selectExample(idx) {
  currentIdx = idx;
  const ex = EXAMPLES[idx];
  const input = document.getElementById('string-input');

  document.querySelectorAll('.ctrl-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });

  input.value = ex.str;
  updateCodeDisplay();
  renderMemory(ex.str, ex.fixedSize);
}

function init() {
  const controls = document.getElementById('string-controls');
  EXAMPLES.forEach((ex, i) => {
    const btn = document.createElement('button');
    btn.className = 'ctrl-btn' + (i === 0 ? ' active' : '');
    btn.textContent = ex.name;
    btn.onclick = () => selectExample(i);
    controls.appendChild(btn);
  });
  selectExample(0);
}

init();
</script>

</body>
</html>
