<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指针入门 — C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0d1a; --surface: #12142a; --surface2: #1a1d3a;
    --border: #2a2d5a; --accent: #6c5ce7; --accent2: #a29bfe;
    --green: #00e676; --cyan: #00e5ff; --orange: #ff9100;
    --pink: #ff4081; --text: #e0e0ff; --text-dim: #7878aa;
    --cell-bg: #1a1d3a; --cell-border: #2a2d5a;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }

  .top-bar {
    display: flex; align-items: center; gap: 16px;
    margin-bottom: 32px; flex-wrap: wrap;
  }

  .back-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text-dim); text-decoration: none;
    font-size: 0.82rem; font-weight: 600; transition: all 0.2s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--text); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

  .top-bar h1 {
    font-size: 1.3rem; font-weight: 700;
    background: linear-gradient(135deg, var(--cyan), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .top-bar .sub { font-size: 0.78rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

  .workspace {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 24px; max-width: 1100px; margin: 0 auto;
  }
  @media (max-width: 800px) { .workspace { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden;
  }

  .panel-header {
    padding: 12px 16px; background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-header .label { font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .panel-header .action {
    font-size: 0.72rem; color: var(--accent2); cursor: pointer;
    padding: 4px 10px; border-radius: 6px;
    background: rgba(108,92,231,0.1); border: none; font-family: inherit;
  }
  .panel-header .action:hover { background: rgba(108,92,231,0.2); }

  .panel-body { padding: 20px; }

  .code-block {
    font-family: 'JetBrains Mono', monospace; font-size: 0.9rem;
    line-height: 1.8; color: var(--text); white-space: pre; overflow-x: auto; letter-spacing: 0.5px;
  }
  .code-block .kw { color: var(--accent2); }
  .code-block .type { color: var(--cyan); }
  .code-block .num { color: var(--orange); }
  .code-block .comment { color: var(--text-dim); font-style: italic; }
  .code-block .highlight { background: rgba(108,92,231,0.2); border-radius: 3px; padding: 0 2px; }
  .code-block .arrow { color: var(--green); font-weight: 700; }

  .memory-grid {
    display: flex; flex-wrap: wrap; gap: 4px;
    padding: 12px; background: rgba(0,0,0,0.2);
    border-radius: 8px; min-height: 60px; align-content: flex-start;
    position: relative;
  }

  .mem-cell {
    width: 48px; height: 48px;
    background: var(--cell-bg); border: 1px solid var(--cell-border);
    border-radius: 6px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
    transition: all 0.3s; position: relative; cursor: pointer;
  }
  .mem-cell .val { font-size: 0.85rem; font-weight: 600; color: var(--text); }
  .mem-cell .addr { font-size: 0.55rem; color: var(--text-dim); margin-top: 2px; }
  .mem-cell .varname { font-size: 0.55rem; color: var(--accent2); margin-bottom: 2px; }
  .mem-cell.active { border-color: var(--accent); box-shadow: 0 0 12px rgba(108,92,231,0.3); }
  .mem-cell.pointer-cell { border-color: var(--cyan); background: rgba(0,229,255,0.05); }
  .mem-cell.target-cell { border-color: var(--green); background: rgba(0,230,118,0.05); }

  .mem-cell .tooltip {
    display: none; position: absolute;
    bottom: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px;
    font-size: 0.65rem; color: var(--text); white-space: nowrap; z-index: 10;
  }
  .mem-cell:hover .tooltip { display: block; }

  /* Arrow SVG for pointer */
  .pointer-arrow {
    position: absolute;
    pointer-events: none;
  }

  .var-selector {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .var-btn {
    padding: 8px 16px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  }
  .var-btn:hover { border-color: var(--accent); }
  .var-btn.active { border-color: var(--cyan); background: rgba(0,229,255,0.1); }

  .value-editor {
    display: flex; align-items: center; gap: 12px;
    margin-top: 12px; padding: 12px 16px;
    background: rgba(0,0,0,0.2); border-radius: 8px;
  }
  .value-editor label { font-size: 0.78rem; color: var(--text-dim); }
  .value-editor input {
    padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;
    width: 80px; outline: none; transition: border-color 0.2s;
  }
  .value-editor input:focus { border-color: var(--accent); }

  .info-bar {
    display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap;
  }
  .info-item {
    padding: 6px 12px; border-radius: 6px;
    background: rgba(0,0,0,0.2);
    font-size: 0.72rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace;
  }
  .info-item strong { color: var(--accent2); font-weight: 600; }

  .legend {
    display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text-dim); }
  .legend-color { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--cell-border); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .mem-cell { animation: fadeIn 0.3s ease both; }

  /* SVG arrow */
  .arrow-svg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 5;
  }
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    返回
  </a>
  <h1>指针入门</h1>
  <span class="sub">&amp; 取地址 · * 解引用 · 箭头</span>
</div>

<div class="workspace">
  <div class="panel">
    <div class="panel-header">
      <span class="label">C 代码</span>
      <button class="action" onclick="resetExample()">重置</button>
    </div>
    <div class="panel-body">
      <div class="var-selector" id="var-selector"></div>
      <div class="code-block" id="code-display"></div>
      <div class="value-editor">
        <label>修改值：</label>
        <input type="number" id="value-input" value="42" oninput="updateTargetValue(this.value)">
        <span class="size-info" id="size-info" style="font-size:0.72rem;color:var(--text-dim);margin-left:auto"></span>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="label">内存视图</span>
      <span class="action" style="cursor:default;background:transparent;color:var(--text-dim)">指针 → 目标</span>
    </div>
    <div class="panel-body">
      <div class="memory-grid" id="memory-grid" style="position:relative;min-height:180px"></div>
      <div class="info-bar" id="info-bar"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-color" style="border-color:var(--cyan);background:rgba(0,229,255,0.1)"></div> 指针变量（存地址）</div>
        <div class="legend-item"><div class="legend-color" style="border-color:var(--green);background:rgba(0,230,118,0.1)"></div> 目标变量（被指向）</div>
        <div class="legend-item"><div class="legend-color" style="border-color:var(--accent);background:rgba(108,92,231,0.1)"></div> 普通变量</div>
      </div>
    </div>
  </div>
</div>

<script>
const EXAMPLES = [
  {
    name: 'int *p = &a',
    code: `int a = 42;\nint *p = &a;  // p 指向 a`,
    target: { name: 'a', type: 'int', value: 42, addr: 0x3000 },
    pointer: { name: 'p', type: 'int*', addr: 0x3100 }
  },
  {
    name: '*p = 100',
    code: `int a = 42;\nint *p = &a;\n*p = 100;  // 通过指针修改 a`,
    target: { name: 'a', type: 'int', value: 100, addr: 0x3000 },
    pointer: { name: 'p', type: 'int*', addr: 0x3100 }
  },
  {
    name: 'int *p1 = &x',
    code: `int x = 7;\nint y = 99;\nint *p1 = &x;  // p1 指向 x`,
    target: { name: 'x', type: 'int', value: 7, addr: 0x3000 },
    extra: { name: 'y', type: 'int', value: 99, addr: 0x3004 },
    pointer: { name: 'p1', type: 'int*', addr: 0x3100 }
  },
  {
    name: 'p1 = &y',
    code: `int x = 7;\nint y = 99;\nint *p1 = &x;\np1 = &y;  // 改指向`,
    target: { name: 'y', type: 'int', value: 99, addr: 0x3004 },
    extra: { name: 'x', type: 'int', value: 7, addr: 0x3000 },
    pointer: { name: 'p1', type: 'int*', addr: 0x3100 }
  }
];

let currentIdx = 0;

function renderMemory() {
  const ex = EXAMPLES[currentIdx];
  const grid = document.getElementById('memory-grid');
  const infoBar = document.getElementById('info-bar');
  const sizeInfo = document.getElementById('size-info');

  grid.innerHTML = '';

  // Create SVG overlay for arrows
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'arrow-svg');
  svg.style.position = 'absolute';
  svg.style.top = '0';
  svg.style.left = '0';
  svg.style.width = '100%';
  svg.style.height = '100%';
  svg.style.pointerEvents = 'none';
  svg.style.zIndex = '5';
  grid.appendChild(svg);

  // Render target variable
  const targetCell = createCell(ex.target, 'target-cell');
  targetCell.style.marginRight = '40px';
  grid.appendChild(targetCell);

  // Render extra variable if exists
  if (ex.extra) {
    const extraCell = createCell(ex.extra, '');
    extraCell.style.marginRight = '40px';
    grid.appendChild(extraCell);
  }

  // Render pointer variable
  const ptrCell = createCell(ex.pointer, 'pointer-cell');
  grid.appendChild(ptrCell);

  // Draw arrow after layout
  requestAnimationFrame(() => {
    drawArrow(svg, ex.pointer, ex.target);
  });

  // Info bar
  infoBar.innerHTML = `
    <div class="info-item">指针 <strong>${ex.pointer.name}</strong> 存地址: <strong>0x${ex.target.addr.toString(16).toUpperCase()}</strong></div>
    <div class="info-item">解引用 <strong>*${ex.pointer.name}</strong> = <strong>${ex.target.value}</strong></div>
  `;

  sizeInfo.textContent = `指针占 8 字节（64位）`;
}

function createCell(v, extraClass) {
  const cell = document.createElement('div');
  cell.className = `mem-cell ${extraClass}`;
  cell.dataset.addr = v.addr;
  cell.dataset.name = v.name;

  const name = document.createElement('div');
  name.className = 'varname';
  name.textContent = v.name;
  cell.appendChild(name);

  const val = document.createElement('div');
  val.className = 'val';
  val.textContent = v.type.endsWith('*') ? `0x${(v.addr + (v.type === 'int*' ? 0 : 0)).toString(16).toUpperCase()}` : v.value;
  cell.appendChild(val);

  const addr = document.createElement('div');
  addr.className = 'addr';
  addr.textContent = `0x${v.addr.toString(16).toUpperCase()}`;
  cell.appendChild(addr);

  const tooltip = document.createElement('div');
  tooltip.className = 'tooltip';
  if (v.type.endsWith('*')) {
    tooltip.textContent = `${v.name} 是指针，存的是地址`;
  } else {
    tooltip.textContent = `${v.name} = ${v.value}`;
  }
  cell.appendChild(tooltip);

  return cell;
}

function drawArrow(svg, from, to) {
  const fromEl = svg.parentElement.querySelector(`[data-addr="${from.addr}"]`);
  const toEl = svg.parentElement.querySelector(`[data-addr="${to.addr}"]`);
  if (!fromEl || !toEl) return;

  const container = svg.parentElement;
  const cRect = container.getBoundingClientRect();
  const fRect = fromEl.getBoundingClientRect();
  const tRect = toEl.getBoundingClientRect();

  const x1 = fRect.left - cRect.left;
  const y1 = fRect.top + fRect.height / 2 - cRect.top;
  const x2 = tRect.right - cRect.left;
  const y2 = tRect.top + tRect.height / 2 - cRect.top;

  // Draw right-angle connector
  const midX = (x1 + x2) / 2;
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  const d = `M ${x1} ${y1} L ${midX} ${y1} L ${midX} ${y2} L ${x2} ${y2}`;
  path.setAttribute('d', d);
  path.setAttribute('stroke', 'var(--green)');
  path.setAttribute('stroke-width', '2.5');
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke-dasharray', '');
  path.setAttribute('opacity', '0.9');
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(path);

  // Arrowhead (pointing left)
  const arrowHead = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  const headSize = 8;
  const hx = x2;
  const hy = y2;
  arrowHead.setAttribute('points',
    `${hx},${hy} ${hx + headSize * 1.2},${hy - headSize * 0.5} ${hx + headSize * 1.2},${hy + headSize * 0.5}`
  );
  arrowHead.setAttribute('fill', 'var(--green)');
  arrowHead.setAttribute('opacity', '0.9');
  svg.appendChild(arrowHead);

  // Label on the horizontal segment
  const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  label.setAttribute('x', (midX + x2) / 2);
  label.setAttribute('y', y2 - 6);
  label.setAttribute('fill', 'var(--green)');
  label.setAttribute('font-size', '10');
  label.setAttribute('font-family', 'JetBrains Mono, monospace');
  label.setAttribute('text-anchor', 'middle');
  label.setAttribute('opacity', '0.6');
  label.textContent = '地址';
  svg.appendChild(label);
}

function updateTargetValue(val) {
  const ex = EXAMPLES[currentIdx];
  const n = parseInt(val);
  if (!isNaN(n)) {
    ex.target.value = n;
    renderMemory();
  }
}

function resetExample() {
  const defaults = {
    'int *p = &a': 42,
    '*p = 100': 100,
    'int *p1 = &x': 7,
    'p1 = &y': 99
  };
  const ex = EXAMPLES[currentIdx];
  ex.target.value = defaults[ex.name] || 42;
  document.getElementById('value-input').value = ex.target.value;
  renderMemory();
}

function selectExample(idx) {
  currentIdx = idx;
  const ex = EXAMPLES[idx];
  const selector = document.getElementById('var-selector');
  const codeDisplay = document.getElementById('code-display');
  const input = document.getElementById('value-input');

  selector.querySelectorAll('.var-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });

  codeDisplay.innerHTML = ex.code.replace(/\/\/.*/g, m => `<span class="comment">${m}</span>`)
    .replace(/int\s*\*/g, '<span class="type">int*</span>')
    .replace(/\bint\b/g, '<span class="type">int</span>')
    .replace(/&/g, '<span class="arrow">&</span>')
    .replace(/\*/g, (m, offset) => {
      const before = ex.code.substring(0, offset);
      if (before.match(/int\s*$/)) return m;
      return '<span class="arrow">*</span>';
    });

  input.value = ex.target.value;
  renderMemory();
}

function init() {
  const selector = document.getElementById('var-selector');
  EXAMPLES.forEach((ex, i) => {
    const btn = document.createElement('button');
    btn.className = 'var-btn' + (i === 0 ? ' active' : '');
    btn.textContent = ex.name;
    btn.onclick = () => selectExample(i);
    selector.appendChild(btn);
  });
  selectExample(0);
}

init();
</script>

</body>
</html>
