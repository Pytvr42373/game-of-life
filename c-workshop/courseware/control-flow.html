<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>控制流 — C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0d1a;
    --surface: #12142a;
    --surface2: #1a1d3a;
    --border: #2a2d5a;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --green: #00e676;
    --cyan: #00e5ff;
    --orange: #ff9100;
    --pink: #ff4081;
    --red: #ff5252;
    --text: #e0e0ff;
    --text-dim: #7878aa;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
  }

  .top-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.82rem;
    font-weight: 600;
    transition: all 0.2s;
  }

  .back-btn:hover { border-color: var(--accent); color: var(--text); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

  .top-bar h1 {
    font-size: 1.3rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent2), var(--orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .top-bar .sub {
    font-size: 0.78rem;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  .workspace {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }

  @media (max-width: 800px) {
    .workspace { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .panel-header {
    padding: 12px 16px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-header .label {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .panel-header .action {
    font-size: 0.72rem;
    color: var(--accent2);
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(108,92,231,0.1);
    border: none;
    font-family: inherit;
    transition: background 0.2s;
  }

  .panel-header .action:hover { background: rgba(108,92,231,0.2); }
  .panel-body { padding: 20px; }

  .code-block {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    line-height: 1.8;
    color: var(--text);
    white-space: pre;
    overflow-x: auto;
    letter-spacing: 0.5px;
  }

  .code-block .kw { color: var(--accent2); }
  .code-block .type { color: var(--cyan); }
  .code-block .num { color: var(--orange); }
  .code-block .str { color: var(--green); }
  .code-block .comment { color: var(--text-dim); font-style: italic; }
  .code-block .highlight { background: rgba(108,92,231,0.25); border-radius: 3px; }
  .code-block .highlight-true { background: rgba(0,230,118,0.2); border-radius: 3px; }
  .code-block .highlight-false { background: rgba(255,82,82,0.2); border-radius: 3px; }
  .code-block .line-num { color: var(--text-dim); user-select: none; margin-right: 16px; }

  /* Flow diagram */
  .flow-diagram {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 16px;
    min-height: 200px;
  }

  .flow-node {
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.8rem;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    border: 2px solid var(--border);
    background: var(--surface2);
    transition: all 0.3s;
    text-align: center;
    min-width: 100px;
  }

  .flow-node.active { border-color: var(--accent); box-shadow: 0 0 16px rgba(108,92,231,0.3); }
  .flow-node.true { border-color: var(--green); box-shadow: 0 0 12px rgba(0,230,118,0.2); }
  .flow-node.false { border-color: var(--red); box-shadow: 0 0 12px rgba(255,82,82,0.2); }
  .flow-node.done { border-color: var(--text-dim); opacity: 0.5; }

  .flow-arrow {
    color: var(--text-dim);
    font-size: 0.75rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .flow-arrow svg { width: 20px; height: 20px; stroke: var(--text-dim); fill: none; stroke-width: 2; }
  .flow-arrow .label { font-size: 0.6rem; color: var(--text-dim); margin-top: 2px; }

  /* Scenario selector */
  .scenario-selector {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .scenario-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .scenario-btn:hover { border-color: var(--accent); }
  .scenario-btn.active { border-color: var(--accent); background: rgba(108,92,231,0.15); }

  /* Controls */
  .flow-controls {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .flow-btn {
    padding: 8px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  .flow-btn:hover { border-color: var(--accent); background: rgba(108,92,231,0.1); }
  .flow-btn.primary { border-color: var(--accent); background: rgba(108,92,231,0.15); color: var(--accent2); }
  .flow-btn.primary:hover { background: rgba(108,92,231,0.25); }
  .flow-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .state-info {
    display: flex;
    gap: 12px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .state-item {
    padding: 6px 12px;
    border-radius: 6px;
    background: rgba(0,0,0,0.2);
    font-size: 0.72rem;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  .state-item strong { color: var(--accent2); font-weight: 600; }

  .branch-decision {
    padding: 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 8px;
    margin-top: 12px;
    text-align: center;
  }

  .branch-decision .condition {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .branch-decision .result {
    font-size: 0.85rem;
    color: var(--text-dim);
  }

  .branch-decision .result .true-text { color: var(--green); font-weight: 700; }
  .branch-decision .result .false-text { color: var(--red); font-weight: 700; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    返回
  </a>
  <h1>控制流</h1>
  <span class="sub">if · else · for · while · 条件判断</span>
</div>

<div class="workspace">
  <div class="panel">
    <div class="panel-header">
      <span class="label">C 代码</span>
      <button class="action" onclick="resetScenario()">重置</button>
    </div>
    <div class="panel-body">
      <div class="scenario-selector" id="scenario-selector"></div>
      <div class="code-block" id="code-display"></div>
      <div class="flow-controls">
        <button class="flow-btn primary" id="step-btn" onclick="stepForward()">▶ 单步执行</button>
        <button class="flow-btn" onclick="runAll()">⏩ 运行全部</button>
      </div>
      <div class="state-info" id="state-info"></div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="label">执行流程</span>
      <span class="action" style="cursor:default;background:transparent;color:var(--text-dim)" id="step-counter">步骤 0</span>
    </div>
    <div class="panel-body">
      <div class="flow-diagram" id="flow-diagram"></div>
      <div class="branch-decision" id="branch-decision" style="display:none"></div>
    </div>
  </div>
</div>

<script>
const SCENARIOS = [
  {
    name: 'if-else 判断',
    lines: [
      'int score = 85;',
      'if (score >= 60) {',
      '    printf("及格\\n");',
      '} else {',
      '    printf("不及格\\n");',
      '}',
      'printf("考试结束\\n");'
    ],
    highlightMap: [
      { line: 0, desc: '声明变量 score = 85' },
      { line: 1, desc: '判断条件: score >= 60 ?' },
      { line: 2, desc: '条件为真 → 执行 if 分支' },
      { line: 4, desc: '跳过 else 分支' },
      { line: 6, desc: '继续执行后续代码' }
    ],
    variables: { score: 85 },
    steps: [
      { currentLine: 0, flowState: '声明变量 score = 85', vars: { score: 85 } },
      { currentLine: 1, flowState: '判断 score >= 60', vars: { score: 85 }, decision: { cond: 'score >= 60', result: true } },
      { currentLine: 2, flowState: '✅ 条件为真，进入 if 分支', vars: { score: 85 } },
      { currentLine: 4, flowState: '跳过 else 分支', vars: { score: 85 } },
      { currentLine: 6, flowState: '继续执行后续代码', vars: { score: 85 } }
    ]
  },
  {
    name: 'for 循环',
    lines: [
      'int sum = 0;',
      'for (int i = 1; i <= 3; i++) {',
      '    sum += i;',
      '}',
      'printf("sum = %d\\n", sum);'
    ],
    highlightMap: [
      { line: 0, desc: '初始化 sum = 0' },
      { line: 1, desc: '进入循环, i = 1' },
      { line: 2, desc: 'sum += i → sum = 1' },
      { line: 1, desc: 'i++ → i = 2, 判断 i <= 3' },
      { line: 2, desc: 'sum += i → sum = 3' },
      { line: 1, desc: 'i++ → i = 3, 判断 i <= 3' },
      { line: 2, desc: 'sum += i → sum = 6' },
      { line: 1, desc: 'i++ → i = 4, 判断 i <= 3 → 不成立, 退出循环' },
      { line: 4, desc: '输出结果' }
    ],
    variables: { sum: 0, i: 0 },
    steps: [
      { currentLine: 0, flowState: '初始化 sum = 0', vars: { sum: 0, i: 0 } },
      { currentLine: 1, flowState: '循环初始化: i = 1', vars: { sum: 0, i: 1 }, decision: { cond: 'i <= 3', result: true } },
      { currentLine: 2, flowState: '第1次迭代: sum += 1', vars: { sum: 1, i: 1 } },
      { currentLine: 1, flowState: 'i++ → i = 2, 判断 i <= 3', vars: { sum: 1, i: 2 }, decision: { cond: 'i <= 3', result: true } },
      { currentLine: 2, flowState: '第2次迭代: sum += 2', vars: { sum: 3, i: 2 } },
      { currentLine: 1, flowState: 'i++ → i = 3, 判断 i <= 3', vars: { sum: 3, i: 3 }, decision: { cond: 'i <= 3', result: true } },
      { currentLine: 2, flowState: '第3次迭代: sum += 3', vars: { sum: 6, i: 3 } },
      { currentLine: 1, flowState: 'i++ → i = 4, 判断 i <= 3 → 退出', vars: { sum: 6, i: 4 }, decision: { cond: 'i <= 3', result: false } },
      { currentLine: 4, flowState: '循环结束, 输出结果', vars: { sum: 6, i: 4 } }
    ]
  },
  {
    name: 'while 循环',
    lines: [
      'int n = 5;',
      'int fact = 1;',
      'while (n > 1) {',
      '    fact *= n;',
      '    n--;',
      '}',
      'printf("%d\\n", fact);'
    ],
    highlightMap: [
      { line: 0, desc: 'n = 5' },
      { line: 1, desc: 'fact = 1' },
      { line: 2, desc: '判断 n > 1 → 5 > 1, 成立' },
      { line: 3, desc: 'fact = 1 * 5 = 5' },
      { line: 4, desc: 'n-- → n = 4' },
      { line: 2, desc: '判断 n > 1 → 4 > 1, 成立' },
      { line: 3, desc: 'fact = 5 * 4 = 20' },
      { line: 4, desc: 'n-- → n = 3' },
      { line: 2, desc: '判断 n > 1 → 3 > 1, 成立' },
      { line: 3, desc: 'fact = 20 * 3 = 60' },
      { line: 4, desc: 'n-- → n = 2' },
      { line: 2, desc: '判断 n > 1 → 2 > 1, 成立' },
      { line: 3, desc: 'fact = 60 * 2 = 120' },
      { line: 4, desc: 'n-- → n = 1' },
      { line: 2, desc: '判断 n > 1 → 1 > 1, 不成立, 退出' },
      { line: 6, desc: '输出 fact = 120' }
    ],
    variables: { n: 5, fact: 1 },
    steps: [
      { currentLine: 0, flowState: 'n = 5', vars: { n: 5, fact: 1 } },
      { currentLine: 1, flowState: 'fact = 1', vars: { n: 5, fact: 1 } },
      { currentLine: 2, flowState: '判断 n > 1', vars: { n: 5, fact: 1 }, decision: { cond: 'n > 1', result: true } },
      { currentLine: 3, flowState: 'fact *= 5 → 5', vars: { n: 5, fact: 5 } },
      { currentLine: 4, flowState: 'n-- → 4', vars: { n: 4, fact: 5 } },
      { currentLine: 2, flowState: '判断 n > 1', vars: { n: 4, fact: 5 }, decision: { cond: 'n > 1', result: true } },
      { currentLine: 3, flowState: 'fact *= 4 → 20', vars: { n: 4, fact: 20 } },
      { currentLine: 4, flowState: 'n-- → 3', vars: { n: 3, fact: 20 } },
      { currentLine: 2, flowState: '判断 n > 1', vars: { n: 3, fact: 20 }, decision: { cond: 'n > 1', result: true } },
      { currentLine: 3, flowState: 'fact *= 3 → 60', vars: { n: 3, fact: 60 } },
      { currentLine: 4, flowState: 'n-- → 2', vars: { n: 2, fact: 60 } },
      { currentLine: 2, flowState: '判断 n > 1', vars: { n: 2, fact: 60 }, decision: { cond: 'n > 1', result: true } },
      { currentLine: 3, flowState: 'fact *= 2 → 120', vars: { n: 2, fact: 120 } },
      { currentLine: 4, flowState: 'n-- → 1', vars: { n: 1, fact: 120 } },
      { currentLine: 2, flowState: '判断 n > 1 → 不成立, 退出', vars: { n: 1, fact: 120 }, decision: { cond: 'n > 1', result: false } },
      { currentLine: 6, flowState: '输出 fact = 120', vars: { n: 1, fact: 120 } }
    ]
  },
  {
    name: 'switch-case',
    lines: [
      'int day = 3;',
      'switch (day) {',
      '    case 1:',
      '        printf("周一\\n"); break;',
      '    case 2:',
      '        printf("周二\\n"); break;',
      '    case 3:',
      '        printf("周三\\n"); break;',
      '    default:',
      '        printf("其他\\n");',
      '}',
      'printf("结束\\n");'
    ],
    highlightMap: [
      { line: 0, desc: 'day = 3' },
      { line: 1, desc: '进入 switch(day)' },
      { line: 7, desc: '匹配 case 3' },
      { line: 8, desc: '执行: 输出"周三"' },
      { line: 8, desc: 'break → 跳出 switch' },
      { line: 11, desc: '继续执行后续代码' }
    ],
    variables: { day: 3 },
    steps: [
      { currentLine: 0, flowState: 'day = 3', vars: { day: 3 } },
      { currentLine: 1, flowState: '计算 switch(3)', vars: { day: 3 } },
      { currentLine: 7, flowState: '匹配 case 3:', vars: { day: 3 } },
      { currentLine: 8, flowState: '输出 "周三"', vars: { day: 3 } },
      { currentLine: 8, flowState: 'break 跳出 switch', vars: { day: 3 } },
      { currentLine: 11, flowState: '继续执行后续代码', vars: { day: 3 } }
    ]
  }
];

let currentIdx = 0;
let currentStep = 0;
let isRunning = false;

function getCodeHTML(scenario, stepIdx) {
  const step = stepIdx >= 0 && stepIdx < scenario.steps.length ? scenario.steps[stepIdx] : null;
  const currentLine = step ? step.currentLine : -1;
  
  let html = '';
  scenario.lines.forEach((line, i) => {
    let cls = '';
    if (i === currentLine && step && step.decision) {
      cls = step.decision.result ? 'highlight-true' : 'highlight-false';
    } else if (i === currentLine) {
      cls = 'highlight';
    }
    html += `<div class="${cls}"><span class="line-num">${String(i + 1).padStart(2)}</span>${escapeHtml(line)}</div>`;
  });
  return html;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderFlow(scenario, stepIdx) {
  const step = scenario.steps[Math.min(stepIdx, scenario.steps.length - 1)];
  const diagram = document.getElementById('flow-diagram');
  const decision = document.getElementById('branch-decision');

  diagram.innerHTML = '';
  decision.style.display = 'none';

  // Show current state
  const node = document.createElement('div');
  node.className = 'flow-node active';
  node.textContent = step.flowState;
  diagram.appendChild(node);

  // Show decision if present
  if (step.decision) {
    decision.style.display = 'block';
    decision.innerHTML = `
      <div class="condition">条件: <span style="color:var(--cyan)">${escapeHtml(step.decision.cond)}</span></div>
      <div class="result">结果: 
        <span class="${step.decision.result ? 'true-text' : 'false-text'}">
          ${step.decision.result ? '✅ 真 (true)' : '❌ 假 (false)'}
        </span>
      </div>
    `;
  }

  // Update step counter
  document.getElementById('step-counter').textContent = `步骤 ${stepIdx + 1}/${scenario.steps.length}`;
}

function renderState(scenario, stepIdx) {
  const step = scenario.steps[Math.min(stepIdx, scenario.steps.length - 1)];
  const info = document.getElementById('state-info');
  let varsHtml = '';
  for (const [k, v] of Object.entries(step.vars)) {
    varsHtml += `<div class="state-item"><strong>${k}</strong> = ${v}</div>`;
  }
  info.innerHTML = varsHtml;
}

function selectScenario(idx) {
  currentIdx = idx;
  currentStep = 0;
  const scenario = SCENARIOS[idx];
  
  // Update selector
  document.querySelectorAll('.scenario-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });

  // Update code
  document.getElementById('code-display').innerHTML = getCodeHTML(scenario, -1);
  
  // Reset flow
  renderFlow(scenario, 0);
  renderState(scenario, 0);
  
  // Enable step button
  document.getElementById('step-btn').disabled = false;
}

function stepForward() {
  const scenario = SCENARIOS[currentIdx];
  if (currentStep >= scenario.steps.length - 1) return;
  
  currentStep++;
  document.getElementById('code-display').innerHTML = getCodeHTML(scenario, currentStep);
  renderFlow(scenario, currentStep);
  renderState(scenario, currentStep);
  
  if (currentStep >= scenario.steps.length - 1) {
    document.getElementById('step-btn').disabled = true;
  }
}

function runAll() {
  if (isRunning) return;
  isRunning = true;
  const scenario = SCENARIOS[currentIdx];
  document.getElementById('step-btn').disabled = true;
  
  let i = 0;
  const interval = setInterval(() => {
    currentStep = i;
    document.getElementById('code-display').innerHTML = getCodeHTML(scenario, i);
    renderFlow(scenario, i);
    renderState(scenario, i);
    i++;
    if (i >= scenario.steps.length) {
      clearInterval(interval);
      isRunning = false;
    }
  }, 600);
}

function resetScenario() {
  const scenario = SCENARIOS[currentIdx];
  currentStep = 0;
  document.getElementById('code-display').innerHTML = getCodeHTML(scenario, -1);
  renderFlow(scenario, 0);
  renderState(scenario, 0);
  document.getElementById('step-btn').disabled = false;
}

function init() {
  const selector = document.getElementById('scenario-selector');
  SCENARIOS.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'scenario-btn' + (i === 0 ? ' active' : '');
    btn.textContent = s.name;
    btn.onclick = () => selectScenario(i);
    selector.appendChild(btn);
  });
  selectScenario(0);
}

init();
</script>
</body>
</html>
