<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排序算法 — C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0d1a;
    --surface: #12142a;
    --surface2: #1a1d3a;
    --border: #2a2d5a;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --green: #00e676;
    --cyan: #00e5ff;
    --orange: #ff9100;
    --pink: #ff4081;
    --red: #ff5252;
    --yellow: #ffd740;
    --text: #e0e0ff;
    --text-dim: #7878aa;
  }

  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }

  .top-bar {
    display: flex; align-items: center; gap: 16px; margin-bottom: 32px; flex-wrap: wrap;
  }
  .back-btn {
    display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: all 0.2s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--text); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .top-bar h1 { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent2), var(--orange)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .top-bar .sub { font-size: 0.78rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

  .workspace { max-width: 1100px; margin: 0 auto; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
  .panel-header { padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-header .label { font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .panel-header .action { font-size: 0.72rem; color: var(--accent2); cursor: pointer; padding: 4px 10px; border-radius: 6px; background: rgba(108,92,231,0.1); border: none; font-family: inherit; transition: background 0.2s; }
  .panel-header .action:hover { background: rgba(108,92,231,0.2); }
  .panel-body { padding: 20px; }

  .code-block {
    font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; line-height: 2;
    color: var(--text); white-space: pre; overflow-x: auto;
  }
  .code-block .kw { color: var(--accent2); }
  .code-block .type { color: var(--cyan); }
  .code-block .num { color: var(--orange); }
  .code-block .comment { color: var(--text-dim); font-style: italic; }
  .code-block .highlight { background: rgba(108,92,231,0.25); border-radius: 3px; padding: 0 2px; }
  .code-block .highlight-compare { background: rgba(255,215,64,0.2); border-radius: 3px; padding: 0 2px; }
  .code-block .highlight-swap { background: rgba(255,82,82,0.2); border-radius: 3px; padding: 0 2px; }
  .code-block .line-num { color: var(--text-dim); user-select: none; margin-right: 12px; }

  .algo-selector { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .algo-btn {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem; cursor: pointer; transition: all 0.2s;
  }
  .algo-btn:hover { border-color: var(--accent); }
  .algo-btn.active { border-color: var(--accent); background: rgba(108,92,231,0.15); }

  .flow-controls { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .flow-btn {
    padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-family: inherit;
    font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
  }
  .flow-btn:hover { border-color: var(--accent); background: rgba(108,92,231,0.1); }
  .flow-btn.primary { border-color: var(--accent); background: rgba(108,92,231,0.15); color: var(--accent2); }
  .flow-btn.primary:hover { background: rgba(108,92,231,0.25); }
  .flow-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Array visualization */
  .array-vis {
    display: flex; gap: 8px; justify-content: center; align-items: flex-end;
    padding: 20px; min-height: 220px; flex-wrap: wrap;
  }

  .array-bar {
    display: flex; flex-direction: column; align-items: center;
    transition: all 0.3s; position: relative;
  }

  .bar-rect {
    width: 48px; border-radius: 6px 6px 0 0;
    background: linear-gradient(180deg, var(--accent), var(--accent2));
    transition: all 0.3s;
    min-height: 20px;
    display: flex; align-items: center; justify-content: center;
  }

  .bar-rect .bar-val {
    font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: 700;
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }

  .bar-rect.comparing {
    background: linear-gradient(180deg, var(--yellow), #ffa000);
    box-shadow: 0 0 16px rgba(255,215,64,0.4);
  }

  .bar-rect.swapping {
    background: linear-gradient(180deg, var(--red), #d50000);
    box-shadow: 0 0 16px rgba(255,82,82,0.4);
  }

  .bar-rect.sorted {
    background: linear-gradient(180deg, var(--green), #00c853);
    box-shadow: 0 0 12px rgba(0,230,118,0.3);
  }

  .bar-rect.pivot {
    background: linear-gradient(180deg, var(--pink), #c51162);
    box-shadow: 0 0 16px rgba(255,64,129,0.4);
  }

  .bar-index {
    font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;
    color: var(--text-dim); margin-top: 6px;
  }

  .state-info { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .state-item {
    padding: 6px 12px; border-radius: 6px; background: rgba(0,0,0,0.2);
    font-size: 0.72rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace;
  }
  .state-item strong { color: var(--accent2); font-weight: 600; }

  .legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; color: var(--text-dim); }
  .legend-color { width: 14px; height: 14px; border-radius: 4px; }

  .step-desc {
    padding: 10px 16px; background: rgba(0,0,0,0.2); border-radius: 8px;
    margin-top: 12px; font-size: 0.85rem; color: var(--text); line-height: 1.5;
  }

  .comparison-count {
    font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
    color: var(--text-dim); padding: 4px 12px; background: rgba(0,0,0,0.2);
    border-radius: 6px; display: inline-block;
  }
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    返回
  </a>
  <h1>排序算法</h1>
  <span class="sub">冒泡排序 · 选择排序 · 插入排序</span>
</div>

<div class="workspace">
  <div class="panel">
    <div class="panel-header">
      <span class="label">C 代码</span>
      <button class="action" onclick="resetAlgo()">重置</button>
    </div>
    <div class="panel-body">
      <div class="algo-selector" id="algo-selector"></div>
      <div class="code-block" id="code-display"></div>
      <div class="flow-controls">
        <button class="flow-btn primary" id="step-btn" onclick="stepForward()">▶ 单步执行</button>
        <button class="flow-btn" onclick="runAll()">⏩ 运行全部</button>
        <span class="comparison-count" id="cmp-count">比较: 0</span>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span class="label">数组可视化</span>
      <span class="action" style="cursor:default;background:transparent;color:var(--text-dim)" id="step-counter">步骤 0</span>
    </div>
    <div class="panel-body">
      <div class="array-vis" id="array-vis"></div>
      <div class="step-desc" id="step-desc">点击"单步执行"开始观察排序过程</div>
      <div class="state-info" id="state-info"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-color" style="background:linear-gradient(180deg,var(--accent),var(--accent2))"></div> 未排序</div>
        <div class="legend-item"><div class="legend-color" style="background:linear-gradient(180deg,var(--yellow),#ffa000)"></div> 正在比较</div>
        <div class="legend-item"><div class="legend-color" style="background:linear-gradient(180deg,var(--red),#d50000)"></div> 正在交换</div>
        <div class="legend-item"><div class="legend-color" style="background:linear-gradient(180deg,var(--green),#00c853)"></div> 已排序</div>
      </div>
    </div>
  </div>
</div>

<script>
const ALGOS = [
  {
    name: '冒泡排序',
    code: [
      'void bubble_sort(int arr[], int n) {',
      '    for (int i = 0; i < n-1; i++) {',
      '        for (int j = 0; j < n-1-i; j++) {',
      '            if (arr[j] > arr[j+1]) {',
      '                int tmp = arr[j];',
      '                arr[j] = arr[j+1];',
      '                arr[j+1] = tmp;',
      '            }',
      '        }',
      '    }',
      '}'
    ],
    initialArray: [29, 10, 14, 37, 13],
    generateSteps(arr) {
      const a = [...arr];
      const steps = [];
      const n = a.length;
      
      steps.push({ array: [...a], compare: [-1,-1], swap: [-1,-1], sorted: [], desc: '初始数组' });
      
      for (let i = 0; i < n - 1; i++) {
        for (let j = 0; j < n - 1 - i; j++) {
          steps.push({ array: [...a], compare: [j, j+1], swap: [-1,-1], sorted: [], desc: `比较 arr[${j}]=${a[j]} 和 arr[${j+1}]=${a[j+1]}` });
          if (a[j] > a[j+1]) {
            [a[j], a[j+1]] = [a[j+1], a[j]];
            steps.push({ array: [...a], compare: [-1,-1], swap: [j, j+1], sorted: [], desc: `交换 → ${a[j+1]} 和 ${a[j]} 换位置` });
          }
        }
        steps.push({ array: [...a], compare: [-1,-1], swap: [-1,-1], sorted: [n-1-i], desc: `第 ${i+1} 轮结束，arr[${n-1-i}]=${a[n-1-i]} 已归位` });
      }
      steps.push({ array: [...a], compare: [-1,-1], swap: [-1,-1], sorted: [0,1,2,3,4], desc: '✅ 排序完成！' });
      
      return steps;
    }
  },
  {
    name: '选择排序',
    code: [
      'void selection_sort(int arr[], int n) {',
      '    for (int i = 0; i < n-1; i++) {',
      '        int min = i;',
      '        for (int j = i+1; j < n; j++) {',
      '            if (arr[j] < arr[min]) {',
      '                min = j;',
      '            }',
      '        }',
      '        int tmp = arr[i];',
      '        arr[i] = arr[min];',
      '        arr[min] = tmp;',
      '    }',
      '}'
    ],
    initialArray: [29, 10, 14, 37, 13],
    generateSteps(arr) {
      const a = [...arr];
      const steps = [];
      const n = a.length;
      let minIdx = -1;
      
      steps.push({ array: [...a], compare: [-1,-1], swap: [-1,-1], minIdx: -1, sorted: [], desc: '初始数组' });
      
      for (let i = 0; i < n - 1; i++) {
        minIdx = i;
        steps.push({ array: [...a], compare: [-1,-1], swap: [-1,-1], minIdx: i, sorted: [], desc: `第 ${i+1} 轮：假设 arr[${i}]=${a[i]} 最小` });
        
        for (let j = i + 1; j < n; j++) {
          steps.push({ array: [...a], compare: [j, minIdx], swap: [-1,-1], minIdx, sorted: [], desc: `比较 arr[${j}]=${a[j]} 和当前最小值 arr[${minIdx}]=${a[minIdx]}` });
          if (a[j] < a[minIdx]) {
            minIdx = j;
            steps.push({ array: [...a], compare: [-1,-1], swap: [-1,-1], minIdx, sorted: [], desc: `找到更小的！arr[${j}]=${a[j]} < arr[${minIdx}]=${a[minIdx]}` });
          }
        }
        
        if (minIdx !== i) {
          [a[i], a[minIdx]] = [a[minIdx], a[i]];
          steps.push({ array: [...a], compare: [-1,-1], swap: [i, minIdx], minIdx: -1, sorted: [], desc: `交换 arr[${i}] 和 arr[${minIdx}]` });
        }
        steps.push({ array: [...a], compare: [-1,-1], swap: [-1,-1], minIdx: -1, sorted: [i], desc: `第 ${i+1} 轮结束，arr[${i}]=${a[i]} 已归位` });
      }
      steps.push({ array: [...a], compare: [-1,-1], swap: [-1,-1], minIdx: -1, sorted: [0,1,2,3,4], desc: '✅ 排序完成！' });
      
      return steps;
    }
  },
  {
    name: '插入排序',
    code: [
      'void insertion_sort(int arr[], int n) {',
      '    for (int i = 1; i < n; i++) {',
      '        int key = arr[i];',
      '        int j = i - 1;',
      '        while (j >= 0 && arr[j] > key) {',
      '            arr[j+1] = arr[j];',
      '            j--;',
      '        }',
      '        arr[j+1] = key;',
      '    }',
      '}'
    ],
    initialArray: [29, 10, 14, 37, 13],
    generateSteps(arr) {
      const a = [...arr];
      const steps = [];
      const n = a.length;
      
      steps.push({ array: [...a], compare: [-1,-1], swap: [-1,-1], sorted: [0], key: -1, keyIdx: -1, desc: '初始数组，arr[0] 视为已排序' });
      
      for (let i = 1; i < n; i++) {
        const key = a[i];
        let j = i - 1;
        steps.push({ array: [...a], compare: [-1,-1], swap: [-1,-1], sorted: Array.from({length: i}, (_, k) => k), key, keyIdx: i, desc: `取出 arr[${i}]=${key}，准备插入已排序部分` });
        
        while (j >= 0 && a[j] > key) {
          steps.push({ array: [...a], compare: [j, -1], swap: [-1,-1], sorted: Array.from({length: i}, (_, k) => k), key, keyIdx: j+1, desc: `arr[${j}]=${a[j]} > ${key}，右移` });
          a[j+1] = a[j];
          steps.push({ array: [...a], compare: [-1,-1], swap: [j, j+1], sorted: [], key, keyIdx: j+1, desc: `arr[${j+1}] ← arr[${j}]` });
          j--;
        }
        
        a[j+1] = key;
        steps.push({ array: [...a], compare: [-1,-1], swap: [-1,-1], sorted: Array.from({length: i+1}, (_, k) => k), key: -1, keyIdx: -1, desc: `插入 ${key} 到 arr[${j+1}]，已完成 ${i+1} 个元素` });
      }
      steps.push({ array: [...a], compare: [-1,-1], swap: [-1,-1], sorted: [0,1,2,3,4], key: -1, keyIdx: -1, desc: '✅ 排序完成！' });
      
      return steps;
    }
  }
];

let currentIdx = 0;
let currentStep = 0;
let steps = [];
let isRunning = false;

function getCodeHTML(algo, stepIdx) {
  const step = steps[Math.min(stepIdx, steps.length - 1)];
  const code = algo.code;
  let html = '';
  code.forEach((line, i) => {
    let cls = '';
    // Highlight based on what's happening
    if (step && step.compare && step.compare[0] >= 0 && i === 3) cls = 'highlight-compare';
    if (step && step.swap && step.swap[0] >= 0 && (i === 4 || i === 5 || i === 6)) cls = 'highlight-swap';
    if (step && step.minIdx !== undefined && step.minIdx >= 0 && i === 2) cls = 'highlight';
    html += `<div class="${cls}"><span class="line-num">${String(i + 1).padStart(2)}</span>${escapeHtml(line)}</div>`;
  });
  return html;
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderArray(step) {
  const vis = document.getElementById('array-vis');
  const arr = step.array;
  const maxVal = Math.max(...arr);
  vis.innerHTML = '';
  
  arr.forEach((val, i) => {
    const bar = document.createElement('div');
    bar.className = 'array-bar';
    
    const rect = document.createElement('div');
    rect.className = 'bar-rect';
    const height = 20 + (val / maxVal) * 160;
    rect.style.height = height + 'px';
    
    let cls = '';
    if (step.sorted && step.sorted.includes(i)) cls = 'sorted';
    else if (step.swap && step.swap.includes(i)) cls = 'swapping';
    else if (step.compare && step.compare.includes(i)) cls = 'comparing';
    else if (step.minIdx === i) cls = 'pivot';
    else if (step.keyIdx === i) cls = 'pivot';
    if (cls) rect.classList.add(cls);
    
    const valSpan = document.createElement('span');
    valSpan.className = 'bar-val';
    valSpan.textContent = val;
    rect.appendChild(valSpan);
    
    const idx = document.createElement('div');
    idx.className = 'bar-index';
    idx.textContent = i;
    
    bar.appendChild(rect);
    bar.appendChild(idx);
    vis.appendChild(bar);
  });
}

function renderState(step) {
  const info = document.getElementById('state-info');
  let html = '';
  if (step.desc) {
    document.getElementById('step-desc').textContent = step.desc;
  }
  // Count comparisons
  let cmpCount = 0;
  for (let i = 0; i <= Math.min(currentStep, steps.length - 1); i++) {
    if (steps[i].compare && steps[i].compare[0] >= 0) cmpCount++;
  }
  document.getElementById('cmp-count').textContent = `比较: ${cmpCount}`;
  document.getElementById('step-counter').textContent = `步骤 ${currentStep + 1}/${steps.length}`;
}

function selectAlgo(idx) {
  currentIdx = idx;
  currentStep = 0;
  const algo = ALGOS[idx];
  steps = algo.generateSteps(algo.initialArray);
  
  document.querySelectorAll('.algo-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
  document.getElementById('code-display').innerHTML = getCodeHTML(algo, -1);
  renderArray(steps[0]);
  renderState(steps[0]);
  document.getElementById('step-btn').disabled = false;
}

function stepForward() {
  if (currentStep >= steps.length - 1) return;
  currentStep++;
  const algo = ALGOS[currentIdx];
  document.getElementById('code-display').innerHTML = getCodeHTML(algo, currentStep);
  renderArray(steps[currentStep]);
  renderState(steps[currentStep]);
  if (currentStep >= steps.length - 1) document.getElementById('step-btn').disabled = true;
}

function runAll() {
  if (isRunning) return;
  isRunning = true;
  document.getElementById('step-btn').disabled = true;
  const algo = ALGOS[currentIdx];
  let i = currentStep;
  const interval = setInterval(() => {
    currentStep = i;
    document.getElementById('code-display').innerHTML = getCodeHTML(algo, i);
    renderArray(steps[i]);
    renderState(steps[i]);
    i++;
    if (i >= steps.length) { clearInterval(interval); isRunning = false; }
  }, 500);
}

function resetAlgo() {
  const algo = ALGOS[currentIdx];
  steps = algo.generateSteps(algo.initialArray);
  currentStep = 0;
  document.getElementById('code-display').innerHTML = getCodeHTML(algo, -1);
  renderArray(steps[0]);
  renderState(steps[0]);
  document.getElementById('step-btn').disabled = false;
}

function init() {
  const selector = document.getElementById('algo-selector');
  ALGOS.forEach((a, i) => {
    const btn = document.createElement('button');
    btn.className = 'algo-btn' + (i === 0 ? ' active' : '');
    btn.textContent = a.name;
    btn.onclick = () => selectAlgo(i);
    selector.appendChild(btn);
  });
  selectAlgo(0);
}

init();
</script>
</body>
</html>
