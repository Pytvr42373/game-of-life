<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>查找算法 — C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0d1a; --surface: #12142a; --surface2: #1a1d3a; --border: #2a2d5a;
    --accent: #6c5ce7; --accent2: #a29bfe; --green: #00e676; --cyan: #00e5ff;
    --orange: #ff9100; --pink: #ff4081; --red: #ff5252; --yellow: #ffd740;
    --text: #e0e0ff; --text-dim: #7878aa;
  }

  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }

  .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .back-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
  .back-btn:hover { border-color: var(--accent); color: var(--text); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .top-bar h1 { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent2), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .top-bar .sub { font-size: 0.78rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

  .workspace { max-width: 1100px; margin: 0 auto; }

  /* ===== Tab System ===== */
  .tab-bar { display: flex; gap: 0; margin-bottom: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px 12px 0 0; overflow: hidden; }
  .tab-btn { flex: 1; padding: 12px 20px; border: none; background: var(--surface2); color: var(--text-dim); font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s; border-bottom: 2px solid transparent; }
  .tab-btn:hover { color: var(--text); background: var(--surface); }
  .tab-btn.active { color: var(--accent2); background: var(--surface); border-bottom-color: var(--accent); }
  .tab-btn .tab-icon { margin-right: 6px; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ===== Panel ===== */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 0 0 12px 12px; overflow: hidden; margin-bottom: 24px; }
  .panel.no-top-radius { border-radius: 0 0 12px 12px; }
  .panel-header { padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-header .label { font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .panel-header .action { font-size: 0.72rem; color: var(--accent2); cursor: pointer; padding: 4px 10px; border-radius: 6px; background: rgba(108,92,231,0.1); border: none; font-family: inherit; transition: background 0.2s; }
  .panel-header .action:hover { background: rgba(108,92,231,0.2); }
  .panel-body { padding: 20px; }

  .panel.panel-double { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  @media (max-width: 800px) { .panel.panel-double { grid-template-columns: 1fr; } }
  .panel-half { padding: 20px; overflow: hidden; }
  .panel-half + .panel-half { border-left: 1px solid var(--border); }
  @media (max-width: 800px) { .panel-half + .panel-half { border-left: none; border-top: 1px solid var(--border); } }

  /* ===== Code Block ===== */
  .code-block { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; line-height: 1.9; color: var(--text); white-space: pre; overflow-x: auto; letter-spacing: 0.5px; }
  .code-block .kw { color: var(--accent2); } .code-block .type { color: var(--cyan); }
  .code-block .num { color: var(--orange); } .code-block .comment { color: var(--text-dim); font-style: italic; }
  .code-block .str { color: var(--green); }
  .code-block .hl { background: rgba(108,92,231,0.25); border-radius: 3px; display: block; }
  .code-block .hl-found { background: rgba(0,230,118,0.25); border-radius: 3px; display: block; }
  .code-block .hl-mid { background: rgba(255,215,64,0.2); border-radius: 3px; display: block; }
  .code-block .hl-compare { background: rgba(255,64,129,0.2); border-radius: 3px; display: block; }
  .code-block .line-num { color: var(--text-dim); user-select: none; margin-right: 12px; display: inline-block; min-width: 24px; }
  .code-line { display: block; padding: 0 4px; border-radius: 3px; transition: all 0.3s; }
  .code-explain { font-size: 0.75rem; color: var(--accent2); font-family: 'Inter', sans-serif; margin-left: 36px; padding: 2px 0 6px 0; border-left: 2px solid var(--accent); padding-left: 12px; display: block; }

  /* ===== Algorithm Selector ===== */
  .algo-selector { display: flex; gap: 8px; flex-wrap: wrap; }
  .algo-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; cursor: pointer; transition: all 0.2s; }
  .algo-btn:hover { border-color: var(--accent); }
  .algo-btn.active { border-color: var(--accent); background: rgba(108,92,231,0.15); color: var(--accent2); }

  /* ===== Controls ===== */
  .controls-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .controls-row label { font-size: 0.78rem; color: var(--text-dim); white-space: nowrap; }
  .controls-row input[type="number"] { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; width: 72px; outline: none; transition: border-color 0.2s; }
  .controls-row input[type="number"]:focus { border-color: var(--accent); }
  .controls-row input[type="range"] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: var(--border); outline: none; width: 120px; }
  .controls-row input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid var(--surface); }
  .controls-row input[type="range"]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid var(--surface); }
  .controls-row .range-val { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--accent2); min-width: 24px; text-align: center; }
  .ctrl-btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 0.78rem; cursor: pointer; transition: all 0.2s; }
  .ctrl-btn:hover { border-color: var(--accent); background: rgba(108,92,231,0.08); }
  .ctrl-btn.primary { border-color: var(--accent); background: rgba(108,92,231,0.15); color: var(--accent2); }
  .ctrl-btn.primary:hover { background: rgba(108,92,231,0.25); }
  .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .ctrl-btn.green { border-color: var(--green); color: var(--green); }
  .ctrl-btn.green:hover { background: rgba(0,230,118,0.1); }

  .data-input-area { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .data-input-area input[type="text"] { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; outline: none; transition: border-color 0.2s; flex: 1; min-width: 180px; }
  .data-input-area input[type="text"]:focus { border-color: var(--accent); }

  /* ===== Array Visualization ===== */
  .array-vis { display: flex; gap: 6px; justify-content: center; align-items: flex-end; padding: 20px 10px; min-height: 240px; flex-wrap: wrap; }
  .array-bar { display: flex; flex-direction: column; align-items: center; transition: all 0.3s; position: relative; cursor: pointer; }
  .array-bar:hover .bar-rect { filter: brightness(1.2); }
  .bar-rect { width: 44px; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--accent), var(--accent2)); transition: all 0.3s; min-height: 24px; display: flex; align-items: center; justify-content: center; position: relative; }
  .bar-rect .bar-val { font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
  .bar-rect.checking { background: linear-gradient(180deg, var(--yellow), #ffa000); box-shadow: 0 0 18px rgba(255,215,64,0.5); transform: scaleY(1.05); transform-origin: bottom; }
  .bar-rect.found { background: linear-gradient(180deg, var(--green), #00c853); box-shadow: 0 0 20px rgba(0,230,118,0.5); transform: scaleY(1.08); transform-origin: bottom; }
  .bar-rect.eliminated { background: linear-gradient(180deg, #3a3a5a, #2a2a4a); opacity: 0.35; }
  .bar-rect.mid { background: linear-gradient(180deg, var(--pink), #c51162); box-shadow: 0 0 18px rgba(255,64,129,0.5); }
  .bar-rect.bound-l { background: linear-gradient(180deg, var(--green), #00c853); box-shadow: 0 0 12px rgba(0,230,118,0.3); }
  .bar-rect.bound-r { background: linear-gradient(180deg, var(--red), #d50000); box-shadow: 0 0 12px rgba(255,82,82,0.3); }
  .bar-rect.bound-lr { background: linear-gradient(180deg, var(--yellow), #ffa000); box-shadow: 0 0 14px rgba(255,215,64,0.4); }
  .bar-index { font-family: 'JetBrains Mono', monospace; font-size: 0.6rem; color: var(--text-dim); margin-top: 5px; text-align: center; min-height: 14px; }
  .bar-index .marker { font-size: 0.55rem; font-weight: 600; }
  .bar-index .marker-l { color: var(--green); }
  .bar-index .marker-r { color: var(--red); }

  /* ===== Flow Controls ===== */
  .flow-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .flow-btn { padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: inherit; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
  .flow-btn:hover { border-color: var(--accent); background: rgba(108,92,231,0.1); }
  .flow-btn.primary { border-color: var(--accent); background: rgba(108,92,231,0.15); color: var(--accent2); }
  .flow-btn.primary:hover { background: rgba(108,92,231,0.25); }
  .flow-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ===== State Info ===== */
  .state-info { display: flex; gap: 10px; flex-wrap: wrap; }
  .state-item { padding: 5px 10px; border-radius: 6px; background: rgba(0,0,0,0.2); font-size: 0.7rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .state-item strong { color: var(--accent2); font-weight: 600; }

  .step-desc { padding: 10px 16px; background: rgba(0,0,0,0.2); border-radius: 8px; margin-top: 10px; font-size: 0.85rem; color: var(--text); line-height: 1.6; }
  .step-desc .highlight-text { color: var(--accent2); font-weight: 600; }
  .step-desc .highlight-green { color: var(--green); font-weight: 600; }
  .step-desc .highlight-red { color: var(--red); font-weight: 600; }

  .result-badge { display: inline-block; padding: 6px 16px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; margin-top: 6px; }
  .result-badge.found { background: rgba(0,230,118,0.15); color: var(--green); border: 1px solid rgba(0,230,118,0.3); }
  .result-badge.not-found { background: rgba(255,82,82,0.15); color: var(--red); border: 1px solid rgba(255,82,82,0.3); }

  /* ===== Legend ===== */
  .legend { display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.7rem; color: var(--text-dim); }
  .legend-color { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }

  /* ===== Separator ===== */
  .section-divider { height: 1px; background: var(--border); margin: 16px 0; }

  /* ===== Code Explanation Panel ===== */
  .explain-header { font-size: 0.72rem; font-weight: 600; color: var(--cyan); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .explain-text { font-size: 0.85rem; color: var(--text); line-height: 1.7; padding: 10px 14px; background: rgba(0,0,0,0.2); border-radius: 8px; border-left: 3px solid var(--accent); }
  .explain-text .code-ref { font-family: 'JetBrains Mono', monospace; color: var(--accent2); font-size: 0.8rem; }

  /* ===== Scrollbar ===== */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* ===== Responsive ===== */
  @media (max-width: 640px) {
    body { padding: 12px; }
    .bar-rect { width: 32px; }
    .bar-rect .bar-val { font-size: 0.65rem; }
    .array-vis { gap: 4px; padding: 12px 4px; }
    .controls-row { gap: 8px; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    返回
  </a>
  <h1>查找算法</h1>
  <span class="sub">线性查找 · 二分查找</span>
</div>

<div class="workspace">

  <!-- ====== Tab Bar ====== -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="tab-visual" onclick="switchTab('tab-visual')">
      <span class="tab-icon">🎯</span> 可视化演示
    </button>
    <button class="tab-btn" data-tab="tab-code" onclick="switchTab('tab-code')">
      <span class="tab-icon">📝</span> 代码讲解
    </button>
  </div>

  <!-- ====== TAB 1: 可视化演示 ====== -->
  <div class="tab-content active" id="tab-visual">
    <div class="panel no-top-radius">
      <div class="panel-header">
        <span class="label">算法选择</span>
        <button class="action" onclick="resetSearch()">🔄 重置</button>
      </div>
      <div class="panel-body">
        <div class="algo-selector" id="algo-selector"></div>

        <div class="section-divider"></div>

        <!-- Data Controls -->
        <div class="controls-row">
          <label>数据规模：</label>
          <input type="range" id="size-slider" min="4" max="20" value="8" oninput="onSizeChange(this.value)">
          <span class="range-val" id="size-display">8</span>
          <label style="margin-left:8px;">自定义数据：</label>
          <div class="data-input-area">
            <input type="text" id="data-input" value="5,18,33,7,42,9,15,27" placeholder="逗号分隔数值">
            <button class="ctrl-btn" onclick="applyCustomData()">应用</button>
            <button class="ctrl-btn green" onclick="randomizeData()">🎲 随机生成</button>
          </div>
        </div>

        <div class="section-divider"></div>

        <!-- Search Controls -->
        <div class="controls-row">
          <label>查找目标值：</label>
          <input type="number" id="target-input" value="33">
          <button class="ctrl-btn primary" onclick="startSearch()">🔍 开始查找</button>
          <span style="margin-left:auto;font-size:0.72rem;color:var(--text-dim);">点击柱状图可快速设为目标值</span>
        </div>
      </div>
    </div>

    <div class="panel no-top-radius">
      <div class="panel-header">
        <span class="label">数组可视化</span>
        <span class="action" style="cursor:default;background:transparent;color:var(--text-dim)" id="step-counter">步骤 0 / 0</span>
      </div>
      <div class="panel-body">
        <div class="array-vis" id="array-vis-main"></div>

        <div class="step-desc" id="step-desc-main">选择一个查找算法，输入目标值，点击"开始查找"</div>

        <div class="controls-row" style="margin-top:10px;">
          <div class="flow-controls">
            <button class="flow-btn primary" id="step-btn" onclick="stepForward()">▶ 单步执行</button>
            <button class="flow-btn" id="run-btn" onclick="runAll()">⏩ 运行全部</button>
          </div>
          <div class="state-info" id="state-info-main" style="margin-left:auto;"></div>
        </div>

        <div id="result-display-main"></div>

        <div class="legend">
          <div class="legend-item"><div class="legend-color" style="background:linear-gradient(180deg,var(--accent),var(--accent2))"></div> 未检查</div>
          <div class="legend-item"><div class="legend-color" style="background:linear-gradient(180deg,var(--yellow),#ffa000)"></div> 正在检查</div>
          <div class="legend-item"><div class="legend-color" style="background:linear-gradient(180deg,var(--green),#00c853)"></div> 找到目标</div>
          <div class="legend-item"><div class="legend-color" style="background:linear-gradient(180deg,var(--pink),#c51162)"></div> 中间值</div>
          <div class="legend-item"><div class="legend-color" style="background:linear-gradient(180deg,var(--green),#00c853);opacity:0.7"></div> 左边界 L</div>
          <div class="legend-item"><div class="legend-color" style="background:linear-gradient(180deg,var(--red),#d50000);opacity:0.7"></div> 右边界 R</div>
          <div class="legend-item"><div class="legend-color" style="background:#3a3a5a;opacity:0.35"></div> 已排除</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ====== TAB 2: 代码讲解 ====== -->
  <div class="tab-content" id="tab-code">
    <div class="panel no-top-radius panel-double">
      <!-- Left: Visualization -->
      <div class="panel-half">
        <div class="panel-header" style="margin:-20px -20px 12px -20px;padding:10px 16px;background:var(--surface2);border-bottom:1px solid var(--border);border-radius:0;">
          <span class="label">数组可视化</span>
          <span class="action" style="cursor:default;background:transparent;color:var(--text-dim)" id="step-counter-code">步骤 0 / 0</span>
        </div>
        <div class="array-vis" id="array-vis-code" style="min-height:160px;padding:10px 4px;"></div>
        <div class="step-desc" id="step-desc-code" style="font-size:0.8rem;padding:8px 12px;">选择一个查找算法开始</div>
        <div class="controls-row" style="margin-top:8px;">
          <div class="flow-controls">
            <button class="flow-btn primary" id="step-btn-code" onclick="stepForward()" style="font-size:0.75rem;padding:6px 14px;">▶ 单步</button>
            <button class="flow-btn" id="run-btn-code" onclick="runAll()" style="font-size:0.75rem;padding:6px 14px;">⏩ 运行</button>
          </div>
          <div class="state-info" id="state-info-code" style="margin-left:auto;"></div>
        </div>
      </div>
      <!-- Right: Code -->
      <div class="panel-half">
        <div class="panel-header" style="margin:-20px -20px 8px -20px;padding:10px 16px;background:var(--surface2);border-bottom:1px solid var(--border);border-radius:0;">
          <span class="label">C 代码 · 逐行解释</span>
          <span class="action" style="cursor:default;background:transparent;color:var(--text-dim);font-family:'JetBrains Mono',monospace;" id="code-line-indicator">行 -</span>
        </div>
        <div class="code-block" id="code-display"></div>
        <div class="explain-header" style="margin-top:12px;">💡 当前行解释</div>
        <div class="explain-text" id="code-explain-text">点击"单步执行"查看每行代码的详细解释</div>
      </div>
    </div>
  </div>

</div>

<script>
// ===========================
// Algorithm Definitions
// ===========================
const ALGOS = [
  {
    name: '线性查找',
    shortName: 'linear',
    code: [
      'int linear_search(int arr[], int n, int target) {',
      '    for (int i = 0; i < n; i++) {',
      '        if (arr[i] == target) {',
      '            return i;  // 找到，返回下标',
      '        }',
      '    }',
      '    return -1;  // 没找到',
      '}'
    ],
    // Line-by-line explanations (index = line number - 1)
    explanations: [
      '定义线性查找函数，参数为数组 <span class="code-ref">arr</span>、长度 <span class="code-ref">n</span>、目标值 <span class="code-ref">target</span>',
      '从下标 <span class="code-ref">0</span> 开始，遍历数组中的每一个元素，<span class="code-ref">i</span> 递增直到 <span class="code-ref">n-1</span>',
      '检查当前元素 <span class="code-ref">arr[i]</span> 是否等于目标值 <span class="code-ref">target</span>',
      '✅ 若相等则查找成功，立即返回当前下标 <span class="code-ref">i</span>（函数结束）',
      '（循环体结束，继续下一次循环）',
      '（外层循环结束）',
      '❌ 遍历完整个数组仍未找到目标值，返回 <span class="code-ref">-1</span> 表示不存在',
      ''
    ],
    // For linear search, which code line to highlight for each step type
    stepToLine: {
      'init': 0,
      'checking': 1,
      'comparing': 2,
      'found': 3,
      'notfound': 6
    },
    initialArray: [5, 18, 33, 7, 42, 9, 15, 27],
    generateSteps(arr, target) {
      const steps = [];
      steps.push({
        type: 'init', array: [...arr], checking: -1, eliminated: [], found: -1,
        highlightLine: 0,
        desc: `线性查找开始：遍历数组，查找目标值 <span class="highlight-text">${target}</span>`
      });
      for (let i = 0; i < arr.length; i++) {
        steps.push({
          type: 'checking', array: [...arr], checking: i, eliminated: [], found: -1,
          highlightLine: 1,
          desc: `第 <span class="highlight-text">${i+1}</span> 步：<span class="highlight-text">i = ${i}</span>，检查 <span class="highlight-text">arr[${i}] = ${arr[i]}</span>`
        });
        steps.push({
          type: 'comparing', array: [...arr], checking: i, eliminated: [], found: -1,
          highlightLine: 2,
          desc: `比较：<span class="highlight-text">arr[${i}] = ${arr[i]}</span> 是否等于目标值 <span class="highlight-text">${target}</span>？`
        });
        if (arr[i] === target) {
          steps.push({
            type: 'found', array: [...arr], checking: -1, eliminated: [], found: i,
            highlightLine: 3,
            desc: `✅ <span class="highlight-green">找到目标！</span> <span class="highlight-text">arr[${i}] = ${target}</span>，返回下标 <span class="highlight-text">${i}</span>`
          });
          return steps;
        }
      }
      const eliminated = Array.from({length: arr.length}, (_, k) => k);
      steps.push({
        type: 'notfound', array: [...arr], checking: -1, eliminated, found: -1,
        highlightLine: 6,
        desc: `❌ <span class="highlight-red">未找到</span> 目标值 <span class="highlight-text">${target}</span>，返回 <span class="highlight-text">-1</span>`
      });
      return steps;
    }
  },
  {
    name: '二分查找',
    shortName: 'binary',
    code: [
      'int binary_search(int arr[], int n, int target) {',
      '    int left = 0, right = n - 1;',
      '    while (left <= right) {',
      '        int mid = left + (right - left) / 2;',
      '        if (arr[mid] == target)',
      '            return mid;',
      '        if (arr[mid] < target)',
      '            left = mid + 1;',
      '        else',
      '            right = mid - 1;',
      '    }',
      '    return -1;',
      '}'
    ],
    explanations: [
      '定义二分查找函数，<span class="highlight-red">要求数组已按升序排列</span>，参数为数组 <span class="code-ref">arr</span>、长度 <span class="code-ref">n</span>、目标值 <span class="code-ref">target</span>',
      '初始化左右边界：<span class="code-ref">left = 0</span>（数组首部），<span class="code-ref">right = n - 1</span>（数组尾部）',
      '当 <span class="code-ref">left ≤ right</span> 时，继续在 <span class="code-ref">[left, right]</span> 范围内查找',
      '计算中间位置：<span class="code-ref">mid = left + (right - left) / 2</span>（防溢出写法）',
      '如果 <span class="code-ref">arr[mid] == target</span>，中间元素恰好等于目标值',
      '✅ 查找成功，返回中间位置下标 <span class="code-ref">mid</span>',
      '如果 <span class="code-ref">arr[mid] < target</span>，中间元素小于目标值',
      '目标值在右半部分，将左边界调整为 <span class="code-ref">left = mid + 1</span>，排除左半部分',
      '否则（<span class="code-ref">arr[mid] > target</span>），中间元素大于目标值',
      '目标值在左半部分，将右边界调整为 <span class="code-ref">right = mid - 1</span>，排除右半部分',
      '（循环结束，查找区间为空）',
      '❌ 查找区间为空仍未找到，返回 <span class="code-ref">-1</span>'
    ],
    stepToLine: {
      'init': 0,
      'init_bounds': 1,
      'loop_check': 2,
      'calc_mid': 3,
      'compare_eq': 4,
      'found': 5,
      'compare_lt': 6,
      'adjust_left': 7,
      'compare_gt': 8,
      'adjust_right': 9,
      'notfound': 11
    },
    initialArray: [5, 7, 9, 15, 18, 27, 33, 42],
    generateSteps(arr, target) {
      const steps = [];
      let left = 0, right = arr.length - 1;
      const eliminated = new Array(arr.length).fill(false);

      steps.push({
        type: 'init', array: [...arr], left, right, mid: -1, checking: -1, found: -1, eliminated: [...eliminated],
        highlightLine: 0,
        desc: `二分查找开始：<span class="highlight-text">[0, ${right}]</span>，查找目标值 <span class="highlight-text">${target}</span>（数组已排序）`
      });
      steps.push({
        type: 'init_bounds', array: [...arr], left, right, mid: -1, checking: -1, found: -1, eliminated: [...eliminated],
        highlightLine: 1,
        desc: `初始化边界：<span class="highlight-green">left = ${left}</span>，<span class="highlight-red">right = ${right}</span>，查找区间 <span class="highlight-text">[${left}, ${right}]</span>`
      });

      while (left <= right) {
        const mid = left + Math.floor((right - left) / 2);

        steps.push({
          type: 'loop_check', array: [...arr], left, right, mid: -1, checking: -1, found: -1, eliminated: [...eliminated],
          highlightLine: 2,
          desc: `检查循环条件：<span class="highlight-text">left = ${left} ≤ right = ${right}</span> ✅，继续查找`
        });
        steps.push({
          type: 'calc_mid', array: [...arr], left, right, mid, checking: -1, found: -1, eliminated: [...eliminated],
          highlightLine: 3,
          desc: `计算 <span class="highlight-text">mid = ${left} + (${right} - ${left}) / 2 = ${mid}</span>，<span class="highlight-text">arr[${mid}] = ${arr[mid]}</span>`
        });
        steps.push({
          type: 'compare_eq', array: [...arr], left, right, mid, checking: -1, found: -1, eliminated: [...eliminated],
          highlightLine: 4,
          desc: `比较：<span class="highlight-text">arr[${mid}] = ${arr[mid]}</span> 是否等于 <span class="highlight-text">${target}</span>？`
        });

        if (arr[mid] === target) {
          steps.push({
            type: 'found', array: [...arr], left, right, mid, checking: -1, found: mid, eliminated: [...eliminated],
            highlightLine: 5,
            desc: `✅ <span class="highlight-green">找到目标！</span> <span class="highlight-text">arr[${mid}] = ${target}</span>，返回下标 <span class="highlight-text">${mid}</span>`
          });
          return steps;
        }

        if (arr[mid] < target) {
          steps.push({
            type: 'compare_lt', array: [...arr], left, right, mid, checking: -1, found: -1, eliminated: [...eliminated],
            highlightLine: 6,
            desc: `<span class="highlight-text">arr[${mid}] = ${arr[mid]} < ${target}</span>，目标在右半部分`
          });
          // Eliminate left half including mid
          for (let i = left; i <= mid; i++) eliminated[i] = true;
          left = mid + 1;
          steps.push({
            type: 'adjust_left', array: [...arr], left, right, mid: -1, checking: -1, found: -1, eliminated: [...eliminated],
            highlightLine: 7,
            desc: `缩小范围：<span class="highlight-green">left = ${mid} + 1 = ${left}</span>，新区间 <span class="highlight-text">[${left}, ${right}]</span>`
          });
        } else {
          steps.push({
            type: 'compare_gt', array: [...arr], left, right, mid, checking: -1, found: -1, eliminated: [...eliminated],
            highlightLine: 8,
            desc: `<span class="highlight-text">arr[${mid}] = ${arr[mid]} > ${target}</span>，目标在左半部分`
          });
          // Eliminate right half including mid
          for (let i = mid; i <= right; i++) eliminated[i] = true;
          right = mid - 1;
          steps.push({
            type: 'adjust_right', array: [...arr], left, right, mid: -1, checking: -1, found: -1, eliminated: [...eliminated],
            highlightLine: 9,
            desc: `缩小范围：<span class="highlight-red">right = ${mid} - 1 = ${right}</span>，新区间 <span class="highlight-text">[${left}, ${right}]</span>`
          });
        }
      }

      // Loop ends - not found
      steps.push({
        type: 'loop_check', array: [...arr], left, right, mid: -1, checking: -1, found: -1, eliminated: [...eliminated],
        highlightLine: 2,
        desc: `检查循环条件：<span class="highlight-text">left = ${left} > right = ${right}</span> ❌，查找区间为空`
      });
      const allEliminated = eliminated.map(() => true);
      steps.push({
        type: 'notfound', array: [...arr], left, right, mid: -1, checking: -1, found: -1, eliminated: allEliminated,
        highlightLine: 11,
        desc: `❌ <span class="highlight-red">未找到</span> 目标值 <span class="highlight-text">${target}</span>，返回 <span class="highlight-text">-1</span>`
      });
      return steps;
    }
  }
];

// ===========================
// State
// ===========================
let currentAlgoIdx = 0;
let currentStep = 0;
let steps = [];
let isRunning = false;
let currentTarget = 33;
let currentArray = [];

// ===========================
// Helper Functions
// ===========================
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function syntaxHighlight(line) {
  return line
    .replace(/\b(int|void|char|float|double|long|short|unsigned|struct|if|else|for|while|do|return|break|continue|sizeof|typedef|const|static)\b/g, '<span class="kw">$1</span>')
    .replace(/\b(\d+)\b/g, '<span class="num">$1</span>')
    .replace(/\/\/.*/g, '<span class="comment">$&</span>')
    .replace(/"(.*?)"/g, '<span class="str">"$1"</span>');
}

// ===========================
// Tab Switching
// ===========================
function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
  // Sync visualization
  if (steps.length > 0) {
    renderBothViews();
  }
}

// ===========================
// Data Management
// ===========================
function onSizeChange(val) {
  document.getElementById('size-display').textContent = val;
}

function randomizeData() {
  const size = parseInt(document.getElementById('size-slider').value);
  const algo = ALGOS[currentAlgoIdx];
  const arr = [];
  if (algo.shortName === 'binary') {
    // Generate sorted unique values
    const used = new Set();
    while (arr.length < size) {
      const v = Math.floor(Math.random() * 90) + 1;
      if (!used.has(v)) { used.add(v); arr.push(v); }
    }
    arr.sort((a, b) => a - b);
  } else {
    // Generate random unsorted values
    const used = new Set();
    while (arr.length < size) {
      const v = Math.floor(Math.random() * 90) + 1;
      if (!used.has(v)) { used.add(v); arr.push(v); }
    }
  }
  document.getElementById('data-input').value = arr.join(',');
  applyCustomData();
}

function applyCustomData() {
  const raw = document.getElementById('data-input').value;
  const nums = raw.split(/[,\s]+/).map(s => parseInt(s.trim())).filter(n => !isNaN(n));
  if (nums.length < 2) {
    document.getElementById('data-input').value = '5,18,33,7,42,9,15,27';
    return applyCustomData();
  }
  // Clamp values
  const arr = nums.map(v => Math.max(1, Math.min(999, v)));
  const algo = ALGOS[currentAlgoIdx];
  if (algo.shortName === 'binary') {
    arr.sort((a, b) => a - b);
  }
  document.getElementById('data-input').value = arr.join(',');
  document.getElementById('size-slider').value = arr.length;
  document.getElementById('size-display').textContent = arr.length;
  currentArray = arr;
  // Reset search
  resetSearch();
}

function getCurrentArray() {
  if (currentArray.length > 0) return currentArray;
  const algo = ALGOS[currentAlgoIdx];
  return [...algo.initialArray];
}

// ===========================
// Search Logic
// ===========================
function startSearch() {
  const target = parseInt(document.getElementById('target-input').value);
  if (isNaN(target)) return;
  currentTarget = target;
  const algo = ALGOS[currentAlgoIdx];
  const arr = getCurrentArray();
  steps = algo.generateSteps(arr, target);
  currentStep = 0;
  renderBothViews();
  updateStepButtons();
  document.getElementById('result-display-main').innerHTML = '';
}

function selectAlgo(idx) {
  currentAlgoIdx = idx;
  currentArray = [];
  document.querySelectorAll('.algo-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
  // Set default data based on algo
  const algo = ALGOS[idx];
  document.getElementById('data-input').value = algo.initialArray.join(',');
  document.getElementById('size-slider').value = algo.initialArray.length;
  document.getElementById('size-display').textContent = algo.initialArray.length;
  currentArray = [...algo.initialArray];
  resetSearch();
}

function resetSearch() {
  const algo = ALGOS[currentAlgoIdx];
  const arr = getCurrentArray();
  const target = parseInt(document.getElementById('target-input').value) || 33;
  currentTarget = target;
  steps = algo.generateSteps(arr, target);
  currentStep = 0;
  renderBothViews();
  updateStepButtons();
  document.getElementById('result-display-main').innerHTML = '';
}

function stepForward() {
  if (currentStep >= steps.length - 1) return;
  currentStep++;
  renderBothViews();
  updateStepButtons();
}

function runAll() {
  if (isRunning) return;
  isRunning = true;
  document.getElementById('step-btn').disabled = true;
  document.getElementById('run-btn').disabled = true;
  document.getElementById('step-btn-code').disabled = true;
  document.getElementById('run-btn-code').disabled = true;
  
  let i = currentStep;
  const interval = setInterval(() => {
    currentStep = i;
    renderBothViews();
    i++;
    if (i >= steps.length) {
      clearInterval(interval);
      isRunning = false;
      updateStepButtons();
    }
  }, 400);
}

function updateStepButtons() {
  const isLast = currentStep >= steps.length - 1;
  document.getElementById('step-btn').disabled = isLast || isRunning;
  document.getElementById('step-btn-code').disabled = isLast || isRunning;
  document.getElementById('run-btn').disabled = isRunning;
  document.getElementById('run-btn-code').disabled = isRunning;
}

// ===========================
// Rendering
// ===========================
function renderBothViews() {
  renderMainView();
  renderCodeView();
}

function renderMainView() {
  if (steps.length === 0) return;
  const step = steps[Math.min(currentStep, steps.length - 1)];
  renderArray('array-vis-main', step);
  document.getElementById('step-desc-main').innerHTML = step.desc;
  document.getElementById('step-counter').textContent = `步骤 ${currentStep + 1} / ${steps.length}`;
  renderStateInfo('state-info-main', step);
  renderResult('result-display-main', step);
}

function renderCodeView() {
  if (steps.length === 0) return;
  const step = steps[Math.min(currentStep, steps.length - 1)];
  renderArray('array-vis-code', step);
  document.getElementById('step-desc-code').innerHTML = step.desc;
  document.getElementById('step-counter-code').textContent = `步骤 ${currentStep + 1} / ${steps.length}`;
  renderStateInfo('state-info-code', step);
  renderCodeDisplay(step);
}

function renderArray(containerId, step) {
  const vis = document.getElementById(containerId);
  const arr = step.array;
  const maxVal = Math.max(...arr, 1);
  vis.innerHTML = '';

  arr.forEach((val, i) => {
    const bar = document.createElement('div');
    bar.className = 'array-bar';
    bar.title = `arr[${i}] = ${val}`;

    const rect = document.createElement('div');
    rect.className = 'bar-rect';
    const height = 24 + (val / maxVal) * 160;
    rect.style.height = height + 'px';

    // Determine bar state
    if (step.found === i) {
      rect.classList.add('found');
    } else if (step.checking === i) {
      rect.classList.add('checking');
    } else if (step.mid === i && step.found !== i) {
      rect.classList.add('mid');
    } else if (step.eliminated && step.eliminated[i]) {
      rect.classList.add('eliminated');
    }

    // Left/right boundary markers
    if (step.left !== undefined && step.right !== undefined) {
      if (i === step.left && i === step.right) {
        rect.classList.add('bound-lr');
      } else if (i === step.left) {
        rect.classList.add('bound-l');
      } else if (i === step.right) {
        rect.classList.add('bound-r');
      }
    }

    const valSpan = document.createElement('span');
    valSpan.className = 'bar-val';
    valSpan.textContent = val;
    rect.appendChild(valSpan);

    const idx = document.createElement('div');
    idx.className = 'bar-index';

    // Show left/right/mid markers
    let markers = [];
    if (step.left !== undefined && i === step.left) {
      markers.push('<span class="marker marker-l">L</span>');
    }
    if (step.right !== undefined && i === step.right) {
      markers.push('<span class="marker marker-r">R</span>');
    }
    if (step.mid === i) {
      markers.push('<span class="marker" style="color:var(--pink)">M</span>');
    }
    idx.innerHTML = `${i} ${markers.join(' ')}`;

    // Click to set target
    bar.addEventListener('click', () => {
      document.getElementById('target-input').value = val;
      startSearch();
    });

    bar.appendChild(rect);
    bar.appendChild(idx);
    vis.appendChild(bar);
  });
}

function renderStateInfo(containerId, step) {
  const info = document.getElementById(containerId);
  let html = '';
  if (step.left !== undefined) html += `<div class="state-item">L = <strong>${step.left}</strong></div>`;
  if (step.right !== undefined) html += `<div class="state-item">R = <strong>${step.right}</strong></div>`;
  if (step.mid !== undefined && step.mid >= 0) html += `<div class="state-item">M = <strong>${step.mid}</strong></div>`;
  if (step.checking >= 0) html += `<div class="state-item">检查下标 <strong>${step.checking}</strong></div>`;
  if (step.found >= 0) html += `<div class="state-item">✅ 下标 <strong>${step.found}</strong></div>`;
  info.innerHTML = html;
}

function renderResult(containerId, step) {
  const result = document.getElementById(containerId);
  if (step.found >= 0) {
    result.innerHTML = `<div class="result-badge found">✅ 找到！目标 ${currentTarget} 在下标 ${step.found}（arr[${step.found}] = ${step.array[step.found]}）</div>`;
  } else if (currentStep === steps.length - 1) {
    const lastStep = steps[steps.length - 1];
    if (lastStep.found === -1) {
      result.innerHTML = `<div class="result-badge not-found">❌ 未找到目标 ${currentTarget}</div>`;
    } else {
      result.innerHTML = '';
    }
  } else {
    result.innerHTML = '';
  }
}

function renderCodeDisplay(step) {
  const algo = ALGOS[currentAlgoIdx];
  const code = algo.code;
  const explanations = algo.explanations;
  const hlLine = step.highlightLine !== undefined ? step.highlightLine : 0;

  let html = '';
  code.forEach((line, i) => {
    let cls = 'code-line';
    if (i === hlLine) {
      if (step.type === 'found' || step.found >= 0) {
        cls += ' hl-found';
      } else if (step.type === 'calc_mid' || step.mid >= 0) {
        cls += ' hl-mid';
      } else if (step.type === 'comparing' || step.type === 'compare_eq' || step.type === 'compare_lt' || step.type === 'compare_gt') {
        cls += ' hl-compare';
      } else {
        cls += ' hl';
      }
    }

    const lineNum = String(i + 1).padStart(2);
    const highlighted = syntaxHighlight(escapeHtml(line));
    html += `<span class="${cls}"><span class="line-num">${lineNum}</span>${highlighted}</span>`;

    // Show explanation below the highlighted line
    if (i === hlLine && explanations[i]) {
      html += `<span class="code-explain">💡 ${explanations[i]}</span>`;
    }
  });

  document.getElementById('code-display').innerHTML = html;
  document.getElementById('code-line-indicator').textContent = `行 ${hlLine + 1}`;
  document.getElementById('code-explain-text').innerHTML = explanations[hlLine] || '—';
}

// ===========================
// Initialization
// ===========================
function init() {
  // Build algo selector
  const selector = document.getElementById('algo-selector');
  ALGOS.forEach((a, i) => {
    const btn = document.createElement('button');
    btn.className = 'algo-btn' + (i === 0 ? ' active' : '');
    btn.textContent = a.name;
    btn.onclick = () => selectAlgo(i);
    selector.appendChild(btn);
  });

  // Set initial data
  currentArray = [...ALGOS[0].initialArray];
  document.getElementById('data-input').value = currentArray.join(',');
  document.getElementById('size-slider').value = currentArray.length;
  document.getElementById('size-display').textContent = currentArray.length;

  // Generate initial steps
  const algo = ALGOS[0];
  steps = algo.generateSteps(currentArray, currentTarget);
  currentStep = 0;
  renderBothViews();
  updateStepButtons();
}

init();
</script>
