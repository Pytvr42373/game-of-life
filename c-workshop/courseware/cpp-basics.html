<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ 程序结构基础 — C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0b0d1a; --surface: #12142a; --surface2: #1a1d3a; --border: #2a2d5a;
    --accent: #6c5ce7; --accent2: #a29bfe; --green: #00e676; --cyan: #00e5ff;
    --orange: #ff9100; --pink: #ff4081; --red: #ff4757; --text: #e0e0ff; --text-dim: #7878aa;
  }

  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
  
  .top-bar { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; flex-wrap: wrap; }
  .back-btn { display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); text-decoration: none; font-size: 0.82rem; font-weight: 600; transition: all 0.2s; }
  .back-btn:hover { border-color: var(--accent); color: var(--text); }
  .back-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
  .top-bar h1 { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, var(--accent2), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .top-bar .sub { font-size: 0.78rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }

  .workspace { max-width: 1100px; margin: 0 auto; }

  .topic-nav { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
  .topic-btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
  .topic-btn:hover { border-color: var(--accent); }
  .topic-btn.active { border-color: var(--accent); background: rgba(108,92,231,0.15); }

  .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel-header { padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-header .label { font-size: 0.72rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
  .panel-body { padding: 20px; }

  .code-block { font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; line-height: 1.8; color: var(--text); white-space: pre; overflow-x: auto; letter-spacing: 0.5px; }
  .code-block .kw { color: var(--accent2); } .code-block .type { color: var(--cyan); }
  .code-block .num { color: var(--orange); } .code-block .str { color: var(--green); }
  .code-block .comment { color: var(--text-dim); font-style: italic; }
  .code-block .hl-yellow { background: rgba(255,215,0,0.12); border-radius: 3px; }
  .code-block .line-num { color: #3a3a6a; user-select: none; margin-right: 10px; }

  .step-area { margin-top: 16px; }
  .step-buttons { display: flex; gap: 8px; margin-bottom: 12px; }
  .step-btn { padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-family: 'Inter', sans-serif; font-size: 0.82rem; cursor: pointer; transition: all 0.2s; }
  .step-btn:hover { border-color: var(--accent); }
  .step-btn.primary { background: rgba(108,92,231,0.2); border-color: var(--accent); }
  .step-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .var-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem; }
  .var-table th { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text-dim); font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .var-table td { padding: 8px 12px; border-bottom: 1px solid rgba(42,45,90,0.5); font-family: 'JetBrains Mono', monospace; }
  .var-table .val { color: var(--orange); }

  .output-area { margin-top: 12px; padding: 14px; background: rgba(0,0,0,0.3); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--green); line-height: 1.6; min-height: 40px; }
  .output-area .line { display: block; }

  .step-info { margin-top: 10px; padding: 10px 14px; background: rgba(108,92,231,0.08); border-radius: 8px; font-size: 0.85rem; color: var(--accent2); font-family: 'Inter', sans-serif; line-height: 1.5; }

  .tip-box { padding: 14px 18px; background: rgba(255,215,0,0.06); border: 1px solid rgba(255,215,0,0.15); border-radius: 8px; margin-bottom: 14px; }
  .tip-box .tip-label { font-size: 0.72rem; font-weight: 700; color: #ffd700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .tip-box .tip-text { font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; }

  .danger-box { padding: 14px 18px; background: rgba(255,71,87,0.06); border: 1px solid rgba(255,71,87,0.15); border-radius: 8px; margin-bottom: 14px; }
  .danger-box .danger-label { font-size: 0.72rem; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .danger-box .danger-text { font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; }

  /* Interactive diagram */
  .flow-diagram { margin-top: 12px; padding: 16px; background: rgba(0,0,0,0.2); border-radius: 8px; }
  .flow-step { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding: 8px 12px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); transition: all 0.3s; }
  .flow-step .step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; flex-shrink: 0; }
  .flow-step .step-text { font-size: 0.82rem; color: var(--text); line-height: 1.5; }
  .flow-step .step-arrow { color: var(--text-dim); font-size: 0.7rem; margin-left: auto; }
  .flow-step.active { border-color: var(--accent); background: rgba(108,92,231,0.1); }
  .flow-step.done { border-color: var(--green); }
  .flow-step.done .step-num { background: var(--green); }
</style>
</head>
<body>

<div class="top-bar">
  <a href="../index.html" class="back-btn">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    返回
  </a>
  <h1>C++ 程序结构基础</h1>
  <span class="sub">#include · using namespace · main · 编译运行</span>
</div>

<div class="workspace">
  <div class="topic-nav" id="topic-nav"></div>

  <div class="main-grid">
    <div class="panel">
      <div class="panel-header">
        <span class="label">C++ 代码</span>
        <span class="action" style="cursor:default;background:transparent;color:var(--text-dim)">点击主题 → 单步执行</span>
      </div>
      <div class="panel-body">
        <div class="code-block" id="code-display"></div>
        <div class="step-area" id="step-area">
          <div class="step-buttons">
            <button class="step-btn primary" id="step-btn" onclick="stepOnce()">▶ 单步执行</button>
            <button class="step-btn" id="reset-btn" onclick="resetStep()">↺ 重置</button>
          </div>
          <div class="var-table-wrapper" id="var-table-wrapper"></div>
          <div class="output-area" id="output-area"><span class="line">点击"单步执行"逐步观察</span></div>
        </div>

    <div class="panel">
      <div class="panel-header">
        <span class="label">关键知识点</span>
      </div>
      <div class="panel-body" id="knowledge-panel">
        <div id="knowledge-content"></div>
      </div>
    </div>
  </div>
</div>

<script>
const TOPICS = [
  {
    name: 'Hello World 拆解',
    code: [
      '#include <iostream>     // ① 头文件',
      'using namespace std;    // ② 命名空间',
      '',
      'int main() {            // ③ 主函数',
      '    cout << "Hello!";   // ④ 输出',
      '    return 0;           // ⑤ 返回',
      '}'
    ],
    steps: [
      { line: 0, vars: {}, out: [], info: '① #include <iostream>：告诉编译器我们要用输入输出功能。iostream = input output stream' },
      { line: 1, vars: {}, out: [], info: '② using namespace std;：std 是标准库的"姓氏"，写上这句就不用每次写 std::cout' },
      { line: 2, vars: {}, out: [], info: '（空行，不影响程序）' },
      { line: 3, vars: {}, out: [], info: '③ int main() { ... }：程序从这里开始执行。int 表示 main 要返回一个整数' },
      { line: 4, vars: {}, out: ['Hello!'], info: '④ cout << "Hello!";：把"Hello!"输出到屏幕。<< 像管道一样把数据送出去' },
      { line: 5, vars: {}, out: ['Hello!'], info: '⑤ return 0;：告诉操作系统"程序正常结束"。0 表示成功' },
      { line: 6, vars: {}, out: ['Hello!'], info: '} 程序结束' }
    ],
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 程序骨架</div>
        <div class="tip-text">
          每个 C++ 程序都有这 5 个部分：<br><br>
          <strong>① #include</strong> — 引入头文件，像 Python 的 import<br>
          <strong>② using namespace</strong> — 简化写法，避免每次写 std::<br>
          <strong>③ int main()</strong> — 程序入口，必须要有<br>
          <strong>④ 语句</strong> — 实际要执行的代码<br>
          <strong>⑤ return 0</strong> — 告诉系统"正常结束"
        </div>
      </div>
      <div class="danger-box">
        <div class="danger-label">⚠️ 常见错误</div>
        <div class="danger-text">
          <strong>1. 漏了分号 ;</strong> — C++ 每条语句末尾必须有分号！<br>
          <strong>2. main 写错</strong> — 写成 mian、Man 都不行<br>
          <strong>3. 括号不匹配</strong> — { 和 } 要成对出现
        </div>
      </div>
    `
  },
  {
    name: '#include 是什么',
    code: [
      '#include <iostream>   // 输入输出',
      '#include <cmath>       // 数学函数',
      '#include <string>     // 字符串',
      '#include <algorithm>  // 算法',
      '',
      'int main() {',
      '    // sqrt 来自 <cmath>',
      '    double r = sqrt(16.0);',
      '    cout << r << endl;',
      '    return 0;',
      '}'
    ],
    steps: [
      { line: 0, vars: {}, out: [], info: '#include <iostream>：引入输入输出功能（cin/cout）' },
      { line: 1, vars: {}, out: [], info: '#include <cmath>：引入数学函数（sqrt、pow、sin 等）' },
      { line: 2, vars: {}, out: [], info: '#include <string>：引入字符串类型' },
      { line: 3, vars: {}, out: [], info: '#include <algorithm>：引入算法函数（sort、max、min 等）' },
      { line: 4, vars: {}, out: [], info: '（空行）' },
      { line: 5, vars: {}, out: [], info: '进入 main 函数' },
      { line: 6, vars: {}, out: [], info: 'sqrt 是 <cmath> 提供的开平方函数' },
      { line: 7, vars: { r: { v: 4, c: 'green' } }, out: [], info: 'sqrt(16.0) = 4.0，存在 r 里' },
      { line: 8, vars: { r: { v: 4 } }, out: ['4'], info: '输出 4' },
      { line: 9, vars: {}, out: ['4'] }
    ],
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 #include 就像 Python 的 import</div>
        <div class="tip-text">
          <strong>#include <头文件></strong> 告诉编译器：我要用这个库里的功能。<br><br>
          <strong>常用头文件：</strong><br>
          &lt;iostream&gt; — cin/cout 输入输出<br>
          &lt;cmath&gt; — sqrt、pow、abs 等数学函数<br>
          &lt;string&gt; — 字符串类型<br>
          &lt;algorithm&gt; — sort、max、min 等算法<br>
          &lt;vector&gt; — 动态数组<br><br>
          <strong>竞赛偷懒写法：</strong><br>
          #include &lt;bits/stdc++.h&gt;  // 一次包含所有头文件<br>
          但正式比赛不推荐，编译慢。
        </div>
      </div>
    `
  },
  {
    name: 'using namespace std',
    code: [
      '#include <iostream>',
      '',
      '// 写法一：不用 using',
      'int main1() {',
      '    std::cout << "A";',
      '    return 0;',
      '}',
      '',
      '// 写法二：用 using',
      'using namespace std;',
      'int main2() {',
      '    cout << "B";',
      '    return 0;',
      '}'
    ],
    steps: [
      { line: 0, vars: {}, out: [], info: '先看写法一：没有 using namespace std' },
      { line: 1, vars: {}, out: [], info: '' },
      { line: 2, vars: {}, out: [], info: '写法一：不用 using' },
      { line: 3, vars: {}, out: [], info: '进入 main1' },
      { line: 4, vars: {}, out: ['A'], info: '必须写 std::cout，告诉编译器 cout 在 std 这个命名空间里' },
      { line: 5, vars: {}, out: ['A'] },
      { line: 6, vars: {}, out: ['A'] },
      { line: 7, vars: {}, out: ['A'], info: '' },
      { line: 8, vars: {}, out: ['A'], info: '写法二：用了 using namespace std;' },
      { line: 9, vars: {}, out: ['A'], info: 'using namespace std; 写在全局位置' },
      { line: 10, vars: {}, out: ['A'], info: '进入 main2' },
      { line: 11, vars: {}, out: ['A', 'B'], info: '直接写 cout 就行，不用加 std::' },
      { line: 12, vars: {}, out: ['A', 'B'] }
    ],
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 命名空间是什么</div>
        <div class="tip-text">
          <strong>namespace（命名空间）</strong> 就像"姓氏"。<br><br>
          C++ 标准库的所有功能都放在 <strong>std</strong> 这个命名空间里。<br>
          就像一家人姓"张"——张伟、张强。<br><br>
          <strong>不写 using：</strong> std::cout（全名）<br>
          <strong>写了 using：</strong> cout（小名）<br><br>
          竞赛中通常写 using namespace std; 省事。<br>
          大型项目中不推荐，可能引起名字冲突。
        </div>
      </div>
    `
  },
  {
    name: '编译运行流程',
    code: [
      '// 源文件: hello.cpp',
      '#include <iostream>',
      'using namespace std;',
      'int main() {',
      '    cout << "Hello!";',
      '    return 0;',
      '}',
      '',
      '// 编译命令:',
      '// g++ hello.cpp -o hello',
      '// 运行命令:',
      '// ./hello'
    ],
    steps: [
      { line: 0, vars: {}, out: [], info: '这是我们的 C++ 源文件 hello.cpp' },
      { line: 1, vars: {}, out: [], info: '#include <iostream> — 告诉编译器需要输入输出功能' },
      { line: 2, vars: {}, out: [], info: 'using namespace std; — 简化写法' },
      { line: 3, vars: {}, out: [], info: 'int main() — 程序入口' },
      { line: 4, vars: {}, out: ['Hello!'], info: '输出 Hello!' },
      { line: 5, vars: {}, out: ['Hello!'], info: 'return 0 — 正常结束' },
      { line: 6, vars: {}, out: ['Hello!'] },
      { line: 7, vars: {}, out: ['Hello!'], info: '' },
      { line: 8, vars: {}, out: ['Hello!'], info: '编译：g++ hello.cpp -o hello' },
      { line: 9, vars: {}, out: ['Hello!'], info: 'g++ 是编译器，把 .cpp 变成可执行文件' },
      { line: 10, vars: {}, out: ['Hello!'], info: '运行：./hello' },
      { line: 11, vars: {}, out: ['Hello!'], info: './hello 执行编译好的程序，输出结果' }
    ],
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 编译 vs 运行</div>
        <div class="tip-text">
          <strong>Python 是解释执行：</strong> 直接跑源码<br>
          python hello.py<br><br>
          <strong>C++ 是编译执行：</strong> 先编译，再运行<br>
          g++ hello.cpp -o hello  → 编译（生成可执行文件）<br>
          ./hello  → 运行<br><br>
          <strong>编译的步骤：</strong><br>
          ① 预处理（处理 #include 等）<br>
          ② 编译（变成汇编代码）<br>
          ③ 汇编（变成机器码）<br>
          ④ 链接（拼成可执行文件）<br><br>
          <strong>竞赛环境：</strong><br>
          在线评测系统（OJ）自动帮你编译运行，<br>
          你只需要提交 .cpp 源码。
        </div>
      </div>
      <div class="danger-box">
        <div class="danger-label">⚠️ 编译错误 vs 运行错误</div>
        <div class="danger-text">
          <strong>编译错误：</strong>语法有问题，编译器报错，不生成可执行文件<br>
          比如漏了分号、拼错关键字<br><br>
          <strong>运行错误：</strong>编译通过，但运行时崩溃<br>
          比如除以 0、数组越界
        </div>
      </div>
    `
  }
];

let currentIdx = 0;
let stepIdx = 0;

function getCodeHTML(code) {
  return code.map((line, i) => {
    let hl = line;
    // Escape angle brackets first so <iostream> doesn't become an HTML tag
    hl = hl.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // Strings FIRST — before keyword/comment/number spans introduce quoted text
    hl = hl.replace(/"([^"]*)"/g, '<span class="str">"$1"</span>');
    hl = hl.replace(/\/\/.*/g, '<span class="comment">$&</span>');
    hl = hl.replace(/\b(int|double|float|char|string|bool|void|long|auto|for|while|do|if|else|return|break|continue|cout|cin|endl|main|using|namespace|include|true|false)\b/g, '<span class="kw">$1</span>');
    hl = hl.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
    hl = hl.replace(/&lt;(\w+)&gt;/g, '<span class="str">&lt;$1&gt;</span>');
    const cls = (stepIdx > 0 && i === TOPICS[currentIdx].steps[stepIdx]?.line) ? ' hl-yellow' : '';
    return `<div class="${cls}"><span class="line-num">${String(i+1).padStart(2)}</span>${hl}</div>`;
  }).join('');
}

function renderVars(vars) {
  const keys = Object.keys(vars);
  if (keys.length === 0) return '<div style="color:var(--text-dim);font-size:0.85rem;font-family:\'JetBrains Mono\',monospace">（无变量）</div>';
  let html = '<table class="var-table"><tr><th>变量</th><th>值</th></tr>';
  keys.forEach(k => {
    const v = vars[k];
    const color = v.c || '';
    const colorMap = { cyan: 'var(--cyan)', green: 'var(--green)', orange: 'var(--orange)', red: 'var(--red)' };
    const style = color ? `color:${colorMap[color] || 'var(--text)'}` : '';
    html += `<tr><td style="color:var(--text-dim)">${k}</td><td class="val" style="${style}">${v.v}</td></tr>`;
  });
  html += '</table>';
  return html;
}

function renderStep() {
  const ex = TOPICS[currentIdx];
  const step = ex.steps[stepIdx];
  
  document.getElementById('code-display').innerHTML = getCodeHTML(ex.code);
  document.getElementById('var-table-wrapper').innerHTML = renderVars(step.vars);
  
  const outEl = document.getElementById('output-area');
  if (step.out.length > 0) {
    outEl.innerHTML = step.out.map(l => `<span class="line">${escapeHtml(l)}</span>`).join('');
  }
  
  const existing = document.querySelector('.step-info');
  if (existing) existing.remove();
  
  if (step.info) {
    const infoEl = document.createElement('div');
    infoEl.className = 'step-info';
    infoEl.textContent = step.info;
    outEl.after(infoEl);
  }
  
  document.getElementById('step-btn').disabled = stepIdx >= ex.steps.length - 1;
}

function stepOnce() {
  const ex = TOPICS[currentIdx];
  if (stepIdx < ex.steps.length - 1) {
    stepIdx++;
    renderStep();
  }
}

function resetStep() {
  stepIdx = 0;
  const ex = TOPICS[currentIdx];
  const outEl = document.getElementById('output-area');
  outEl.innerHTML = '<span class="line">点击"单步执行"逐步观察</span>';
  const infoEl = document.querySelector('.step-info');
  if (infoEl) infoEl.remove();
  document.getElementById('var-table-wrapper').innerHTML = '';
  document.getElementById('step-btn').disabled = false;
  document.getElementById('code-display').innerHTML = getCodeHTML(ex.code);
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function selectTopic(idx) {
  currentIdx = idx;
  stepIdx = 0;
  const ex = TOPICS[idx];
  
  document.querySelectorAll('.topic-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
  document.getElementById('code-display').innerHTML = getCodeHTML(ex.code);
  document.getElementById('var-table-wrapper').innerHTML = '';
  document.getElementById('step-btn').disabled = false;
  
  const outEl = document.getElementById('output-area');
  outEl.innerHTML = '<span class="line">点击"单步执行"逐步观察</span>';
  const infoEl = document.querySelector('.step-info');
  if (infoEl) infoEl.remove();
  
  document.getElementById('knowledge-content').innerHTML = ex.knowledge;
}

function init() {
  const nav = document.getElementById('topic-nav');
  TOPICS.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'topic-btn' + (i === 0 ? ' active' : '');
    btn.textContent = t.name;
    btn.onclick = () => selectTopic(i);
    nav.appendChild(btn);
  });
  selectTopic(0);
}

init();
</script>
</body>
