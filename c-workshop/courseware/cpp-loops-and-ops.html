<script>
const EXAMPLES = [
  {
    name: 'i++ 与 ++i 的区别',
    code: [
      '#include <iostream>',
      'using namespace std;',
      'int main() {',
      '    int a = 5, b = 5;',
      '    // 后置++: 先使用，再加',
      '    int x = a++;  // x=5, a=6',
      '    // 前置++: 先加，再使用',
      '    int y = ++b;  // b=6, y=6',
      '    cout << x << " " << a << endl;',
      '    cout << y << " " << b << endl;',
      '    return 0;',
      '}'
    ],
    steps: [
      { line: 0, vars: {}, out: [] },
      { line: 1, vars: {}, out: [] },
      { line: 2, vars: {}, out: [] },
      { line: 3, vars: { a: { v: 5, c: 'cyan' }, b: { v: 5, c: 'cyan' } }, out: [], info: 'a=5, b=5 初始化' },
      { line: 4, vars: { a: { v: 5, c: 'cyan' }, b: { v: 5, c: 'cyan' } }, out: [], info: '后置++: 先取 a 的值，再让 a 加 1' },
      { line: 5, vars: { a: { v: 6, c: 'orange' }, b: { v: 5, c: 'cyan' }, x: { v: 5, c: 'green' } }, out: [], info: 'a++ 返回旧值5 → x=5, a变为6' },
      { line: 6, vars: { a: { v: 6, c: 'cyan' }, b: { v: 5, c: 'cyan' }, x: { v: 5, c: 'green' } }, out: [], info: '前置++: 先让 b 加 1，再取新值' },
      { line: 7, vars: { a: { v: 6, c: 'cyan' }, b: { v: 6, c: 'orange' }, x: { v: 5, c: 'green' }, y: { v: 6, c: 'green' } }, out: [], info: '++b 先加→b=6, 返回新值6→y=6' },
      { line: 8, vars: { a: { v: 6 }, b: { v: 6 }, x: { v: 5 }, y: { v: 6 } }, out: ['5 6'] },
      { line: 9, vars: { a: { v: 6 }, b: { v: 6 }, x: { v: 5 }, y: { v: 6 } }, out: ['5 6', '6 6'] },
      { line: 10, vars: {}, out: ['5 6', '6 6'] }
    ],
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 核心区别</div>
        <div class="tip-text">
          <strong>i++（后置）</strong>：先取 i 的值参与表达式，再让 i 加 1<br><br>
          <strong>++i（前置）</strong>：先让 i 加 1，再取新值参与表达式<br><br>
          在 for 循环中 i++ 和 ++i 效果一样（因为自增是独立语句）。<br>
          但在赋值表达式里完全不同，如上例所示。
        </div>
      </div>
      <div class="danger-box">
        <div class="danger-label">⚠️ 常见陷阱</div>
        <div class="danger-text">
          <strong>不要写这样的代码：</strong><br>
          int i = 0;<br>
          i = i++;  // 未定义行为！不同编译器结果不同<br><br>
          一条语句中多次修改同一个变量会导致未定义行为。
        </div>
      </div>
    `
  },
  {
    name: 'for 循环执行流程',
    code: [
      '#include <iostream>',
      'using namespace std;',
      'int main() {',
      '    int sum = 0;',
      '    // for(初始化; 条件; 更新)',
      '    for (int i = 1; i <= 3; i++) {',
      '        sum += i;',
      '    }',
      '    // 循环结束后 i 已销毁',
      '    cout << sum << endl;',
      '    return 0;',
      '}'
    ],
    steps: [
      { line: 0, vars: {}, out: [] },
      { line: 1, vars: {}, out: [] },
      { line: 2, vars: {}, out: [] },
      { line: 3, vars: { sum: { v: 0, c: 'cyan' } }, out: [], info: 'sum 初始化为 0' },
      { line: 4, vars: { sum: { v: 0, c: 'cyan' } }, out: [], info: '【第1轮】初始化: int i = 1' },
      { line: 5, vars: { i: { v: 1, c: 'green' }, sum: { v: 0, c: 'cyan' } }, out: [], info: '【第1轮】条件检查: i=1, 1<=3 成立 → 进入循环体' },
      { line: 6, vars: { i: { v: 1, c: 'green' }, sum: { v: 1, c: 'orange' } }, out: [], info: '【第1轮】sum += i → sum = 0 + 1 = 1' },
      { line: 4, vars: { i: { v: 1, c: 'green' }, sum: { v: 1, c: 'cyan' } }, out: [], info: '【第1轮】更新: i++ → i 变为 2' },
      { line: 5, vars: { i: { v: 2, c: 'green' }, sum: { v: 1, c: 'cyan' } }, out: [], info: '【第2轮】条件检查: i=2, 2<=3 成立 → 进入循环体' },
      { line: 6, vars: { i: { v: 2, c: 'green' }, sum: { v: 3, c: 'orange' } }, out: [], info: '【第2轮】sum += i → sum = 1 + 2 = 3' },
      { line: 4, vars: { i: { v: 2, c: 'green' }, sum: { v: 3, c: 'cyan' } }, out: [], info: '【第2轮】更新: i++ → i 变为 3' },
      { line: 5, vars: { i: { v: 3, c: 'green' }, sum: { v: 3, c: 'cyan' } }, out: [], info: '【第3轮】条件检查: i=3, 3<=3 成立 → 进入循环体' },
      { line: 6, vars: { i: { v: 3, c: 'green' }, sum: { v: 6, c: 'orange' } }, out: [], info: '【第3轮】sum += i → sum = 3 + 3 = 6' },
      { line: 4, vars: { i: { v: 3, c: 'green' }, sum: { v: 6, c: 'cyan' } }, out: [], info: '【第3轮】更新: i++ → i 变为 4' },
      { line: 5, vars: { i: { v: 4, c: 'green' }, sum: { v: 6, c: 'cyan' } }, out: [], info: '【第4轮】条件检查: i=4, 4<=3 不成立 → 退出循环' },
      { line: 8, vars: { sum: { v: 6, c: 'cyan' } }, out: [], info: '循环结束，i 已销毁（作用域在 for 内）' },
      { line: 9, vars: { sum: { v: 6 } }, out: ['6'] },
      { line: 10, vars: {}, out: ['6'] }
    ],
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 for 循环执行顺序</div>
        <div class="tip-text">
          <strong>for(A; B; C) { D }</strong> 的执行顺序：<br>
          ① <strong>A</strong>（初始化，只执行一次）<br>
          ② <strong>B</strong>（条件判断，true 进循环，false 退出）<br>
          ③ <strong>D</strong>（循环体）<br>
          ④ <strong>C</strong>（更新语句）→ 回到 ②<br><br>
          <strong>C++11 起</strong>：for 中声明的变量（如 int i）只在循环内有效，<br>
          循环结束后 i 就销毁了，外部无法访问。
        </div>
      </div>
      <div class="danger-box">
        <div class="danger-label">⚠️ 死循环风险</div>
        <div class="danger-text">
          for(;;) 是无限循环，等价于 while(true)。<br>
          忘记写更新语句（C）也会导致死循环。<br>
          条件写反（如 i <= 0 而不是 i >= 0）会导致一次都不执行。
        </div>
      </div>
    `
  },
  {
    name: 'while 与 do-while',
    code: [
      '#include <iostream>',
      'using namespace std;',
      'int main() {',
      '    int n = 5;',
      '    // while: 先判断，再执行',
      '    while (n > 0) {',
      '        cout << n << " ";',
      '        n--;',
      '    }',
      '    cout << endl;',
      '    // do-while: 先执行，再判断',
      '    int m = 0;',
      '    do {',
      '        cout << "执行了!";',
      '    } while (m > 0);',
      '    // 即使条件不成立也执行了一次',
      '    return 0;',
      '}'
    ],
    steps: [
      { line: 0, vars: {}, out: [] },
      { line: 1, vars: {}, out: [] },
      { line: 2, vars: {}, out: [] },
      { line: 3, vars: { n: { v: 5, c: 'cyan' } }, out: [], info: 'n = 5' },
      { line: 4, vars: { n: { v: 5, c: 'cyan' } }, out: [], info: 'while 循环：先判断条件' },
      { line: 5, vars: { n: { v: 5, c: 'cyan' } }, out: [], info: 'n=5, 5>0 成立 → 进入循环体' },
      { line: 6, vars: { n: { v: 5, c: 'cyan' } }, out: ['5 '], info: '输出 5' },
      { line: 7, vars: { n: { v: 4, c: 'orange' } }, out: ['5 '], info: 'n-- → n 变为 4' },
      { line: 5, vars: { n: { v: 4, c: 'cyan' } }, out: ['5 '], info: 'n=4, 4>0 成立 → 继续' },
      { line: 6, vars: { n: { v: 4, c: 'cyan' } }, out: ['5 4 '], info: '输出 4' },
      { line: 7, vars: { n: { v: 3, c: 'orange' } }, out: ['5 4 '], info: 'n-- → n 变为 3' },
      { line: 5, vars: { n: { v: 3, c: 'cyan' } }, out: ['5 4 '], info: 'n=3, 3>0 成立' },
      { line: 6, vars: { n: { v: 3, c: 'cyan' } }, out: ['5 4 3 '], info: '输出 3' },
      { line: 7, vars: { n: { v: 2, c: 'orange' } }, out: ['5 4 3 '], info: 'n-- → n 变为 2' },
      { line: 5, vars: { n: { v: 2, c: 'cyan' } }, out: ['5 4 3 '], info: 'n=2, 2>0 成立' },
      { line: 6, vars: { n: { v: 2, c: 'cyan' } }, out: ['5 4 3 2 '], info: '输出 2' },
      { line: 7, vars: { n: { v: 1, c: 'orange' } }, out: ['5 4 3 2 '], info: 'n-- → n 变为 1' },
      { line: 5, vars: { n: { v: 1, c: 'cyan' } }, out: ['5 4 3 2 '], info: 'n=1, 1>0 成立' },
      { line: 6, vars: { n: { v: 1, c: 'cyan' } }, out: ['5 4 3 2 1 '], info: '输出 1' },
      { line: 7, vars: { n: { v: 0, c: 'orange' } }, out: ['5 4 3 2 1 '], info: 'n-- → n 变为 0' },
      { line: 5, vars: { n: { v: 0, c: 'cyan' } }, out: ['5 4 3 2 1 '], info: 'n=0, 0>0 不成立 → 退出 while' },
      { line: 9, vars: { n: { v: 0 } }, out: ['5 4 3 2 1', ''], info: '输出换行' },
      { line: 10, vars: { n: { v: 0 }, m: { v: 0, c: 'cyan' } }, out: ['5 4 3 2 1', ''], info: '现在看 do-while：m = 0' },
      { line: 11, vars: { n: { v: 0 }, m: { v: 0, c: 'cyan' } }, out: ['5 4 3 2 1', ''], info: 'do-while：先执行循环体一次！' },
      { line: 12, vars: { n: { v: 0 }, m: { v: 0, c: 'cyan' } }, out: ['5 4 3 2 1', '执行了!'], info: '即使 m=0，也输出了"执行了!"' },
      { line: 13, vars: { n: { v: 0 }, m: { v: 0, c: 'cyan' } }, out: ['5 4 3 2 1', '执行了!'], info: '判断条件: m=0, 0>0 不成立 → 退出' },
      { line: 15, vars: {}, out: ['5 4 3 2 1', '执行了!'], info: 'do-while 保证循环体至少执行一次' }
    ],
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 while vs do-while</div>
        <div class="tip-text">
          <strong>while(条件) { }</strong>：先判断，条件为 false 则一次都不执行<br><br>
          <strong>do { } while(条件);</strong>：先执行一次，再判断<br><br>
          <strong>注意：</strong>do-while 末尾有 <strong>分号 ;</strong>，容易漏写！<br><br>
          应用场景：需要"至少执行一次"时用 do-while，<br>
          比如菜单显示、输入验证等。
        </div>
      </div>
      <div class="danger-box">
        <div class="danger-label">⚠️ while 常见错误</div>
        <div class="danger-text">
          <strong>1. 忘记更新条件变量</strong> → 死循环<br>
          int i = 0; while (i < 10) { } // 没写 i++<br><br>
          <strong>2. 多写分号</strong> → 循环体为空<br>
          while (i < 10); { i++; } // 分号结束了循环！<br><br>
          <strong>3. 条件写反</strong> → 一次都不执行
        </div>
      </div>
    `
  },
  {
    name: 'break 与 continue',
    code: [
      '#include <iostream>',
      'using namespace std;',
      'int main() {',
      '    for (int i = 1; i <= 5; i++) {',
      '        if (i == 3) {',
      '            continue;  // 跳过本次',
      '        }',
      '        if (i == 5) {',
      '            break;     // 终止循环',
      '        }',
      '        cout << i << " ";',
      '    }',
      '    // 输出: 1 2 4',
      '    return 0;',
      '}'
    ],
    steps: [
      { line: 0, vars: {}, out: [] },
      { line: 1, vars: {}, out: [] },
      { line: 2, vars: {}, out: [] },
      { line: 3, vars: {}, out: [], info: 'i=1, 1<=5成立' },
      { line: 4, vars: { i: { v: 1, c: 'green' } }, out: [], info: 'i=1, 1==3? 不成立' },
      { line: 7, vars: { i: { v: 1, c: 'green' } }, out: [], info: 'i=1, 1==5? 不成立' },
      { line: 10, vars: { i: { v: 1, c: 'green' } }, out: ['1 '], info: '输出 1' },
      { line: 3, vars: { i: { v: 2, c: 'green' } }, out: ['1 '], info: 'i++ → i=2, 2<=5成立' },
      { line: 4, vars: { i: { v: 2, c: 'green' } }, out: ['1 '], info: 'i=2, 2==3? 不成立' },
      { line: 7, vars: { i: { v: 2, c: 'green' } }, out: ['1 '], info: 'i=2, 2==5? 不成立' },
      { line: 10, vars: { i: { v: 2, c: 'green' } }, out: ['1 2 '], info: '输出 2' },
      { line: 3, vars: { i: { v: 3, c: 'green' } }, out: ['1 2 '], info: 'i++ → i=3, 3<=5成立' },
      { line: 4, vars: { i: { v: 3, c: 'green' } }, out: ['1 2 '], info: 'i=3, 3==3 成立！' },
      { line: 5, vars: { i: { v: 3, c: 'green' } }, out: ['1 2 '], info: 'continue 触发！跳过本次循环剩余部分' },
      { line: 3, vars: { i: { v: 4, c: 'green' } }, out: ['1 2 '], info: '直接跳到更新: i++ → i=4, 4<=5成立' },
      { line: 4, vars: { i: { v: 4, c: 'green' } }, out: ['1 2 '], info: 'i=4, 4==3? 不成立' },
      { line: 7, vars: { i: { v: 4, c: 'green' } }, out: ['1 2 '], info: 'i=4, 4==5? 不成立' },
      { line: 10, vars: { i: { v: 4, c: 'green' } }, out: ['1 2 4 '], info: '输出 4' },
      { line: 3, vars: { i: { v: 5, c: 'green' } }, out: ['1 2 4 '], info: 'i++ → i=5, 5<=5成立' },
      { line: 4, vars: { i: { v: 5, c: 'green' } }, out: ['1 2 4 '], info: 'i=5, 5==3? 不成立' },
      { line: 7, vars: { i: { v: 5, c: 'green' } }, out: ['1 2 4 '], info: 'i=5, 5==5 成立！' },
      { line: 8, vars: { i: { v: 5, c: 'green' } }, out: ['1 2 4 '], info: 'break 触发！立即终止整个循环' },
      { line: 14, vars: {}, out: ['1 2 4 '], info: '循环结束，输出: 1 2 4（跳过了3，到5就停了）' }
    ],
    knowledge: `
      <div class="tip-box" style="margin-top:0">
        <div class="tip-label">📌 break vs continue</div>
        <div class="tip-text">
          <strong>break</strong>：跳出整个循环，不再执行后续任何轮次<br><br>
          <strong>continue</strong>：跳过<strong>本轮</strong>剩余代码，进入下一轮<br><br>
          <strong>注意：</strong><br>
          - continue 后，for 循环会执行"更新"部分再判断条件<br>
          - while 循环中 continue 要小心！如果更新写在 continue 后面，<br>
          会导致死循环（因为条件变量没更新）
        </div>
      </div>
      <div class="danger-box">
        <div class="danger-label">⚠️ while 中 continue 的陷阱</div>
        <div class="danger-text">
          <strong>错误写法：</strong><br>
          int i = 0; while (i < 10) {<br>
          &nbsp;&nbsp;if (i == 5) continue;  // 死循环！<br>
          &nbsp;&nbsp;i++;<br>
          }<br><br>
          i=5 时 continue 跳过 i++，i 永远等于 5！<br>
          <strong>修正：</strong>把 i++ 写在 continue 前面，或用 for 循环
        </div>
      </div>
    `
  }
];

let currentIdx = 0;
let stepIdx = 0;

function getCodeHTML(code) {
  return code.map((line, i) => {
    let hl = line;
    hl = hl.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    hl = hl.replace(/\b(int|double|float|char|string|bool|void|long|auto|for|while|do|if|else|return|break|continue|cout|cin|endl|main|using|namespace|include)\b/g, '<span class="kw">$1</span>');
    hl = hl.replace(/\/\/.*/g, '<span class="comment">$&</span>');
    hl = hl.replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
    hl = hl.replace(/"([^"]*)"/g, '<span class="str">"$1"</span>');
    const cls = (stepIdx > 0 && i === EXAMPLES[currentIdx].steps[stepIdx]?.line) ? ' hl-yellow' : '';
    return `<div class="${cls}"><span class="line-num">${String(i+1).padStart(2)}</span>${hl}</div>`;
  }).join('');
}

function renderVars(vars) {
  const keys = Object.keys(vars);
  if (keys.length === 0) return '<div style="color:var(--text-dim);font-size:0.85rem;font-family:\'JetBrains Mono\',monospace">（无变量）</div>';
  
  let html = '<table class="var-table"><tr><th>变量</th><th>值</th></tr>';
  keys.forEach(k => {
    const v = vars[k];
    const color = v.c || '';
    const colorMap = { cyan: 'var(--cyan)', green: 'var(--green)', orange: 'var(--orange)', red: 'var(--red)' };
    const style = color ? `color:${colorMap[color] || 'var(--text)'}` : '';
    html += `<tr><td style="color:var(--text-dim)">${k}</td><td class="val" style="${style}">${v.v}</td></tr>`;
  });
  html += '</table>';
  return html;
}

function renderStep() {
  const ex = EXAMPLES[currentIdx];
  const step = ex.steps[stepIdx];
  
  document.getElementById('code-display').innerHTML = getCodeHTML(ex.code);
  document.getElementById('var-table-wrapper').innerHTML = renderVars(step.vars);
  
  const outEl = document.getElementById('output-area');
  if (step.out.length > 0) {
    outEl.innerHTML = step.out.map((l, i) => 
      `<span class="line">${escapeHtml(l)}</span>`
    ).join('');
  }
  
  const existing = document.querySelector('.step-info');
  if (existing) existing.remove();
  
  if (step.info) {
    const infoEl = document.createElement('div');
    infoEl.className = 'step-info';
    infoEl.textContent = step.info;
    outEl.after(infoEl);
  }
  
  document.getElementById('step-btn').disabled = stepIdx >= ex.steps.length - 1;
}

function stepOnce() {
  const ex = EXAMPLES[currentIdx];
  if (stepIdx < ex.steps.length - 1) {
    stepIdx++;
    renderStep();
  }
}

function resetStep() {
  stepIdx = 0;
  const ex = EXAMPLES[currentIdx];
  const outEl = document.getElementById('output-area');
  outEl.innerHTML = '<span class="line">点击"单步执行"逐步观察</span>';
  const infoEl = document.querySelector('.step-info');
  if (infoEl) infoEl.remove();
  document.getElementById('var-table-wrapper').innerHTML = '';
  document.getElementById('step-btn').disabled = false;
  document.getElementById('code-display').innerHTML = getCodeHTML(ex.code);
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function selectExample(idx) {
  currentIdx = idx;
  stepIdx = 0;
  const ex = EXAMPLES[idx];
  
  document.querySelectorAll('.example-btn').forEach((btn, i) => btn.classList.toggle('active', i === idx));
  document.getElementById('code-display').innerHTML = getCodeHTML(ex.code);
  document.getElementById('var-table-wrapper').innerHTML = '';
  document.getElementById('step-btn').disabled = false;
  
  const outEl = document.getElementById('output-area');
  outEl.innerHTML = '<span class="line">点击"单步执行"逐步观察</span>';
  const infoEl = document.querySelector('.step-info');
  if (infoEl) infoEl.remove();
  
  document.getElementById('knowledge-content').innerHTML = ex.knowledge;
}

function init() {
  const selector = document.getElementById('example-selector');
  EXAMPLES.forEach((ex, i) => {
    const btn = document.createElement('button');
    btn.className = 'example-btn' + (i === 0 ? ' active' : '');
    btn.textContent = ex.name;
    btn.onclick = () => selectExample(i);
    selector.appendChild(btn);
  });
  selectExample(0);
}

init();
</script>
</body>
