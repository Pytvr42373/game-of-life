<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C 语言交互实验室</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0b0d1a;
    --surface: #12142a;
    --surface2: #1a1d3a;
    --border: #2a2d5a;
    --accent: #6c5ce7;
    --accent2: #a29bfe;
    --green: #00e676;
    --cyan: #00e5ff;
    --orange: #ff9100;
    --pink: #ff4081;
    --text: #e0e0ff;
    --text-dim: #7878aa;
    --card-shadow: rgba(108, 92, 231, 0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 20% 50%, rgba(108,92,231,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0,230,118,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(0,229,255,0.04) 0%, transparent 50%);
    z-index: -1;
    animation: bgShift 20s ease-in-out infinite alternate;
  }

  @keyframes bgShift {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(-2%, -1%) rotate(3deg); }
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* Header */
  header {
    text-align: center;
    margin-bottom: 60px;
    position: relative;
  }

  .badge {
    display: inline-block;
    padding: 6px 16px;
    border-radius: 20px;
    background: rgba(108, 92, 231, 0.15);
    border: 1px solid rgba(108, 92, 231, 0.3);
    font-size: 0.75rem;
    color: var(--accent2);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  h1 {
    font-size: 3rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent2), var(--green), var(--cyan));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
    margin-bottom: 12px;
  }

  .subtitle {
    font-size: 1.05rem;
    color: var(--text-dim);
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.7;
  }

  .subtitle strong {
    color: var(--accent2);
    -webkit-text-fill-color: var(--accent2);
  }

  /* Stats bar */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 28px;
    flex-wrap: wrap;
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--text-dim);
  }

  .stat-item .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent2);
  }

  .stat-item .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot.green { background: var(--green); }
  .dot.cyan { background: var(--cyan); }
  .dot.orange { background: var(--orange); }
  .dot.pink { background: var(--pink); }

  /* Section headers */
  .section-header {
    grid-column: 1 / -1;
    margin: 16px 0 8px;
    padding: 0;
  }

  .section-header h2 {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }

  .section-header .section-sub {
    font-size: 0.78rem;
    color: var(--text-dim);
  }

  .section-header .section-line {
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
    margin-top: 10px;
    border-radius: 2px;
    opacity: 0.4;
  }

  /* Course grid */
  .course-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 24px;
  }

  .course-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: block;
  }

  .course-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--green));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .course-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 12px 40px var(--card-shadow);
  }

  .course-card:hover::before {
    opacity: 1;
  }

  .card-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-dim);
    margin-bottom: 12px;
    letter-spacing: 1px;
  }

  .card-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    margin-bottom: 16px;
  }

  .icon-purple { background: rgba(108,92,231,0.15); }
  .icon-green { background: rgba(0,230,118,0.15); }
  .icon-cyan { background: rgba(0,229,255,0.15); }
  .icon-orange { background: rgba(255,145,0,0.15); }
  .icon-pink { background: rgba(255,64,129,0.15); }

  .course-card h2 {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text);
  }

  .course-card p {
    font-size: 0.82rem;
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    padding: 3px 10px;
    border-radius: 6px;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .tag-purple { background: rgba(108,92,231,0.12); color: var(--accent2); }
  .tag-green { background: rgba(0,230,118,0.12); color: var(--green); }
  .tag-cyan { background: rgba(0,229,255,0.12); color: var(--cyan); }
  .tag-orange { background: rgba(255,145,0,0.12); color: var(--orange); }
  .tag-pink { background: rgba(255,64,129,0.12); color: var(--pink); }

  .card-arrow {
    position: absolute;
    bottom: 24px;
    right: 24px;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    opacity: 0.5;
  }

  .course-card:hover .card-arrow {
    opacity: 1;
    background: var(--accent);
    transform: translateX(4px);
  }

  .card-arrow svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: var(--text);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Footer */
  footer {
    text-align: center;
    margin-top: 60px;
    padding-top: 30px;
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  footer a {
    color: var(--accent2);
    text-decoration: none;
  }

  /* Responsive */
  @media (max-width: 640px) {
    h1 { font-size: 2rem; }
    .container { padding: 24px 16px 60px; }
    .course-grid { grid-template-columns: 1fr; }
    .stats-bar { gap: 20px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge">Interactive Lab</div>
    <h1>C 语言交互实验室</h1>
    <p class="subtitle">
      从 Python 到 C，<strong>看见</strong>内存里发生的一切。<br>
      每个课件都是一个可交互的"内存显微镜"。
    </p>
    <div class="stats-bar">
      <div class="stat-item">
        <span class="dot green"></span>
        <span class="num" id="course-count">18</span>
        <span>个交互课件</span>
      </div>
      <div class="stat-item">
        <span class="dot cyan"></span>
        <span>点击 · 拖拽 · 观察</span>
      </div>
      <div class="stat-item">
        <span class="dot orange"></span>
        <span>零依赖 · 打开即用</span>
      </div>
    </div>
  </header>

  <div class="course-grid" id="course-grid"></div>

  <footer>
    从 Python 到 C · 看见内存 · 理解本质
  </footer>
</div>

<script>
const SECTIONS = [
  {
    title: '🐍 Python → C++ 衔接（逐行讲解）',
    sub: '从 Python 出发，逐行拆解 C++ 的每个关键概念',
    lineColor: 'var(--accent2)'
  },
  {
    num: '01',
    icon: '📦',
    iconClass: 'icon-purple',
    title: '头文件详解',
    desc: '#include 是什么？<iostream> vs <cstdio>？尖括号 vs 双引号？点击代码逐行查看解释。',
    tags: ['#include', '预处理', '头文件'],
    tagClass: 'tag-purple',
    file: 'courseware/headers.html'
  },
  {
    num: '02',
    icon: '🏷️',
    iconClass: 'icon-purple',

    tags: ['namespace', 'std', '命名冲突'],
    tagClass: 'tag-purple',
    file: 'courseware/namespace.html'
  },
  {
    num: '03',

    iconClass: 'icon-green',

    tagClass: 'tag-green',
    file: 'courseware/cin-cout.html'
  },
  {
    num: '04',

    desc: '%d %f %lf %c %s 格式控制、& 取地址、宽度对齐精度、竞赛中的速度优势。逐行讲解。',
    tags: ['scanf', 'printf', '格式控制'],
    tagClass: 'tag-orange',
    file: 'courseware/scanf-printf.html'
  },
  {
    num: '05',
    icon: '🐍➜⚡',
    iconClass: 'icon-purple',
    title: 'Python → C++ 综合对比',
    desc: '从 Python 出发快速上手 C++：输入输出、数据类型、条件判断，左右对比一目了然。',
    tags: ['过渡', '对比', '综合'],
    tagClass: 'tag-purple',
    file: 'courseware/python-to-cpp.html'
  },
  {
    title: '📖 零基础入门 · GESP 1级',
    sub: 'C++ 语法核心：变量、运算、输入输出、分支、循环',
    lineColor: 'var(--accent)'
  },
  {
    num: '02',
    icon: '🏗️',
    iconClass: 'icon-purple',
    title: 'C++ 程序结构基础',
    desc: '#include 是什么？using namespace std 干嘛的？main 函数怎么来的？编译和运行有什么区别？',
    tags: ['头文件', '命名空间', '编译流程'],
    tagClass: 'tag-purple',
    file: 'courseware/cpp-basics.html'
  },
  {
    num: '03',
    icon: '🧩',
    iconClass: 'icon-purple',
    title: '变量与数据类型',
    desc: 'int / long long / float / double / char / bool，每种类型占多大内存？范围是多少？',
    tags: ['类型系统', '内存大小', 'GESP 1级'],
    tagClass: 'tag-purple',
    file: 'courseware/variables.html'
  },
  {
    num: '04',
    icon: '➕➖',
    iconClass: 'icon-orange',
    title: '算术运算与赋值',
    desc: '加减乘除、取模、复合赋值、类型转换、自增自减，C++ 运算的完整细节。',
    tags: ['运算符', '类型转换', 'GESP 1级'],
    tagClass: 'tag-orange',
    file: 'courseware/arithmetic.html'
  },
  {
    num: '05',
    icon: '⌨️',
    iconClass: 'icon-orange',
    title: '输入输出',
    desc: 'cin/cout 与 scanf/printf 的格式控制、宽度对齐、小数精度、竞赛常用技巧。',
    tags: ['printf', 'scanf', 'GESP 1级'],
    tagClass: 'tag-orange',
    file: 'courseware/stdio.html'
  },
  {
    num: '06',
    icon: '🎮',
    iconClass: 'icon-purple',
    title: '分支结构',
    desc: 'if-else if-else、switch-case、条件表达式、多层嵌套，单步执行看条件怎么走。',
    tags: ['条件', '分支', 'GESP 1级'],

  {
    num: '07',

    tags: ['自增自减', '循环细节', 'GESP 1级'],
    tagClass: 'tag-cyan',
    file: 'courseware/cpp-loops-and-ops.html'
  },
  {
    title: '📐 进阶语法 · GESP 2级',
    sub: '数组、字符串、函数、结构体',
    lineColor: 'var(--green)'
  },
  {
    num: '08',
    icon: '📊',
    iconClass: 'icon-green',
    title: '数组',
    desc: '一排连续的内存格子。索引就是偏移量，鼠标悬停看地址，理解 arr[i] 的本质。',
    tags: ['连续内存', '索引', 'GESP 2级'],
    tagClass: 'tag-green',
    file: 'courseware/arrays.html'
  },
  {
    num: '09',
    icon: '🔤',
    iconClass: 'icon-orange',
    title: '字符串',
    desc: 'C 语言没有字符串类型！每个字符占一格，末尾藏着 \\0。string 类操作函数。',
    tags: ['char[]', '\\0结尾', 'GESP 2级'],
    tagClass: 'tag-orange',
    file: 'courseware/strings.html'
  },
  {
    num: '10',
    icon: '🔄',
    iconClass: 'icon-pink',
    title: '函数传参',
    desc: '值传递复制一份，引用传递指向同一份。看函数调用时栈帧里发生了什么。',
    tags: ['值传递', '引用传递', 'GESP 2级'],
    tagClass: 'tag-pink',
    file: 'courseware/functions.html'
  },
  {
    num: '11',
    icon: '📦',
    iconClass: 'icon-pink',
    title: '结构体',
    desc: 'struct 自定义类型，嵌套结构体，内存对齐，typedef 简化，看内存布局一目了然。',
    tags: ['struct', '自定义类型', 'GESP 2级'],
    tagClass: 'tag-pink',
    file: 'courseware/structs.html'
  },
  {
    title: '⚙️ 算法入门 · GESP 3-4级',
    sub: '指针、枚举、模拟、排序、查找、递归',
    lineColor: 'var(--orange)'
  },
  {
    num: '12',
    icon: '🎯',
    iconClass: 'icon-cyan',
    title: '指针入门',
    desc: '& 取地址，* 解引用。指针就是一个箭头，指向内存里的某个位置。',
    tags: ['地址', '箭头', 'GESP 3级'],
    tagClass: 'tag-cyan',
    file: 'courseware/pointers.html'
  },
  {
    num: '13',
    icon: '📡',
    iconClass: 'icon-green',
    title: '排序算法',
    desc: '冒泡 / 选择 / 插入排序，柱状图可视化，每一步比较和交换都看得清清楚楚。',
    tags: ['算法', '可视化', 'GESP 3级'],
    tagClass: 'tag-green',
    file: 'courseware/sorting.html'
  },
  {
    num: '14',
    icon: '🔍',
    iconClass: 'icon-cyan',
    title: '查找算法',
    desc: '线性查找 vs 二分查找，动态输入目标值，看 left/right/mid 边界怎么移动。',
    tags: ['算法', '二分', 'GESP 3级'],
    tagClass: 'tag-cyan',
    file: 'courseware/searching.html'
  }
];

const grid = document.getElementById('course-grid');
let seq = 0;

SECTIONS.forEach(item => {
  if (item.title && !item.num) {
    // Section header
    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = `
      <h2>${item.title}</h2>
      <div class="section-sub">${item.sub}</div>
      <div class="section-line" style="background:linear-gradient(90deg, ${item.lineColor}, transparent)"></div>
    `;
    grid.appendChild(header);
  } else {
    seq++;
    const c = item;
    const card = document.createElement('a');
    card.className = 'course-card';
    card.href = c.file;
    card.innerHTML = `
      <div class="card-number">${String(seq).padStart(2, '0')}</div>
      <div class="card-icon ${c.iconClass}">${c.icon}</div>
      <h2>${c.title}</h2>
      <p>${c.desc}</p>
      <div class="card-tags">
        ${c.tags.map(t => `<span class="tag ${c.tagClass}">${t}</span>`).join('')}
      </div>
      <div class="card-arrow">
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </div>
    `;
    grid.appendChild(card);
  }
});
</script>

</body>
</html>
