<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>恶魔追逐 · 2.5D 棋盘视觉预览</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    color:#e7f7ee;min-height:100vh;
    background:radial-gradient(1200px 700px at 50% -10%,#132a1d,transparent 60%),
               radial-gradient(900px 600px at 85% 110%,rgba(153,27,27,.18),transparent 55%),
               linear-gradient(180deg,#08110d,#0e1d15);
    padding:14px 12px 40px;
  }
  h1{text-align:center;font-size:20px;letter-spacing:2px;margin:4px 0 2px}
  p.sub{text-align:center;font-size:12px;color:#8fb89f;margin:0 0 12px}
  .stage{position:relative;width:min(96vw,640px);margin:0 auto}
  #boardCanvas{display:block;width:100%;height:auto;border-radius:16px;
    box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 0 0 1px rgba(74,222,128,.12)}
  .piece{position:absolute;z-index:9;pointer-events:none;transform-style:preserve-3d;
    transition:left .2s ease-out,top .2s ease-out}
  .piece svg{display:block;width:100%;height:100%;overflow:visible}
  .piece-shadow{position:absolute;left:50%;bottom:-6px;width:74%;height:10px;
    transform:translateX(-50%);background:radial-gradient(ellipse,rgba(0,0,0,.5),transparent 70%)}
  .toolbar{display:flex;gap:10px;justify-content:center;margin:16px 0 6px;flex-wrap:wrap}
  button{padding:10px 22px;border-radius:12px;border:0;cursor:pointer;font-weight:800;font-size:14px;
    color:#05150b;background:linear-gradient(160deg,#22c55e,#16a34a);box-shadow:0 4px 0 #14532d}
  button.arcade{background:linear-gradient(160deg,#7ff3ff,#0ea5e9);box-shadow:0 4px 0 #0b4050;color:#031820}
  .legend{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:12px;font-size:12px;color:#8fb89f}
  .legend b{color:#e7f7ee}
  .note{text-align:center;font-size:12px;color:#8fb89f;margin-top:14px;line-height:1.8}
</style>
</head>
<body>
  <h1>👹 恶魔追逐 · 2.5D 阶梯棋盘预览</h1>
  <p class="sub">Canvas 等距渲染 · 每行一级台阶 · 立体格面 · 棋子站立</p>
  <div class="toolbar">
    <button id="th4399">清新主题</button>
    <button id="thArcade" class="arcade">街机主题</button>
  </div>
  <div class="stage">
    <canvas id="boardCanvas"></canvas>
  </div>
  <div class="legend">
    <span>🟦 <b>你 · 剑士</b> 1号格</span>
    <span>🟩 <b>队友 · 法师</b> 5号格</span>
    <span>🟥 <b>恶魔 · 角魔</b> 20号格(2d6)</span>
  </div>
  <p class="note">棋子 = SVG 建模站立在格子上（带投影）<br>棋盘 = 等距平行四边形格面 + 行间台阶立面 + 近大远小透视</p>

<script>
/* =====================================================================
 * board.js —— 《恶魔追逐·队友模式》Canvas 等距阶梯棋盘渲染
 * 采用确定性等距(斜投影)几何：棋盘从远(第1行)到近(第4行)逐级放大，
 * 每行是一层台阶（顶面 + 立面），格子为立体平行四边形，
 * 命运格金色发光，起点/终点高亮，蛇形方向箭头可见。
 * 暴露 window.SnakeBoard；兼容 node（module.exports）便于几何自测。
 * ===================================================================== */
(function (global) {
  'use strict';

  function createBoard(opts) {
    opts = opts || {};
    var canvas = opts.canvas;
    var ctx = canvas ? canvas.getContext('2d') : null;
    var fateCells = opts.fateCells || [5, 10, 15, 25, 35, 44];
    var start = opts.start || 1;
    var end = opts.end || 48;
    var palette = opts.palette || { row: ['#16301f', '#1b3a26', '#204430', '#26523a'], edge: '#3f7d4e', fate: '#f5c518', start: '#22c55e', end: '#f5c518', text: '#e7f7ee' };

    // 等距几何参数（单位 px，基于画布宽度自适应）
    var W = 0, H = 0;
    var rows = 4, cols = 12;
    var geo = null; // 每行几何

    function layout() {
      W = canvas ? canvas.clientWidth : (opts.width || 640);
      // 每行宽度按比例缩放：第0行(远)=78%，第3行(近)=100%，形成透视阶梯
      var padX = 16;
      var rowScale = [0.78, 0.85, 0.92, 1.0];
      var baseRowW = W - padX * 2;
      var rowW = [];
      for (var r = 0; r < rows; r++) {
        rowW.push(baseRowW * rowScale[r]);
      }
      var colW = [], hh = [];
      for (var r = 0; r < rows; r++) {
        colW.push(rowW[r] / cols);
        hh.push(colW[r] * 0.5); // 顶面高度（等距纵向压缩）
      }
      var stepH = colW[0] * 0.34; // 台阶立面高度
      // 每行顶部 y：逐行累计（顶面高 + 立面 + 错层）
      var yTop = [padX + 6];
      for (var r = 1; r < rows; r++) {
        yTop.push(yTop[r - 1] + hh[r - 1] + stepH);
      }
      // 斜偏移：顶面右端下移，形成等距菱形感（相对行宽）
      var dx = rowW[0] * 0.085;
      var totalH = yTop[rows - 1] + hh[rows - 1] + stepH + 12;
      geo = { rowW: rowW, colW: colW, hh: hh, yTop: yTop, stepH: stepH, dx: dx, totalH: totalH, padX: padX, rowScale: rowScale };
      H = totalH;
      if (canvas) {
        var dpr = Math.min(2, global.devicePixelRatio || 1);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    }

    // 返回某格顶面中心（屏幕坐标）+ 尺寸，供棋子定位
    function cellCenter(pos) {
      var rc = posToRC(pos);
      var r = rc.row, c = rc.col;
      var g = geo;
      var rowW = g.rowW[r];
      var x0 = (W - rowW) / 2;
      var cw = g.colW[r];
      var cx = x0 + c * cw + cw / 2;
      var cy = g.yTop[r] + g.hh[r] / 2 + g.dx / 2; // 顶面中心（考虑斜度均值）
      return { x: cx, y: cy, w: cw, h: g.hh[r], row: r, col: c, scale: g.rowScale[r] };
    }
    function posToRC(pos) {
      var idx = pos - 1;
      var row = Math.floor(idx / cols);
      var cc = idx % cols;
      var col = (row % 2 === 0) ? cc : (cols - 1 - cc);
      return { row: row, col: col };
    }

    function draw() {
      if (!ctx || !geo) return;
      ctx.clearRect(0, 0, W, H);
      // 背景透视地面
      var grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, 'rgba(6,14,10,.9)');
      grad.addColorStop(1, 'rgba(14,26,18,.95)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // 从远到近画每一行（近行覆盖远行底部，形成前后遮挡）
      for (var r = 0; r < rows; r++) {
        drawRow(r);
      }
    }

    // 画一行台阶：先画立面（整行），再画格子顶面
    function drawRow(r) {
      var g = geo;
      var rowW = g.rowW[r];
      var x0 = (W - rowW) / 2;
      var y = g.yTop[r];
      var cw = g.colW[r];
      var hh = g.hh[r];
      var dx = g.dx;
      var stepH = g.stepH;

      // —— 行背景立面（台阶侧壁）——
      ctx.beginPath();
      ctx.moveTo(x0, y + hh);
      ctx.lineTo(x0 + rowW, y + hh);
      ctx.lineTo(x0 + rowW + dx, y + hh + stepH);
      ctx.lineTo(x0 + dx, y + hh + stepH);
      ctx.closePath();
      var sh = ctx.createLinearGradient(0, y + hh, 0, y + hh + stepH);
      var dk = shade(palette.row[r], -0.55);
      sh.addColorStop(0, shade(dk, 0.18));
      sh.addColorStop(1, dk);
      ctx.fillStyle = sh;
      ctx.fill();

      // —— 该行左/右侧壁 ——
      // 左壁
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.lineTo(x0 + dx, y + stepH);
      ctx.lineTo(x0 + dx, y + hh + stepH);
      ctx.lineTo(x0, y + hh);
      ctx.closePath();
      ctx.fillStyle = shade(palette.row[r], -0.42);
      ctx.fill();
      // 右壁
      ctx.beginPath();
      ctx.moveTo(x0 + rowW, y);
      ctx.lineTo(x0 + rowW + dx, y + stepH);
      ctx.lineTo(x0 + rowW + dx, y + hh + stepH);
      ctx.lineTo(x0 + rowW, y + hh);
      ctx.closePath();
      ctx.fillStyle = shade(palette.row[r], -0.38);
      ctx.fill();

      // —— 12 个格子顶面 ——
      for (var c = 0; c < cols; c++) {
        var pos = rcToPos(r, c);
        var cx = x0 + c * cw;
        var cy = y;
        // 顶面平行四边形（右侧带斜度）
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + cw, cy);
        ctx.lineTo(cx + cw + dx, cy + hh);
        ctx.lineTo(cx + dx, cy + hh);
        ctx.closePath();
        var isFate = fateCells.indexOf(pos) !== -1;
        var isStart = pos === start;
        var isEnd = pos === end;
        var base = isFate ? palette.fate : (isStart ? palette.start : (isEnd ? palette.end : palette.row[r]));
        var gg = ctx.createLinearGradient(cx, cy, cx + cw, cy + hh);
        gg.addColorStop(0, shade(base, 0.34));
        gg.addColorStop(1, shade(base, -0.1));
        ctx.fillStyle = gg;
        ctx.fill();
        // 描边
        ctx.strokeStyle = isFate ? 'rgba(245,197,24,.85)' : 'rgba(255,255,255,.14)';
        ctx.lineWidth = isFate ? 1.6 : 1;
        ctx.stroke();
        // 命运格发光
        if (isFate) {
          ctx.save();
          ctx.shadowColor = 'rgba(245,197,24,.9)';
          ctx.shadowBlur = 10;
          ctx.strokeStyle = 'rgba(245,197,24,.9)';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }
        // 序号
        ctx.fillStyle = isFate ? 'rgba(20,12,2,.9)' : (isStart || isEnd ? '#0b140d' : palette.text);
        ctx.font = 'bold ' + Math.max(9, Math.round(cw * 0.26)) + 'px sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(String(pos), cx + 2, cy + 2);
        // 命运/起点/终点标记
        if (isFate) {
          ctx.font = 'bold ' + Math.round(cw * 0.5) + 'px serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(20,12,2,.92)';
          ctx.fillText('?', cx + cw / 2 + dx / 2, cy + hh / 2);
        } else if (isStart) {
          ctx.font = 'bold ' + Math.round(cw * 0.42) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(8,24,14,.92)';
          ctx.fillText('起', cx + cw / 2 + dx / 2, cy + hh / 2);
        } else if (isEnd) {
          ctx.font = 'bold ' + Math.round(cw * 0.42) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(20,12,2,.92)';
          ctx.fillText('终', cx + cw / 2 + dx / 2, cy + hh / 2);
        }
        // 蛇形方向箭头（非命运/起终）
        if (!isFate && !isStart && !isEnd && c < cols - 1) {
          ctx.font = Math.round(cw * 0.3) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(255,255,255,.4)';
          ctx.fillText(r % 2 === 0 ? '→' : '←', cx + cw / 2 + dx / 2, cy + hh / 2);
        }
      }
    }

    function rcToPos(row, col) {
      var c = (row % 2 === 0) ? col : (cols - 1 - col);
      return row * cols + c + 1;
    }

    // 明暗工具：hex 色 + 亮度 delta(-1..1)
    function shade(hex, delta) {
      var c = hex.replace('#', '');
      if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
      var num = parseInt(c, 16);
      var r = Math.min(255, Math.max(0, (num >> 16) + Math.round(255 * delta)));
      var g = Math.min(255, Math.max(0, ((num >> 8) & 255) + Math.round(255 * delta)));
      var b = Math.min(255, Math.max(0, (num & 255) + Math.round(255 * delta)));
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }

    function setPalette(p) { if (p) palette = p; }

    return {
      layout: layout,
      draw: draw,
      cellCenter: cellCenter,
      posToRC: posToRC,
      rcToPos: rcToPos,
      setPalette: setPalette,
      get height() { return H; },
      get width() { return W; }
    };
  }

  var api = { createBoard: createBoard };
  if (typeof module !== 'undefined' && module.exports) { module.exports = api; }
  global.SnakeBoard = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function(){
  'use strict';
  var canvas = document.getElementById('boardCanvas');
  var stage = document.querySelector('.stage');
  var theme = '4399';
  var palette = {
    '4399': { row:['#16301f','#1b3a26','#204430','#26523a'], edge:'#3f7d4e', fate:'#f5c518', start:'#22c55e', end:'#f5c518', text:'#e7f7ee' },
    'arcade':{ row:['#0b1d30','#0e2438','#112b44','#15334f'], edge:'#7ff3ff', fate:'#f5c518', start:'#22d3ee', end:'#f5c518', text:'#e3f8ff' }
  };
  var board = SnakeBoard.createBoard({ canvas: canvas, palette: palette[theme] });
  board.layout();
  board.draw();

  // 放置棋子（预览：演示三种角色在不同格位站立）
  var pieces = [
    { actor:'player', pos:1,  svg:pieceSvg('player') },
    { actor:'mate',   pos:5,  svg:pieceSvg('mate') },
    { actor:'demon',  pos:20, svg:pieceSvg('demon') }
  ];
  var pieceEls = {};
  function placeAll(){
    pieces.forEach(function(p){
      var cp = board.cellCenter(p.pos);
      var pw = Math.max(26, cp.w * 0.72);
      var ph = Math.round(pw * 1.5);
      var el = pieceEls[p.actor];
      if(!el){
        el = document.createElement('div');
        el.className = 'piece';
        el.innerHTML = '<div class="piece-body">' + p.svg + '</div><div class="piece-shadow"></div>';
        stage.appendChild(el);
        pieceEls[p.actor] = el;
      }
      el.style.width = pw + 'px';
      el.style.height = ph + 'px';
      // 棋子底部站在格子顶面
      el.style.left = (cp.x - pw/2) + 'px';
      el.style.top  = (cp.y + cp.h/2 - ph + 4) + 'px';
    });
  }
  placeAll();

  function pieceSvg(actor){
    if(actor==='player'){
      return '<svg viewBox="0 0 64 96"><defs><linearGradient id="pb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0284c7"/></linearGradient></defs>'+
        '<path d="M32 34 L17 86 L47 86 Z" fill="#0c4a6e" opacity=".95"/>'+
        '<rect x="21" y="70" width="9" height="16" rx="3" fill="#155e75"/><rect x="34" y="70" width="9" height="16" rx="3" fill="#155e75"/>'+
        '<path d="M20 40 Q20 29 32 29 Q44 29 44 40 L45 63 Q45 70 32 70 Q19 70 19 63 Z" fill="url(#pb)"/>'+
        '<rect x="19" y="57" width="26" height="5" rx="2" fill="#082f49"/>'+
        '<circle cx="32" cy="22" r="10" fill="#e0f2fe"/><path d="M21 22 A11 10 0 0 1 43 22 L43 20 Q43 12 32 12 Q21 12 21 20 Z" fill="#22d3ee"/>'+
        '<circle cx="27" cy="24" r="1.7" fill="#fef08a"/><circle cx="37" cy="24" r="1.7" fill="#fef08a"/>'+
        '<g transform="rotate(-28 56 22)"><rect x="54" y="4" width="4.5" height="30" rx="2" fill="#e0f2fe"/><rect x="52.5" y="33" width="7.5" height="4.5" rx="1" fill="#f59e0b"/></g>'+
        '<path d="M12 44 Q7 52 13 62 L17 66 L21 62 Q26 52 21 44 Z" fill="#0284c7"/>'+
        '<ellipse cx="32" cy="90" rx="19" ry="4" fill="#22d3ee" opacity=".32"/></svg>';
    }
    if(actor==='mate'){
      return '<svg viewBox="0 0 64 96"><defs><linearGradient id="mb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/></linearGradient></defs>'+
        '<path d="M20 44 L16 88 L48 88 L44 44 Q32 34 20 44 Z" fill="url(#mb)"/>'+
        '<path d="M16 80 L48 80 L48 88 L16 88 Z" fill="#14532d"/>'+
        '<rect x="40" y="38" width="8" height="24" rx="4" fill="#166534"/>'+
        '<rect x="47" y="4" width="4" height="66" rx="2" fill="#78350f"/>'+
        '<circle cx="49" cy="8" r="7.5" fill="#4ade80"/><circle cx="49" cy="8" r="3.5" fill="#bbf7d0"/>'+
        '<circle cx="32" cy="28" r="10" fill="#dcfce7"/>'+
        '<path d="M20 26 Q32 2 46 24 L20 26 Z" fill="#16a34a"/>'+
        '<circle cx="27" cy="30" r="1.7" fill="#14532d"/><circle cx="37" cy="30" r="1.7" fill="#14532d"/>'+
        '<ellipse cx="32" cy="90" rx="17" ry="4" fill="#22c55e" opacity=".32"/></svg>';
    }
    return '<svg viewBox="0 0 72 96"><defs><linearGradient id="db" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#991b1b"/></linearGradient></defs>'+
      '<path d="M14 40 Q0 30 4 16 Q14 26 16 38 Z" fill="#7f1d1d"/><path d="M58 40 Q72 30 68 16 Q58 26 56 38 Z" fill="#7f1d1d"/>'+
      '<path d="M36 74 Q52 84 62 76 L64 70" stroke="#991b1b" stroke-width="5" fill="none" stroke-linecap="round"/>'+
      '<path d="M22 42 Q22 30 36 28 Q50 30 50 42 L52 70 Q52 78 36 78 Q20 78 20 70 Z" fill="url(#db)"/>'+
      '<path d="M36 44 L42 56 L36 66 L30 56 Z" fill="#f87171" opacity=".65"/>'+
      '<path d="M24 28 Q24 12 36 12 Q48 12 48 28 L48 34 Q42 38 36 38 Q30 38 24 34 Z" fill="#dc2626"/>'+
      '<path d="M25 16 Q18 3 11 5 Q20 12 25 13 Z" fill="#fbbf24"/><path d="M47 16 Q54 3 61 5 Q52 12 47 13 Z" fill="#fbbf24"/>'+
      '<ellipse cx="30" cy="24" rx="3" ry="4.2" fill="#fde047"/><circle cx="30" cy="24" r="1.5" fill="#7c2d12"/>'+
      '<ellipse cx="42" cy="24" rx="3" ry="4.2" fill="#fde047"/><circle cx="42" cy="24" r="1.5" fill="#7c2d12"/>'+
      '<path d="M30 32 L42 32 L38 35 Q36 36 34 35 Z" fill="#450a0a"/>'+
      '<ellipse cx="36" cy="90" rx="21" ry="5" fill="#ef4444" opacity=".45"/></svg>';
  }

  function applyTheme(t){
    theme = t;
    document.body.style.color = t==='arcade' ? '#e3f8ff' : '#e7f7ee';
    board.setPalette(palette[t]);
    board.layout();
    board.draw();
    placeAll();
  }
  document.getElementById('th4399').addEventListener('click', function(){ applyTheme('4399'); });
  document.getElementById('thArcade').addEventListener('click', function(){ applyTheme('arcade'); });

  window.addEventListener('resize', function(){ applyTheme(theme); });
})();
</script>
</body>

      var baseRowW = W - padX * 2;
      var rowW = [];
      for (var r = 0; r < rows; r++) {
        rowW.push(baseRowW * rowScale[r]);
      }
      var colW = [], hh = [];
      for (var r = 0; r < rows; r++) {
        colW.push(rowW[r] / cols);
        hh.push(colW[r] * 0.5); // 顶面高度（等距纵向压缩）
      }
      var stepH = colW[0] * 0.34; // 台阶立面高度
      // 每行顶部 y：逐行累计（顶面高 + 立面 + 错层）
      var yTop = [padX + 6];
      for (var r = 1; r < rows; r++) {
        yTop.push(yTop[r - 1] + hh[r - 1] + stepH);
      }
      // 斜偏移：顶面右端下移，形成等距菱形感（相对行宽）
      var dx = rowW[0] * 0.085;
      var totalH = yTop[rows - 1] + hh[rows - 1] + stepH + 12;
      geo = { rowW: rowW, colW: colW, hh: hh, yTop: yTop, stepH: stepH, dx: dx, totalH: totalH, padX: padX, rowScale: rowScale };
      H = totalH;
      if (canvas) {
        var dpr = Math.min(2, global.devicePixelRatio || 1);
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
    }

    // 返回某格顶面中心（屏幕坐标）+ 尺寸，供棋子定位
    function cellCenter(pos) {
      var rc = posToRC(pos);
      var r = rc.row, c = rc.col;
      var g = geo;
      var rowW = g.rowW[r];
      var x0 = (W - rowW) / 2;
      var cw = g.colW[r];
      var cx = x0 + c * cw + cw / 2 + g.dx / 2; // 顶面水平中心（含斜度）
      var cy = g.yTop[r] + g.hh[r] / 2 + g.dx / 2; // 顶面垂直中心（含斜度）
      return { x: cx, y: cy, w: cw, h: g.hh[r], row: r, col: c, scale: g.rowScale[r], dx: g.dx };
    }
    function posToRC(pos) {
      var idx = pos - 1;
      var row = Math.floor(idx / cols);
      var cc = idx % cols;
      var col = (row % 2 === 0) ? cc : (cols - 1 - cc);
      return { row: row, col: col };
    }

    function draw() {
      if (!ctx || !geo) return;
      ctx.clearRect(0, 0, W, H);
      // 背景透视地面
      var grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, 'rgba(6,14,10,.9)');
      grad.addColorStop(1, 'rgba(14,26,18,.95)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // 从远到近画每一行（近行覆盖远行底部，形成前后遮挡）
      for (var r = 0; r < rows; r++) {
        drawRow(r);
      }
    }

    // 画一行台阶：先画立面（整行），再画格子顶面
    function drawRow(r) {
      var g = geo;
      var rowW = g.rowW[r];
      var x0 = (W - rowW) / 2;
      var y = g.yTop[r];
      var cw = g.colW[r];
      var hh = g.hh[r];
      var dx = g.dx;
      var stepH = g.stepH;

      // —— 行背景立面（台阶侧壁）——
      ctx.beginPath();
      ctx.moveTo(x0, y + hh);
      ctx.lineTo(x0 + rowW, y + hh);
      ctx.lineTo(x0 + rowW + dx, y + hh + stepH);
      ctx.lineTo(x0 + dx, y + hh + stepH);
      ctx.closePath();
      var sh = ctx.createLinearGradient(0, y + hh, 0, y + hh + stepH);
      var dk = shade(palette.row[r], -0.55);
      sh.addColorStop(0, shade(dk, 0.18));
      sh.addColorStop(1, dk);
      ctx.fillStyle = sh;
      ctx.fill();

      // —— 该行左/右侧壁 ——
      // 左壁
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.lineTo(x0 + dx, y + stepH);
      ctx.lineTo(x0 + dx, y + hh + stepH);
      ctx.lineTo(x0, y + hh);
      ctx.closePath();
      ctx.fillStyle = shade(palette.row[r], -0.42);
      ctx.fill();
      // 右壁
      ctx.beginPath();
      ctx.moveTo(x0 + rowW, y);
      ctx.lineTo(x0 + rowW + dx, y + stepH);
      ctx.lineTo(x0 + rowW + dx, y + hh + stepH);
      ctx.lineTo(x0 + rowW, y + hh);
      ctx.closePath();
      ctx.fillStyle = shade(palette.row[r], -0.38);
      ctx.fill();

      // —— 12 个格子顶面 ——
      for (var c = 0; c < cols; c++) {
        var pos = rcToPos(r, c);
        var cx = x0 + c * cw;
        var cy = y;
        // 顶面平行四边形（右侧带斜度）
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + cw, cy);
        ctx.lineTo(cx + cw + dx, cy + hh);
        ctx.lineTo(cx + dx, cy + hh);
        ctx.closePath();
        var isFate = fateCells.indexOf(pos) !== -1;
        var isStart = pos === start;
        var isEnd = pos === end;
        var base = isFate ? palette.fate : (isStart ? palette.start : (isEnd ? palette.end : palette.row[r]));
        var gg = ctx.createLinearGradient(cx, cy, cx + cw, cy + hh);
        gg.addColorStop(0, shade(base, 0.34));
        gg.addColorStop(1, shade(base, -0.1));
        ctx.fillStyle = gg;
        ctx.fill();
        // 描边
        ctx.strokeStyle = isFate ? 'rgba(245,197,24,.85)' : 'rgba(255,255,255,.14)';
        ctx.lineWidth = isFate ? 1.6 : 1;
        ctx.stroke();
        // 命运格发光
        if (isFate) {
          ctx.save();
          ctx.shadowColor = 'rgba(245,197,24,.9)';
          ctx.shadowBlur = 10;
          ctx.strokeStyle = 'rgba(245,197,24,.9)';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.restore();
        }
        // 序号
        ctx.fillStyle = isFate ? 'rgba(20,12,2,.9)' : (isStart || isEnd ? '#0b140d' : palette.text);
        ctx.font = 'bold ' + Math.max(9, Math.round(cw * 0.26)) + 'px sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(String(pos), cx + 2, cy + 2);
        // 命运/起点/终点标记
        if (isFate) {
          ctx.font = 'bold ' + Math.round(cw * 0.5) + 'px serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(20,12,2,.92)';
          ctx.fillText('?', cx + cw / 2 + dx / 2, cy + hh / 2);
        } else if (isStart) {
          ctx.font = 'bold ' + Math.round(cw * 0.42) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(8,24,14,.92)';
          ctx.fillText('起', cx + cw / 2 + dx / 2, cy + hh / 2);
        } else if (isEnd) {
          ctx.font = 'bold ' + Math.round(cw * 0.42) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(20,12,2,.92)';
          ctx.fillText('终', cx + cw / 2 + dx / 2, cy + hh / 2);
        }
        // 蛇形方向箭头（非命运/起终）
        if (!isFate && !isStart && !isEnd && c < cols - 1) {
          ctx.font = Math.round(cw * 0.3) + 'px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(255,255,255,.4)';
          ctx.fillText(r % 2 === 0 ? '→' : '←', cx + cw / 2 + dx / 2, cy + hh / 2);
        }
      }
    }

    function rcToPos(row, col) {
      var c = (row % 2 === 0) ? col : (cols - 1 - col);
      return row * cols + c + 1;
    }

    // 明暗工具：hex 色 + 亮度 delta(-1..1)
    function shade(hex, delta) {
      var c = hex.replace('#', '');
      if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
      var num = parseInt(c, 16);
      var r = Math.min(255, Math.max(0, (num >> 16) + Math.round(255 * delta)));
      var g = Math.min(255, Math.max(0, ((num >> 8) & 255) + Math.round(255 * delta)));
      var b = Math.min(255, Math.max(0, (num & 255) + Math.round(255 * delta)));
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }

    function setPalette(p) { if (p) palette = p; }

    return {
      layout: layout,
      draw: draw,
      cellCenter: cellCenter,
      posToRC: posToRC,
      rcToPos: rcToPos,
      setPalette: setPalette,
      get height() { return H; },
      get width() { return W; }
    };
  }

  var api = { createBoard: createBoard };
  if (typeof module !== 'undefined' && module.exports) { module.exports = api; }
  global.SnakeBoard = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function(){
  'use strict';
  var canvas = document.getElementById('boardCanvas');
  var stage = document.querySelector('.stage');
  var theme = '4399';
  var palette = {
    '4399': { row:['#16301f','#1b3a26','#204430','#26523a'], edge:'#3f7d4e', fate:'#f5c518', start:'#22c55e', end:'#f5c518', text:'#e7f7ee' },
    'arcade':{ row:['#0b1d30','#0e2438','#112b44','#15334f'], edge:'#7ff3ff', fate:'#f5c518', start:'#22d3ee', end:'#f5c518', text:'#e3f8ff' }
  };
  var board = SnakeBoard.createBoard({ canvas: canvas, palette: palette[theme] });
  board.layout();
  board.draw();

  // 放置棋子（预览：演示三种角色在不同格位站立）
  var pieces = [
    { actor:'player', pos:1,  svg:pieceSvg('player') },
    { actor:'mate',   pos:5,  svg:pieceSvg('mate') },
    { actor:'demon',  pos:20, svg:pieceSvg('demon') }
  ];
  var pieceEls = {};
  function placeAll(){
    pieces.forEach(function(p){
      var cp = board.cellCenter(p.pos);
      var pw = Math.max(26, cp.w * 0.72);
      var ph = Math.round(pw * 1.5);
      var el = pieceEls[p.actor];
      if(!el){
        el = document.createElement('div');
        el.className = 'piece';
        el.innerHTML = '<div class="piece-body">' + p.svg + '</div><div class="piece-shadow"></div>';
        stage.appendChild(el);
        pieceEls[p.actor] = el;
      }
      el.style.width = pw + 'px';
      el.style.height = ph + 'px';
      // 棋子底部站在格子顶面
      el.style.left = (cp.x - pw/2) + 'px';
      el.style.top  = (cp.y + cp.h/2 - ph + 4) + 'px';
    });
  }
  placeAll();

  function pieceSvg(actor){
    if(actor==='player'){
      return '<svg viewBox="0 0 64 96"><defs><linearGradient id="pb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0284c7"/></linearGradient></defs>'+
        '<path d="M32 34 L17 86 L47 86 Z" fill="#0c4a6e" opacity=".95"/>'+
        '<rect x="21" y="70" width="9" height="16" rx="3" fill="#155e75"/><rect x="34" y="70" width="9" height="16" rx="3" fill="#155e75"/>'+
        '<path d="M20 40 Q20 29 32 29 Q44 29 44 40 L45 63 Q45 70 32 70 Q19 70 19 63 Z" fill="url(#pb)"/>'+
        '<rect x="19" y="57" width="26" height="5" rx="2" fill="#082f49"/>'+
        '<circle cx="32" cy="22" r="10" fill="#e0f2fe"/><path d="M21 22 A11 10 0 0 1 43 22 L43 20 Q43 12 32 12 Q21 12 21 20 Z" fill="#22d3ee"/>'+
        '<circle cx="27" cy="24" r="1.7" fill="#fef08a"/><circle cx="37" cy="24" r="1.7" fill="#fef08a"/>'+
        '<g transform="rotate(-28 56 22)"><rect x="54" y="4" width="4.5" height="30" rx="2" fill="#e0f2fe"/><rect x="52.5" y="33" width="7.5" height="4.5" rx="1" fill="#f59e0b"/></g>'+
        '<path d="M12 44 Q7 52 13 62 L17 66 L21 62 Q26 52 21 44 Z" fill="#0284c7"/>'+
        '<ellipse cx="32" cy="90" rx="19" ry="4" fill="#22d3ee" opacity=".32"/></svg>';
    }
    if(actor==='mate'){
      return '<svg viewBox="0 0 64 96"><defs><linearGradient id="mb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/></linearGradient></defs>'+
        '<path d="M20 44 L16 88 L48 88 L44 44 Q32 34 20 44 Z" fill="url(#mb)"/>'+
        '<path d="M16 80 L48 80 L48 88 L16 88 Z" fill="#14532d"/>'+
        '<rect x="40" y="38" width="8" height="24" rx="4" fill="#166534"/>'+
        '<rect x="47" y="4" width="4" height="66" rx="2" fill="#78350f"/>'+
        '<circle cx="49" cy="8" r="7.5" fill="#4ade80"/><circle cx="49" cy="8" r="3.5" fill="#bbf7d0"/>'+
        '<circle cx="32" cy="28" r="10" fill="#dcfce7"/>'+
        '<path d="M20 26 Q32 2 46 24 L20 26 Z" fill="#16a34a"/>'+
        '<circle cx="27" cy="30" r="1.7" fill="#14532d"/><circle cx="37" cy="30" r="1.7" fill="#14532d"/>'+
        '<ellipse cx="32" cy="90" rx="17" ry="4" fill="#22c55e" opacity=".32"/></svg>';
    }
    return '<svg viewBox="0 0 72 96"><defs><linearGradient id="db" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#991b1b"/></linearGradient></defs>'+
      '<path d="M14 40 Q0 30 4 16 Q14 26 16 38 Z" fill="#7f1d1d"/><path d="M58 40 Q72 30 68 16 Q58 26 56 38 Z" fill="#7f1d1d"/>'+
      '<path d="M36 74 Q52 84 62 76 L64 70" stroke="#991b1b" stroke-width="5" fill="none" stroke-linecap="round"/>'+
      '<path d="M22 42 Q22 30 36 28 Q50 30 50 42 L52 70 Q52 78 36 78 Q20 78 20 70 Z" fill="url(#db)"/>'+
      '<path d="M36 44 L42 56 L36 66 L30 56 Z" fill="#f87171" opacity=".65"/>'+
      '<path d="M24 28 Q24 12 36 12 Q48 12 48 28 L48 34 Q42 38 36 38 Q30 38 24 34 Z" fill="#dc2626"/>'+
      '<path d="M25 16 Q18 3 11 5 Q20 12 25 13 Z" fill="#fbbf24"/><path d="M47 16 Q54 3 61 5 Q52 12 47 13 Z" fill="#fbbf24"/>'+
      '<ellipse cx="30" cy="24" rx="3" ry="4.2" fill="#fde047"/><circle cx="30" cy="24" r="1.5" fill="#7c2d12"/>'+
      '<ellipse cx="42" cy="24" rx="3" ry="4.2" fill="#fde047"/><circle cx="42" cy="24" r="1.5" fill="#7c2d12"/>'+
      '<path d="M30 32 L42 32 L38 35 Q36 36 34 35 Z" fill="#450a0a"/>'+
      '<ellipse cx="36" cy="90" rx="21" ry="5" fill="#ef4444" opacity=".45"/></svg>';
  }

  function applyTheme(t){
    theme = t;
    document.body.style.color = t==='arcade' ? '#e3f8ff' : '#e7f7ee';
    board.setPalette(palette[t]);
    board.layout();
    board.draw();
    placeAll();
  }
  document.getElementById('th4399').addEventListener('click', function(){ applyTheme('4399'); });
  document.getElementById('thArcade').addEventListener('click', function(){ applyTheme('arcade'); });

  window.addEventListener('resize', function(){ applyTheme(theme); });
})();
</script>
