<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24点 · Make 24</title>
<script defer src="../anti-addiction.js"></script>
<script>
(function() {
  var theme = '4399';
  try {
    theme = localStorage.getItem('gh-theme') || '4399';
  } catch (e) {}
  if (theme !== '4399' && theme !== 'arcade') theme = '4399';
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.style.backgroundColor = theme === 'arcade' ? '#0b0b18' : '#f4f8ef';
}());
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet"></noscript>
<style>
/* ===== Reset & Base ===== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;background:#f4f8ef}
body{
  min-height:100vh;
  font-family:'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;
  transition:background-color .3s,color .3s;
  position:relative;
  overflow-x:hidden;
}

/* ===== Theme Variables ===== */
body[data-theme="4399"]{
  --bg:#f4f8ef;--bg2:#fff;--surface:#fff;--line:#d8e8cd;
  --text:#24401d;--dim:#6f8a63;--green:#389904;--green2:#448230;--orange:#fb6400;--orange2:#e64e00;
  --tag-bg:#eef5e8;
  background:linear-gradient(180deg,#eef6e6 0%,#fff 50%,#f5fbef 100%);color:var(--text);
}
body[data-theme="4399"]::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.6;
  background:radial-gradient(circle at 10% 15%,rgba(56,153,4,.10),transparent 35%),
    radial-gradient(circle at 90% 85%,rgba(251,100,0,.08),transparent 35%);
}
body[data-theme="arcade"]{
  --bg:#0b0b18;--bg2:#14142b;--surface:#191934;--line:#3a3a5c;--hard:#000;
  --text:#f4f4ff;--dim:#7a7aa0;--green:#00ff9d;--pink:#ff2d78;--cyan:#3de1ff;--yellow:#ffe14d;
  --tag-bg:#2a2a4a;
  background-color:#0b0b18;color:var(--text);
  background-image:radial-gradient(circle at 50% 0%,#2a2a55 0%,transparent 60%);
}
body[data-theme="arcade"]::before{
  content:'';position:fixed;inset:0;pointer-events:none;opacity:.15;z-index:0;
  background-image:linear-gradient(#3a3a5c 1px,transparent 1px),linear-gradient(90deg,#3a3a5c 1px,transparent 1px);
  background-size:26px 26px;
}
body[data-theme="arcade"]::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.5;
}

/* ===== Loader ===== */
#loader{
  display:none;
  position:fixed;inset:0;z-index:99999;
  background:var(--bg);
  align-items:center;justify-content:center;
}
#loader .spinner{
  width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--green);
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Back Button ===== */
.back-btn{
  position:fixed;top:16px;left:16px;z-index:1000;
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--text);text-decoration:none;font-size:14px;font-weight:600;
  transition:all .2s;
}
.back-btn:hover{background:rgba(255,255,255,.28);transform:translateX(-2px)}

/* ===== Theme Switcher ===== */
#theme-switch{
  position:fixed;right:16px;bottom:16px;z-index:1000;
  width:46px;height:46px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#16a34a;background:rgba(255,255,255,.92);border:1px solid rgba(34,197,94,.4);
  box-shadow:0 3px 14px rgba(34,197,94,.2);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  cursor:pointer;user-select:none;transition:transform 180ms ease,background 180ms ease;
}
#theme-switch:hover{transform:scale(1.08) rotate(-3deg)}
#theme-switch:active{transform:scale(.94)}
body[data-theme="arcade"] #theme-switch{
  color:#7ff3ff;background:rgba(10,10,24,.82);border-color:rgba(61,225,255,.42);
  box-shadow:0 0 16px rgba(61,225,255,.23);
}

/* ===== Main Container ===== */
main{
  max-width:600px;margin:0 auto;padding:80px 20px 100px;
  position:relative;z-index:1;
}

/* ===== Header ===== */
.h4399{display:none;text-align:center;margin-bottom:24px}
body[data-theme="4399"] .h4399{display:block}
.h4399 .topbar{display:flex;align-items:center;justify-content:center;gap:10px}
.h4399 .logo{font-size:28px}
.h4399 .title{font-family:'ZCOOL KuaiLe',cursive;font-size:32px;color:var(--green)}
.h4399 .title em{font-style:normal;color:var(--orange);font-size:18px;margin-left:6px;font-family:'PingFang SC',sans-serif;font-weight:400}
.h4399 .subtitle{color:var(--dim);font-size:13px;margin-top:4px}

.harcade{display:none;text-align:center;margin-bottom:24px}
body[data-theme="arcade"] .harcade{display:block}
.harcade .logo-bar{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--yellow);letter-spacing:2px;margin-bottom:10px}
.harcade h1{font-family:'Press Start 2P',monospace;font-size:28px;letter-spacing:2px}
.harcade h1 .p{color:var(--pink)}
.harcade h1 .c{color:var(--cyan)}
.harcade .subtitle{font-family:'Press Start 2P',monospace;font-size:8px;color:var(--dim);margin-top:8px}

/* ===== Mode Selector (vertical list) ===== */
.mode-list{
  display:flex;flex-direction:column;gap:10px;margin-bottom:22px;
  max-width:340px;margin-left:auto;margin-right:auto;
}
.mode-btn{
  display:flex;align-items:center;justify-content:center;
  padding:14px 18px;
  border:2px solid var(--line);
  border-radius:10px;
  background:var(--surface);
  color:var(--dim);
  font-size:15px;font-weight:700;
  cursor:pointer;
  transition:all .2s;
  font-family:inherit;
  text-align:center;
}
.mode-btn:hover{border-color:var(--green);color:var(--text)}
.mode-btn.active{
  background:var(--green);border-color:var(--green);color:#fff;
}
.mode-btn:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
body[data-theme="arcade"] .mode-btn.active{
  background:var(--cyan);border-color:var(--cyan);color:var(--bg);
  box-shadow:0 0 10px rgba(61,225,255,.4);
}
body[data-theme="arcade"] .mode-btn:focus-visible{outline-color:var(--yellow)}

/* ===== Stats Bar ===== */
.stats-bar{
  display:flex;gap:8px;margin-bottom:24px;justify-content:center;flex-wrap:wrap;
}
.stat-item{
  display:flex;align-items:center;gap:4px;
  padding:6px 12px;
  background:var(--tag-bg);
  border-radius:8px;
  font-size:13px;
}
.stat-icon{font-size:14px}
.stat-value{font-weight:700;color:var(--text)}
.stat-label{color:var(--dim);font-size:11px}

/* ===== Number Cards ===== */
.numbers{
  display:flex;gap:12px;justify-content:center;margin-bottom:24px;
}
.num-card{
  width:80px;height:100px;
  display:flex;align-items:center;justify-content:center;
  font-size:42px;font-weight:800;
  font-family:inherit;line-height:1;padding:0;
  border:3px solid var(--green);
  border-radius:14px;
  background:var(--surface);
  color:var(--green);
  cursor:pointer;
  transition:transform .2s,box-shadow .2s,opacity .2s,filter .2s;
  animation:card-enter .4s ease-out backwards;
  user-select:none;
  -webkit-appearance:none;appearance:none;
}
.num-card:nth-child(1){animation-delay:0s}
.num-card:nth-child(2){animation-delay:.08s}
.num-card:nth-child(3){animation-delay:.16s}
.num-card:nth-child(4){animation-delay:.24s}
.num-card:hover:not(.used){transform:translateY(-4px) scale(1.05);box-shadow:0 8px 20px rgba(0,0,0,.15)}
.num-card:active:not(.used){transform:scale(.95)}
.num-card:focus-visible{outline:3px solid var(--orange);outline-offset:4px}
.num-card.used{
  opacity:.25;filter:grayscale(1);pointer-events:none;transform:scale(.9);cursor:default;
  border-color:var(--line);
}
body[data-theme="arcade"] .num-card{
  border-color:var(--cyan);color:var(--cyan);
  background:var(--surface);
  box-shadow:0 0 8px rgba(61,225,255,.2);
}
body[data-theme="arcade"] .num-card:hover:not(.used){
  box-shadow:0 0 16px rgba(61,225,255,.5);
}
body[data-theme="arcade"] .num-card.used{
  border-color:var(--line);box-shadow:none;
}
body[data-theme="arcade"] .num-card:focus-visible{outline-color:var(--yellow)}

@keyframes card-enter{
  from{transform:rotateY(90deg) scale(.8);opacity:0}
  to{transform:rotateY(0) scale(1);opacity:1}
}

/* ===== Operator Buttons ===== */
.operators{
  display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:20px;max-width:380px;margin-left:auto;margin-right:auto;
}
.op-btn{
  width:52px;height:52px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;font-weight:700;
  border:none;border-radius:12px;
  background:var(--orange);color:#fff;
  cursor:pointer;
  transition:transform .15s,filter .15s,box-shadow .15s;
  font-family:inherit;
}
.op-btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.op-btn:active{transform:scale(.92)}
body[data-theme="arcade"] .op-btn{
  background:var(--pink);color:#fff;
  box-shadow:0 0 8px rgba(255,45,120,.3);
}
body[data-theme="arcade"] .op-btn:hover{
  box-shadow:0 0 16px rgba(255,45,120,.5);
}
.op-btn.special{background:var(--green2)}
body[data-theme="arcade"] .op-btn.special{background:var(--green);color:var(--bg)}
.op-btn.danger{background:#e74c3c}
body[data-theme="arcade"] .op-btn.danger{background:var(--yellow);color:var(--bg)}

/* ===== Expression Display ===== */
.expr-area{
  background:var(--surface);
  border:2px solid var(--line);
  border-radius:12px;
  padding:20px;
  margin-bottom:16px;
  text-align:center;
  min-height:80px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:border-color .3s;
}
.expr-display{
  font-size:28px;font-weight:700;
  font-family:'Courier New','Consolas',monospace;
  color:var(--text);
  word-break:break-all;
  min-height:36px;
  line-height:1.4;
}
.expr-display.empty{color:var(--dim);font-size:16px;font-weight:400}
.result-display{
  font-size:20px;font-weight:700;
  color:var(--dim);
}
.result-display.win{color:var(--green);font-size:28px}
body[data-theme="arcade"] .result-display.win{color:var(--green);text-shadow:0 0 10px rgba(0,255,157,.5)}
.expr-area.error-flash{
  animation:error-flash .5s ease;
}
@keyframes error-flash{
  0%,100%{border-color:var(--line);background:var(--surface)}
  25%,75%{border-color:#e74c3c;background:rgba(231,76,60,.08)}
}

/* ===== Action Buttons ===== */
.actions{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
}
.action-btn{
  padding:12px 28px;
  border:none;border-radius:10px;
  font-size:15px;font-weight:700;
  cursor:pointer;
  transition:transform .2s,filter .2s,box-shadow .2s;
  font-family:inherit;
}
.action-btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.action-btn:active{transform:scale(.96)}
.action-btn.skip{background:var(--dim);color:#fff}
.action-btn.hint{background:var(--orange);color:#fff}
.action-btn.next{background:var(--green);color:#fff;display:none}
.action-btn.next.show{display:inline-block;animation:btn-pop .3s ease}
body[data-theme="arcade"] .action-btn.skip{background:var(--line);color:var(--text)}
body[data-theme="arcade"] .action-btn.hint{background:var(--pink)}
body[data-theme="arcade"] .action-btn.hint:hover{box-shadow:0 0 12px rgba(255,45,120,.5)}
body[data-theme="arcade"] .action-btn.next{background:var(--green);color:var(--bg)}
body[data-theme="arcade"] .action-btn.next:hover{box-shadow:0 0 12px rgba(0,255,157,.5)}

@keyframes btn-pop{
  from{transform:scale(.5);opacity:0}
  to{transform:scale(1);opacity:1}
}

/* ===== Hint Display ===== */
.hint-display{
  text-align:center;
  color:var(--orange);
  font-size:16px;font-weight:600;
  margin-top:12px;
  opacity:0;
  transition:opacity .3s;
  min-height:24px;
  font-family:'Courier New','Consolas',monospace;
}
.hint-display.show{opacity:1}
body[data-theme="arcade"] .hint-display{color:var(--yellow)}

/* ===== Taunt Toast ===== */
#taunt{
  position:fixed;top:16%;left:50%;transform:translate(-50%,-20px);z-index:9000;
  padding:10px 18px;
  background:var(--surface);
  border:2px solid var(--orange);
  border-radius:12px;
  color:var(--orange);
  font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;
  transition:all .35s;
  max-width:82vw;text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,.18);
}
#taunt.show{opacity:1;transform:translate(-50%,0)}
body[data-theme="arcade"] #taunt{
  border-color:var(--yellow);color:var(--yellow);
  box-shadow:0 0 14px rgba(255,225,77,.3);
}

/* ===== Celebration ===== */
#celebration{
  position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;display:none;
}
#celebration.active{display:block}
.confetti-piece{
  position:absolute;top:-20px;
  animation:confetti-fall linear forwards;
}
@keyframes confetti-fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0}
}

.win-banner{
  position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(0);
  z-index:10000;
  font-size:48px;font-weight:800;
  color:var(--green);
  pointer-events:none;
  opacity:0;
  transition:all .4s cubic-bezier(.34,1.56,.64,1);
  white-space:nowrap;
}
.win-banner.show{transform:translate(-50%,-50%) scale(1);opacity:1}
body[data-theme="arcade"] .win-banner{
  font-family:'Press Start 2P',monospace;font-size:28px;
  color:var(--green);text-shadow:0 0 20px rgba(0,255,157,.6),0 0 40px rgba(0,255,157,.3);
}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);
  white-space:nowrap;border:0;
}

/* ===== Responsive ===== */
@media(max-width:480px){
  main{padding:70px 12px 90px}
  .num-card{width:64px;height:84px;font-size:34px;border-radius:10px}
  .op-btn{width:44px;height:44px;font-size:18px;border-radius:10px}
  .expr-display{font-size:22px}
  .h4399 .title{font-size:26px}
  .harcade h1{font-size:20px}
  .harcade .logo-bar{font-size:7px}
  .harcade .subtitle{font-size:6px}
  .stat-item{padding:4px 8px;font-size:12px}
  .action-btn{padding:10px 20px;font-size:14px}
}

/* ===== 美学增强 (frontend-design) ===== */

/* 数字卡片：渐变质感 + 内发光 */
.num-card{
  background:linear-gradient(145deg,var(--surface),color-mix(in srgb,var(--surface) 88%,var(--green) 12%));
  box-shadow:0 4px 14px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.12);
  letter-spacing:-1px;
}
body[data-theme="arcade"] .num-card{
  background:linear-gradient(145deg,#1c1c3a,#191934 60%,#15152c);
  box-shadow:0 0 10px rgba(61,225,255,.18),inset 0 0 12px rgba(61,225,255,.05),inset 0 1px 0 rgba(255,255,255,.06);
}
.num-card:hover:not(.used){
  transform:translateY(-6px) scale(1.05);
  box-shadow:0 12px 26px rgba(0,0,0,.16),0 0 0 2px color-mix(in srgb,var(--green) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.16);
}
body[data-theme="arcade"] .num-card:hover:not(.used){
  box-shadow:0 0 22px rgba(61,225,255,.45),0 12px 26px rgba(0,0,0,.35),inset 0 0 16px rgba(61,225,255,.08);
}
.num-card:active:not(.used){
  transform:scale(.93);
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

/* 运算符按钮：渐变 + 按压缩放 + 呼吸光晕 */
.op-btn{
  background:linear-gradient(145deg,var(--orange),var(--orange2));
  box-shadow:0 4px 12px rgba(251,100,0,.28),inset 0 1px 0 rgba(255,255,255,.2);
  text-shadow:0 1px 2px rgba(0,0,0,.15);
}
.op-btn:hover{transform:translateY(-3px) scale(1.06);filter:brightness(1.08);box-shadow:0 8px 18px rgba(251,100,0,.35)}
.op-btn:active{transform:scale(.9);box-shadow:0 2px 6px rgba(0,0,0,.15)}
body[data-theme="arcade"] .op-btn{
  background:linear-gradient(145deg,#ff3a86,#ff2d78);
  box-shadow:0 0 12px rgba(255,45,120,.35),inset 0 1px 0 rgba(255,255,255,.15);
}
body[data-theme="arcade"] .op-btn:hover{box-shadow:0 0 20px rgba(255,45,120,.6)}
.op-btn.special{
  background:linear-gradient(145deg,var(--green2),var(--green));
  box-shadow:0 4px 12px rgba(56,153,4,.25),inset 0 1px 0 rgba(255,255,255,.18);
}
.op-btn.danger{
  background:linear-gradient(145deg,#e74c3c,#c0392b);
  box-shadow:0 4px 12px rgba(231,76,60,.3),inset 0 1px 0 rgba(255,255,255,.15);
}
body[data-theme="arcade"] .op-btn.danger{
  background:linear-gradient(145deg,#ffe14d,#ffd21a);
  color:var(--bg);
  box-shadow:0 0 12px rgba(255,225,77,.35);
}

/* 表达式区：层次与发光 */
.expr-area{
  box-shadow:inset 0 2px 8px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04);
  border-radius:16px;
}
body[data-theme="arcade"] .expr-area{
  box-shadow:inset 0 2px 12px rgba(0,0,0,.4),0 0 18px rgba(61,225,255,.08);
  border-radius:4px;
}
.expr-display{letter-spacing:1px}

/* 模式按钮：激活态增强 */
.mode-btn.active{
  box-shadow:0 6px 18px rgba(56,153,4,.3),inset 0 1px 0 rgba(255,255,255,.2);
}
body[data-theme="arcade"] .mode-btn.active{
  box-shadow:0 0 16px rgba(61,225,255,.45),0 6px 18px rgba(0,0,0,.3);
}

/* 操作按钮：质感 */
.action-btn{
  box-shadow:0 4px 12px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.18);
}
.action-btn:hover{box-shadow:0 8px 18px rgba(0,0,0,.18)}

/* 统计项：胶囊质感 */
.stat-item{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 6px rgba(0,0,0,.04);
}

/* Taunt Toast：更醒目 + 浮动动画 */
#taunt{
  padding:12px 22px;
  font-size:15px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.2),0 0 0 1px color-mix(in srgb,var(--orange) 30%,transparent);
  backdrop-filter:blur(8px);
  letter-spacing:.3px;
}
body[data-theme="arcade"] #taunt{
  border-radius:4px;
  font-family:'Press Start 2P',monospace;
  font-size:10px;
  letter-spacing:1px;
  box-shadow:0 0 20px rgba(255,225,77,.4),6px 6px 0 var(--hard);
  text-shadow:0 0 8px rgba(255,225,77,.6);
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation:none!important;
    transition:none!important;
    scroll-behavior:auto!important;
  }
  .back-btn:hover,#theme-switch:hover,
  .num-card:hover:not(.used),.num-card:active:not(.used),
  .op-btn:hover,.op-btn:active,
  .action-btn:hover,.action-btn:active{
    transform:none!important;
  }
  .win-banner,.win-banner.show{transform:translate(-50%,-50%) scale(1)}
}
</style>
</head>
<body>
<script>
(function() {
  document.body.setAttribute('data-theme', document.documentElement.getAttribute('data-theme') || '4399');
}());
</script>

<!-- Loader -->
<div id="loader"><div class="spinner"></div></div>

<!-- Back Button -->
<a href="../index.html" class="back-btn">&#8592; 主页</a>

<!-- Theme Switcher -->
<button type="button" id="theme-switch" title="切换主题" aria-label="切换主题"></button>

<!-- Celebration Overlay -->
<div id="celebration"></div>
<div class="win-banner" id="win-banner">24!</div>

<!-- Taunt Toast -->
<div id="taunt"></div>

<!-- Main Game -->
<main>
  <div class="sr-only" id="game-status" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- 4399 Header -->
  <header class="h4399">
    <div class="topbar"><div class="logo">🔢</div><div class="title">24点 <em>Make 24</em></div></div>
    <div class="subtitle">// use four numbers to make 24</div>
  </header>

  <!-- Arcade Header -->
  <header class="harcade">
    <div class="logo-bar">▶ INSERT COIN ◀</div>
    <h1><span class="p">MAKE</span> <span class="c">24</span></h1>
    <div class="subtitle">// four numbers one goal</div>
  </header>

  <!-- Mode Selector (vertical) -->
  <div class="mode-list" role="group" aria-label="游戏模式">
    <button type="button" class="mode-btn active" data-mode="simple" aria-pressed="true">
      <span>简单模式</span>
    </button>
    <button type="button" class="mode-btn" data-mode="challenge" aria-pressed="false">
      <span>挑战模式</span>
    </button>
  </div>

  <!-- Stats -->
  <div class="stats-bar">
    <div class="stat-item"><span class="stat-icon">✓</span><span class="stat-value" id="stat-completed">0</span><span class="stat-label">完成</span></div>
    <div class="stat-item"><span class="stat-icon">↻</span><span class="stat-value" id="stat-skipped">0</span><span class="stat-label">跳过</span></div>
    <div class="stat-item"><span class="stat-icon">⏱</span><span class="stat-value" id="stat-time">0:00</span><span class="stat-label">用时</span></div>
    <div class="stat-item"><span class="stat-icon">🔥</span><span class="stat-value" id="stat-streak">0</span><span class="stat-label">连胜</span></div>
    <div class="stat-item"><span class="stat-icon">🏆</span><span class="stat-value" id="stat-best">0</span><span class="stat-label">最佳</span></div>
  </div>

  <!-- Number Cards -->
  <div class="numbers" id="numbers" role="group" aria-label="本题数字"></div>

  <!-- Operators -->
  <div class="operators">
    <button type="button" class="op-btn" data-op="+">+</button>
    <button type="button" class="op-btn" data-op="-">-</button>
    <button type="button" class="op-btn" data-op="×">×</button>
    <button type="button" class="op-btn" data-op="÷">÷</button>
    <button type="button" class="op-btn" data-op="(">(</button>
    <button type="button" class="op-btn" data-op=")">)</button>
    <button type="button" class="op-btn special" data-op="back" aria-label="退格">⌫</button>
    <button type="button" class="op-btn danger" data-op="clear" aria-label="清空表达式">C</button>
  </div>

  <!-- Expression Display -->
  <div class="expr-area" id="expr-area">
    <div class="expr-display empty" id="expr-display">点击数字开始</div>
    <div class="result-display" id="result-display"></div>
  </div>

  <!-- Hint -->
  <div class="hint-display" id="hint-display"></div>

  <!-- Actions -->
  <div class="actions">
    <button type="button" class="action-btn skip" id="btn-skip">跳过</button>
    <button type="button" class="action-btn hint" id="btn-hint">提示</button>
    <button type="button" class="action-btn next" id="btn-next">下一题 →</button>
  </div>
</main>

<script>
// ===== State =====
var state = {
  numbers: [],
  used: [false, false, false, false],
  tokens: [],
  mode: 'simple',
  startTime: null,
  timerInterval: null,
  celebrationTimers: [],
  solved: false,
  stats: {
    completed: 0,
    skipped: 0,
    streak: 0,
    bestStreak: 0
  }
};

// ===== DOM References =====
var numbersEl = document.getElementById('numbers');
var exprDisplay = document.getElementById('expr-display');
var resultDisplay = document.getElementById('result-display');
var exprArea = document.getElementById('expr-area');
var hintDisplay = document.getElementById('hint-display');
var btnSkip = document.getElementById('btn-skip');
var btnHint = document.getElementById('btn-hint');
var btnNext = document.getElementById('btn-next');
var statCompleted = document.getElementById('stat-completed');
var statSkipped = document.getElementById('stat-skipped');
var statTime = document.getElementById('stat-time');
var statStreak = document.getElementById('stat-streak');
var statBest = document.getElementById('stat-best');
var gameStatus = document.getElementById('game-status');
var celebrationEl = document.getElementById('celebration');
var winBanner = document.getElementById('win-banner');
var tauntEl = document.getElementById('taunt');
var reducedMotionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;

function prefersReducedMotion() {
  return !!(reducedMotionQuery && reducedMotionQuery.matches);
}

function announceStatus(message) {
  gameStatus.textContent = message;
}

// ===== 24-Point Solver (exact fractions, avoids float errors) =====
function gcd(a, b) { while (b) { var t = a % b; a = b; b = t; } return a || 1; }
function makeFrac(num, den) {
  if (den < 0) { num = -num; den = -den; }
  var g = gcd(Math.abs(num), Math.abs(den));
  return { num: num / g, den: den / g };
}
function fAdd(a, b) { return makeFrac(a.num * b.den + b.num * a.den, a.den * b.den); }
function fSub(a, b) { return makeFrac(a.num * b.den - b.num * a.den, a.den * b.den); }
function fMul(a, b) { return makeFrac(a.num * b.num, a.den * b.den); }
function fDiv(a, b) { return makeFrac(a.num * b.den, a.den * b.num); }
function isInt(f) { return f.den === 1; }
function toFrac(n) { return { num: n, den: 1 }; }

// Full search (fractions allowed) — determines solvability
function solveWith(items) {
  if (items.length === 1) return items[0].num === 24 * items[0].den;
  for (var i = 0; i < items.length; i++) {
    for (var j = i + 1; j < items.length; j++) {
      var rest = items.filter(function(_, k) { return k !== i && k !== j; });
      var a = items[i], b = items[j];
      var ops = [fAdd(a, b), fSub(a, b), fSub(b, a), fMul(a, b)];
      if (b.num !== 0) ops.push(fDiv(a, b));
      if (a.num !== 0) ops.push(fDiv(b, a));
      for (var k = 0; k < ops.length; k++) {
        if (solveWith(rest.concat([ops[k]]))) return true;
      }
    }
  }
  return false;
}

// Integer-only search — every intermediate must stay an integer
function solveIntOnly(items) {
  if (items.length === 1) return items[0].num === 24 * items[0].den;
  for (var i = 0; i < items.length; i++) {
    for (var j = i + 1; j < items.length; j++) {
      var rest = items.filter(function(_, k) { return k !== i && k !== j; });
      var a = items[i], b = items[j];
      var cands = [fAdd(a, b), fSub(a, b), fSub(b, a), fMul(a, b)];
      if (b.num !== 0) cands.push(fDiv(a, b));
      if (a.num !== 0) cands.push(fDiv(b, a));
      for (var k = 0; k < cands.length; k++) {
        if (isInt(cands[k])) {
          if (solveIntOnly(rest.concat([cands[k]]))) return true;
        }
      }
    }
  }
  return false;
}

function solvable(nums) {
  return solveWith(nums.map(toFrac));
}

// A puzzle "requires an intermediate fraction" if it's solvable but has
// no solution that stays integer at every intermediate step.
function requiresFraction(nums) {
  return solveWith(nums.map(toFrac)) && !solveIntOnly(nums.map(toFrac));
}

// Return a solution expression string (for hint)
function solveExpr(items) {
  if (items.length === 1) {
    if (items[0].num === 24 * items[0].den) return items[0].expr;
    return null;
  }
  for (var i = 0; i < items.length; i++) {
    for (var j = i + 1; j < items.length; j++) {
      var rest = items.filter(function(_, k) { return k !== i && k !== j; });
      var a = items[i], b = items[j];
      var ops = [
        { v: fAdd(a, b), e: '(' + a.expr + '+' + b.expr + ')' },
        { v: fSub(a, b), e: '(' + a.expr + '-' + b.expr + ')' },
        { v: fSub(b, a), e: '(' + b.expr + '-' + a.expr + ')' },
        { v: fMul(a, b), e: '(' + a.expr + '×' + b.expr + ')' }
      ];
      if (b.num !== 0) ops.push({ v: fDiv(a, b), e: '(' + a.expr + '÷' + b.expr + ')' });
      if (a.num !== 0) ops.push({ v: fDiv(b, a), e: '(' + b.expr + '÷' + a.expr + ')' });
      for (var k = 0; k < ops.length; k++) {
        var r = solveExpr(rest.concat([{ num: ops[k].v.num, den: ops[k].v.den, expr: ops[k].e }]));
        if (r) return r;
      }
    }
  }
  return null;
}

function cleanExpr(expr) {
  while (expr.length >= 2 && expr[0] === '(' && expr[expr.length - 1] === ')') {
    var depth = 0;
    var isMatching = false;
    for (var i = 0; i < expr.length; i++) {
      if (expr[i] === '(') depth++;
      if (expr[i] === ')') depth--;
      if (depth === 0) {
        isMatching = (i === expr.length - 1);
        break;
      }
    }
    if (isMatching) {
      expr = expr.slice(1, -1);
    } else {
      break;
    }
  }
  return expr;
}

// ===== Puzzle Generation =====
var classicPool = [
  [3, 8, 3, 8],   // 8÷(3-8÷3)=24
  [1, 4, 5, 6],   // 6÷(5÷4-1)=24
  [1, 3, 4, 6],
  [1, 5, 5, 5]
];
var challengePool = [
  [1, 6, 6, 8], [1, 8, 12, 12], [2, 2, 11, 11], [2, 2, 13, 13],
  [2, 3, 5, 12], [2, 4, 10, 10], [2, 5, 5, 10], [2, 7, 7, 10],
  [3, 3, 7, 7], [4, 4, 7, 7], [5, 5, 7, 11], [5, 7, 7, 11]
];

function shuffledPuzzle(puzzle) {
  var result = puzzle.slice();
  for (var i = result.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = result[i];
    result[i] = result[j];
    result[j] = temp;
  }
  return result;
}

function generatePuzzle() {
  var mode = state.mode;
  var attempts = 0;
  if (mode === 'challenge') {
    var pool = Math.random() < 0.4 ? classicPool : challengePool;
    return shuffledPuzzle(pool[Math.floor(Math.random() * pool.length)]);
  }
  while (attempts < 600) {
    attempts++;
    var s = [];
    for (var i = 0; i < 4; i++) s.push(Math.floor(Math.random() * 9) + 1); // 1-9 primary
    if (solvable(s)) return s;
  }
  // Fallback
  return [1, 2, 3, 4].slice();
}

// ===== Taunt Library (30 items) =====

  '再卡几秒，屏幕都要打哈欠了',
  '快醒醒，24 在等你认领',

  '我都替你的计算器着急',
  '深呼吸，答案自己会跑出来',
  '这局就靠你了，别放弃'
];
var tauntTimers = [];

function showTaunt(msg) {
  tauntEl.textContent = msg;
  tauntEl.classList.add('show');
  clearTimeout(showTaunt._h);
  showTaunt._h = setTimeout(function() {
    tauntEl.classList.remove('show');
    showTaunt._h = null;
  }, 2600);
}
function scheduleTaunts() {
  clearTaunts();
  var usedIdx = [];
  function pick() {
    var i = Math.floor(Math.random() * tauntLines.length);
    var guard = 0;
    while (usedIdx.indexOf(i) >= 0 && guard < 40) { i = Math.floor(Math.random() * tauntLines.length); guard++; }
    usedIdx.push(i);
    return tauntLines[i];
  }
  tauntTimers.push(setTimeout(function() { showTaunt(pick()); }, 5000));
  tauntTimers.push(setTimeout(function() { showTaunt(pick()); }, 10000));
  tauntTimers.push(setTimeout(function() { showTaunt(pick()); }, 24000));
}
function clearTaunts() {
  tauntTimers.forEach(function(id) { clearTimeout(id); });
  tauntTimers = [];
  clearTimeout(showTaunt._h);
  showTaunt._h = null;
  tauntEl.classList.remove('show');
}

// ===== Expression Building =====
function addNumber(cardIndex) {
  if (state.used[cardIndex] || state.solved) return;
  state.used[cardIndex] = true;
  state.tokens.push({ type: 'num', value: state.numbers[cardIndex], cardIndex: cardIndex });
  updateDisplay();
}

function addOperator(op) {
  if (state.solved) return;
  state.tokens.push({ type: 'op', value: op });
  updateDisplay();
}

function backspace() {
  if (state.tokens.length === 0 || state.solved) return;
  var last = state.tokens.pop();
  if (last.type === 'num') {
    state.used[last.cardIndex] = false;
  }
  updateDisplay();
}

function clearExpression() {
  if (state.solved) return;
  state.tokens = [];
  state.used = [false, false, false, false];
  updateDisplay();
}

function getDisplayExpression() {
  return state.tokens.map(function(t) { return t.value; }).join('');
}

function evaluateTokens(tokens) {
  if (!tokens || tokens.length === 0 || tokens.length > 64) return null;
  var index = 0;

  function isFiniteNumber(value) {
    return typeof value === 'number' && isFinite(value);
  }

  function parsePrimary() {
    var token = tokens[index];
    if (!token) return null;

    if (token.type === 'num') {
      if (!isFiniteNumber(token.value)) return null;
      index++;
      return token.value;
    }

    if (token.type === 'op' && token.value === '(') {
      index++;
      var value = parseExpression();
      var closing = tokens[index];
      if (value === null || !closing || closing.type !== 'op' || closing.value !== ')') return null;
      index++;
      return value;
    }

    return null;
  }

  function parseTerm() {
    var value = parsePrimary();
    if (value === null) return null;

    while (index < tokens.length) {
      var token = tokens[index];
      if (!token || token.type !== 'op' || (token.value !== '×' && token.value !== '÷')) break;
      index++;

      var right = parsePrimary();
      if (right === null || (token.value === '÷' && right === 0)) return null;
      value = token.value === '×' ? value * right : value / right;
      if (!isFiniteNumber(value)) return null;
    }

    return value;
  }

  function parseExpression() {
    var value = parseTerm();
    if (value === null) return null;

    while (index < tokens.length) {
      var token = tokens[index];
      if (!token || token.type !== 'op' || (token.value !== '+' && token.value !== '-')) break;
      index++;

      var right = parseTerm();
      if (right === null) return null;
      value = token.value === '+' ? value + right : value - right;
      if (!isFiniteNumber(value)) return null;
    }

    return value;
  }

  var result = parseExpression();
  if (result === null || index !== tokens.length || !isFiniteNumber(result)) return null;
  return result;
}

function evaluateExpression() {
  return evaluateTokens(state.tokens);
}

function allCardsUsed() {
  return state.used.every(function(u) { return u; });
}

function formatNumber(n) {
  if (Number.isInteger(n)) return String(n);
  return parseFloat(n.toFixed(4)).toString();
}

function updateDisplay(shouldAnnounce) {
  updateNumberCards();

  var exprStr = getDisplayExpression();
  if (!exprStr) {
    exprDisplay.textContent = '点击数字开始';
    exprDisplay.className = 'expr-display empty';
    resultDisplay.textContent = '';
    resultDisplay.className = 'result-display';
    if (shouldAnnounce !== false) announceStatus('算式已清空。');
    return;
  }

  exprDisplay.textContent = exprStr;
  exprDisplay.className = 'expr-display';

  var result = evaluateExpression();

  if (result === null) {
    resultDisplay.textContent = '...';
    resultDisplay.className = 'result-display';
    if (shouldAnnounce !== false) announceStatus('当前算式：' + exprStr + '，尚未完成。');
  } else if (Math.abs(result - 24) < 1e-6 && allCardsUsed()) {
    resultDisplay.textContent = '= 24 🎉';
    resultDisplay.className = 'result-display win';
    win();
  } else {
    var formattedResult = formatNumber(result);
    resultDisplay.textContent = '= ' + formattedResult;
    resultDisplay.className = 'result-display';
    if (allCardsUsed()) {
      showErrorFlash();
      if (shouldAnnounce !== false) announceStatus('当前算式：' + exprStr + '，结果为 ' + formattedResult + '，还不是 24。');
    } else if (shouldAnnounce !== false) {
      announceStatus('当前算式：' + exprStr + '，结果为 ' + formattedResult + '。');
    }
  }
}

// ===== Rendering =====
function renderNumbers() {
  numbersEl.innerHTML = '';
  state.numbers.forEach(function(n, i) {
    var card = document.createElement('button');
    card.type = 'button';
    card.className = 'num-card';
    card.textContent = n;
    card.setAttribute('aria-label', '数字 ' + n + '，第 ' + (i + 1) + ' 张卡片');
    card.style.animationDelay = (i * 0.08) + 's';
    (function(idx) {
      card.addEventListener('click', function() { addNumber(idx); });
    })(i);
    numbersEl.appendChild(card);
  });
  updateNumberCards();
}

function updateNumberCards() {
  var cards = numbersEl.children;
  for (var i = 0; i < cards.length; i++) {
    var used = state.used[i];
    if (cards[i].disabled === used) continue;
    cards[i].disabled = used;
    if (used) cards[i].classList.add('used');
    else cards[i].classList.remove('used');
    cards[i].setAttribute('aria-label', '数字 ' + state.numbers[i] + '，第 ' + (i + 1) + ' 张卡片' + (used ? '，已使用' : ''));
  }
}

function updateModeButtons() {
  document.querySelectorAll('.mode-btn').forEach(function(btn) {
    var active = btn.dataset.mode === state.mode;
    if (active) btn.classList.add('active');
    else btn.classList.remove('active');
    btn.setAttribute('aria-pressed', active ? 'true' : 'false');
  });
}

function renderStats() {
  statCompleted.textContent = state.stats.completed;
  statSkipped.textContent = state.stats.skipped;
  statStreak.textContent = state.stats.streak;
  statBest.textContent = state.stats.bestStreak;
}

// ===== Error Flash =====
var errorFlashTimer = null;

function clearErrorFlash() {
  clearTimeout(errorFlashTimer);
  errorFlashTimer = null;
  exprArea.classList.remove('error-flash');
}

function showErrorFlash() {
  clearErrorFlash();
  if (prefersReducedMotion()) return;
  void exprArea.offsetWidth;
  exprArea.classList.add('error-flash');
  errorFlashTimer = setTimeout(function() {
    exprArea.classList.remove('error-flash');
    errorFlashTimer = null;
  }, 600);
}

// ===== Win =====
function win() {
  if (state.solved) return;
  state.solved = true;
  stopTimer();
  clearTaunts(); // no more taunts once solved

  state.stats.completed++;
  state.stats.streak++;
  if (state.stats.streak > state.stats.bestStreak) {
    state.stats.bestStreak = state.stats.streak;
  }
  saveStats();
  renderStats();

  showCelebration();
  btnNext.classList.add('show');
  hintDisplay.classList.remove('show');
  announceStatus('回答正确，' + getDisplayExpression() + ' 等于 24。');
}

// ===== Celebration =====
function clearCelebration() {
  state.celebrationTimers.forEach(function(id) { clearTimeout(id); });
  state.celebrationTimers = [];
  celebrationEl.classList.remove('active');
  celebrationEl.innerHTML = '';
  winBanner.classList.remove('show');
}

function setCelebrationTimer(callback, delay) {
  var id = setTimeout(function() {
    var index = state.celebrationTimers.indexOf(id);
    if (index >= 0) state.celebrationTimers.splice(index, 1);
    callback();
  }, delay);
  state.celebrationTimers.push(id);
}

function showCelebration() {
  clearCelebration();
  var reducedMotion = prefersReducedMotion();
  var theme = document.body.dataset.theme;
  var colors = theme === 'arcade'
    ? ['#00ff9d', '#ff2d78', '#3de1ff', '#ffe14d', '#a06bff']
    : ['#389904', '#fb6400', '#e64e00', '#448230', '#ffd700', '#ff6b6b'];

  if (!reducedMotion) {
    for (var i = 0; i < 80; i++) {
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = (Math.random() * 100) + '%';
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.animationDelay = (Math.random() * 0.5) + 's';
      piece.style.animationDuration = (2 + Math.random() * 2) + 's';
      var size = 6 + Math.random() * 8;
      piece.style.width = size + 'px';
      piece.style.height = size + 'px';
      if (Math.random() > 0.5) piece.style.borderRadius = '50%';
      celebrationEl.appendChild(piece);
    }
    celebrationEl.classList.add('active');
  }
  winBanner.textContent = theme === 'arcade' ? '24! WIN!' : '🎉 24! 🎉';
  winBanner.classList.add('show');

  setCelebrationTimer(function() {
    celebrationEl.classList.remove('active');
    winBanner.classList.remove('show');
    if (reducedMotion) {
      celebrationEl.innerHTML = '';
    } else {
      setCelebrationTimer(function() { celebrationEl.innerHTML = ''; }, 500);
    }
  }, reducedMotion ? 1200 : 3000);
}

// ===== Game Flow =====
function newPuzzle(statusPrefix) {
  if (typeof statusPrefix !== 'string') statusPrefix = '';
  stopTimer();
  clearTaunts();
  clearCelebration();
  clearErrorFlash();

  state.solved = false;
  state.used = [false, false, false, false];
  state.tokens = [];
  btnNext.classList.remove('show');
  hintDisplay.classList.remove('show');
  hintDisplay.textContent = '';
  exprDisplay.textContent = '点击数字开始';
  exprDisplay.className = 'expr-display empty';
  resultDisplay.textContent = '';
  resultDisplay.className = 'result-display';

  state.numbers = generatePuzzle();
  renderNumbers();
  updateDisplay(false);
  startTimer();
  scheduleTaunts();
  announceStatus((statusPrefix ? statusPrefix + ' ' : '') + (state.mode === 'challenge' ? '挑战模式' : '简单模式') + '新题。数字：' + state.numbers.join('、') + '。');
}

function abandonCurrentPuzzle() {
  if (state.solved) return false;
  state.stats.skipped++;
  state.stats.streak = 0;
  saveStats();
  renderStats();
  return true;
}

function skip() {
  var abandoned = abandonCurrentPuzzle();
  newPuzzle(abandoned ? '已跳过上一题。' : '');
}

function showHint() {
  if (state.solved) return;
  var solution = solveExpr(state.numbers.map(function(n) {
    return { num: n, den: 1, expr: String(n) };
  }));
  if (solution) {
    hintDisplay.textContent = '💡 ' + cleanExpr(solution) + ' = 24';
  } else {
    hintDisplay.textContent = '💡 本题无解';
  }
  hintDisplay.classList.add('show');
  announceStatus(hintDisplay.textContent);
}

// ===== Timer =====
function startTimer() {
  stopTimer();
  state.startTime = Date.now();
  state.timerInterval = setInterval(function() {
    var elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    statTime.textContent = formatTime(elapsed);
  }, 1000);
  statTime.textContent = '0:00';
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
}

function formatTime(s) {
  var m = Math.floor(s / 60);
  var sec = s % 60;
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// ===== Stats Persistence =====
function loadStats() {
  try {
    var saved = JSON.parse(localStorage.getItem('game-24-stats'));
    if (saved) {
      state.stats.bestStreak = saved.bestStreak || 0;
      state.stats.completed = saved.completed || 0;
      state.stats.skipped = saved.skipped || 0;
    }
  } catch (e) {}
}

function saveStats() {
  try {
    localStorage.setItem('game-24-stats', JSON.stringify({
      bestStreak: state.stats.bestStreak,
      completed: state.stats.completed,
      skipped: state.stats.skipped
    }));
  } catch (e) {}
}

// ===== Theme =====
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.documentElement.style.backgroundColor = theme === 'arcade' ? '#0b0b18' : '#f4f8ef';
  document.body.setAttribute('data-theme', theme);
}

function initTheme() {
  var saved = document.documentElement.getAttribute('data-theme') || '4399';
  try {
    saved = localStorage.getItem('gh-theme') || saved;
  } catch (e) {}
  if (saved !== '4399' && saved !== 'arcade') saved = '4399';
  applyTheme(saved);
  updateThemeIcon();
}

function switchTheme() {
  var loader = document.getElementById('loader');
  loader.style.display = 'flex';
  function finishSwitch() {
    try {
      var current = document.body.dataset.theme;
      var next = current === '4399' ? 'arcade' : '4399';
      applyTheme(next);
      try {
        localStorage.setItem('gh-theme', next);
      } catch (e) {}
      updateThemeIcon();
      announceStatus(next === 'arcade' ? '已切换到街机暗色主题。' : '已切换到日间清新主题。');
    } finally {
      loader.style.display = 'none';
    }
  }
  if (prefersReducedMotion()) finishSwitch();
  else setTimeout(finishSwitch, 400);
}

function updateThemeIcon() {
  var theme = document.body.dataset.theme;
  var btn = document.getElementById('theme-switch');
  if (theme === '4399') {
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 12 L21 6 A10 10 0 1 0 21 18 Z"/><circle cx="13.5" cy="7.5" r="1.1" fill="#ffffff"/></svg>';
    btn.setAttribute('aria-label', '切换到街机暗色主题');
    btn.title = '切换到街机暗色主题';
  } else {
    btn.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3C9.8 3 8 4.8 8 7c0 .6.1 1.2.4 1.7C6.5 9.4 5.2 11 5.2 13c0 2.2 1.8 4 4 4h5.6c2.2 0 4-1.8 4-4 0-2-1.3-3.6-3.2-4.3.3-.5.4-1.1.4-1.7 0-2.2-1.8-4-4-4z"/><path d="M12 17v4"/><path d="M12 21l-3 2M12 21l3 2"/></svg>';
    btn.setAttribute('aria-label', '切换到日间清新主题');
    btn.title = '切换到日间清新主题';
  }
}

// ===== Event Listeners =====
document.querySelectorAll('.op-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var op = btn.dataset.op;
    if (op === 'back') backspace();
    else if (op === 'clear') clearExpression();
    else addOperator(op);
  });
});

document.querySelectorAll('.mode-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var nextMode = btn.dataset.mode;
    if (nextMode === state.mode) return;
    var abandoned = abandonCurrentPuzzle();
    state.mode = nextMode;
    updateModeButtons();
    newPuzzle((abandoned ? '上一题已计为跳过。' : '') + '已切换到' + (nextMode === 'challenge' ? '挑战模式。' : '简单模式。'));
  });
});

btnSkip.addEventListener('click', skip);
btnHint.addEventListener('click', showHint);
btnNext.addEventListener('click', newPuzzle);
document.getElementById('theme-switch').addEventListener('click', switchTheme);

// Keyboard support
function isInteractiveTarget(target) {
  while (target && target !== document) {
    var tagName = target.tagName ? target.tagName.toLowerCase() : '';
    if (tagName === 'button' || tagName === 'a' || tagName === 'input' || tagName === 'select' || tagName === 'textarea' || tagName === 'summary') return true;
    if (target.isContentEditable) return true;
    if (target.getAttribute && target.getAttribute('tabindex') !== null) return true;
    target = target.parentNode;
  }
  return false;
}

document.addEventListener('keydown', function(e) {
  if (state.solved) {
    if ((e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') && !isInteractiveTarget(e.target)) {
      e.preventDefault();
      newPuzzle();
    }
    return;
  }
  if (e.key === 'Backspace') { e.preventDefault(); backspace(); }
  else if (e.key === 'Escape') { clearExpression(); }
  else if (e.key === '+') { addOperator('+'); }
  else if (e.key === '-') { addOperator('-'); }
  else if (e.key === '*' || e.key === 'x' || e.key === 'X') { addOperator('×'); }
  else if (e.key === '/') { e.preventDefault(); addOperator('÷'); }
  else if (e.key === '(') { addOperator('('); }
  else if (e.key === ')') { addOperator(')'); }
  else if (e.key >= '0' && e.key <= '9') {
    var num = parseInt(e.key);
    for (var i = 0; i < state.numbers.length; i++) {
      if (!state.used[i] && state.numbers[i] === num) {
        addNumber(i);
        break;
      }
    }
  }
});

// ===== Init =====
function init() {
  initTheme();
  loadStats();
  renderStats();
  updateModeButtons();
  newPuzzle();
}

init();
</script>
</body>
