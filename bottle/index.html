<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0b1322" />
    <title>Decanta: Water Sort</title>
    <!-- Tab favicon. / is swapped by Vite for the deploy base (/ locally, /decanta-water-sort/ on Pages). -->
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <!-- iOS doesn't read the manifest for "add to home screen" — it needs these separate tags. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="倒水" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <script type="module" crossorigin src="./assets/index-DhMYQyOW.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/Geometry-DtZ4-p-4.js">
    <link rel="modulepreload" crossorigin href="./assets/RenderTargetSystem-CFWUoMLd.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CpaC40FQ.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <div id="root">
      <!-- Boot loader: pure inline HTML/CSS so it shows even while the JS bundle is still
           downloading (slow networks / first PWA load). React's first render replaces the
           children of #root, which removes it automatically. -->
      <style>
        #boot { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; background: #0b1322; }
        #boot .r { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #1e293b; border-top-color: #2dd4bf; animation: bootspin 0.8s linear infinite; }
        #boot .t { color: #475569; font: 600 12px/1 system-ui, sans-serif; letter-spacing: 0.34em; padding-left: 0.34em; }
        #boot .bar { width: 180px; height: 3px; border-radius: 2px; background: #1e293b; overflow: hidden; }
        #boot .bar i { display: block; height: 100%; width: 40%; border-radius: 2px; background: linear-gradient(90deg, rgba(45,212,191,0), #2dd4bf, rgba(45,212,191,0)); animation: bootslide 1.3s ease-in-out infinite; }
        #boot .h { color: #64748b; font: 500 11px/1.5 system-ui, sans-serif; letter-spacing: 0.08em; }
        #boot .warn { color: #fbbf24; font: 500 12px/1.5 system-ui, sans-serif; text-align: center; }
        #boot .retry { padding: 9px 20px; border-radius: 999px; border: 1px solid rgba(45,212,191,0.5); background: rgba(45,212,191,0.12); color: #2dd4bf; font: 600 12px/1 system-ui, sans-serif; letter-spacing: 0.1em; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        @keyframes bootspin { to { transform: rotate(360deg); } }
        @keyframes bootslide { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
        @media (prefers-reduced-motion: reduce) {
          #boot .r { animation-duration: 2.4s; }
          #boot .bar i { animation: none; transform: translateX(75%); }
        }
      </style>
      <div id="boot">
        <div class="r"></div>
        <div class="t">DECANTA</div>
        <div class="bar"><i></i></div>
        <div class="h">首次加载资源较大，请稍候 · LOADING ASSETS</div>
      </div>
    </div>

    <!-- Timeout fallback: if the bundle hasn't rendered (removed #boot) after 12s,
         show a hint + retry button. Pure inline, no external deps. -->
    <script>
      (function () {
        setTimeout(function () {
          var boot = document.getElementById('boot');
          if (!boot || boot.getAttribute('data-warned')) return;
          boot.setAttribute('data-warned', '1');
          var msg = document.createElement('div');
          msg.className = 'warn';
          msg.textContent = '加载时间较长：请检查网络，或点击重试';
          var btn = document.createElement('button');
          btn.className = 'retry';
          btn.type = 'button';
          btn.textContent = '重试 RETRY';
          btn.onclick = function () { location.reload(); };
          boot.appendChild(msg);
          boot.appendChild(btn);
        }, 12000);
      })();
    </script>

    <!-- 返回主页按钮 (独立于React DOM) -->
    <a id="bottle-home-btn" href="../index.html" style="position:fixed;top:12px;left:12px;z-index:2147483000;
      text-decoration:none;font:700 14px/1 system-ui,sans-serif;padding:13px 16px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;
      background:rgba(11,19,34,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#e6f6ff;border:1px solid rgba(45,212,191,.35);
      box-shadow:0 2px 10px rgba(0,0,0,.35);transition:.2s;letter-spacing:.5px;-webkit-tap-highlight-color:transparent;user-select:none">← 主页</a>

  </body>
</html>
