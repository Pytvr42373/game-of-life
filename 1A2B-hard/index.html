<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script>try{if(localStorage.getItem('gh-theme')==='arcade')document.documentElement.classList.add('pre-arcade')}catch(e){}</script>
<style>html{background:#f4f8ef}html.pre-arcade{background:#0b0b18}</style>
<title>1A2B 猜数字 · 难版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bungee&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bungee&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet"></noscript>
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* ============ 4399 主题变量（与 1A2B/Stroop 一致） ============ */
body[data-theme="4399"]{
  --bg:#f4f8ef; --bg2:#ffffff; --surface:#ffffff; --line:#d8e8cd;
  --text:#24401d; --dim:#6f8a63; --green:#389904; --green2:#448230; --orange:#fb6400; --orange2:#e64e00;
  --tag-bg:#eef5e8; --cell-empty:#ffffff; --cell-border:#d8e8cd;
  --gray-bg:#b9c8ad; --gray-text:#ffffff;
  --key-bg:#e6efde; --key-text:#24401d; --key-border:#cfe3bf;
  --overlay:rgba(36,64,29,.42);
  --shadow-sm:0 2px 8px rgba(56,153,4,.10);
  --shadow-md:0 6px 20px rgba(56,153,4,.15);
  --shadow-lg:0 12px 36px rgba(56,153,4,.20);
  --radius:16px;
  background:linear-gradient(180deg,#eef6e6 0%,#ffffff 50%,#f5fbef 100%);
  color:var(--text);
}
body[data-theme="4399"]::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.6;
  background:
    radial-gradient(circle at 10% 15%, rgba(56,153,4,.10), transparent 35%),
    radial-gradient(circle at 90% 85%, rgba(251,100,0,.08), transparent 35%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.4), transparent 60%);
}

/* ============ 主题2 · 街机厅（暗色） ============ */
body[data-theme="arcade"]{
  --bg:#0b0b18; --bg2:#14142b; --surface:#191934; --line:#3a3a5c; --hard:#000;
  --text:#f4f4ff; --dim:#7a7aa0; --green:#00ff9d; --pink:#ff2d78; --cyan:#3de1ff; --yellow:#ffe14d;
  --tag-bg:#2a2a4a; --cell-empty:#191934; --cell-border:#3a3a5c;
  --gray-bg:#3a3a5c; --gray-text:#9a9ac4;
  --key-bg:#24244a; --key-text:#f4f4ff; --key-border:#3a3a5c;
  --overlay:rgba(0,0,0,.75);
  --shadow-sm:0 2px 8px rgba(0,0,0,.30);
  --shadow-md:0 6px 20px rgba(0,0,0,.40);
  --shadow-lg:0 12px 36px rgba(0,0,0,.50);
  --radius:16px;
  background-color:#0b0b18;color:var(--text);
  background-image:radial-gradient(circle at 50% 0%, #2a2a55 0%, transparent 60%);
}
body[data-theme="arcade"]::before{
  content:'';position:fixed;inset:0;pointer-events:none;opacity:.15;z-index:0;
  background-image:linear-gradient(#3a3a5c 1px,transparent 1px),linear-gradient(90deg,#3a3a5c 1px,transparent 1px);
  background-size:26px 26px;
}
body[data-theme="arcade"]::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.12) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;opacity:.5;
}

body{
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  min-height:100vh;
  transition:background .4s,color .4s;
  -webkit-tap-highlight-color:transparent;
}

/* ============ 返回主页按钮（与 1A2B 一致） ============ */
.back-home{
  position:fixed;top:14px;left:14px;z-index:99;
  text-decoration:none;font-weight:700;
  padding:8px 16px;border-radius:999px;cursor:pointer;
  font-size:13px;font-family:inherit;
  background:rgba(255,255,255,.65);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1.5px solid var(--line);color:var(--green);
  box-shadow:var(--shadow-sm);
  transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;
}
.back-home:hover{
  background:rgba(255,255,255,.9);border-color:var(--green);
  transform:translateY(-2px);box-shadow:var(--shadow-md);
}
.back-home:active{transform:translateY(0)}
body[data-theme="arcade"] .back-home{
  background:rgba(11,11,24,.72);border:2px solid var(--line);color:var(--cyan);
  font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:1px;
  box-shadow:3px 3px 0 var(--hard);
}
body[data-theme="arcade"] .back-home:hover{
  border-color:var(--cyan);box-shadow:3px 3px 0 var(--hard),0 0 12px var(--cyan);
}

/* ============ 主题切换器（右下角单个图标） ============ */
.theme-switch{position:fixed;right:16px;bottom:170px;z-index:99;width:46px;height:46px;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;user-select:none;
  background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);
  box-shadow:0 3px 12px rgba(0,0,0,.3);transition:transform .2s,background .2s;color:#22c55e}
body[data-theme="4399"] .theme-switch{background:rgba(255,255,255,.9);border:1px solid rgba(34,197,94,.35);color:#16a34a;box-shadow:0 3px 12px rgba(34,197,94,.15)}
body[data-theme="arcade"] .theme-switch{background:rgba(10,10,24,.75);border:1px solid rgba(61,225,255,.4);color:#7ff3ff;box-shadow:0 0 14px rgba(61,225,255,.25)}
.theme-switch:hover{transform:scale(1.08)}
.theme-switch:active{transform:scale(.94)}

/* ============ 主容器 ============ */
.wrap{
  position:relative;z-index:1;
  max-width:520px;margin:0 auto;
  padding:28px 16px 150px;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;
}

/* ============ Hero 头部（4399） ============ */
body[data-theme="4399"] .h4399{display:block}
.h4399{display:none;text-align:center;margin-bottom:10px}
.h4399 .topbar{display:flex;align-items:center;gap:7px;justify-content:center;margin-bottom:2px}
.h4399 .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--green),var(--green2));display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 10px rgba(56,153,4,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.h4399 .title{font-size:1.3rem;font-weight:900;color:var(--green);letter-spacing:.5px;text-shadow:0 1px 0 rgba(255,255,255,.8),0 3px 8px rgba(56,153,4,.18);display:inline}
.h4399 .title em{font-style:normal;color:var(--orange)}
.h4399 .hard-badge{display:inline-block;margin-left:7px;padding:2px 8px;border-radius:6px;
  font-size:.68rem;font-weight:900;letter-spacing:1px;color:#fff;
  background:linear-gradient(135deg,var(--orange),var(--orange2));
  box-shadow:0 2px 8px rgba(251,100,0,.35);transform:rotate(-2deg)}
.h4399 .sub{font-size:.72rem;color:var(--dim);margin:0}

/* ============ 街机厅 头部（难版强调） ============ */
body[data-theme="arcade"] .harcade{display:block}
.harcade{display:none;text-align:center;margin-bottom:14px}
.harcade .logo{font-family:'Press Start 2P',monospace;font-size:10px;letter-spacing:3px;color:var(--yellow);text-shadow:0 0 14px var(--yellow),3px 3px 0 var(--hard);margin-bottom:10px;animation:blink 1.4s steps(1) infinite}
.harcade .title{font-family:'Press Start 2P',monospace;font-size:clamp(16px,4.5vw,26px);line-height:1.6;color:var(--text);text-shadow:3px 3px 0 var(--hard),0 0 20px rgba(255,45,120,.45);margin-bottom:6px}
.harcade .title .c{color:var(--pink);text-shadow:3px 3px 0 var(--hard),0 0 20px var(--pink)}
.harcade .title .y{color:var(--cyan);text-shadow:3px 3px 0 var(--hard),0 0 20px var(--cyan);font-family:'PingFang SC','Microsoft YaHei',sans-serif;font-weight:900}
.harcade .hard-badge{display:inline-block;margin-left:8px;padding:3px 8px;font-family:'Press Start 2P',monospace;font-size:8px;
  color:#000;background:var(--pink);box-shadow:2px 2px 0 var(--hard);animation:blink 1.2s steps(1) infinite}
.harcade .sub{color:var(--dim);font-family:'Press Start 2P',monospace;font-size:8px;letter-spacing:3px}
@keyframes blink{50%{opacity:0}}

/* ============ 设置栏（卡片式按钮） ============ */
.setup{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.length-pick{display:flex;gap:10px}
.length-pick button{font-weight:700;font-size:14px;padding:8px 14px;border-radius:10px;cursor:pointer;transition:.18s;letter-spacing:.5px}
body[data-theme="4399"] .length-pick button{background:var(--surface);border:2px solid var(--line);color:var(--text)}
body[data-theme="4399"] .length-pick button.on{background:linear-gradient(135deg,var(--green),var(--green2));border-color:var(--green2);color:#fff;box-shadow:0 3px 10px rgba(56,153,4,.3)}
body[data-theme="arcade"] .length-pick button{
  background:var(--key-bg);border:3px solid var(--line);color:var(--key-text);
  box-shadow:3px 3px 0 var(--hard);
}
body[data-theme="arcade"] .length-pick button:hover{border-color:var(--cyan);box-shadow:4px 4px 0 var(--hard)}
body[data-theme="arcade"] .length-pick button.on{
  background:var(--green);border-color:var(--green);color:#000;
  box-shadow:3px 3px 0 var(--hard);
}

/* 通用按钮 */
.new-btn{font-weight:700;font-size:14px;padding:8px 16px;border-radius:10px;cursor:pointer;transition:.18s}
body[data-theme="4399"] .new-btn{background:linear-gradient(135deg,var(--orange),var(--orange2));border:2px solid var(--orange2);color:#fff;box-shadow:0 3px 10px rgba(251,100,0,.25)}
.new-btn:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 8px 22px rgba(251,100,0,.35)}
.new-btn:active{transform:translateY(0)}
.new-btn.ghost{
  background:var(--surface);color:var(--green);
  border:2px solid var(--line);
  box-shadow:var(--shadow-sm);
}
.new-btn.ghost:hover{border-color:var(--green);filter:none;box-shadow:var(--shadow-md)}
body[data-theme="arcade"] .new-btn{
  background:var(--pink);border:3px solid var(--pink);color:#fff;
  text-shadow:2px 2px 0 #000;box-shadow:3px 3px 0 var(--hard);
}
body[data-theme="arcade"] .new-btn:hover{background:#ff6aa0;border-color:var(--cyan)}
body[data-theme="arcade"] .new-btn.ghost{background:var(--key-bg);border:3px solid var(--line);color:var(--text);text-shadow:none}

/* HUD（侧边悬浮） */
.hud{
  position:fixed;right:14px;top:50%;transform:translateY(-50%);
  z-index:98;display:flex;flex-direction:column;gap:8px;
}
body[data-theme="4399"] .hud .chip{background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--dim);box-shadow:var(--shadow-sm)}
body[data-theme="4399"] .hud .chip b{color:var(--green2)}
body[data-theme="arcade"] .hud .chip{background:var(--surface);border:2px solid var(--line);box-shadow:3px 3px 0 var(--hard);padding:4px 12px;color:var(--dim);font-family:'Press Start 2P',monospace;font-size:9px}
body[data-theme="arcade"] .hud .chip b{color:var(--green);text-shadow:0 0 8px var(--green)}

/* ============ 棋盘（难版：数字格 + 右侧 A/B 总数徽标） ============ */
.board{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;width:100%}
.row{display:flex;gap:6px;justify-content:center;align-items:center}
.rcells{display:flex;gap:5px}
:root{--cell-size:min(calc((100vw - 176px)/6),50px);--cell-font:calc(var(--cell-size)*0.46)}
.cell{width:var(--cell-size);height:var(--cell-size);display:flex;align-items:center;justify-content:center;font-size:var(--cell-font);font-weight:800;
  border-radius:8px;transition:transform .1s}
body[data-theme="4399"] .cell{background:var(--cell-empty);border:2px solid var(--cell-border);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 6px rgba(36,64,29,.07)}
body[data-theme="arcade"] .cell{background:var(--cell-empty);border:3px solid var(--cell-border);color:var(--text);box-shadow:3px 3px 0 var(--hard)}
.cell.filled{animation:pop .15s ease}
@keyframes pop{50%{transform:scale(1.12)}}
.cell.current{border-color:var(--green)}
body[data-theme="4399"] .cell.current{box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 0 0 3px rgba(56,153,4,.12),0 0 12px rgba(56,153,4,.16)}

/* 反馈徽标：只显示 几A几B 总数，不给逐格提示 */
.fb-badge{min-width:76px;height:var(--cell-size);flex:none;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:calc(var(--cell-size)*0.4);letter-spacing:1px;border-radius:10px;color:var(--dim)}
.fb-badge .a{color:var(--green);font-weight:900}
.fb-badge .b{color:#e2a400;font-weight:900}
body[data-theme="4399"] .fb-badge{background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.9)}
body[data-theme="arcade"] .fb-badge{background:var(--key-bg);border:3px solid var(--line);box-shadow:3px 3px 0 var(--hard);color:#9a9ac4;font-family:'Press Start 2P',monospace;font-size:calc(var(--cell-size)*0.34)}
body[data-theme="arcade"] .fb-badge .a{color:var(--green);text-shadow:0 0 8px var(--green)}
body[data-theme="arcade"] .fb-badge .b{color:var(--yellow);text-shadow:0 0 8px var(--yellow)}
.fb-badge.show{animation:badgeIn .35s ease}
@keyframes badgeIn{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.fb-badge.win{border-color:var(--green)!important;box-shadow:0 0 16px rgba(56,153,4,.35)!important}
body[data-theme="arcade"] .fb-badge.win{box-shadow:3px 3px 0 var(--hard),0 0 16px rgba(0,255,157,.6)!important}

/* 规则提示条（难版专属） */
.rules{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:2px 0 8px;font-size:14px;color:var(--dim)}
.rules .r{padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
/* A/B 特色徽章（规则条与弹窗共用） */
.ab{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 5px;border-radius:7px;font-weight:900;font-size:16px;line-height:1;vertical-align:middle;color:#fff}
.ab.a{background:var(--green);box-shadow:0 0 8px rgba(56,153,4,.45)}
.ab.b{background:#e2a400;box-shadow:0 0 8px rgba(226,164,0,.45)}
.rules .ab{margin-right:3px}
.rules .ab.a{background:var(--green)}
.rules .ab.b{background:#e2a400}
body[data-theme="arcade"] .rules .r{background:var(--key-bg);border:2px solid var(--line);box-shadow:2px 2px 0 var(--hard);font-family:'Press Start 2P',monospace;font-size:11px}
body[data-theme="4399"] .rules .r{background:rgba(255,255,255,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:var(--shadow-sm)}
body[data-theme="arcade"] .rules .ab.a{background:var(--green);color:#000;text-shadow:none;box-shadow:2px 2px 0 var(--hard),0 0 8px var(--green)}
body[data-theme="arcade"] .rules .ab.b{background:var(--yellow);color:#000;text-shadow:none;box-shadow:2px 2px 0 var(--hard),0 0 8px var(--yellow)}
body[data-theme="arcade"] .rule-modal .ab.a{background:var(--green);color:#000;text-shadow:none;box-shadow:2px 2px 0 var(--hard),0 0 8px var(--green)}
body[data-theme="arcade"] .rule-modal .ab.b{background:var(--yellow);color:#000;text-shadow:none;box-shadow:2px 2px 0 var(--hard),0 0 8px var(--yellow)}

/* ============ 键盘（保持缩小） ============ */
.kb{position:fixed;left:0;right:0;bottom:0;z-index:40;width:100%;padding:4px 10px max(8px, env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(2,1fr);gap:3px;max-width:420px;margin:0 auto}
.key{min-height:38px;border-radius:8px;font-size:14px;font-weight:800;cursor:pointer;transition:.12s;touch-action:manipulation;height:100%}
body[data-theme="4399"] .key{background:var(--key-bg);border:2px solid var(--key-border);color:var(--key-text);box-shadow:0 2px 0 var(--key-border)}
body[data-theme="4399"] .key:hover{background:var(--surface2,#eef5e8);border-color:var(--green);transform:translateY(-1px);box-shadow:0 3px 0 var(--key-border)}
body[data-theme="4399"] .key:active{transform:translateY(1px);box-shadow:0 1px 0 var(--key-border)}
body[data-theme="arcade"] .key{background:var(--key-bg);border:3px solid var(--line);color:var(--key-text);box-shadow:3px 3px 0 var(--hard)}
body[data-theme="arcade"] .key:hover{background:#2e2e58;border-color:var(--cyan);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--hard)}
body[data-theme="arcade"] .key:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--hard)}
.key.tall{grid-row:span 2;font-size:12px;display:flex;align-items:center;justify-content:center;height:auto}
.key:disabled{opacity:.5;cursor:not-allowed}

/* ============ 结果弹窗 ============ */
.overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(4px);z-index:150;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.on{display:flex}
.modal{width:100%;max-width:380px;border-radius:var(--radius);padding:22px;text-align:center;max-height:88vh;overflow:auto}
body[data-theme="4399"] .modal{background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow-lg)}
body[data-theme="arcade"] .modal{background:var(--surface);border:3px solid var(--line);box-shadow:8px 8px 0 var(--hard),0 0 30px rgba(61,225,255,.15)}
.modal h2{font-size:20px;margin-bottom:4px}
body[data-theme="4399"] .modal h2{color:var(--green);font-family:'ZCOOL KuaiLe',sans-serif}
body[data-theme="arcade"] .modal h2{font-family:'Press Start 2P',monospace;font-size:14px;color:var(--green);text-shadow:0 0 10px var(--green);line-height:1.8}
.modal .answer{margin:6px 0 12px;font-size:15px;color:var(--dim)}
.modal .answer b{font-size:22px;letter-spacing:4px;color:var(--text)}

/* ============ 进入规则弹窗（解释 A/B 含义） ============ */
.rule-overlay{z-index:160}
.rule-modal .rule-title{margin-bottom:2px}
.rule-intro{font-size:14px;color:var(--dim);margin:4px 0 14px}
.rule-line{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--text);margin:12px 0;text-align:left}
.rule-line .lbl{font-weight:900;color:var(--text)}
.rule-line .desc{color:var(--dim);font-size:13px}
.rule-example{background:var(--bg2);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin:14px 0 4px;font-size:14px;color:var(--text);text-align:left}
.rule-example .ex-title{font-weight:900;color:var(--green);margin-bottom:8px;font-size:13px;letter-spacing:1px}
.rule-example .ex-fb{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-weight:900;font-size:16px}
.rule-example .ex-fb .a{color:var(--green)}
.rule-example .ex-fb .b{color:#e2a400}
body[data-theme="arcade"] .rule-example{background:var(--key-bg);border:2px solid var(--line);box-shadow:2px 2px 0 var(--hard)}
body[data-theme="arcade"] .rule-example .ex-title{color:var(--green);text-shadow:0 0 8px var(--green)}
body[data-theme="arcade"] .rule-example .ex-fb .a{color:var(--green);text-shadow:0 0 8px var(--green)}
body[data-theme="arcade"] .rule-example .ex-fb .b{color:var(--yellow);text-shadow:0 0 8px var(--yellow)}

/* ============ 4399 世界树 · 环境装饰（树影/叶脉微风/萤火虫） ============ */
.decor-tree{position:fixed;right:-34px;top:-16px;z-index:0;pointer-events:none;opacity:.1;display:none}
body[data-theme="4399"] .decor-tree{display:block}
.decor-tree svg{display:block}
.leaf-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.world-leaf{--leaf-face:#6fa647;--leaf-edge:#3f6e31;--leaf-vein:#315f2a;--leaf-light:rgba(245,255,226,.8);position:fixed;width:var(--leaf-size,18px);aspect-ratio:14/19;opacity:0;pointer-events:none;color:var(--leaf-face);transform-origin:50% 82%}
.world-leaf.leaf--sage{--leaf-face:#88aa68;--leaf-edge:#527542;--leaf-vein:#46693b}
.world-leaf.leaf--amber{--leaf-face:#aaa052;--leaf-edge:#706c38;--leaf-vein:#625f32;--leaf-light:rgba(255,248,201,.72)}
.world-leaf svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 1px rgba(31,69,27,.18))}
.world-leaf .leaf-shape{fill:currentColor;stroke:var(--leaf-edge);stroke-width:1;vector-effect:non-scaling-stroke}
.world-leaf .leaf-glint{fill:none;stroke:var(--leaf-light);stroke-width:1.15;stroke-linecap:round;opacity:.72;vector-effect:non-scaling-stroke}
.world-leaf .leaf-vein{fill:none;stroke:var(--leaf-vein);stroke-width:.9;stroke-linecap:round;stroke-linejoin:round;opacity:.72;vector-effect:non-scaling-stroke}
body[data-theme="4399"] .leaf-layer .world-leaf{animation:leafDrift 16s cubic-bezier(.42,0,.58,1) infinite}
@keyframes leafDrift{
  0%{opacity:0;transform:translate3d(0,-8px,0) rotate(var(--r0,-12deg)) scale(var(--leaf-scale,.9))}
  9%{opacity:.58}
  27%{transform:translate3d(var(--x1,-24px),var(--y1,18vh),0) rotate(var(--r1,42deg)) scale(var(--leaf-scale,.9))}
  52%{transform:translate3d(var(--x2,-8px),var(--y2,44vh),0) rotate(var(--r2,-18deg)) scale(var(--leaf-scale,.9))}
  78%{opacity:.48;transform:translate3d(var(--x3,-72px),var(--y3,72vh),0) rotate(var(--r3,78deg)) scale(var(--leaf-scale,.9))}
  100%{opacity:0;transform:translate3d(var(--x4,-110px),var(--y4,108vh),0) rotate(var(--r4,150deg)) scale(var(--leaf-scale,.9))}
}
body[data-theme="4399"] .world-leaf.leaf-lift{z-index:26;animation:leafLift 1.2s cubic-bezier(.16,1,.3,1) forwards}
@keyframes leafLift{
  0%{opacity:0;transform:translate3d(0,7px,0) rotate(var(--r0,-18deg)) scale(.5)}
  18%{opacity:.86}
  48%{opacity:.74;transform:translate3d(var(--x1,8px),var(--y1,-28px),0) rotate(var(--r1,25deg)) scale(.78)}
  100%{opacity:0;transform:translate3d(var(--x2,28px),var(--y2,-82px),0) rotate(var(--r2,72deg)) scale(.96)}
}
.firefly-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;display:none}
body[data-theme="4399"] .firefly-layer{display:block}
.firefly-layer i{position:absolute;bottom:-14px;width:6px;height:6px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(220,255,130,.95) 0%,rgba(190,255,90,.4) 45%,rgba(190,255,90,0) 72%);
  box-shadow:0 0 10px 3px rgba(190,255,90,.35);

@keyframes fireflyUp{

  10%{opacity:.9}

/* 统计卡片 */

.stat-box{text-align:center;padding:14px 6px;border-radius:var(--radius);background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow-sm);transition:transform .18s}

</style>

<body data-theme="4399">

<div class="loader" id="loader">
  <div class="core"><div class="ring"></div><div class="ring r2"></div><div class="pixel">&#9670;</div></div>

</div>

<a class="back-home" href="../index.html">&#8592; 主页</a>
<div class="theme-switch" id="themeToggle" role="button" aria-label="切换主题" title="切换主题"></div>

<div class="wrap">

  <!-- Hero 头部（4399） -->
  <header class="h4399">
    <div class="topbar"><div class="logo">💀</div><div class="title">1A2B <em>难版</em></div><span class="hard-badge">专家</span></div>
    <div class="sub">只报几A几B，不告诉你哪个对 —— 数字可重复、首位可为 0</div>
  </header>

  <!-- 街机厅 头部（难版强调） -->
  <header class="harcade">
    <div class="logo">&#9654; EXPERT MODE &#9664;</div>
    <div class="title"><span class="c">1A</span>2B <span class="y">难版</span><span class="hard-badge">HARD</span></div>
    <div class="sub">- NO PER-DIGIT HINT -</div>
  </header>

  <div class="setup">

  </div>

  <!-- 难版规则提示 -->
  <div class="rules">

  <div class="modal">

    <div id="resultSub" style="color:var(--dim);font-size:13px"></div>

      <div class="stat-box"><div class="num" id="stPlayed">0</div><div class="lbl">已玩</div></div>
      <div class="stat-box"><div class="num" id="stWinPct">0%</div><div class="lbl">胜率</div></div>

      <button class="ghost" id="modalClose">关闭</button>
      <button id="modalNew">再来一局</button>
    </div>

<script>
(function(){
  'use strict';

  var CURRENT_LEN = 4;
  var MAX_GUESSES = {4:6, 5:7, 6:8};   // 难版：次数比经典更紧

  var answer = [];
  var guesses = [];      // 已提交的猜测 (each: array of digits)
  var feedbacks = [];    // 已提交的反馈 (each: {A: int, B: int})
  var current = [];      // 当前行输入
  var currentRow = 0;    // 下一行索引
  var gameOver = false;
  var isWin = false;
  var guessedCount = 0;  // 本局已提交次数

  var boardEl = document.getElementById('board');
  var msgEl = document.getElementById('msg');
  var chancesLeftEl = document.getElementById('chancesLeft');
  var chancesTotalEl = document.getElementById('chancesTotal');
  var bestLabelEl = document.getElementById('bestLabel');
  var overlay = document.getElementById('overlay');
  var kbEnter = document.getElementById('kbEnter');
  var kbBack = document.getElementById('kbBack');

  /* ================= 难版判定：只算 A 和 B 的总数，不给逐格提示 =================
     A = 位置和数字都正确的个数
     B = 数字存在于答案但位置不正确的个数（不重复计数，扣除已算入 A 的数字）
     答案 1234，猜 1256 → 位置0、1 正确 = 2A；5、6 不在答案 = 0B → 反馈 "2A0B" */
  function getAB(ans, gue){
    var n = ans.length;
    var A = 0, B = 0;
    var remaining = {};
    var marked = new Array(n).fill(false);
    for (var i=0;i<n;i++){ remaining[ans[i]] = (remaining[ans[i]]||0)+1; }
    // 第一遍：统计 A（位置和数字都正确），并扣减可用计数
    for (var i=0;i<n;i++){
      if (gue[i]===ans[i]){ A++; marked[i]=true; remaining[ans[i]]--; }
    }
    // 第二遍：统计 B（数字存在但位置错，且仍可匹配）
    for (var i=0;i<n;i++){
      if (marked[i]) continue;
      var d = gue[i];
      if (remaining[d] > 0){ B++; remaining[d]--; }
    }
    return {A:A, B:B};
  }

  /* ================= 生成答案 ================= */
  function genAnswer(n){
    var a = [];
    for (var i=0;i<n;i++){ a.push(String(Math.floor(Math.random()*10))); }
    return a;
  }

  /* ================= 渲染棋盘 ================= */
  function renderBoard(){
    var max = MAX_GUESSES[CURRENT_LEN];
    var html = '';
    for (var r=0;r<max;r++){
      html += '<div class="row"><div class="rcells">';
      for (var c=0;c<CURRENT_LEN;c++){ html += '<div class="cell"></div>'; }
      html += '</div><div class="fb-badge">?</div></div>';
    }
    boardEl.innerHTML = html;
  }

  function setCell(r, c, text, cls){
    var rowEl = boardEl.children[r];
    if (!rowEl) return;
    var cell = rowEl.querySelectorAll('.rcells .cell')[c];
    if (!cell) return;
    if (cls) cell.className = 'cell ' + cls; else cell.className = 'cell';
    cell.textContent = text;
  }

  function updateCurrentRow(){
    var r = currentRow;
    var c;
    for (c=0;c<CURRENT_LEN;c++){
      if (c < current.length) setCell(r, c, current[c], 'cell filled current');
      else setCell(r, c, '', 'cell');
    }
  }

  /* 渲染某一行已提交的结果：数字 + 右侧 几A几B 徽标 */
  function renderRow(i){
    var rowEl = boardEl.children[i];
    if (!rowEl) return;
    var cells = rowEl.querySelectorAll('.rcells .cell');
    var badge = rowEl.querySelector('.fb-badge');
    var gue = guesses[i], fb = feedbacks[i];
    for (var c=0;c<CURRENT_LEN;c++){
      cells[c].className = 'cell filled';
      cells[c].textContent = gue[c];
    }
    badge.className = 'fb-badge show' + (fb.A===CURRENT_LEN ? ' win' : '');
    badge.innerHTML = '<span class="a">'+fb.A+'</span>A <span class="b">'+fb.B+'</span>B';
  }

  function renderBoardState(){
    for (var i=0;i<feedbacks.length;i++) renderRow(i);
    if (!gameOver) updateCurrentRow();
    else { for (var c=0;c<CURRENT_LEN;c++) setCell(currentRow, c, '', 'cell'); }
  }

  /* ================= 键盘状态（难版不给逐格提示，故按键保持中性，不加色） ================= */
  function resetKeyboard(){
    document.querySelectorAll('.key[data-digit]').forEach(function(k){
      k.className = 'key';
    });
  }

  /* ================= 游戏操作 ================= */
  function addDigit(d){
    if (gameOver) return;
    if (current.length >= CURRENT_LEN) return;
    current.push(d);
    updateCurrentRow();
    msgEl.textContent = '';
  }

  function doBackspace(){
    if (gameOver) return;
    if (current.length===0) return;
    current.pop();
    updateCurrentRow();
  }

  function submitGuess(){
    if (gameOver) return;
    if (current.length !== CURRENT_LEN){
      shakeRow();
      msgEl.textContent = '请输入 ' + CURRENT_LEN + ' 位数字';
      return;
    }
    var gue = current.slice();
    var fb = getAB(answer, gue);
    guesses.push(gue);
    feedbacks.push(fb);
    guessedCount++;

    renderRow(currentRow);

    // 4399：A 反馈唤起少量叶片
    if (fb.A) setTimeout(function(){ burstLeaves(fb.A); }, 250);

    current = [];
    currentRow++;
    updateHud();

    var won = (fb.A === CURRENT_LEN);
    if (won){
      isWin = true;
      gameOver = true;
      setTimeout(function(){ endGame(true); }, 350);
    } else if (currentRow >= MAX_GUESSES[CURRENT_LEN]){
      isWin = false;
      gameOver = true;
      setTimeout(function(){ endGame(false); }, 350);
    } else {
      for (var c=0;c<CURRENT_LEN;c++) setCell(currentRow, c, '', 'cell');
    }
  }

  function shakeRow(){
    var rowEl = boardEl.children[currentRow];
    if (!rowEl) return;
    rowEl.style.animation='shake .3s';
    setTimeout(function(){ rowEl.style.animation=''; }, 300);
  }

  function updateHud(){
    chancesLeftEl.textContent = Math.max(0, MAX_GUESSES[CURRENT_LEN]-currentRow);
    chancesTotalEl.textContent = MAX_GUESSES[CURRENT_LEN];
    bestLabelEl.textContent = getBest()===null ? '—' : getBest();
  }

  /* ================= 本地统计（难版独立 key，不与经典版混用） ================= */
  function statsKey(len){ return 'ab12h-stats-v2-' + len; }
  function defaultStats(){
    return { played:0, won:0, currentStreak:0, maxStreak:0, best:null, dist:{} };
  }
  function loadStats(len){
    try {
      var raw = localStorage.getItem(statsKey(len));
      if (raw){ var s = JSON.parse(raw); if (s && typeof s==='object') return s; }
    } catch(e){}
    return defaultStats();
  }
  function saveStats(len, s){
    try { localStorage.setItem(statsKey(len), JSON.stringify(s)); } catch(e){}
  }
  function getBest(){
    return loadStats(CURRENT_LEN).best;
  }

  function recordResult(win){
    var s = loadStats(CURRENT_LEN);
    s.played++;
    if (win){
      s.won++;
      s.currentStreak++;
      s.maxStreak = Math.max(s.maxStreak, s.currentStreak);
      var prevBest = s.best;
      if (prevBest===null || guessedCount < prevBest) s.best = guessedCount;
      s.dist[guessedCount] = (s.dist[guessedCount]||0) + 1;
    } else {
      s.currentStreak = 0;
    }
    saveStats(CURRENT_LEN, s);
  }

  function endGame(win){
    recordResult(win);
    updateHud();
    showModal(win);
  }

  /* ================= 结果弹窗 ================= */
  function getResultSub(win){
    var max = MAX_GUESSES[CURRENT_LEN];
    if (!win) return '难版' + max + '次都没猜中？连总数提示都救不了你……';
    if (guessedCount <= 3) return '第' + guessedCount + '次盲猜命中？这已经不是运气，是超能力了！';
    if (guessedCount <= 5) return '第' + guessedCount + '次破解，能在没有逐格提示下赢，算你狠。';
    return '第' + guessedCount + '次才解开，惊险！差点就要给你发"难度已调低"了。';
  }

  function showModal(win){
    var s = loadStats(CURRENT_LEN);
    document.getElementById('resultTitle').textContent = win ? '🎉 恭喜破解！' : '😵 挑战失败';
    document.getElementById('resultAnswer').textContent = answer.join('');
    document.getElementById('resultSub').textContent = getResultSub(win);

    document.getElementById('stPlayed').textContent = s.played;
    document.getElementById('stWinPct').textContent = (s.played ? Math.round(s.won/s.played*100) : 0) + '%';
    document.getElementById('stStreak').textContent = s.currentStreak;
    document.getElementById('stBest').textContent = s.best===null ? '—' : s.best;

    var distEl = document.getElementById('dist');
    var max = MAX_GUESSES[CURRENT_LEN];
    var maxCount = 1;
    for (var k=1;k<=max;k++){ if ((s.dist[k]||0)>maxCount) maxCount=s.dist[k]||0; }
    var html = '';
    for (var k=1;k<=max;k++){
      var cnt = s.dist[k]||0;
      var w = Math.max(2, Math.round(cnt/maxCount*100));
      html += '<div class="drow"><span class="dlabel">'+k+'</span>'+
              '<div class="dbar" style="width:'+w+'%"></div>'+
              '<span class="dcount">'+cnt+'</span></div>';
    }
    distEl.innerHTML = html;

    overlay.classList.add('on');
  }

  function closeModal(){ overlay.classList.remove('on'); }

  /* ================= 进入规则弹窗 ================= */
  var ruleOverlay = document.getElementById('ruleOverlay');
  document.getElementById('ruleStart').addEventListener('click', function(){
    ruleOverlay.classList.remove('on');
  });

  /* ================= 新游戏 ================= */
  function newGame(){
    answer = genAnswer(CURRENT_LEN);
    guesses = []; feedbacks = []; current = [];
    currentRow = 0; gameOver = false; isWin = false; guessedCount = 0;
    renderBoard();
    resetKeyboard();
    msgEl.textContent = '';
    closeModal();
    updateHud();
  }

  /* ================= 4399 世界树 · 环境装饰（树影/叶脉微风/萤火虫） ================= */
  var treeEl=null, leafLayer=null, fireflyLayer=null;
  function reducedMotion(){ try{ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } }
  function treeSVG(){
    return '<svg viewBox="0 0 200 240" width="300" height="360" aria-hidden="true">'
      +'<path d="M92 224c-10 8-24 10-34 7M108 224c10 8 24 10 34 7M100 224c0 7 1 11 0 16" stroke="#7a5230" stroke-width="6" stroke-linecap="round" fill="none"/>'
      +'<path d="M91 224 C88 172 93 152 100 126 C107 152 112 172 109 224 Z" fill="#7a5230"/>'
      +'<circle cx="100" cy="62" r="47" fill="#57a832"/>'
      +'<circle cx="60" cy="92" r="35" fill="#57a832"/>'
      +'<circle cx="140" cy="92" r="35" fill="#57a832"/>'
      +'<circle cx="80" cy="122" r="31" fill="#5cb43c"/>'
      +'<circle cx="120" cy="122" r="31" fill="#5cb43c"/>'
      +'<circle cx="100" cy="44" r="31" fill="#4f9c2e"/>'
      +'</svg>';
  }
  function startTree(){
    if (treeEl) return;
    treeEl=document.createElement('div');
    treeEl.className='decor-tree';
    treeEl.innerHTML=treeSVG();
    document.body.appendChild(treeEl);
  }
  function stopTree(){ if (treeEl){ if (treeEl.parentNode) treeEl.parentNode.removeChild(treeEl); treeEl=null; } }
  function leafSVG(){
    return '<svg viewBox="0 0 28 38" aria-hidden="true"><path class="leaf-shape" d="M14.4 2.5c6.4 2.6 11 8.2 10.4 14.8-.8 8-7.1 14.2-17.6 16.8 1-6.3-3.1-10.1-3-16.3.1-6.9 4.1-12.2 10.2-15.3Z"/><path class="leaf-glint" d="M13.3 6.2c-3.9 2.9-5.8 7-5.7 11.6"/><path class="leaf-vein" d="M7.1 35.6c3.8-8 6.4-15.6 7.7-28.2M11.7 24.6l-4.3-4M13.1 19.2l5.4-4.4M10.1 29.7l-2.7-2.4"/></svg>';
  }
  function createLeaf(extraClass){
    var l=document.createElement('span');
    var tone=Math.random()<.18?'leaf--amber':(Math.random()<.42?'leaf--sage':'leaf--fern');
    l.className='world-leaf '+tone+(extraClass?' '+extraClass:'');
    l.innerHTML=leafSVG();
    return l;
  }
  function startLeaves(){
    if (leafLayer||reducedMotion()) return;
    leafLayer=document.createElement('div');
    leafLayer.className='leaf-layer';
    var vh=Math.max(window.innerHeight||0,560);
    for (var i=0;i<4;i++){
      var l=createLeaf('');
      var duration=14+Math.random()*7;
      var tilt=-35+Math.random()*70;
      l.style.right=(8+Math.random()*210).toFixed(0)+'px';
      l.style.top=(36+Math.random()*96)+'px';
      l.style.animationDelay=(-Math.random()*duration).toFixed(2)+'s';
      l.style.animationDuration=duration.toFixed(2)+'s';
      l.style.setProperty('--leaf-size',(14+Math.random()*8).toFixed(1)+'px');
      l.style.setProperty('--leaf-scale',(0.76+Math.random()*.34).toFixed(2));
      l.style.setProperty('--x1',(-15-Math.random()*30).toFixed(0)+'px');
      l.style.setProperty('--x2',(10-Math.random()*55).toFixed(0)+'px');
      l.style.setProperty('--x3',(-28-Math.random()*88).toFixed(0)+'px');
      l.style.setProperty('--x4',(-72-Math.random()*125).toFixed(0)+'px');
      l.style.setProperty('--y1',(vh*(.16+Math.random()*.06)).toFixed(0)+'px');
      l.style.setProperty('--y2',(vh*(.39+Math.random()*.08)).toFixed(0)+'px');
      l.style.setProperty('--y3',(vh*(.66+Math.random()*.08)).toFixed(0)+'px');
      l.style.setProperty('--y4',(vh*(1.02+Math.random()*.12)).toFixed(0)+'px');
      l.style.setProperty('--r0',tilt.toFixed(0)+'deg');
      l.style.setProperty('--r1',(tilt+40+Math.random()*50).toFixed(0)+'deg');
      l.style.setProperty('--r2',(tilt-30-Math.random()*45).toFixed(0)+'deg');
      l.style.setProperty('--r3',(tilt+60+Math.random()*70).toFixed(0)+'deg');
      l.style.setProperty('--r4',(tilt+125+Math.random()*90).toFixed(0)+'deg');
      leafLayer.appendChild(l);
    }
    document.body.appendChild(leafLayer);
  }
  function stopLeaves(){ if (leafLayer){ if (leafLayer.parentNode) leafLayer.parentNode.removeChild(leafLayer); leafLayer=null; } }
  function startFireflies(){
    if (fireflyLayer||reducedMotion()) return;
    fireflyLayer=document.createElement('div');
    fireflyLayer.className='firefly-layer';
    for (var i=0;i<8;i++){
      var f=document.createElement('i');
      f.style.left=(2+Math.random()*96)+'%';
      f.style.animationDuration=(9+Math.random()*9).toFixed(2)+'s';
      f.style.animationDelay=(Math.random()*10).toFixed(2)+'s';
      f.style.setProperty('--fx',(-60+Math.random()*120)+'px');
      f.style.setProperty('--fh',(55+Math.random()*40)+'vh');
      fireflyLayer.appendChild(f);
    }
    document.body.appendChild(fireflyLayer);
  }
  function stopFireflies(){ if (fireflyLayer){ if (fireflyLayer.parentNode) fireflyLayer.parentNode.removeChild(fireflyLayer); fireflyLayer=null; } }
  function burstLeaves(count){
    if (document.body.dataset.theme!=='4399'||!count||reducedMotion()) return;
    var b=boardEl.getBoundingClientRect();
    var total=Math.min(7,Math.max(2,count+1));
    for (var i=0;i<total;i++){
      var l=createLeaf('leaf-lift');
      var tilt=-28+Math.random()*56;
      l.style.left=(b.left+b.width*(.14+Math.random()*.72))+'px';
      l.style.top=(b.top+b.height*(.38+Math.random()*.42))+'px';
      l.style.animationDelay=(i*.045).toFixed(2)+'s';
      l.style.animationDuration=(1+Math.random()*.38).toFixed(2)+'s';
      l.style.setProperty('--leaf-size',(13+Math.random()*6).toFixed(1)+'px');
      l.style.setProperty('--r0',tilt.toFixed(0)+'deg');
      l.style.setProperty('--r1',(tilt-24+Math.random()*48).toFixed(0)+'deg');
      l.style.setProperty('--r2',(tilt-75+Math.random()*150).toFixed(0)+'deg');
      l.style.setProperty('--x1',(-14+Math.random()*28).toFixed(0)+'px');
      l.style.setProperty('--y1',(-24-Math.random()*16).toFixed(0)+'px');
      l.style.setProperty('--x2',(-42+Math.random()*84).toFixed(0)+'px');
      l.style.setProperty('--y2',(-70-Math.random()*38).toFixed(0)+'px');
      document.body.appendChild(l);
      (function(el){ setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); },1700); })(l);
    }
  }

  /* ================= 主题切换（单个日/夜图标 + 加载动画） ================= */
  var toggle = document.getElementById('themeToggle');
  var loader = document.getElementById('loader');
  function iconSVG(arcade){
    if(arcade){
      // 吃豆人 Pac-Man（街机）
      return '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 12 L21 6 A10 10 0 1 0 21 18 Z"/><circle cx="13.5" cy="7.5" r="1.1" fill="#ffffff"/></svg>';
    }
    // 世界树 Yggdrasil（清新）
    return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3C9.8 3 8 4.8 8 7c0 .6.1 1.2.4 1.7C6.5 9.4 5.2 11 5.2 13c0 2.2 1.8 4 4 4h5.6c2.2 0 4-1.8 4-4 0-2-1.3-3.6-3.2-4.3.3-.5.4-1.1.4-1.7 0-2.2-1.8-4-4-4z"/><path d="M12 17v4"/><path d="M12 21l-3 2M12 21l3 2"/></svg>';
  }
  function applyTheme(t){
    document.body.dataset.theme = t;
    toggle.innerHTML = iconSVG(t!=='arcade');
    try { localStorage.setItem('gh-theme', t); } catch(e){}
    if (t==='4399'){ startTree(); startLeaves(); startFireflies(); }
    else { stopTree(); stopLeaves(); stopFireflies(); }
  }
  toggle.addEventListener('click', function(){
    var next = document.body.dataset.theme==='arcade' ? '4399' : 'arcade';
    loader.classList.add('on');
    setTimeout(function(){
      applyTheme(next);
      loader.classList.remove('on');
    }, 500);
  });

  /* ================= 绑定事件 ================= */
  document.querySelectorAll('.length-pick button').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.length-pick button').forEach(function(b){b.classList.remove('on');});
      btn.classList.add('on');
      CURRENT_LEN = parseInt(btn.getAttribute('data-len'),10);
      newGame();
    });
  });

  document.getElementById('newGame').addEventListener('click', newGame);
  document.getElementById('modalNew').addEventListener('click', newGame);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('statsBtn').addEventListener('click', function(){ showModal(false); });

  document.querySelectorAll('.key[data-digit]').forEach(function(k){
    k.addEventListener('click', function(){ addDigit(k.getAttribute('data-digit')); });
  });
  kbEnter.addEventListener('click', submitGuess);
  kbBack.addEventListener('click', doBackspace);

  document.addEventListener('keydown', function(e){
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)){ addDigit(e.key); e.preventDefault(); return; }
    if (e.key==='Backspace'){ doBackspace(); e.preventDefault(); return; }
    if (e.key==='Enter'){ submitGuess(); e.preventDefault(); return; }
  });

  /* 初始 */
  (function init(){
    var saved = null;
    try { saved = localStorage.getItem('gh-theme')||'4399'; } catch(e){ saved='4399'; }
    applyTheme(saved);
    newGame();
    /* 进入游戏时弹出规则说明（每次进入均弹，确保 A/B 含义清晰） */
    ruleOverlay.classList.add('on');
  })();
})();
</script>
<script>
/* ===== 防沉迷统一计时（与主页共享 golPlaySeconds，每天提醒一次） ===== */
(function(){
  var PLAY_SECONDS_KEY='golPlaySeconds';
  var PLAY_WARNED_KEY='golPlayWarnedDate';
  var THRESHOLD=15*60;      // 900 秒 = 15 分钟
  var STEP=30;              // 每次心跳累加 30 秒
  var INTERVAL=30000;       // 每 30 秒心跳

  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  var today=new Date();
  var dateKey=today.getFullYear()+'-'+(today.getMonth()+1)+'-'+today.getDate();

  function readSeconds(){
    var v=parseInt(lsGet(PLAY_SECONDS_KEY),10);
    return isNaN(v)?0:v;
  }
  var playSeconds=readSeconds();
  var warned=false;
  if(lsGet(PLAY_WARNED_KEY)===dateKey) warned=true;

  var banner=null;
  function ensureBanner(){
    if(banner) return banner;
    banner=document.createElement('div');
    banner.setAttribute('role','alert');
    banner.style.cssText='position:fixed;left:16px;right:16px;bottom:20px;z-index:99999;background:rgba(20,20,35,.96);color:#ffe14d;border:2px solid #ff4040;border-radius:12px;padding:14px 18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.5;box-shadow:0 6px 24px rgba(0,0,0,.35);text-align:center;transform:translateY(20px);opacity:0;transition:opacity .25s ease,transform .25s ease;';
    var reduced=false;
    try{ reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}
    if(reduced){ banner.style.transition='none'; }
    var title=document.createElement('div');
    title.style.cssText='font-weight:700;font-size:18px;';
    title.textContent='⏰ 已经玩 '+Math.floor(playSeconds/60)+' 分钟啦';
    var sub=document.createElement('div');
    sub.style.cssText='margin-top:4px;color:#eee;font-size:14px;';
    sub.textContent='注意休息眼睛，眺望一下远方吧 👀';
    banner.appendChild(title);
    banner.appendChild(sub);
    if(document.body) document.body.appendChild(banner);
    requestAnimationFrame(function(){ banner.style.transform='translateY(0)'; banner.style.opacity='1'; });
    return banner;
  }
  function warnPlay(){
    // 每天只提醒一次：当天已提醒则不再弹
    if(warned) return;
    warned=true;
    lsSet(PLAY_WARNED_KEY,dateKey);
    ensureBanner();
    var t=setTimeout(function(){ if(banner){ banner.style.opacity='0'; banner.style.transform='translateY(20px)'; } },8000);
    banner.addEventListener('click',function(){ banner.style.opacity='0'; banner.style.transform='translateY(20px)'; clearTimeout(t); });
  }
  function tickPlay(){
    // 仅在页面可见时累计，切走/隐藏时暂停
    if(document.visibilityState==='visible'){
      playSeconds+=STEP;
      lsSet(PLAY_SECONDS_KEY,String(playSeconds));
      if(playSeconds>=THRESHOLD) warnPlay();
    }
  }
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') tickPlay();
  });
  setInterval(tickPlay,INTERVAL);
  // 初次加载：若已累计达到阈值且当天未提醒，立即提示
  if(playSeconds>=THRESHOLD) warnPlay();
})();
</script>
